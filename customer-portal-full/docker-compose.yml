    profiles: [go, pillar5, all]

  ifrs17:
    <<: *python-service
    build:
      context: ../ifrs17-engine
    ports: ["8210:8210"]
    profiles: [python, pillar5, all]

  pan-african-ekyc:
    <<: *go-service
