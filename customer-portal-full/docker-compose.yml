  actuarial:
    <<: *python-service
    build:
      context: ../actuarial-platform
    ports: ["8212:8212"]
    profiles: [python, pillar7, all]

  api-marketplace:
    <<: *go-service
    build:
      context: ../api-marketplace
    ports: ["8111:8111"]
    profiles: [go, pillar7, all]

  # ═══════════════════════════════════════════════════════════════════════════
  # Pillar 8 - Operational Excellence (Go, Rust)
  # ═══════════════════════════════════════════════════════════════════════════
  multi-tenant:
    <<: *go-service
    build:
      context: ../multi-tenant-platform
    ports: ["8112:8112"]
    profiles: [go, pillar8, all]

  dr-ha:
    <<: *go-service
    build:
      context: ../dr-ha-service
    ports: ["8113:8113"]
    profiles: [go, pillar8, all]

  performance-gateway:
    <<: *rust-service
    build:
      context: ../performance-gateway
    ports: ["8114:8114"]
    profiles: [rust, pillar8, all]

  devops:
    <<: *go-service
    build:
      context: ../devops-platform
    ports: ["8115:8115"]
    profiles: [go, pillar8, all]

volumes:
  pgdata:

networks:
  ngapp:
    driver: bridge
