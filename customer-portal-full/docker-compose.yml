  # ═══════════════════════════════════════════════════════════════════════════
  # Pillar 6 - Customer Experience (Go)
  # ═══════════════════════════════════════════════════════════════════════════
  multi-language:
    <<: *go-service
    build:
      context: ../multi-language-service
    ports: ["8108:8108"]
    profiles: [go, pillar6, all]

  notification:
