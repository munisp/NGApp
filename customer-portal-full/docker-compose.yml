    ports: ["8109:8109"]
    profiles: [go, pillar6, all]

  gamification:
    <<: *go-service
    build:
      context: ../gamification-service
    ports: ["8110:8110"]
    profiles: [go, pillar6, all]

  # ═══════════════════════════════════════════════════════════════════════════
  # Pillar 7 - Data & Analytics (Python, Go)
  # ═══════════════════════════════════════════════════════════════════════════
