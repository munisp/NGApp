version: '3.8'

services:
  # ============================================================================
  # Core Document Processing Services (Local-First)
  # ============================================================================
  
  deepseek_local:
    build:
      context: ./deepseek_local
      dockerfile: Dockerfile
    container_name: deepseek_local
    ports:
      - "9002:9002"
    environment:
      - MODEL_PATH=/models/deepseek-vl-7b-chat
      - QUANTIZATION=int4
      - DEVICE=cuda
      - MAX_BATCH_SIZE=8
      - MAX_SEQUENCE_LENGTH=2048
    volumes:
      - ./models:/models
      - ./cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  docling:
    build:
      context: ./docling_service
      dockerfile: Dockerfile
    container_name: docling
    ports:
      - "9001:9001"
    environment:
      - WORKERS=4
      - MAX_FILE_SIZE=50MB
      - ENABLE_TABLE_EXTRACTION=true
    volumes:
      - ./temp:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  go_orchestrator:
    build:
      context: ./go_orchestrator
      dockerfile: Dockerfile
    container_name: go_orchestrator
    ports:
      - "9003:9003"
    environment:
      - DEEPSEEK_URL=http://deepseek_local:9002
      - DOCLING_URL=http://docling:9001
      - TESSERACT_ENABLED=true
      - PADDLEOCR_ENABLED=true
      - WORKERS=10
      - QUEUE_SIZE=1000
    depends_on:
      - deepseek_local
      - docling
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ============================================================================
  # Biometric Verification Service (Local-First)
  # ============================================================================
  
  biometric:
    build:
      context: ./biometric_service
      dockerfile: Dockerfile
    container_name: biometric
    ports:
      - "9004:9004"
    environment:
      - DEVICE=cuda
      - FACE_DETECTION_MODEL=mtcnn
      - FACE_RECOGNITION_MODEL=facenet
      - LIVENESS_ENABLED=true
    volumes:
      - ./biometric_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ============================================================================
  # Identity Verification Services (Production-Ready)
  # ============================================================================
  
  nimc:
    build:
      context: ./services/nimc_service
      dockerfile: Dockerfile
    container_name: nimc
    ports:
      - "9005:9005"
    environment:
      - NIMC_USE_MOCK=${NIMC_USE_MOCK:-false}
      - NIMC_ENVIRONMENT=${NIMC_ENVIRONMENT:-production}
      - NIMC_API_URL=${NIMC_API_URL:-https://api.nimc.gov.ng/v1}
      - NIMC_API_KEY=${NIMC_API_KEY}
      - NIMC_API_SECRET=${NIMC_API_SECRET}
      - NIMC_TIMEOUT=30
      - NIMC_RETRY_COUNT=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  cac:
    build:
      context: ./services/cac_service
      dockerfile: Dockerfile
    container_name: cac
    ports:
      - "9006:9006"
    environment:
      - CAC_USE_MOCK=${CAC_USE_MOCK:-false}
      - CAC_ENVIRONMENT=${CAC_ENVIRONMENT:-production}
      - CAC_API_URL=${CAC_API_URL:-https://api.cac.gov.ng/v1}
      - CAC_API_KEY=${CAC_API_KEY}
      - CAC_API_SECRET=${CAC_API_SECRET}
      - CAC_TIMEOUT=30
      - CAC_RETRY_COUNT=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ============================================================================
  # Existing Platform Services
  # ============================================================================
  
  backend_api:
    build:
      context: ./document_intelligence_platform
      dockerfile: Dockerfile
    container_name: backend_api
    ports:
      - "8001:8001"
    environment:
      - OCR_SERVICE_PRIORITY=deepseek_local,docling,tesseract,paddleocr
      - DEEPSEEK_URL=http://deepseek_local:9002
      - DOCLING_URL=http://docling:9001
      - BIOMETRIC_URL=http://biometric:9004
      - NIMC_URL=http://nimc:9005
      - CAC_URL=http://cac:9006
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - deepseek_local
      - docling
      - biometric
      - nimc
      - cac
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  orchestration_api:
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: orchestration_api
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKEND_API_URL=http://backend_api:8001
    depends_on:
      - redis
      - backend_api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  celery_worker:
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=3
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    restart: unless-stopped
  
  celery_beat:
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: celery_beat
    command: celery -A celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
    restart: unless-stopped
  
  frontend:
    build:
      context: ./document_intelligence_ui
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend_api:8001
      - VITE_ORCHESTRATION_URL=http://orchestration_api:8003
    depends_on:
      - backend_api
      - orchestration_api
    restart: unless-stopped
  
  # ============================================================================
  # Supporting Services
  # ============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ============================================================================
  # Monitoring and Logging (Optional)
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: document_intelligence_network
