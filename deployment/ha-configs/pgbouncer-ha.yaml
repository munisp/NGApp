apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: fintech
data:
  pgbouncer.ini: |
    [databases]
    fintech_mobile_app = host=postgres-primary port=5432 dbname=fintech_mobile_app
    fintech_mobile_app_ro = host=postgres-replica port=5432 dbname=fintech_mobile_app

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction
    default_pool_size = 25
    min_pool_size = 5
    max_client_conn = 200
    reserve_pool_size = 5
    reserve_pool_timeout = 3

    server_idle_timeout = 300
    server_lifetime = 3600
    server_connect_timeout = 15
    server_login_retry = 1
    query_wait_timeout = 120
    client_idle_timeout = 0

    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    stats_period = 60

    max_db_connections = 50
    max_user_connections = 50

    server_round_robin = 1
    server_check_query = SELECT 1
    server_check_delay = 30

    tcp_keepalive = 1
    tcp_keepidle = 300
    tcp_keepintvl = 60

  userlist.txt: |
    "fintech_user" "md5password_hash_here"
    "fintech_readonly" "md5password_hash_here"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: fintech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.22.0
          ports:
            - containerPort: 6432
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: fintech
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 6432
      targetPort: 6432
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-pdb
  namespace: fintech
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer
