            - labelSelector:
                matchExpressions:
                  - key: component
                    operator: In
                    values:
                      - history
              topologyKey: kubernetes.io/hostname
      containers:
        - name: history
          image: temporalio/server:1.22.4
          args:
            - start
            - --service=history
          ports:
            - containerPort: 7234
              name: grpc
            - containerPort: 6934
              name: membership
            - containerPort: 9090
              name: metrics
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POSTGRES_HOST
