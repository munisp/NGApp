---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
spec:
  type: ClusterIP
  ports:
    - port: 7233
      targetPort: 7233
      name: grpc
  selector:
    app: temporal
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend-headless
  namespace: temporal
spec:
  clusterIP: None
  ports:
    - port: 7233
      targetPort: 7233
      name: grpc
    - port: 6933
      targetPort: 6933
      name: membership
  selector:
    app: temporal
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-history-headless
  namespace: temporal
spec:
  clusterIP: None
  ports:
    - port: 7234
      targetPort: 7234
      name: grpc
    - port: 6934
      targetPort: 6934
      name: membership
  selector:
    app: temporal
    component: history
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-matching-headless
  namespace: temporal
spec:
  clusterIP: None
  ports:
    - port: 7235
      targetPort: 7235
      name: grpc
    - port: 6935
      targetPort: 6935
      name: membership
  selector:
    app: temporal
    component: matching
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-secrets
  namespace: temporal
type: Opaque
stringData:
  postgres-password: "${POSTGRES_PASSWORD}"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-frontend-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-history-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: history
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-matching-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: matching
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: temporal-frontend-hpa
  namespace: temporal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: temporal-frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: temporal-history-hpa
  namespace: temporal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: temporal-history
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: temporal-monitor
  namespace: temporal
spec:
  selector:
    matchLabels:
      app: temporal
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
