apiVersion: v1
kind: Namespace
metadata:
  name: fluvio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluvio-config
  namespace: fluvio
data:
  SC_CONFIG: |
    replication:
      min_in_sync_replicas: 2
    
    storage:
      log_dir: /var/lib/fluvio/data
      size: 100Gi
    
    spu:
      min_id: 0
      max_id: 1000
    
    tls:
      enabled: true
      ca_cert: /etc/fluvio/tls/ca.crt
      server_cert: /etc/fluvio/tls/server.crt
      server_key: /etc/fluvio/tls/server.key
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-sc
  namespace: fluvio
spec:
  serviceName: fluvio-sc-headless
  replicas: 3
  selector:
    matchLabels:
      app: fluvio-sc
  template:
    metadata:
      labels:
        app: fluvio-sc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9003"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - fluvio-sc
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - fluvio-sc
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: fluvio-sc
          image: infinyon/fluvio:0.11.5
          command:
            - fluvio-sc
            - --bind-public
            - 0.0.0.0:9003
            - --bind-private
            - 0.0.0.0:9004
          ports:
            - containerPort: 9003
              name: public
            - containerPort: 9004
              name: private
          env:
            - name: RUST_LOG
              value: info
            - name: FLV_SC_PRIVATE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              memory: 512Mi
              cpu: "250m"
            limits:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: fluvio-data
              mountPath: /var/lib/fluvio
            - name: tls-certs
              mountPath: /etc/fluvio/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tls-certs
          secret:
            secretName: fluvio-tls
  volumeClaimTemplates:
    - metadata:
        name: fluvio-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fluvio-spu
  namespace: fluvio
spec:
  serviceName: fluvio-spu-headless
  replicas: 5
  selector:
    matchLabels:
      app: fluvio-spu
  template:
    metadata:
      labels:
        app: fluvio-spu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9005"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - fluvio-spu
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - fluvio-spu
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: fluvio-spu
      containers:
        - name: fluvio-spu
          image: infinyon/fluvio:0.11.5
          command:
            - fluvio-spu
            - --sc-addr
            - fluvio-sc.fluvio.svc.cluster.local:9004
            - --bind-public
            - 0.0.0.0:9005
            - --bind-private
            - 0.0.0.0:9006
          ports:
            - containerPort: 9005
              name: public
            - containerPort: 9006
              name: private
          env:
            - name: RUST_LOG
              value: info
            - name: SPU_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              memory: 1Gi
              cpu: "500m"
            limits:
              memory: 4Gi
              cpu: "2"
          volumeMounts:
            - name: fluvio-data
              mountPath: /var/lib/fluvio
            - name: tls-certs
              mountPath: /etc/fluvio/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9005
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tls-certs
          secret:
            secretName: fluvio-tls
  volumeClaimTemplates:
    - metadata:
        name: fluvio-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc
  namespace: fluvio
spec:
  type: ClusterIP
  ports:
    - port: 9003
      targetPort: 9003
      name: public
  selector:
    app: fluvio-sc
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-sc-headless
  namespace: fluvio
spec:
  clusterIP: None
  ports:
    - port: 9003
      targetPort: 9003
      name: public
    - port: 9004
      targetPort: 9004
      name: private
  selector:
    app: fluvio-sc
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-spu-headless
  namespace: fluvio
spec:
  clusterIP: None
  ports:
    - port: 9005
      targetPort: 9005
      name: public
    - port: 9006
      targetPort: 9006
      name: private
  selector:
    app: fluvio-spu
---
apiVersion: v1
kind: Secret
metadata:
  name: fluvio-tls
  namespace: fluvio
type: kubernetes.io/tls
data:
  tls.crt: "${FLUVIO_TLS_CRT_BASE64}"
  tls.key: "${FLUVIO_TLS_KEY_BASE64}"
  ca.crt: "${FLUVIO_CA_CRT_BASE64}"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-sc-pdb
  namespace: fluvio
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fluvio-sc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-spu-pdb
  namespace: fluvio
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: fluvio-spu
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fluvio-spu-hpa
  namespace: fluvio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: fluvio-spu
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluvio-monitor
  namespace: fluvio
spec:
  selector:
    matchLabels:
      app: fluvio-sc
  endpoints:
    - port: public
      interval: 15s
      path: /metrics
