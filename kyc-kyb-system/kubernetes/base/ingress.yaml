apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kyc-kyb-ingress
  namespace: kyc-kyb-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kyc.insurance.com
    secretName: kyc-tls-secret
  rules:
  - host: kyc.insurance.com
    http:
      paths:
      - path: /api/v1/document
        pathType: Prefix
        backend:
          service:
            name: document-verification-service
            port:
              number: 8001
      - path: /api/v1/liveness
        pathType: Prefix
        backend:
          service:
            name: liveness-service
            port:
              number: 8002
      - path: /api/v1/aml
        pathType: Prefix
        backend:
          service:
            name: aml-screening-service
            port:
              number: 8003
      - path: /api/v1/risk
        pathType: Prefix
        backend:
          service:
            name: risk-scoring-service
            port:
              number: 8004
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: keycloak-service
            port:
              number: 8080
