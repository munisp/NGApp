apiVersion: v1
kind: Secret
metadata:
  name: kyc-postgres-secret
  namespace: kyc-kyb-system
type: Opaque
stringData:
  POSTGRES_USER: kyc_admin
  POSTGRES_PASSWORD: kyc_secure_password_2026
  POSTGRES_DB: kyc_kyb_system
  DATABASE_URL: postgresql://kyc_admin:kyc_secure_password_2026@postgres-service:5432/kyc_kyb_system
---
apiVersion: v1
kind: Secret
metadata:
  name: kyc-redis-secret
  namespace: kyc-kyb-system
type: Opaque
stringData:
  REDIS_PASSWORD: redis_secure_password_2026
  REDIS_URL: redis://:redis_secure_password_2026@redis-service:6379
---
apiVersion: v1
kind: Secret
metadata:
  name: kyc-keycloak-secret
  namespace: kyc-kyb-system
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin_secure_password_2026
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyc-config
  namespace: kyc-kyb-system
data:
  KEYCLOAK_URL: "http://keycloak-service:8080"
  KEYCLOAK_REALM: "kyc-kyb-system"
  PERMIFY_URL: "http://permify-service:3476"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  ZOOKEEPER_CONNECT: "zookeeper-service:2181"
