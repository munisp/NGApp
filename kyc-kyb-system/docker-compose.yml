version: '3.8'

services:
  # ============================================================================
  # DATABASE SERVICES
  # ============================================================================
  
  postgres:
    image: postgres:14-alpine
    container_name: kyc-postgres
    environment:
      POSTGRES_USER: kyc_admin
      POSTGRES_PASSWORD: kyc_secure_password_2026
      POSTGRES_DB: kyc_kyb_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc_admin -d kyc_kyb_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kyc-redis
    command: redis-server --requirepass redis_secure_password_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # AUTHENTICATION & AUTHORIZATION
  # ============================================================================
  
  keycloak:
    image: quay.io/keycloak/keycloak:21.0.0
    container_name: kyc-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secure_password_2026
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kyc_kyb_system
      KC_DB_USERNAME: kyc_admin
      KC_DB_PASSWORD: kyc_secure_password_2026
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  permify:
    image: ghcr.io/permify/permify:latest
    container_name: kyc-permify
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://kyc_admin:kyc_secure_password_2026@postgres:5432/kyc_kyb_system?sslmode=disable
      PERMIFY_HTTP_PORT: 3476
      PERMIFY_GRPC_PORT: 3478
      PERMIFY_LOG_LEVEL: info
    ports:
      - "3476:3476"
      - "3478:3478"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3476/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # MESSAGE BROKER
  # ============================================================================
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kyc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kyc-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ============================================================================
  # KYC/KYB MICROSERVICES
  # ============================================================================
  
  document-verification-service:
    build:
      context: ./document-verification-service
      dockerfile: Dockerfile
    container_name: kyc-document-verification
    environment:
      DATABASE_URL: postgresql://kyc_admin:kyc_secure_password_2026@postgres:5432/kyc_kyb_system
      REDIS_URL: redis://:redis_secure_password_2026@redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kyc-kyb-system
      PERMIFY_URL: http://permify:3476
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      permify:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kyc-network
    volumes:
      - ./document-verification-service/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  liveness-service:
    build:
      context: ./liveness-service
      dockerfile: Dockerfile
    container_name: kyc-liveness
    environment:
      DATABASE_URL: postgresql://kyc_admin:kyc_secure_password_2026@postgres:5432/kyc_kyb_system
      REDIS_URL: redis://:redis_secure_password_2026@redis:6379/1
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kyc-kyb-system
      PERMIFY_URL: http://permify:3476
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      permify:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kyc-network
    volumes:
      - ./liveness-service/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  aml-screening-service:
    build:
      context: ./aml-screening-service
      dockerfile: Dockerfile
    container_name: kyc-aml-screening
    environment:
      DATABASE_URL: postgresql://kyc_admin:kyc_secure_password_2026@postgres:5432/kyc_kyb_system
      REDIS_URL: redis://:redis_secure_password_2026@redis:6379/2
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kyc-kyb-system
      PERMIFY_URL: http://permify:3476
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      permify:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  risk-scoring-service:
    build:
      context: ./risk-scoring-service
      dockerfile: Dockerfile
    container_name: kyc-risk-scoring
    environment:
      DATABASE_URL: postgresql://kyc_admin:kyc_secure_password_2026@postgres:5432/kyc_kyb_system
      REDIS_URL: redis://:redis_secure_password_2026@redis:6379/3
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kyc-kyb-system
      PERMIFY_URL: http://permify:3476
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PORT: 8004
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      permify:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ============================================================================
  # INITIALIZATION SERVICE
  # ============================================================================
  
  init-service:
    image: curlimages/curl:latest
    container_name: kyc-init
    depends_on:
      keycloak:
        condition: service_healthy
      permify:
        condition: service_healthy
    networks:
      - kyc-network
    volumes:
      - ./security/keycloak:/keycloak:ro
      - ./security/permify:/permify:ro
      - ./scripts:/scripts:ro
    command: >
      sh -c "
        echo 'Waiting for services to be ready...' &&
        sleep 30 &&
        echo 'Initializing Keycloak realm...' &&
        sh /scripts/init-keycloak.sh &&
        echo 'Loading Permify schema...' &&
        sh /scripts/init-permify.sh &&
        echo 'Initialization complete!'
      "
    restart: "no"

  # ============================================================================
  # API GATEWAY
  # ============================================================================
  
  nginx:
    image: nginx:alpine
    container_name: kyc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - document-verification-service
      - liveness-service
      - aml-screening-service
      - risk-scoring-service
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  kyc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
