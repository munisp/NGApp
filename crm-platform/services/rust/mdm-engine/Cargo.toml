[package]
name = "mdm-engine"
version = "0.1.0"
edition = "2021"
description = "Master Data Management Engine — Golden records, entity resolution, data quality scoring"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
