[package]
name = "waf-engine"
version = "0.1.0"
edition = "2021"
description = "Web Application Firewall engine with OWASP CRS, ransomware protection, and financial platform threat detection"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
base64 = "0.22"
sha2 = "0.10"
