[package]
name = "usage-metering"
version = "0.1.0"
edition = "2021"
description = "Per-tenant API usage metering, quota enforcement, and billing service"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tracing = "0.1"
