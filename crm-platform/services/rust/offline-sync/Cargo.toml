[package]
name = "offline-sync"
version = "0.1.0"
edition = "2021"
description = "Offline-first sync engine for low-bandwidth African markets"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
lz4_flex = "0.11"
bincode = "1"
dashmap = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }
