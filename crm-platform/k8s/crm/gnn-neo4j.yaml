apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnn-neo4j
  namespace: crm
  labels:
    app: gnn-neo4j
    platform: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gnn-neo4j
  template:
    metadata:
      labels:
        app: gnn-neo4j
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      containers:
        - name: gnn-neo4j
          image: crm-platform/gnn-neo4j:latest
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 400m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gnn-neo4j-service
  namespace: crm
spec:
  selector:
    app: gnn-neo4j
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gnn-neo4j-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gnn-neo4j
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
