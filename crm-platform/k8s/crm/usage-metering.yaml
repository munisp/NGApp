apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-metering
  namespace: crm
  labels:
    app: usage-metering
    platform: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usage-metering
  template:
    metadata:
      labels:
        app: usage-metering
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8107"
    spec:
      containers:
        - name: usage-metering
          image: crm-platform/usage-metering:latest
          ports:
            - containerPort: 8107
          env:
            - name: PORT
              value: "8107"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8107
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8107
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: usage-metering-service
  namespace: crm
spec:
  selector:
    app: usage-metering
  ports:
    - port: 8107
      targetPort: 8107
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usage-metering-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usage-metering
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
