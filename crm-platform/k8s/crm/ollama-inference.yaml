apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-inference
  namespace: crm
  labels:
    app: ollama-inference
    platform: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ollama-inference
  template:
    metadata:
      labels:
        app: ollama-inference
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8096"
    spec:
      containers:
        - name: ollama-inference
          image: crm-platform/ollama-inference:latest
          ports:
            - containerPort: 8096
          env:
            - name: PORT
              value: "8096"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8096
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-inference-service
  namespace: crm
spec:
  selector:
    app: ollama-inference
  ports:
    - port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ollama-inference-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ollama-inference
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
