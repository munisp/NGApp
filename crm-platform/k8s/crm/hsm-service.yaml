apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsm-service
  namespace: crm
  labels:
    app: hsm-service
    platform: crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hsm-service
  template:
    metadata:
      labels:
        app: hsm-service
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8105"
    spec:
      containers:
        - name: hsm-service
          image: crm-platform/hsm-service:latest
          ports:
            - containerPort: 8105
          env:
            - name: PORT
              value: "8105"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8105
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8105
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hsm-service-service
  namespace: crm
spec:
  selector:
    app: hsm-service
  ports:
    - port: 8105
      targetPort: 8105
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hsm-service-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hsm-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
