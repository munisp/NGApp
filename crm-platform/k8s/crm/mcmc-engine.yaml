apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcmc-engine
  namespace: crm
  labels:
    app: mcmc-engine
    platform: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcmc-engine
  template:
    metadata:
      labels:
        app: mcmc-engine
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8092"
    spec:
      containers:
        - name: mcmc-engine
          image: crm-platform/mcmc-engine:latest
          ports:
            - containerPort: 8092
          env:
            - name: PORT
              value: "8092"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8092
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8092
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcmc-engine-service
  namespace: crm
spec:
  selector:
    app: mcmc-engine
  ports:
    - port: 8092
      targetPort: 8092
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcmc-engine-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcmc-engine
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
