apiVersion: apps/v1
kind: Deployment
metadata:
  name: epr-kgqa
  namespace: crm
  labels:
    app: epr-kgqa
    platform: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: epr-kgqa
  template:
    metadata:
      labels:
        app: epr-kgqa
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8094"
    spec:
      containers:
        - name: epr-kgqa
          image: crm-platform/epr-kgqa:latest
          ports:
            - containerPort: 8094
          env:
            - name: PORT
              value: "8094"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 400m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8094
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: epr-kgqa-service
  namespace: crm
spec:
  selector:
    app: epr-kgqa
  ports:
    - port: 8094
      targetPort: 8094
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: epr-kgqa-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: epr-kgqa
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
