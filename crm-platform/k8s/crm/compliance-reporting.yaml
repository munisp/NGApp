apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-reporting
  namespace: crm
  labels:
    app: compliance-reporting
    platform: crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliance-reporting
  template:
    metadata:
      labels:
        app: compliance-reporting
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
    spec:
      containers:
        - name: compliance-reporting
          image: crm-platform/compliance-reporting:latest
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-reporting-service
  namespace: crm
spec:
  selector:
    app: compliance-reporting
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compliance-reporting-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliance-reporting
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
