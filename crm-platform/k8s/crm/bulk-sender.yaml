apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-sender
  namespace: crm
  labels:
    app: bulk-sender
    platform: crm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bulk-sender
  template:
    metadata:
      labels:
        app: bulk-sender
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8104"
    spec:
      containers:
        - name: bulk-sender
          image: crm-platform/bulk-sender:latest
          ports:
            - containerPort: 8104
          env:
            - name: PORT
              value: "8104"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8104
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8104
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bulk-sender-service
  namespace: crm
spec:
  selector:
    app: bulk-sender
  ports:
    - port: 8104
      targetPort: 8104
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bulk-sender-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bulk-sender
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
