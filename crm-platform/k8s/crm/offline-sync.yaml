apiVersion: apps/v1
kind: Deployment
metadata:
  name: offline-sync
  namespace: crm
  labels:
    app: offline-sync
    platform: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: offline-sync
  template:
    metadata:
      labels:
        app: offline-sync
        platform: crm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
    spec:
      containers:
        - name: offline-sync
          image: crm-platform/offline-sync:latest
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              value: kafka.crm.svc:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: offline-sync-service
  namespace: crm
spec:
  selector:
    app: offline-sync
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: offline-sync-hpa
  namespace: crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: offline-sync
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
