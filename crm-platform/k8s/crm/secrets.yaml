apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  database-url: "postgres://ndsep_user:${POSTGRES_PASSWORD}@postgres.crm.svc:5432/ndsep_db?sslmode=require"
  redis-url: "redis://redis.crm.svc:6379/0"
  keycloak-client-secret: "${KEYCLOAK_CLIENT_SECRET}"
  permify-api-token: "${PERMIFY_API_TOKEN}"
  tigerbeetle-address: "tigerbeetle.crm.svc:3001"
  opensearch-password: "${OPENSEARCH_ADMIN_PASSWORD}"
  apisix-admin-key: "${APISIX_ADMIN_KEY}"
