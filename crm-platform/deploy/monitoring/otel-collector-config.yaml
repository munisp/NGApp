# OpenTelemetry Collector Configuration
# Distributed tracing for all CRM platform services

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'crm-api'
          scrape_interval: 15s
          static_configs:
            - targets: ['crm-api:8080']
        - job_name: 'semantic-search'
          scrape_interval: 15s
          static_configs:
            - targets: ['semantic-search:8082']
        - job_name: 'workflow-runtime'
          scrape_interval: 15s
          static_configs:
            - targets: ['workflow-runtime:8083']
        - job_name: 'sales-agent'
          scrape_interval: 15s
          static_configs:
            - targets: ['sales-agent:8084']
        - job_name: 'analytics-engine'
          scrape_interval: 15s
          static_configs:
            - targets: ['analytics-engine:8085']

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  attributes:
    actions:
      - key: environment
        value: production
        action: upsert
      - key: service.namespace
        value: crm-platform
        action: upsert

  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: crm

  logging:
    loglevel: warn

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes, resource]
      exporters: [otlp/jaeger, logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]
