apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-service-config
  namespace: enterprise-crm
  labels:
    app: customer-service
    component: config
data:
  config.yaml: |
    server:
      port: 8080
      host: "0.0.0.0"
      environment: "production"
      read_timeout: 30
      write_timeout: 30
      idle_timeout: 120
    
    database:
      host: "postgresql.enterprise-crm.svc.cluster.local"
      port: 5432
      user: "customer_service"
      dbname: "customer_service"
      sslmode: "require"
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: 3600
    
    redis:
      host: "redis.enterprise-crm.svc.cluster.local"
      port: 6379
      db: 0
      pool_size: 10
      min_idle_conns: 2
    
    kafka:
      brokers:
        - "kafka.enterprise-crm.svc.cluster.local:9092"
      consumer_group: "customer-service-group"
      topics:
        customer_events: "customer-events"
        interaction_events: "interaction-events"
        segment_events: "segment-events"
    
    dapr:
      app_id: "customer-service"
      app_port: 8080
      state_store: "statestore"
      pubsub: "pubsub"
      secret_store: "secretstore"
    
    temporal:
      host_port: "temporal.enterprise-crm.svc.cluster.local:7233"
      namespace: "default"
      task_queue: "customer-service-queue"
    
    logging:
      level: "info"
      format: "json"
    
    metrics:
      enabled: true
      path: "/metrics"
      port: 9090

---
apiVersion: v1
kind: Secret
metadata:
  name: customer-service-secrets
  namespace: enterprise-crm
  labels:
    app: customer-service
    component: secrets
type: Opaque
data:
  # Base64 encoded values (replace with actual values)
  DB_PASSWORD: cG9zdGdyZXM=  # postgres
  REDIS_PASSWORD: ""
  JWT_SECRET: c3VwZXJfc2VjcmV0X2p3dF9rZXk=  # super_secret_jwt_key

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: enterprise-crm
  labels:
    app: customer-service
    component: api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: customer-service
      component: api
  template:
    metadata:
      labels:
        app: customer-service
        component: api
        version: v1
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "customer-service"
        dapr.io/app-port: "8080"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: customer-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: customer-service
        image: enterprise-crm/customer-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_ENVIRONMENT
          value: "production"
        - name: DB_HOST
          value: "postgresql.enterprise-crm.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "customer_service"
        - name: DB_NAME
          value: "customer_service"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: customer-service-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          value: "redis.enterprise-crm.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: customer-service-secrets
              key: REDIS_PASSWORD
        - name: KAFKA_BROKERS
          value: "kafka.enterprise-crm.svc.cluster.local:9092"
        - name: DAPR_APP_ID
          value: "customer-service"
        - name: TEMPORAL_HOST_PORT
          value: "temporal.enterprise-crm.svc.cluster.local:7233"
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: customer-service-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: enterprise-crm
  labels:
    app: customer-service
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: customer-service
    component: api

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-service
  namespace: enterprise-crm
  labels:
    app: customer-service

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: customer-service
  namespace: enterprise-crm
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: customer-service
  namespace: enterprise-crm
subjects:
- kind: ServiceAccount
  name: customer-service
  namespace: enterprise-crm
roleRef:
  kind: Role
  name: customer-service
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: customer-service-network-policy
  namespace: enterprise-crm
spec:
  podSelector:
    matchLabels:
      app: customer-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: enterprise-crm
    - namespaceSelector:
        matchLabels:
          name: istio-system
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: enterprise-crm
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 9092  # Kafka
    - protocol: TCP
      port: 7233  # Temporal
  - to: []
    ports:
    - protocol: TCP
      port: 53   # DNS
    - protocol: UDP
      port: 53   # DNS
    - protocol: TCP
      port: 443  # HTTPS

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customer-service-pdb
  namespace: enterprise-crm
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: customer-service
      component: api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-service-hpa
  namespace: enterprise-crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

