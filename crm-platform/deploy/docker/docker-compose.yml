version: "3.9"

services:
  # ============== Database ==============
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ndsep_user
      POSTGRES_PASSWORD: ndsep_secure_2026
      POSTGRES_DB: ndsep_db
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndsep_user -d ndsep_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============== Cache ==============
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s

  # ============== Message Broker ==============
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "crm-platform-kafka-cluster"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092", "9094:9094"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8081:8081"]

  # ============== Auth ==============
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_crm_2026
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ndsep_db
      KC_DB_USERNAME: ndsep_user
      KC_DB_PASSWORD: ndsep_secure_2026
    ports: ["8180:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  # ============== API Gateway ==============
  apisix:
    image: apache/apisix:3.6.0-debian
    ports: ["9080:9080", "9443:9443", "9180:9180"]
    volumes:
      - ../../middleware/apisix/apisix_routes.yaml:/usr/local/apisix/conf/apisix.yaml
    depends_on:
      - crm-core

  # ============== CRM Services ==============
  crm-core:
    build:
      context: ../../services/go/crm-services
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: banking-crm
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # ============== Compliance Service (Python) ==============
  compliance-service:
    build:
      context: ../../services/python/compliance-reporting
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db?sslmode=disable
      PORT: "8086"
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }

  # ============== Offline Sync (Rust) ==============
  offline-sync:
    build:
      context: ../../services/rust/offline-sync
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/1
      PORT: "8084"
    ports: ["8084:8084"]
    depends_on:
      redis: { condition: service_healthy }

  # ============== WAF Engine (Rust) ==============
  waf-engine:
    build:
      context: ../../services/rust/waf-engine
      dockerfile: Dockerfile
    environment:
      PORT: "8085"
    ports: ["8085:8085"]

  # ============== Campaign Analytics (Python) ==============
  campaign-analytics:
    build:
      context: ../../services/python/campaign-analytics
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db?sslmode=disable
      REDIS_URL: redis://redis:6379/2
      PORT: "8087"
    ports: ["8087:8087"]
    depends_on:
      postgres: { condition: service_healthy }

  # ============== Workflow Orchestration ==============
  temporal:
    image: temporalio/auto-setup:1.22
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ndsep_user
      POSTGRES_PWD: ndsep_secure_2026
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }

  temporal-ui:
    image: temporalio/ui:2.22.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8088:8080"]
    depends_on:
      - temporal

  # ============== Search ==============
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Admin_crm_2026!
      DISABLE_SECURITY_PLUGIN: "true"
    ports: ["9200:9200"]
    volumes:
      - osdata:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    depends_on:
      - opensearch

  # ============== CRM PWA ==============
  crm-web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    ports: ["3000:80"]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  osdata:
