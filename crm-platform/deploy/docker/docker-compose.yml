version: '3.8'

services:
  crm-web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://crm-api:8080
    depends_on:
      - crm-api

  crm-api:
    build:
      context: ../../services/go/crm-services
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://crm:crm_password@postgres:5432/crm_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - KEYCLOAK_URL=http://keycloak:8080
      - TEMPORAL_HOST=temporal:7233
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - redis

  bulk-sender:
    build:
      context: ../../services/rust/bulk-sender
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=4
      - RATE_LIMIT_PER_SECOND=1000
    depends_on:
      - redis

  usage-metering:
    build:
      context: ../../services/rust/usage-metering
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://crm:crm_password@postgres:5432/crm_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  campaign-analytics:
    build:
      context: ../../services/python/campaign-analytics
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=postgres://crm:crm_password@postgres:5432/crm_db?sslmode=disable
      - REDIS_URL=redis://redis:6379

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_password
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - crm_redis_data:/data

volumes:
  crm_postgres_data:
  crm_redis_data:
