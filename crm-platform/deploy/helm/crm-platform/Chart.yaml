apiVersion: v2
name: crm-platform
description: Unified Banking CRM Platform — Multi-tenant, multi-vertical enterprise CRM
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - crm
  - banking
  - telco
  - commodity
  - cpaas
  - multi-tenant
maintainers:
  - name: CRM Platform Team
dependencies:
  - name: postgresql
    version: "~13.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "~18.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "~26.0"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
