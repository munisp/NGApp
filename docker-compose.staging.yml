version: '3.8'

# Staging Environment Configuration
# This configuration is optimized for staging/testing environments
# with reduced resources and additional debugging capabilities

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for faster iterations
    container_name: payment-switch-staging-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - LOG_LEVEL=debug
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./certs:/app/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.payment-switch.environment=staging"
      - "com.payment-switch.service=app"

  db:
    image: postgres:15-alpine
    container_name: payment-switch-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging_password}
      POSTGRES_DB: payment_switch_staging
      POSTGRES_USER: ${DB_USER:-staging_user}
    volumes:
      - staging-db-data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    networks:
      - staging-network
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-staging_user} -d payment_switch_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.payment-switch.environment=staging"
      - "com.payment-switch.service=database"

  redis:
    image: redis:7-alpine
    container_name: payment-switch-staging-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - staging-redis-data:/data
    networks:
      - staging-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "com.payment-switch.environment=staging"
      - "com.payment-switch.service=cache"

  # Optional: Nginx for SSL termination in staging
  nginx:
    image: nginx:alpine
    container_name: payment-switch-staging-nginx
    restart: unless-stopped
    ports:
      - "8080:80"    # HTTP on different port
      - "8443:443"   # HTTPS on different port
    volumes:
      - ./nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - staging-network
    labels:
      - "com.payment-switch.environment=staging"
      - "com.payment-switch.service=proxy"

  # Optional: Adminer for database management in staging
  adminer:
    image: adminer:latest
    container_name: payment-switch-staging-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    networks:
      - staging-network
    labels:
      - "com.payment-switch.environment=staging"
      - "com.payment-switch.service=admin-tool"

  # Optional: Redis Commander for cache management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: payment-switch-staging-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - staging-network
    depends_on:
      - redis
    labels:
      - "com.payment-switch.environment=staging"
      - "com.payment-switch.service=admin-tool"

volumes:
  staging-db-data:
    name: payment-switch-staging-db-data
  staging-redis-data:
    name: payment-switch-staging-redis-data

networks:
  staging-network:
    name: payment-switch-staging-network
    driver: bridge
