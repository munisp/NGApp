# ISO 27001 Asset Inventory
# PayGate Payment Switch Platform
# Last Updated: 2025-12-30

metadata:
  organization: PayGate
  scope: Payment Processing Platform
  version: "1.0"
  last_review: "2025-12-30"
  next_review: "2026-03-30"
  owner: Security Team
  classification: Confidential

assets:
  # Critical Infrastructure
  - id: AST-INFRA-001
    name: TigerBeetle Ledger Cluster
    type: software
    classification: restricted
    owner: Platform Engineering
    custodian: SRE Team
    location: Primary Datacenter
    business_value: critical
    description: Core financial ledger for all transactions
    dependencies:
      - AST-INFRA-003  # PostgreSQL
    security_controls:
      - mTLS encryption
      - Network isolation
      - Audit logging
      - Backup encryption
    risk_assessments:
      - RISK-001
      - RISK-002

  - id: AST-INFRA-002
    name: Mojaloop Integration Layer
    type: software
    classification: confidential
    owner: Integration Team
    custodian: Platform Engineering
    location: Primary Datacenter
    business_value: critical
    description: Mojaloop FSPIOP integration for interoperability
    dependencies:
      - AST-INFRA-001  # TigerBeetle
      - AST-INFRA-003  # PostgreSQL
    security_controls:
      - mTLS encryption
      - API authentication
      - Rate limiting
      - Audit logging

  - id: AST-INFRA-003
    name: PostgreSQL Database Cluster
    type: software
    classification: restricted
    owner: Database Team
    custodian: SRE Team
    location: Primary Datacenter
    business_value: critical
    description: Primary relational database for application data
    security_controls:
      - Encryption at rest
      - TLS in transit
      - Role-based access
      - Audit logging
      - Automated backups

  - id: AST-INFRA-004
    name: Redis Cluster
    type: software
    classification: confidential
    owner: Platform Engineering
    custodian: SRE Team
    location: Primary Datacenter
    business_value: high
    description: Caching and session storage
    security_controls:
      - TLS encryption
      - Authentication required
      - Network isolation

  - id: AST-INFRA-005
    name: Apache Kafka Cluster
    type: software
    classification: confidential
    owner: Platform Engineering
    custodian: SRE Team
    location: Primary Datacenter
    business_value: critical
    description: Event streaming platform for domain events
    security_controls:
      - SASL authentication
      - TLS encryption
      - ACL-based authorization
      - Audit logging

  - id: AST-INFRA-006
    name: RustFS Object Storage
    type: software
    classification: confidential
    owner: Platform Engineering
    custodian: SRE Team
    location: Primary Datacenter
    business_value: high
    description: Object storage for documents and files
    security_controls:
      - Server-side encryption
      - Access policies
      - Versioning enabled
      - Audit logging

  # Security Infrastructure
  - id: AST-SEC-001
    name: Keycloak Identity Provider
    type: software
    classification: restricted
    owner: Security Team
    custodian: Platform Engineering
    location: Primary Datacenter
    business_value: critical
    description: Identity and access management
    security_controls:
      - MFA enforcement
      - Password policies
      - Session management
      - Audit logging

  - id: AST-SEC-002
    name: Permify Authorization Service
    type: software
    classification: restricted
    owner: Security Team
    custodian: Platform Engineering
    location: Primary Datacenter
    business_value: critical
    description: Fine-grained authorization (RBAC/ABAC)
    security_controls:
      - Policy versioning
      - Audit logging
      - API authentication

  - id: AST-SEC-003
    name: APISIX API Gateway
    type: software
    classification: confidential
    owner: Platform Engineering
    custodian: SRE Team
    location: DMZ
    business_value: critical
    description: API gateway for north-south traffic
    security_controls:
      - TLS termination
      - Rate limiting
      - JWT validation
      - WAF integration
      - Audit logging

  - id: AST-SEC-004
    name: OpenAppSec WAF
    type: software
    classification: confidential
    owner: Security Team
    custodian: SRE Team
    location: DMZ
    business_value: high
    description: Web Application Firewall
    security_controls:
      - OWASP rule sets
      - Custom rules
      - Threat intelligence
      - Logging and alerting

  - id: AST-SEC-005
    name: HashiCorp Vault
    type: software
    classification: restricted
    owner: Security Team
    custodian: SRE Team
    location: Primary Datacenter
    business_value: critical
    description: Secrets management and PKI
    security_controls:
      - Seal/unseal process
      - Audit logging
      - Policy-based access
      - Auto-rotation

  # Application Services
  - id: AST-APP-001
    name: Payment Core Services
    type: software
    classification: confidential
    owner: Engineering Team
    custodian: Platform Engineering
    location: Kubernetes Cluster
    business_value: critical
    description: Core payment processing services (Go)
    dependencies:
      - AST-INFRA-001
      - AST-INFRA-003
      - AST-INFRA-005
    security_controls:
      - Container security
      - Network policies
      - Service mesh
      - Audit logging

  - id: AST-APP-002
    name: Admin Dashboard
    type: software
    classification: confidential
    owner: Engineering Team
    custodian: Platform Engineering
    location: Kubernetes Cluster
    business_value: high
    description: Administrative web interface (Next.js)
    security_controls:
      - CSP headers
      - HSTS
      - Authentication required
      - RBAC enforcement

  - id: AST-APP-003
    name: KYC/KYB Service
    type: software
    classification: restricted
    owner: Compliance Team
    custodian: Platform Engineering
    location: Kubernetes Cluster
    business_value: high
    description: Know Your Customer/Business verification
    dependencies:
      - AST-INFRA-003
      - AST-INFRA-006
    security_controls:
      - PII encryption
      - Access logging
      - Data retention policies

  - id: AST-APP-004
    name: Fraud Detection Service
    type: software
    classification: confidential
    owner: Risk Team
    custodian: Platform Engineering
    location: Kubernetes Cluster
    business_value: high
    description: Real-time fraud detection and prevention
    security_controls:
      - ML model versioning
      - Decision audit trail
      - Alert management

  # Data Assets
  - id: AST-DATA-001
    name: Transaction Data
    type: data
    classification: restricted
    owner: Finance Team
    custodian: Database Team
    location: PostgreSQL / TigerBeetle
    business_value: critical
    description: All financial transaction records
    retention: 7 years
    security_controls:
      - Encryption at rest
      - Access logging
      - Backup encryption

  - id: AST-DATA-002
    name: Customer PII
    type: data
    classification: restricted
    owner: Compliance Team
    custodian: Database Team
    location: PostgreSQL
    business_value: critical
    description: Personal identifiable information
    retention: As required by regulation
    security_controls:
      - Field-level encryption
      - Access logging
      - Data masking
      - Right to erasure support

  - id: AST-DATA-003
    name: Audit Logs
    type: data
    classification: confidential
    owner: Security Team
    custodian: SRE Team
    location: Delta Lake / ELK
    business_value: high
    description: Security and compliance audit logs
    retention: 7 years
    security_controls:
      - Hash-chain integrity
      - Immutable storage
      - Access controls

  - id: AST-DATA-004
    name: Cryptographic Keys
    type: data
    classification: restricted
    owner: Security Team
    custodian: Security Team
    location: HashiCorp Vault / HSM
    business_value: critical
    description: Encryption keys and certificates
    security_controls:
      - HSM storage
      - Key rotation
      - Access logging
      - Dual control

# Asset Classification Legend
classification_levels:
  public:
    description: Information that can be freely shared
    handling: No special handling required
  internal:
    description: Information for internal use only
    handling: Access restricted to employees
  confidential:
    description: Sensitive business information
    handling: Need-to-know basis, encrypted storage
  restricted:
    description: Highly sensitive information
    handling: Strict access controls, encryption required, audit logging
