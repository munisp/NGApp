version: "3.9"

services:
  # ── Core Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ndsep_db
      POSTGRES_USER: ndsep_user
      POSTGRES_PASSWORD: ndsep_secure_2026
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndsep_user -d ndsep_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s

  # ── TypeScript API (main server) ─────────────────────────────────────────────
  ndsep-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["5000:5000"]
    environment:
      DATABASE_URL: postgresql://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-32-chars-minimum!!
      NODE_ENV: development
      EVENT_GATEWAY_URL: http://event-gateway:8170
      REALTIME_ENGINE_URL: http://realtime-engine:8180
      PQC_ENGINE_URL: http://pqc-engine:8190
      COMPLIANCE_AI_URL: http://compliance-ai:8200
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── Go Services ──────────────────────────────────────────────────────────────
  event-gateway:
    build:
      context: ./services/go
      dockerfile: event-gateway/Dockerfile
    ports: ["8170:8170"]
    environment:
      PORT: "8170"
      KAFKA_BROKERS: kafka:9092

  realtime-engine:
    build:
      context: ./services/go
      dockerfile: realtime-engine/Dockerfile
    ports: ["8180:8180"]
    environment:
      PORT: "8180"

  dlq-processor:
    build:
      context: ./services/go
      dockerfile: dlq-processor/Dockerfile
    ports: ["9090:9090"]
    environment:
      DATABASE_URL: postgresql://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }

  health-orchestrator:
    build:
      context: ./services/go
      dockerfile: health-orchestrator/Dockerfile
    ports: ["8195:8195"]
    environment:
      PORT: "8195"

  # ── Rust Services ────────────────────────────────────────────────────────────
  pqc-engine:
    build:
      context: ./services/rust/pqc-engine
    ports: ["8190:8190"]
    environment:
      PORT: "8190"

  data-pipeline:
    build:
      context: ./services/rust/data-pipeline
    ports: ["8191:8191"]
    environment:
      PORT: "8191"

  # ── Python ML Services ───────────────────────────────────────────────────────
  compliance-ai:
    build:
      context: ./services/python/compliance-ai
    ports: ["8200:8200"]
    environment:
      PORT: "8200"

  regulatory-intelligence:
    build:
      context: ./services/python/regulatory-intelligence
    ports: ["8201:8201"]
    environment:
      PORT: "8201"

  # ── Observability ────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
      - "8889:8889"   # Prometheus metrics
    volumes:
      - ./monitoring/otel-config.yaml:/etc/otelcol-contrib/config.yaml

volumes:
  pgdata:
