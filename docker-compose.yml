  treasury-liquidity:
    build: { context: ., dockerfile: docker/Dockerfile.rust, args: { SERVICE: treasury-liquidity-rs } }
    environment: { PORT: "8142" }
    ports: ["8142:8142"]
    profiles: ["services"]

volumes:
  pgdata:
  osdata:
