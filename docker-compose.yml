# 54Bank Core Banking Platform — Docker Compose
# A6: Container orchestration with all infrastructure dependencies
#
# Usage:
#   docker compose up -d                          # Start all infrastructure
#   docker compose up -d postgres redis kafka      # Start just infra
#   docker compose --profile services up -d        # Start services too

version: "3.9"

services:
  # ── Infrastructure ──

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking54
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking_dev_password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking54"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "54bank-kafka-dev-cluster"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports: ["9200:9200"]
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Express Gateway (BFF) ──

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://banking:banking_dev_password@postgres:5432/banking54"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["gateway"]

  # ── Go Services ──

  teller-operations:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: teller-operations-go } }
    environment: { PORT: "8090" }
    ports: ["8090:8090"]
    profiles: ["services"]

  payments-hub:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: payments-hub-go } }
    environment: { PORT: "8091" }
    ports: ["8091:8091"]
    profiles: ["services"]

  trade-finance:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: trade-finance-go } }
    environment: { PORT: "8093" }
    ports: ["8093:8093"]
    profiles: ["services"]

  esusu-groups:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: esusu-groups-go } }
    environment: { PORT: "8095" }
    ports: ["8095:8095"]
    profiles: ["services"]

  group-lending:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: group-lending-go } }
    environment: { PORT: "8096" }
    ports: ["8096:8096"]
    profiles: ["services"]

  virtual-accounts:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: virtual-accounts-go } }
    environment: { PORT: "8097" }
    ports: ["8097:8097"]
    profiles: ["services"]

  cheque-clearing:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: cheque-clearing-go } }
    environment: { PORT: "8132" }
    ports: ["8132:8132"]
    profiles: ["services"]

  nibss-direct-debit:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: nibss-direct-debit-go } }
    environment: { PORT: "8134" }
    ports: ["8134:8134"]
    profiles: ["services"]

  card-management:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: card-management-go } }
    environment: { PORT: "8140" }
    ports: ["8140:8140"]
    profiles: ["services"]

  agent-banking:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: agent-banking-go } }
    environment: { PORT: "8143" }
    ports: ["8143:8143"]
    profiles: ["services"]

  # ── Python Services ──

  islamic-banking:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: islamic-banking-py } }
    environment: { PORT: "8092" }
    ports: ["8092:8092"]
    profiles: ["services"]

  batch-processing:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: batch-processing-py } }
    environment: { PORT: "8117" }
    ports: ["8117:8117"]
    profiles: ["services"]

  customer-360:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: customer-360-py } }
    environment: { PORT: "8133" }
    ports: ["8133:8133"]
    profiles: ["services"]

  kyc-aml:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: kyc-aml-screening-py } }
    environment: { PORT: "8136" }
    ports: ["8136:8136"]
    profiles: ["services"]

  # ── Rust Services ──

  bulk-payments:
    build: { context: ., dockerfile: docker/Dockerfile.rust, args: { SERVICE: bulk-payments-rs } }
    environment: { PORT: "8139" }
    ports: ["8139:8139"]
