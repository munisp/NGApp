---
# Kafka HA Cluster — KRaft Mode (No ZooKeeper), 3 Combined Brokers/Controllers
# Rack-aware placement, TLS, SASL/SCRAM, Prometheus metrics, PodDisruptionBudget
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    app.kubernetes.io/managed-by: helm
---
# Headless Service for broker discovery
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
  labels:
    app: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: controller
      port: 9093
      targetPort: 9093
    - name: broker
      port: 9092
      targetPort: 9092
    - name: broker-tls
      port: 9094
      targetPort: 9094
    - name: metrics
      port: 9101
      targetPort: 9101
---
# External LoadBalancer service for client access
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: broker-tls
      port: 9094
      targetPort: 9094
    - name: metrics
      port: 9101
      targetPort: 9101
---
# ConfigMap for Kafka server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka
data:
  server.properties: |
    # KRaft mode — no ZooKeeper
    process.roles=broker,controller
    controller.quorum.voters=0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093,1@kafka-1.kafka-headless.kafka.svc.cluster.local:9093,2@kafka-2.kafka-headless.kafka.svc.cluster.local:9093
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=BROKER
    listeners=BROKER://:9092,CONTROLLER://:9093,BROKER_TLS://:9094
    advertised.listeners=BROKER://$(POD_NAME).kafka-headless.kafka.svc.cluster.local:9092,BROKER_TLS://$(POD_NAME).kafka-headless.kafka.svc.cluster.local:9094
    listener.security.protocol.map=BROKER:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,BROKER_TLS:SASL_SSL
    # Replication
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    # Rack awareness
    broker.rack=$(RACK_ID)
    replica.selector.class=org.apache.kafka.common.replica.RackAwareReplicaSelector
    # Performance
    num.network.threads=8
    num.io.threads=16
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    num.partitions=12
    num.recovery.threads.per.data.dir=2
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    # Compression
    compression.type=lz4
    # SASL
    sasl.enabled.mechanisms=SCRAM-SHA-512
    sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
    # JMX/Metrics
    metric.reporters=org.apache.kafka.common.metrics.JmxReporter
    auto.create.topics.enable=false
    delete.topic.enable=true
    # Log dirs
    log.dirs=/var/kafka/data
  log4j.properties: |
    log4j.rootLogger=INFO, stdout
    log4j.appender.stdout=org.apache.log4j.ConsoleAppender
    log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
    log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
---
# Secret for SASL credentials
apiVersion: v1
kind: Secret
metadata:
  name: kafka-sasl-secret
  namespace: kafka
type: Opaque
stringData:
  KAFKA_CLIENT_USERS: "insurance-platform"
  KAFKA_CLIENT_PASSWORDS: "${KAFKA_CLIENT_PASSWORD}"
  KAFKA_INTER_BROKER_USER: "inter-broker"
  KAFKA_INTER_BROKER_PASSWORD: "${KAFKA_INTER_BROKER_PASSWORD}"
---
# StatefulSet for 3-broker KRaft cluster
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka
    version: "3.7"
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["zone-a", "zone-b", "zone-c"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: kafka
      initContainers:
        - name: kafka-init
          image: bitnami/kafka:3.7
          command:
            - /bin/bash
            - -c
            - |
              ORDINAL=${HOSTNAME##*-}
              NODE_ID=$ORDINAL
              if [ ! -f /var/kafka/data/meta.properties ]; then
                /opt/bitnami/kafka/bin/kafka-storage.sh format \
                  --config /etc/kafka/server.properties \
                  --cluster-id "${KAFKA_CLUSTER_ID}" \
                  --node-id ${NODE_ID} \
                  --ignore-formatted
              fi
          env:
            - name: KAFKA_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-sasl-secret
                  key: KAFKA_CLUSTER_ID
                  optional: true
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka/data
            - name: kafka-config
              mountPath: /etc/kafka
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
            - containerPort: 9094
              name: broker-tls
            - containerPort: 9101
              name: metrics
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RACK_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/zone']
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx4G -Xms4G"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"
            - name: KAFKA_JMX_PORT
              value: "9101"
          envFrom:
            - secretRef:
                name: kafka-sasl-secret
          resources:
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            exec:
              command:
                - /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server=localhost:9092
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server=localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka/data
            - name: kafka-config
              mountPath: /etc/kafka
            - name: kafka-tls
              mountPath: /etc/kafka/tls
              readOnly: true
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:latest
          args:
            - --kafka.server=localhost:9092
            - --web.listen-address=:9308
          ports:
            - containerPort: 9308
              name: exporter-metrics
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: kafka-config
          configMap:
            name: kafka-config
        - name: kafka-tls
          secret:
            secretName: kafka-tls-secret
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi
---
# PodDisruptionBudget — ensure at least 2 brokers always available
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-pdb
  namespace: kafka
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kafka
---
# HorizontalPodAutoscaler for Kafka (scale based on CPU/memory)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-hpa
  namespace: kafka
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: kafka
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# NetworkPolicy — restrict Kafka access to authorized namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-network-policy
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kafka-access: "true"
      ports:
        - port: 9092
        - port: 9094
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9093
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
    - ports:
        - port: 53
          protocol: UDP
