---
# Permify HA — 3-replica fine-grained authorization service
# PostgreSQL persistence, Redis cache, TLS, Prometheus metrics, PodDisruptionBudget
apiVersion: v1
kind: Namespace
metadata:
  name: permify
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: permify
data:
  config.yaml: |
    server:
      rate_limit: 1000
      http:
        enabled: true
        port: 3476
        tls:
          enabled: false
      grpc:
        port: 3478
        tls:
          enabled: false
    logger:
      level: info
      output: stdout
    profiler:
      enabled: false
      port: 6060
    authn:
      method: preshared
      preshared:
        keys:
          - ${PERMIFY_PRESHARED_KEY}
    tracer:
      exporter: otlp
      endpoint: otel-collector.observability.svc.cluster.local:4317
      insecure: true
      enabled: true
    meter:
      exporter: otlp
      endpoint: otel-collector.observability.svc.cluster.local:4317
      insecure: true
      enabled: true
    database:
      engine: postgres
      uri: postgres://permify:${PERMIFY_DB_PASSWORD}@postgres-ha.postgres.svc.cluster.local:5432/permify?sslmode=disable
      auto_migrate: true
      max_open_connections: 20
      max_idle_connections: 5
      max_connection_lifetime: 300s
      max_connection_idle_time: 60s
      garbage_collection:
        enabled: true
        interval: 200h
        window: 200h
        timeout: 5m
    distributed:
      enabled: true
      address: permify-headless.permify.svc.cluster.local:3478
      port: 3478
    cache:
      number_of_counters: 1_000
      max_cost: 1GiB
---
apiVersion: v1
kind: Secret
metadata:
  name: permify-secret
  namespace: permify
type: Opaque
stringData:
  PERMIFY_DB_PASSWORD: "${PERMIFY_DB_PASSWORD}"
  PERMIFY_PRESHARED_KEY: "${PERMIFY_PRESHARED_KEY}"
---
# Headless service for distributed mode
apiVersion: v1
kind: Service
metadata:
  name: permify-headless
  namespace: permify
spec:
  clusterIP: None
  selector:
    app: permify
  ports:
    - name: grpc
      port: 3478
    - name: http
      port: 3476
---
# External service
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: permify
  labels:
    app: permify
spec:
  selector:
    app: permify
  ports:
    - name: http
      port: 3476
      targetPort: 3476
    - name: grpc
      port: 3478
      targetPort: 3478
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: permify
  labels:
    app: permify
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: permify
  template:
    metadata:
      labels:
        app: permify
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: permify
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: permify
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres-ha.postgres.svc.cluster.local -p 5432 -U permify; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: permify-secret
                  key: PERMIFY_DB_PASSWORD
      containers:
        - name: permify
          image: ghcr.io/permify/permify:v0.9.6
          args:
            - serve
            - --config=/etc/permify/config.yaml
          ports:
            - containerPort: 3476
              name: http
            - containerPort: 3478
              name: grpc
            - containerPort: 9090
              name: metrics
          env:
            - name: PERMIFY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: permify-secret
                  key: PERMIFY_DB_PASSWORD
            - name: PERMIFY_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: permify-secret
                  key: PERMIFY_PRESHARED_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            grpc:
              port: 3478
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 3478
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: permify-config
              mountPath: /etc/permify
      volumes:
        - name: permify-config
          configMap:
            name: permify-config
---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-pdb
  namespace: permify
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: permify
---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permify-hpa
  namespace: permify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: permify
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
