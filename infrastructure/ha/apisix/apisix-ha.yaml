---
# APISIX HA — 3-replica gateway + 3-node etcd cluster + APISIX Dashboard
# mTLS, rate limiting, JWT auth, OpenAppSec WAF integration, Prometheus metrics
apiVersion: v1
kind: Namespace
metadata:
  name: apisix
---
# etcd cluster for APISIX configuration storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: apisix
  labels:
    app: etcd
spec:
  serviceName: etcd-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: etcd
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: etcd
      containers:
        - name: etcd
          image: bitnami/etcd:3.5
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_DATA_DIR
              value: /var/etcd/data
            - name: ETCD_INITIAL_CLUSTER
              value: "etcd-0=http://etcd-0.etcd-headless.apisix.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd-headless.apisix.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd-headless.apisix.svc.cluster.local:2380"
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: apisix-etcd-cluster
            - name: ETCD_LISTEN_PEER_URLS
              value: http://0.0.0.0:2380
            - name: ETCD_LISTEN_CLIENT_URLS
              value: http://0.0.0.0:2379
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://$(ETCD_NAME).etcd-headless.apisix.svc.cluster.local:2379"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: "http://$(ETCD_NAME).etcd-headless.apisix.svc.cluster.local:2380"
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "8589934592"
            - name: ETCD_SNAPSHOT_COUNT
              value: "10000"
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: etcd-data
              mountPath: /var/etcd/data
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  namespace: apisix
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - port: 2379
      name: client
    - port: 2380
      name: peer
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: apisix
spec:
  selector:
    app: etcd
  ports:
    - port: 2379
      name: client
---
# APISIX ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: apisix
data:
  config.yaml: |
    apisix:
      node_listen:
        - port: 9080
          enable_http2: true
        - port: 9443
          enable_http2: true
          tls: true
      enable_ipv6: false
      enable_admin: true
      admin_listen:
        ip: 0.0.0.0
        port: 9180
      admin_key:
        - name: admin
          key: ${APISIX_ADMIN_KEY}
          role: admin
      ssl:
        enable: true
        listen_port: 9443
        ssl_protocols: TLSv1.2 TLSv1.3
        ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
      proxy_cache:
        cache_ttl: 10s
        zones:
          - name: disk_cache_one
            memory_size: 50m
            disk_size: 1G
            disk_path: /tmp/apisix_cache
            cache_levels: 1:2
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      etcd:
        host:
          - http://etcd-0.etcd-headless.apisix.svc.cluster.local:2379
          - http://etcd-1.etcd-headless.apisix.svc.cluster.local:2379
          - http://etcd-2.etcd-headless.apisix.svc.cluster.local:2379
        prefix: /apisix
        timeout: 30
        health_check_timeout: 10
        startup_retry_times: 12
        retry_delay: 5
        tls:
          verify: false
    plugin_attr:
      prometheus:
        export_uri: /apisix/prometheus/metrics
        metric_prefix: apisix_
        enable_export_server: true
        export_addr:
          ip: 0.0.0.0
          port: 9091
      opentelemetry:
        trace_id_source: x-request-id
        resource:
          service.name: apisix
        collector:
          address: otel-collector.observability.svc.cluster.local:4318
          request_timeout: 3
      jwt-auth:
        exp: 86400
      limit-req:
        rate: 100
        burst: 50
      limit-conn:
        conn: 1000
        burst: 200
      limit-count:
        count: 1000
        time_window: 60
    nginx_config:
      worker_processes: auto
      worker_rlimit_nofile: 65536
      events:
        worker_connections: 10240
      http:
        access_log: /dev/stdout
        keepalive_timeout: 60s
        client_header_timeout: 60s
        client_body_timeout: 60s
        send_timeout: 10s
        upstream:
          keepalive: 320
          keepalive_requests: 1000
          keepalive_timeout: 60s
---
# APISIX Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: apisix
  labels:
    app: apisix
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/apisix/prometheus/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: apisix
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: apisix
      initContainers:
        - name: wait-for-etcd
          image: bitnami/etcd:3.5
          command:
            - /bin/sh
            - -c
            - |
              until etcdctl --endpoints=http://etcd.apisix.svc.cluster.local:2379 endpoint health; do
                echo "Waiting for etcd..."
                sleep 2
              done
      containers:
        - name: apisix
          image: apache/apisix:3.9.0-debian
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9443
              name: https
            - containerPort: 9180
              name: admin
            - containerPort: 9091
              name: metrics
          env:
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: apisix-secret
                  key: APISIX_ADMIN_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: apisix-tls
              mountPath: /etc/apisix/tls
              readOnly: true
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
        - name: apisix-tls
          secret:
            secretName: apisix-tls-secret
            optional: true
---
# Services
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: apisix
  labels:
    app: apisix
spec:
  selector:
    app: apisix
  ports:
    - name: http
      port: 80
      targetPort: 9080
    - name: https
      port: 443
      targetPort: 9443
    - name: admin
      port: 9180
      targetPort: 9180
    - name: metrics
      port: 9091
      targetPort: 9091
---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-pdb
  namespace: apisix
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: apisix
---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apisix-hpa
  namespace: apisix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apisix
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
# PodDisruptionBudget for etcd
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-pdb
  namespace: apisix
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: etcd
