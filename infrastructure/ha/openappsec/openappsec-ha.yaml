---
# OpenAppSec HA — AI-powered WAF with 3 replicas
# Integrated with APISIX gateway, Prometheus metrics, PodDisruptionBudget
apiVersion: v1
kind: Namespace
metadata:
  name: openappsec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openappsec-config
  namespace: openappsec
data:
  policy.json: |
    {
      "policies": {
        "default": {
          "mode": "prevent-learn",
          "web-attacks": {
            "minimum-confidence": "high",
            "max-body-size-kb": 1024,
            "max-header-size-bytes": 8192,
            "max-url-size-bytes": 32768,
            "max-object-depth": 40,
            "illegal-http-methods": true
          },
          "anti-bot": {
            "injected-urls": [
              "/api/v1/login",
              "/api/v1/register",
              "/api/v1/claims/submit"
            ],
            "validated-urls": [
              "/api/v1/login",
              "/api/v1/register"
            ]
          },
          "snort-signatures": {
            "configmap-name": "snort-signatures",
            "configmap-namespace": "openappsec"
          }
        },
        "insurance-api": {
          "mode": "prevent-learn",
          "web-attacks": {
            "minimum-confidence": "medium",
            "max-body-size-kb": 10240,
            "max-header-size-bytes": 16384,
            "max-url-size-bytes": 65536,
            "illegal-http-methods": true
          },
          "rate-limit": {
            "default-limit": 1000,
            "burst": 200,
            "window-seconds": 60
          }
        }
      },
      "triggers": {
        "log-trigger": {
          "access-control-logging": true,
          "detect-events-logging": true,
          "prevent-events-logging": true,
          "log-to-agent": true,
          "log-to-stdout": true,
          "response-body": false,
          "response-code": true
        }
      },
      "exceptions": {
        "health-check-exception": {
          "action": "skip",
          "condition": {
            "url": ["/health", "/ready", "/metrics", "/apisix/status"]
          }
        }
      }
    }
  agent.conf: |
    {
      "agentToken": "${OPENAPPSEC_AGENT_TOKEN}",
      "centralizedLogging": {
        "enabled": true,
        "endpoint": "https://logs.openappsec.io"
      },
      "intelligence": {
        "enabled": true,
        "endpoint": "https://intelligence.openappsec.io"
      },
      "modelUpdateInterval": 3600,
      "debugLevel": "info"
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: openappsec-secret
  namespace: openappsec
type: Opaque
stringData:
  OPENAPPSEC_AGENT_TOKEN: "${OPENAPPSEC_AGENT_TOKEN}"
---
# OpenAppSec Agent DaemonSet — runs on every node for inline inspection
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openappsec-agent
  namespace: openappsec
  labels:
    app: openappsec-agent
spec:
  selector:
    matchLabels:
      app: openappsec-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: openappsec-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      hostNetwork: false
      tolerations:
        - operator: Exists
      containers:
        - name: openappsec-agent
          image: openappsec/agent:latest
          env:
            - name: OPENAPPSEC_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openappsec-secret
                  key: OPENAPPSEC_AGENT_TOKEN
            - name: OPENAPPSEC_POLICY_FILE
              value: /etc/openappsec/policy.json
            - name: OPENAPPSEC_AGENT_CONF
              value: /etc/openappsec/agent.conf
          ports:
            - containerPort: 7777
              name: attachment
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            privileged: false
            capabilities:
              add:
                - NET_ADMIN
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: openappsec-config
              mountPath: /etc/openappsec
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: openappsec-config
          configMap:
            name: openappsec-config
        - name: host-proc
          hostPath:
            path: /proc
---
# OpenAppSec Attachment Deployment — APISIX plugin integration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openappsec-attachment
  namespace: openappsec
  labels:
    app: openappsec-attachment
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: openappsec-attachment
  template:
    metadata:
      labels:
        app: openappsec-attachment
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: openappsec-attachment
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: openappsec-attachment
      containers:
        - name: openappsec-attachment
          image: openappsec/attachment:latest
          env:
            - name: ATTACHMENT_AGENT_ADDRESS
              value: "openappsec-agent.openappsec.svc.cluster.local:7777"
            - name: ATTACHMENT_LISTEN_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: openappsec-agent
  namespace: openappsec
spec:
  selector:
    app: openappsec-agent
  ports:
    - port: 7777
      name: attachment
---
apiVersion: v1
kind: Service
metadata:
  name: openappsec-attachment
  namespace: openappsec
spec:
  selector:
    app: openappsec-attachment
  ports:
    - port: 8080
      name: http
---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openappsec-attachment-pdb
  namespace: openappsec
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: openappsec-attachment
---
# APISIX Plugin Config for OpenAppSec integration
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-openappsec-plugin
  namespace: apisix
data:
  openappsec-plugin.lua: |
    -- OpenAppSec APISIX Plugin
    local http = require("resty.http")
    local core = require("apisix.core")

    local plugin_name = "openappsec"

    local schema = {
      type = "object",
      properties = {
        attachment_url = {
          type = "string",
          default = "http://openappsec-attachment.openappsec.svc.cluster.local:8080"
        },
        timeout_ms = {
          type = "integer",
          default = 100
        },
        fail_open = {
          type = "boolean",
          default = true
        }
      }
    }

    local _M = {
      version = 0.1,
      priority = 2900,
      name = plugin_name,
      schema = schema,
    }

    function _M.check_schema(conf)
      return core.schema.check(schema, conf)
    end

    function _M.access(conf, ctx)
      local httpc = http.new()
      httpc:set_timeout(conf.timeout_ms)

      local headers = ngx.req.get_headers()
      local method = ngx.req.get_method()
      local uri = ngx.var.request_uri

      local ok, err = httpc:connect(conf.attachment_url)
      if not ok then
        if conf.fail_open then
          core.log.warn("OpenAppSec attachment unreachable, failing open: ", err)
          return
        end
        return 503, { message = "WAF unavailable" }
      end

      local res, err = httpc:request({
        method = "POST",
        path = "/inspect",
        headers = {
          ["Content-Type"] = "application/json",
          ["X-Original-URI"] = uri,
          ["X-Original-Method"] = method,
          ["X-Client-IP"] = core.request.get_ip(ctx),
        },
        body = core.json.encode({
          uri = uri,
          method = method,
          headers = headers,
          source_ip = core.request.get_ip(ctx),
        })
      })

      if not res then
        if conf.fail_open then
          return
        end
        return 503, { message = "WAF inspection failed" }
      end

      if res.status == 403 then
        return 403, { message = "Request blocked by WAF" }
      end
    end

    return _M
