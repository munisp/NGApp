# External Secrets for Agent Banking Platform
# These ExternalSecret resources pull secrets from AWS Secrets Manager or HashiCorp Vault
# and create Kubernetes Secrets that can be referenced by deployments

---
# Kafka SSL Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-ssl-secrets
  namespace: kafka-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kafka-ssl-secrets
    creationPolicy: Owner
  data:
  - secretKey: ssl-keystore-password
    remoteRef:
      key: agent-banking/kafka/ssl
      property: keystore-password
  - secretKey: ssl-key-password
    remoteRef:
      key: agent-banking/kafka/ssl
      property: key-password
  - secretKey: ssl-truststore-password
    remoteRef:
      key: agent-banking/kafka/ssl
      property: truststore-password

