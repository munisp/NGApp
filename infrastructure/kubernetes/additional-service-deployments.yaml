# Additional Kubernetes Deployments for All Services
# Auto-generated to ensure all services with Dockerfiles have K8s deployments
# Total new deployments: 81

---
# account-services Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-services
  namespace: agent-banking
  labels:
    app: account-services
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-services
  template:
    metadata:
      labels:
        app: account-services
        tier: backend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "account-services"
        dapr.io/app-port: "8000"
    spec:
      containers:
      - name: account-services
        image: agent-banking/account-services:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: connection-string
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: account-services
  namespace: agent-banking
spec:
  selector:
    app: account-services
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

