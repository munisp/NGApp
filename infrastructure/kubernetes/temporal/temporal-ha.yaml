apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamic-config
  namespace: document-intelligence-infra
data:
  dynamic_config.yaml: |
    # Dynamic configuration for Temporal
    frontend.enableClientVersionCheck:
      - value: true
        constraints: {}
    history.defaultActivityRetryPolicy:
      - value:
          InitialIntervalInSeconds: 1
          MaximumIntervalCoefficient: 100.0
          BackoffCoefficient: 2.0
          MaximumAttempts: 0
        constraints: {}
    limit.maxIDLength:
      - value: 1000
        constraints: {}
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
        constraints: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: document-intelligence-infra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      containers:
      - name: temporal-ui
        image: temporalio/ui:2.26.2
        ports:
        - containerPort: 8080
        env:
        - name: TEMPORAL_ADDRESS
          value: temporal-frontend:7233
        - name: TEMPORAL_CORS_ORIGINS
          value: "*"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: document-intelligence-infra
spec:
  ports:
  - port: 8080
    name: http
  selector:
    app: temporal-ui
---
