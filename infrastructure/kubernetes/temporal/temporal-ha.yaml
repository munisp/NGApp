apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: document-intelligence-infra
data:
  config_template.yaml: |
    log:
      stdout: true
      level: info
    
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            pluginName: postgres
            databaseName: temporal
            connectAddr: "postgresql:5432"
            connectProtocol: tcp
            user: temporal
            password: temporal
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
        visibility:
          sql:
            pluginName: postgres
            databaseName: temporal_visibility
            connectAddr: "postgresql:5432"
            connectProtocol: tcp
            user: temporal
            password: temporal
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: 1h
    
    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: ""
      pprof:
        port: 7936
      metrics:
        prometheus:
          timerType: histogram
          listenAddress: "0.0.0.0:9090"
    
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
    
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: active
      currentClusterName: active
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: frontend
          rpcAddress: "temporal-frontend:7233"
    
    dcRedirectionPolicy:
      policy: noop
    
    archival:
      history:
        state: disabled
      visibility:
        state: disabled
    
    namespaceDefaults:
      archival:
        history:
          state: disabled
        visibility:
          state: disabled
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: document-intelligence-infra
  labels:
    app: temporal
    component: frontend
spec:
  ports:
  - port: 7233
    name: grpc
  - port: 9090
    name: metrics
  selector:
    app: temporal
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend-headless
  namespace: document-intelligence-infra
  labels:
    app: temporal
    component: frontend
spec:
  ports:
  - port: 7233
    name: grpc
  - port: 6933
    name: membership
  clusterIP: None
  selector:
    app: temporal
    component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: document-intelligence-infra
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal
      component: frontend
  template:
    metadata:
      labels:
        app: temporal
        component: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - temporal
              topologyKey: kubernetes.io/hostname
      containers:
      - name: temporal-frontend
        image: temporalio/server:1.24.2
        ports:
        - containerPort: 7233
          name: grpc
        - containerPort: 6933
          name: membership
        - containerPort: 9090
          name: metrics
        env:
        - name: SERVICES
          value: frontend
        - name: DB
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: temporal
        - name: POSTGRES_PWD
          value: temporal
        - name: POSTGRES_SEEDS
          value: postgresql
        - name: DYNAMIC_CONFIG_FILE_PATH
          value: /etc/temporal/config/dynamicconfig/dynamic_config.yaml
        - name: ENABLE_ES
          value: "false"
        volumeMounts:
        - name: config
          mountPath: /etc/temporal/config/dynamicconfig
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 7233
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: temporal-dynamic-config
---
