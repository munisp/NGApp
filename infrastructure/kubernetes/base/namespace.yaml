apiVersion: v1
kind: Namespace
metadata:
  name: document-intelligence
  labels:
    app.kubernetes.io/name: document-intelligence
    app.kubernetes.io/part-of: document-intelligence-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: document-intelligence-infra
  labels:
    app.kubernetes.io/name: document-intelligence-infra
    app.kubernetes.io/part-of: document-intelligence-platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: document-intelligence
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: document-intelligence
spec:
  limits:
  - default:
      cpu: "1"
      memory: 1Gi
    defaultRequest:
      cpu: "100m"
      memory: 256Mi
    type: Container
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: document-intelligence
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: document-intelligence
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/part-of: document-intelligence-platform
