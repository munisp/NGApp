  name: backend-api-secrets
  namespace: document-intelligence
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  DATABASE_PASSWORD: "change-me-in-production"
  S3_ACCESS_KEY: "minio"
  S3_SECRET_KEY: "minio123"
---
apiVersion: v1
kind: Secret
metadata:
  name: nimc-secrets
  namespace: document-intelligence
type: Opaque
stringData:
