apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-api-config
  namespace: document-intelligence
data:
  NODE_ENV: production
  PORT: "8001"
  DATABASE_URL: "mysql://user:password@mysql:3306/document_intelligence"
  REDIS_URL: "redis://redis.document-intelligence-infra:6379"
  KAFKA_BROKERS: "kafka-0.kafka-headless.document-intelligence-infra:9092,kafka-1.kafka-headless.document-intelligence-infra:9092,kafka-2.kafka-headless.document-intelligence-infra:9092"
  TEMPORAL_ADDRESS: "temporal-frontend.document-intelligence-infra:7233"
  KEYCLOAK_URL: "http://keycloak.document-intelligence-infra:8080"
  PERMIFY_URL: "http://permify.document-intelligence-infra:3476"
  OCR_SERVICE_URL: "http://ocr-service:9002"
  LAKEHOUSE_API_URL: "http://lakehouse-api.document-intelligence-infra:8002"
  NIMC_SERVICE_URL: "http://nimc-service:9005"
  CAC_SERVICE_URL: "http://cac-service:9006"
  BIOMETRIC_SERVICE_URL: "http://biometric-service:9004"
  S3_ENDPOINT: "http://minio.document-intelligence-infra:9000"
  S3_BUCKET: "documents"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: document-intelligence
  annotations:
    dapr.io/enabled: "true"
    dapr.io/app-id: "document-api"
    dapr.io/app-port: "8001"
    dapr.io/config: "document-intelligence-config"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend-api
        image: document-intelligence/backend-api:latest
        ports:
        - containerPort: 8001
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: backend-api-config
        - secretRef:
            name: backend-api-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: document-intelligence
spec:
  ports:
  - port: 8001
    name: http
  - port: 9090
    name: metrics
  selector:
    app: backend-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api-hpa
  namespace: document-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: document-intelligence
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend
        image: document-intelligence/frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_API_URL
          value: "http://backend-api:8001"
        - name: VITE_WS_URL
          value: "ws://backend-api:8001"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: document-intelligence
spec:
  ports:
  - port: 3000
    name: http
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-service
  namespace: document-intelligence
  annotations:
    dapr.io/enabled: "true"
    dapr.io/app-id: "ocr-service"
    dapr.io/app-port: "9002"
    dapr.io/config: "document-intelligence-config"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ocr-service
  template:
    metadata:
      labels:
        app: ocr-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ocr-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: ocr-service
        image: document-intelligence/ocr-service:latest
        ports:
        - containerPort: 9002
          name: http
        env:
        - name: DEEPSEEK_URL
          value: "http://deepseek-local:9002"
        - name: DOCLING_URL
          value: "http://docling:9001"
        - name: OCR_PRIORITY
          value: "deepseek_local,docling,tesseract,paddleocr"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 4Gi
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 9002
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 9002
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-service
  namespace: document-intelligence
spec:
  ports:
  - port: 9002
    name: http
  selector:
    app: ocr-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimc-service
  namespace: document-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nimc-service
  template:
    metadata:
      labels:
        app: nimc-service
    spec:
      containers:
      - name: nimc-service
        image: document-intelligence/nimc-service:latest
        ports:
        - containerPort: 9005
          name: http
        env:
        - name: NIMC_USE_MOCK
          value: "false"
        - name: NIMC_ENVIRONMENT
          value: "production"
        - name: NIMC_API_KEY
          valueFrom:
            secretKeyRef:
              name: nimc-secrets
              key: api-key
        - name: NIMC_API_SECRET
          valueFrom:
            secretKeyRef:
              name: nimc-secrets
              key: api-secret
        - name: NIMC_API_URL
          value: "https://api.nimc.gov.ng/v1"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 9005
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9005
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nimc-service
  namespace: document-intelligence
spec:
  ports:
  - port: 9005
    name: http
  selector:
    app: nimc-service
---
