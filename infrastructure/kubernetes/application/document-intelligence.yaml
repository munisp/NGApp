apiVersion: apps/v1
kind: Deployment
metadata:
  name: biometric-service
  namespace: document-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biometric-service
  template:
    metadata:
      labels:
        app: biometric-service
    spec:
      containers:
      - name: biometric-service
        image: document-intelligence/biometric-service:latest
        ports:
        - containerPort: 9004
          name: http
        env:
        - name: DEVICE
          value: "cuda"
        - name: FACE_DETECTION_MODEL
          value: "mtcnn"
        - name: FACE_RECOGNITION_MODEL
          value: "facenet"
        - name: LIVENESS_ENABLED
          value: "true"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 9004
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 9004
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: biometric-service
  namespace: document-intelligence
spec:
  ports:
  - port: 9004
    name: http
  selector:
    app: biometric-service
---
