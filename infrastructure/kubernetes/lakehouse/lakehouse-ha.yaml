apiVersion: v1
kind: ConfigMap
metadata:
  name: lakehouse-api-config
  namespace: document-intelligence-infra
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8002
      workers: 4
    
    spark:
      master: spark://spark-master:7077
      app_name: document-intelligence-lakehouse
      executor_memory: 4g
      executor_cores: 2
      executor_instances: 3
    
    delta:
      warehouse_path: s3a://lakehouse/warehouse
      bronze_path: s3a://lakehouse/bronze
      silver_path: s3a://lakehouse/silver
      gold_path: s3a://lakehouse/gold
    
    minio:
      endpoint: http://minio:9000
      access_key: minio
      secret_key: minio123
      bucket: lakehouse
    
    tables:
      documents:
        path: s3a://lakehouse/bronze/documents
        partition_by: [category, year, month]
      ocr_results:
        path: s3a://lakehouse/silver/ocr_results
        partition_by: [category, status]
      analytics:
        path: s3a://lakehouse/gold/analytics
        partition_by: [date]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-api
  namespace: document-intelligence-infra
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lakehouse-api
  template:
    metadata:
      labels:
        app: lakehouse-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - lakehouse-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: lakehouse-api
        image: document-intelligence/lakehouse-api:latest
        ports:
        - containerPort: 8002
          name: http
        volumeMounts:
        - name: config
          mountPath: /app/config
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: lakehouse-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: lakehouse-api
  namespace: document-intelligence-infra
spec:
  ports:
  - port: 8002
    name: http
  selector:
    app: lakehouse-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lakehouse-api-hpa
  namespace: document-intelligence-infra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lakehouse-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
