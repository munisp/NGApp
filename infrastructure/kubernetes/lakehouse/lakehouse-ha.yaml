apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: document-intelligence-infra
data:
  spark-defaults.conf: |
    # Spark Configuration for Delta Lake
    spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
    
    # Performance tuning
    spark.sql.shuffle.partitions=200
    spark.sql.adaptive.enabled=true
    spark.sql.adaptive.coalescePartitions.enabled=true
    spark.sql.adaptive.skewJoin.enabled=true
    
    # Memory configuration
    spark.driver.memory=4g
    spark.executor.memory=4g
    spark.executor.cores=2
    spark.executor.instances=3
    
    # Delta Lake optimizations
    spark.databricks.delta.retentionDurationCheck.enabled=false
    spark.databricks.delta.vacuum.parallelDelete.enabled=true
    spark.databricks.delta.optimize.maxFileSize=134217728
    spark.databricks.delta.autoCompact.enabled=true
    spark.databricks.delta.autoOptimize.optimizeWrite=true
    
    # S3/MinIO configuration
    spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.path.style.access=true
    spark.hadoop.fs.s3a.connection.ssl.enabled=false
    
    # History server
    spark.eventLog.enabled=true
    spark.eventLog.dir=s3a://spark-logs/
    spark.history.fs.logDirectory=s3a://spark-logs/
    
  log4j2.properties: |
    rootLogger.level=WARN
    rootLogger.appenderRef.stdout.ref=console
    appender.console.type=Console
    appender.console.name=console
    appender.console.target=SYSTEM_ERR
    appender.console.layout.type=PatternLayout
    appender.console.layout.pattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: document-intelligence-infra
  labels:
    app: spark-master
spec:
  ports:
  - port: 7077
    name: spark
  - port: 8080
    name: webui
  - port: 6066
    name: rest
  selector:
    app: spark-master
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-headless
  namespace: document-intelligence-infra
  labels:
    app: spark-master
spec:
  ports:
  - port: 7077
    name: spark
  clusterIP: None
  selector:
    app: spark-master
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-master
  namespace: document-intelligence-infra
spec:
  serviceName: spark-master-headless
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: bitnami/spark:3.5.1
        ports:
        - containerPort: 7077
          name: spark
        - containerPort: 8080
          name: webui
        - containerPort: 6066
          name: rest
        env:
        - name: SPARK_MODE
          value: master
        - name: SPARK_MASTER_HOST
          value: spark-master
        - name: SPARK_MASTER_PORT
          value: "7077"
        - name: SPARK_MASTER_WEBUI_PORT
          value: "8080"
        volumeMounts:
        - name: config
          mountPath: /opt/bitnami/spark/conf/spark-defaults.conf
          subPath: spark-defaults.conf
        - name: config
          mountPath: /opt/bitnami/spark/conf/log4j2.properties
          subPath: log4j2.properties
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: spark-config
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-worker
  namespace: document-intelligence-infra
spec:
  serviceName: spark-worker-headless
  replicas: 3
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - spark-worker
              topologyKey: kubernetes.io/hostname
      containers:
      - name: spark-worker
        image: bitnami/spark:3.5.1
        ports:
        - containerPort: 8081
          name: webui
        env:
        - name: SPARK_MODE
          value: worker
        - name: SPARK_MASTER_URL
          value: spark://spark-master:7077
        - name: SPARK_WORKER_MEMORY
          value: 4G
        - name: SPARK_WORKER_CORES
          value: "2"
        volumeMounts:
        - name: config
          mountPath: /opt/bitnami/spark/conf/spark-defaults.conf
          subPath: spark-defaults.conf
        - name: config
          mountPath: /opt/bitnami/spark/conf/log4j2.properties
          subPath: log4j2.properties
        - name: work
          mountPath: /opt/bitnami/spark/work
        resources:
          requests:
            cpu: 1000m
            memory: 4Gi
          limits:
            cpu: 2000m
            memory: 6Gi
        livenessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: spark-config
  volumeClaimTemplates:
  - metadata:
      name: work
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spark-worker-headless
  namespace: document-intelligence-infra
spec:
  ports:
  - port: 8081
    name: webui
  clusterIP: None
  selector:
    app: spark-worker
---
