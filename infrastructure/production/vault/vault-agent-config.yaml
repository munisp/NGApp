---
# Vault Agent Injector — Dapr Component for Vault Secret Store
# All microservices use this Dapr secret store component to retrieve secrets
# Vault Agent is injected as a sidecar via annotations on each pod
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: vault-secret-store
  namespace: insurance-platform
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - name: vaultAddr
      value: "https://vault.vault.svc.cluster.local:8200"
    - name: vaultTokenMountPath
      value: "/var/run/secrets/vault/token"
    - name: vaultKVPrefix
      value: "insurance/platform"
    - name: tlsCertPath
      value: "/etc/ssl/certs/vault-ca.crt"
    - name: enginePath
      value: "kv"
    - name: vaultValueType
      value: "map"
    - name: skipVerify
      value: "false"
---
# Vault Agent Injector Deployment — runs as a MutatingWebhook
# Automatically injects vault-agent sidecar into annotated pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent-injector
  namespace: vault
  labels:
    app: vault-agent-injector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vault-agent-injector
  template:
    metadata:
      labels:
        app: vault-agent-injector
    spec:
      serviceAccountName: vault-agent-injector
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vault-agent-injector
                topologyKey: kubernetes.io/hostname
      containers:
        - name: sidecar-injector
          image: hashicorp/vault-k8s:1.4
          args:
            - agent-inject
            - 2>&1
          env:
            - name: AGENT_INJECT_LISTEN
              value: ":8080"
            - name: AGENT_INJECT_LOG_LEVEL
              value: "info"
            - name: AGENT_INJECT_VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: AGENT_INJECT_VAULT_AUTH_PATH
              value: "auth/kubernetes"
            - name: AGENT_INJECT_TLS_AUTO
              value: "vault-agent-injector-cfg"
            - name: AGENT_INJECT_TLS_AUTO_HOSTS
              value: "vault-agent-injector-svc,vault-agent-injector-svc.vault,vault-agent-injector-svc.vault.svc"
            - name: AGENT_INJECT_LOG_FORMAT
              value: "json"
            - name: AGENT_INJECT_REVOKE_ON_SHUTDOWN
              value: "false"
            - name: AGENT_INJECT_CPU_REQUEST
              value: "250m"
            - name: AGENT_INJECT_CPU_LIMIT
              value: "500m"
            - name: AGENT_INJECT_MEM_REQUEST
              value: "64Mi"
            - name: AGENT_INJECT_MEM_LIMIT
              value: "128Mi"
          ports:
            - containerPort: 8080
              name: https
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
# Example pod annotation template for all microservices
# Add these annotations to every Deployment in insurance-platform namespace:
#
# vault.hashicorp.com/agent-inject: "true"
# vault.hashicorp.com/role: "<service-name>"
# vault.hashicorp.com/agent-inject-secret-config: "insurance/platform/<service-name>/config"
# vault.hashicorp.com/agent-inject-template-config: |
#   {{- with secret "insurance/platform/<service-name>/config" -}}
#   export DB_PASSWORD="{{ .Data.data.db_password }}"
#   export API_KEY="{{ .Data.data.api_key }}"
#   {{- end }}
# vault.hashicorp.com/agent-pre-populate-only: "true"
# vault.hashicorp.com/tls-secret: "vault-tls"
