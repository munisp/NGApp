---
# HashiCorp Vault — HA Production Deployment
# 3-node Raft cluster with auto-unseal via AWS KMS (or GCP/Azure equivalent)
# Integrated with Kubernetes auth for all 54 microservices
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  annotations:
    iam.amazonaws.com/role: arn:aws:iam::ACCOUNT_ID:role/vault-unseal-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-server-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    ui = true
    log_level = "info"

    storage "raft" {
      path    = "/vault/data"
      node_id = "VAULT_NODE_ID"

      retry_join {
        leader_api_addr = "https://vault-0.vault-internal:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
        leader_client_cert_file = "/vault/tls/tls.crt"
        leader_client_key_file  = "/vault/tls/tls.key"
      }
      retry_join {
        leader_api_addr = "https://vault-1.vault-internal:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
        leader_client_cert_file = "/vault/tls/tls.crt"
        leader_client_key_file  = "/vault/tls/tls.key"
      }
      retry_join {
        leader_api_addr = "https://vault-2.vault-internal:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
        leader_client_cert_file = "/vault/tls/tls.crt"
        leader_client_key_file  = "/vault/tls/tls.key"
      }
    }

    listener "tcp" {
      address            = "[::]:8200"
      cluster_address    = "[::]:8201"
      tls_cert_file      = "/vault/tls/tls.crt"
      tls_key_file       = "/vault/tls/tls.key"
      tls_client_ca_file = "/vault/tls/ca.crt"
      tls_min_version    = "tls13"
    }

    seal "awskms" {
      region     = "eu-west-1"
      kms_key_id = "alias/vault-unseal-key"
    }

    api_addr     = "https://VAULT_POD_IP:8200"
    cluster_addr = "https://VAULT_POD_IP:8201"

    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname          = true
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  serviceName: vault-internal
  replicas: 3
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics"
    spec:
      serviceAccountName: vault
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vault
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: vault-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              POD_NAME=$(hostname)
              NODE_ID=${POD_NAME##*-}
              sed "s/VAULT_NODE_ID/vault-${NODE_ID}/" /vault/config/vault.hcl > /vault/config-rendered/vault.hcl
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: config-rendered
              mountPath: /vault/config-rendered
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          args:
            - server
            - -config=/vault/config-rendered/vault.hcl
          env:
            - name: VAULT_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VAULT_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VAULT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAULT_ADDR
              value: "https://127.0.0.1:8200"
            - name: VAULT_API_ADDR
              value: "https://$(VAULT_POD_IP):8200"
            - name: VAULT_CLUSTER_ADDR
              value: "https://$(VAULT_POD_IP):8201"
            - name: VAULT_RAFT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
          ports:
            - containerPort: 8200
              name: https
            - containerPort: 8201
              name: https-internal
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - vault status -tls-skip-verify
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - IPC_LOCK
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
            - name: config
              mountPath: /vault/config
            - name: config-rendered
              mountPath: /vault/config-rendered
            - name: tls
              mountPath: /vault/tls
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: config-rendered
          emptyDir: {}
        - name: tls
          secret:
            secretName: vault-tls
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  selector:
    app: vault
  ports:
    - name: https
      port: 8200
      targetPort: 8200
    - name: https-internal
      port: 8201
      targetPort: 8201
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: vault
  labels:
    app: vault
spec:
  clusterIP: None
  selector:
    app: vault
  ports:
    - name: https
      port: 8200
      targetPort: 8200
    - name: https-internal
      port: 8201
      targetPort: 8201
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vault-pdb
  namespace: vault
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vault
