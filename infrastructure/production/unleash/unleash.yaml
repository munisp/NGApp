---
# =============================================================================
# Unleash Feature Flag Platform — Unified Insurance Platform
# Self-hosted Unleash with PostgreSQL backend
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
  namespace: unleash
  labels:
    app: unleash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unleash
  template:
    metadata:
      labels:
        app: unleash
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4242"
        prometheus.io/path: "/internal-backstage/prometheus"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: unleash
              topologyKey: kubernetes.io/hostname
      containers:
        - name: unleash
          image: unleashorg/unleash-server:6.1.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: unleash-secrets
                  key: database-url
            - name: DATABASE_SSL
              value: "true"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: unleash-secrets
                  key: secret-key
            - name: INIT_ADMIN_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: unleash-secrets
                  key: admin-api-token
            - name: AUTH_TYPE
              value: "open-source"
            - name: UNLEASH_URL
              value: "https://flags.insurance-platform.com"
            - name: LOG_LEVEL
              value: "info"
            - name: ENABLE_OAS
              value: "true"
            - name: IMPORT_DROP_BEFORE_IMPORT
              value: "false"
          ports:
            - containerPort: 4242
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
  namespace: unleash
spec:
  selector:
    app: unleash
  ports:
    - name: http
      port: 4242
      targetPort: 4242
---
# --- Unleash Edge (SDK proxy for high-throughput) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash-edge
  namespace: unleash
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unleash-edge
  template:
    metadata:
      labels:
        app: unleash-edge
    spec:
      containers:
        - name: unleash-edge
          image: unleashorg/unleash-edge:19.3.0
          args:
            - edge
            - --upstream-url=http://unleash.unleash.svc.cluster.local:4242
            - --port=3063
            - --metrics-interval-seconds=15
          env:
            - name: UPSTREAM_URL
              value: "http://unleash.unleash.svc.cluster.local:4242"
            - name: TOKENS
              valueFrom:
                secretKeyRef:
                  name: unleash-secrets
                  key: edge-tokens
          ports:
            - containerPort: 3063
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /internal-backstage/health
              port: 3063
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unleash-edge
  namespace: unleash
spec:
  selector:
    app: unleash-edge
  ports:
    - name: http
      port: 3063
      targetPort: 3063
