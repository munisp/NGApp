---
# =============================================================================
# GitHub Actions CI/CD — Unified Insurance Platform
# Alternative to GitLab CI — identical stages and quality gates
# =============================================================================
name: Insurance Platform CI/CD

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  HELM_VERSION: "3.15.0"
  KUBECTL_VERSION: "1.30.0"

jobs:
  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - openimis-consumer
          - claims-producer
          - underwriting-risk-integrator
          - unified-analytics
          - etherisc-gif
          - cession-management
          - reinsurance-accounting
          - payment-service
          - insurance-radar
          - customer-portal
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/insurance/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/insurance/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}

  # ============================================================
  # UNIT TESTS
  # ============================================================
  unit-tests:
    name: Unit Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - openimis-consumer
          - claims-producer
          - underwriting-risk-integrator
          - unified-analytics
          - etherisc-gif
          - cession-management
          - reinsurance-accounting
          - payment-service
          - insurance-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          pytest tests/unit/ \
            --cov=. \
            --cov-report=xml \
            --junitxml=junit.xml \
            --cov-fail-under=80 \
            -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/junit.xml
            services/${{ matrix.service }}/coverage.xml

  # ============================================================
  # SECURITY SCANS
  # ============================================================
  sast:
    name: SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/typescript
            p/docker
            p/kubernetes
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  container-scan:
    name: Container Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service:
          - openimis-consumer
          - claims-producer
          - underwriting-risk-integrator
          - unified-analytics
          - payment-service
          - customer-portal
    permissions:
      security-events: write
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/insurance/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "1"
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ============================================================
  # INTEGRATION TESTS
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insurance_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/insurance_test
          REDIS_URL: redis://localhost:6379
          TEST_ENV: ci
        run: |
          pip install -r requirements-test.txt
          pytest tests/integration/ \
            --junitxml=integration-junit.xml \
            -v \
            --timeout=120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-junit.xml

  # ============================================================
  # PERFORMANCE TESTS
  # ============================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 load test
        run: |
          k6 run \
            --vus 50 \
            --duration 5m \
            --threshold "http_req_duration{p(95)<500}" \
            --threshold "http_req_failed<0.01" \
            --out json=k6-results.json \
            tests/performance/load-test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: k6-results.json

  # ============================================================
  # DEPLOY STAGING
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, sast, container-scan, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.insurance-platform.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
      - name: Deploy to staging
        run: |
          helm upgrade --install insurance-platform ./helm/insurance-platform \
            --namespace insurance-platform \
            --create-namespace \
            --set global.image.tag="${{ github.sha }}" \
            --set global.environment=staging \
            --values helm/values-staging.yaml \
            --wait \
            --timeout 10m \
            --atomic

  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.insurance-platform.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
      - name: Deploy canary (20% traffic)
        run: |
          helm upgrade --install insurance-platform-canary ./helm/insurance-platform \
            --namespace insurance-platform \
            --set global.image.tag="${{ github.sha }}" \
            --set global.environment=production \
            --set global.canary.enabled=true \
            --set global.canary.weight=20 \
            --values helm/values-production.yaml \
            --wait --timeout 10m --atomic
          echo "Canary deployed. Monitoring for 5 minutes..."
          sleep 300
      - name: Promote to full production
        run: |
          helm upgrade --install insurance-platform ./helm/insurance-platform \
            --namespace insurance-platform \
            --set global.image.tag="${{ github.sha }}" \
            --set global.environment=production \
            --set global.replicaCount=3 \
            --values helm/values-production.yaml \
            --wait --timeout 15m --atomic
          helm uninstall insurance-platform-canary --namespace insurance-platform || true
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} Insurance Platform Production Deploy: ${{ job.status }}",
              "attachments": [{
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {"title": "Version", "value": "${{ github.sha }}", "short": true},
                  {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
