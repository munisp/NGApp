---
# --- Certificate: Observability stack TLS ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: observability-tls
  namespace: observability
spec:
  secretName: observability-tls
  issuerRef:
    name: vault-internal-ca
    kind: ClusterIssuer
  commonName: grafana.observability.svc.cluster.local
  dnsNames:
    - grafana.observability.svc.cluster.local
    - prometheus.observability.svc.cluster.local
    - jaeger.observability.svc.cluster.local
    - loki.observability.svc.cluster.local
    - monitoring.insurance-platform.com
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# --- CertificateRequest approver RBAC ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-approver
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status"]
    verbs: ["update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    resourceNames:
      - "issuers.cert-manager.io/*"
      - "clusterissuers.cert-manager.io/*"
    verbs: ["approve"]
---
# --- External Secrets Operator: sync Vault secrets to K8s Secrets ---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: insurance-platform
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "insurance"
      version: "v2"
      caBundle: ""  # Populated from vault-tls secret
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
---
# --- ExternalSecret: sync all platform secrets ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-secrets
  namespace: insurance-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: platform-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
  data:
    - secretKey: kafka-sasl-password
      remoteRef:
        key: infra/kafka
        property: sasl_password
    - secretKey: redis-password
      remoteRef:
        key: infra/redis
        property: password
    - secretKey: keycloak-client-secret
      remoteRef:
        key: infra/keycloak
        property: client_secret
    - secretKey: openimis-api-key
      remoteRef:
        key: platform/openimis
        property: api_key
    - secretKey: stripe-api-key
      remoteRef:
        key: platform/payment
        property: stripe_api_key
    - secretKey: unleash-api-token
      remoteRef:
        key: infra/unleash
        property: api_token
