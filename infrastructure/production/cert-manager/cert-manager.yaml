---
# =============================================================================
# cert-manager — Unified Insurance Platform
# Automated TLS certificate lifecycle management
# Issuers: Let's Encrypt (production + staging) + Vault PKI (internal)
# =============================================================================

# --- ClusterIssuer: Let's Encrypt Production ---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-ops@insurance-platform.com
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
      - http01:
          ingress:
            class: istio
      - dns01:
          route53:
            region: eu-west-1
            hostedZoneID: HOSTED_ZONE_ID
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
---
# --- ClusterIssuer: Let's Encrypt Staging (for testing) ---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform-ops@insurance-platform.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: istio
---
# --- ClusterIssuer: Vault PKI (internal services) ---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-internal-ca
spec:
  vault:
    path: insurance/pki/sign/internal-services
    server: https://vault.vault.svc.cluster.local:8200
    caBundle: |-
      # Base64-encoded Vault CA certificate — populated during bootstrap
      VAULT_CA_BUNDLE_PLACEHOLDER
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        secretRef:
          name: cert-manager-vault-token
          key: token
---
# --- Certificate: External API gateway (Let's Encrypt) ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: insurance-platform-tls
  namespace: istio-system
spec:
  secretName: insurance-platform-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - api.insurance-platform.com
    - portal.insurance-platform.com
    - admin.insurance-platform.com
    - "*.insurance-platform.com"
  duration: 2160h   # 90 days
  renewBefore: 360h # Renew 15 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# --- Certificate: Vault TLS (internal CA) ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  issuerRef:
    name: vault-internal-ca
    kind: ClusterIssuer
  commonName: vault.vault.svc.cluster.local
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-0.vault-internal
    - vault-1.vault-internal
    - vault-2.vault-internal
  duration: 8760h   # 1 year
  renewBefore: 720h # Renew 30 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# --- Certificate: Keycloak TLS ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    name: vault-internal-ca
    kind: ClusterIssuer
  commonName: keycloak.keycloak.svc.cluster.local
  dnsNames:
    - keycloak
    - keycloak.keycloak
    - keycloak.keycloak.svc.cluster.local
    - auth.insurance-platform.com
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
