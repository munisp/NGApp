  commonName: tigerbeetle.tigerbeetle.svc.cluster.local
  dnsNames:
    - tigerbeetle-0.tigerbeetle.tigerbeetle.svc.cluster.local
    - tigerbeetle-1.tigerbeetle.tigerbeetle.svc.cluster.local
    - tigerbeetle-2.tigerbeetle.tigerbeetle.svc.cluster.local
