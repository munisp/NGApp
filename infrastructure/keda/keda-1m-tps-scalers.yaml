# Kafka Authentication for 1M TPS cluster
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-mega-auth
  namespace: core-services
spec:
  secretTargetRef:
    - parameter: sasl
      name: kafka-mega-credentials
      key: sasl
    - parameter: username
      name: kafka-mega-credentials
      key: username
    - parameter: password
      name: kafka-mega-credentials
      key: password
    - parameter: tls
      name: kafka-mega-credentials
      key: tls
    - parameter: ca
      name: kafka-mega-tls
      key: ca.crt
---
# Prometheus Alerts for 1M TPS Scaling
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: keda-1m-tps-alerts
  namespace: core-services
spec:
  groups:
    - name: keda-1m-tps
      rules:
        - alert: ServiceScalingAtMax
          expr: keda_scaler_active == 1 and keda_scaled_object_replicas == keda_scaled_object_max_replicas
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Service {{ $labels.scaledObject }} is at max replicas"
            description: "Service is at maximum capacity. Consider increasing maxReplicaCount."
        - alert: KafkaLagCritical
          expr: kafka_consumergroup_lag > 100000
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Kafka consumer lag is critical"
            description: "Consumer group {{ $labels.consumergroup }} has lag of {{ $value }}"
        - alert: ThroughputBelowTarget
          expr: sum(rate(http_requests_total{service=~"transaction-service|payment-service"}[1m])) < 900000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Platform throughput below 900K TPS target"
            description: "Current throughput: {{ $value }} req/sec"
        - alert: HighLatencyP99
          expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P99 latency above 10ms target"
            description: "P99 latency: {{ $value }}s"
---
# Resource Quotas for 1M TPS namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: core-services-1m-quota
  namespace: core-services
spec:
  hard:
    requests.cpu: "10000"
    requests.memory: "20Ti"
    limits.cpu: "20000"
    limits.memory: "40Ti"
    pods: "5000"
---
# Limit Range for pods
apiVersion: v1
kind: LimitRange
metadata:
  name: core-services-1m-limits
  namespace: core-services
spec:
  limits:
    - default:
        cpu: "2"
        memory: "4Gi"
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
      type: Container
