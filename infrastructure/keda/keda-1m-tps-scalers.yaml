# KEDA Autoscaling Configuration for 1M TPS
# Scales services to 500+ replicas based on Kafka lag and CPU
apiVersion: v1
kind: Namespace
metadata:
  name: keda-1m
  labels:
    app.kubernetes.io/name: keda-1m
    throughput-tier: "1m-tps"
---
# ScaledObject for Transaction Service - 500 replicas max
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transaction-service-1m-scaler
  namespace: core-services
  labels:
    app: transaction-service
    throughput-tier: "1m-tps"
spec:
  scaleTargetRef:
    name: transaction-service
  pollingInterval: 5
  cooldownPeriod: 60
  minReplicaCount: 50
  maxReplicaCount: 500
  fallback:
    failureThreshold: 3
    replicas: 100
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 5
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 200
              periodSeconds: 15
            - type: Pods
              value: 50
              periodSeconds: 15
          selectPolicy: Max
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-mega.kafka-mega.svc.cluster.local:9092
        consumerGroup: transaction-service
        topic: transactions.created
        lagThreshold: "1000"
        activationLagThreshold: "100"
        offsetResetPolicy: earliest
      authenticationRef:
        name: kafka-mega-auth
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"
---
