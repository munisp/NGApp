routes:
  # ── Financial Services ──
  - uri: /api/v1/payouts/*
    name: instant-payout
    upstream:
      type: roundrobin
      nodes:
        "instant-payout-service:8101": 1
    plugins:
      jwt-auth: {}
      limit-req:
        rate: 100
        burst: 50
        key_type: "var"
        key: "remote_addr"
      cors:
        allow_origins: "*"
        allow_methods: "GET, POST, PUT, DELETE, OPTIONS"

  - uri: /api/v1/mobile-money/*
    name: mobile-money
    upstream:
      type: roundrobin
      nodes:
        "mobile-money-service:8092": 1
    plugins:
      jwt-auth: {}
      limit-req:
        rate: 200
        burst: 100
        key_type: "var"
        key: "remote_addr"

  - uri: /api/v1/currency/*
    name: multi-currency
    upstream:
      type: roundrobin
      nodes:
        "multi-currency-service:8102": 1
    plugins:
      jwt-auth: {}
      limit-count:
        count: 1000
        time_window: 60
        key_type: "var"
        key: "remote_addr"

  - uri: /api/v1/premium-finance/*
    name: premium-finance
    upstream:
      type: roundrobin
      nodes:
        "premium-finance-service:8099": 1
    plugins:
      jwt-auth: {}

  - uri: /api/v1/blockchain/*
