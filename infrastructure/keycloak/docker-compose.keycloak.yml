version: "3.9"

# ── OG-RMM Keycloak + Permify Identity & Authorization Stack ──────────────────
#
# Usage:
#   docker compose -f docker-compose.keycloak.yml up -d
#
# After startup:
#   Keycloak Admin UI: http://localhost:8080/admin  (admin / ${KEYCLOAK_ADMIN_PASSWORD})
#   Permify gRPC:      localhost:3478
#   Permify HTTP:      http://localhost:3476
#
# Import realm:
#   docker exec -it og-rmm-keycloak /opt/keycloak/bin/kc.sh import \
#     --file /opt/keycloak/data/import/og-rmm-realm.json
#
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Keycloak Identity Provider ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: og-rmm-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    volumes:
      - ./og-rmm-realm.json:/opt/keycloak/data/import/og-rmm-realm.json:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - og-rmm-auth

  # ── Keycloak PostgreSQL Database ────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: og-rmm-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - og-rmm-auth

  # ── Permify Fine-Grained Authorization ─────────────────────────────────────
  permify:
    image: ghcr.io/permify/permify:v0.9.6
    container_name: og-rmm-permify
    restart: unless-stopped
    command:
      - serve
      - --database-engine=postgres
      - --database-uri=postgres://permify:${PERMIFY_DB_PASSWORD:-permify}@permify-db:5432/permify?sslmode=disable
      - --database-max-open-connections=20
      - --database-max-idle-connections=5
      - --grpc-port=3478
      - --http-port=3476
      - --log-level=info
    ports:
      - "3476:3476"   # HTTP/REST API
      - "3478:3478"   # gRPC API
    depends_on:
      permify-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3476/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - og-rmm-auth

  # ── Permify PostgreSQL Database ─────────────────────────────────────────────
  permify-db:
    image: postgres:16-alpine
    container_name: og-rmm-permify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: permify
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: ${PERMIFY_DB_PASSWORD:-permify}
    volumes:
      - permify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permify -d permify"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - og-rmm-auth

volumes:
  keycloak_db_data:
    name: og-rmm-keycloak-db-data
  permify_db_data:
    name: og-rmm-permify-db-data

networks:
  og-rmm-auth:
    name: og-rmm-auth
    driver: bridge
