---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
spec:
  type: ClusterIP
  ports:
    - port: 7233
      targetPort: 7233
      name: grpc
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: temporal
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-history
  namespace: temporal
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 7234
      targetPort: 7234
      name: grpc
    - port: 6934
      targetPort: 6934
      name: membership
  selector:
    app: temporal
    component: history
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-matching
  namespace: temporal
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 7235
      targetPort: 7235
      name: grpc
    - port: 6935
      targetPort: 6935
      name: membership
  selector:
    app: temporal
    component: matching
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamic-config
  namespace: temporal
data:
  dynamic_config.yaml: |
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
    frontend.enableClientVersionCheck:
      - value: true
    history.defaultActivityRetryPolicy:
      - value:
          InitialIntervalInSeconds: 1
          MaximumIntervalCoefficient: 100.0
          BackoffCoefficient: 2.0
          MaximumAttempts: 0
    history.defaultWorkflowRetryPolicy:
      - value:
          InitialIntervalInSeconds: 1
          MaximumIntervalCoefficient: 100.0
          BackoffCoefficient: 2.0
          MaximumAttempts: 0
    limit.maxIDLength:
      - value: 1000
    limit.blobSize.error:
      - value: 2097152
    limit.blobSize.warn:
      - value: 262144
    limit.historySize.error:
      - value: 52428800
    limit.historySize.warn:
      - value: 10485760
    limit.historyCount.error:
      - value: 51200
    limit.historyCount.warn:
      - value: 10240
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-frontend-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-history-pdb
  namespace: temporal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: temporal
      component: history
---
apiVersion: policy/v1
