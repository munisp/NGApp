apiVersion: v1
kind: Namespace
metadata:
  name: temporal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-config
  namespace: temporal
data:
  config_template.yaml: |
    log:
      stdout: true
      level: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            pluginName: postgres
            databaseName: temporal
            connectAddr: "temporal-postgresql:5432"
            connectProtocol: tcp
            user: temporal
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
        visibility:
          sql:
            pluginName: postgres
            databaseName: temporal_visibility
            connectAddr: "temporal-postgresql:5432"
            connectProtocol: tcp
            user: temporal
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: 1h
    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: "{{ default .Env.POD_IP \"0.0.0.0\" }}"
      pprof:
        port: 7936
      metrics:
        prometheus:
          timerType: histogram
          listenAddress: "0.0.0.0:9090"
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: active
      currentClusterName: active
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: frontend
          rpcAddress: "temporal-frontend:7233"
    dcRedirectionPolicy:
      policy: noop
    archival:
      history:
        state: enabled
        enableRead: true
        provider:
          filestore:
            fileMode: "0666"
            dirMode: "0766"
      visibility:
        state: enabled
        enableRead: true
        provider:
          filestore:
            fileMode: "0666"
            dirMode: "0766"
    namespaceDefaults:
      archival:
        history:
          state: enabled
          URI: "file:///tmp/temporal_archival/development"
        visibility:
          state: enabled
          URI: "file:///tmp/temporal_vis_archival/development"
    publicClient:
      hostPort: "temporal-frontend:7233"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: temporal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal
      component: frontend
  template:
    metadata:
      labels:
        app: temporal
        component: frontend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: component
                    operator: In
                    values:
                      - frontend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: temporal-frontend
          image: temporalio/server:1.22.4
          ports:
            - containerPort: 7233
              name: grpc
            - containerPort: 6933
              name: membership
            - containerPort: 9090
              name: metrics
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICES
              value: frontend
            - name: DB
              value: postgresql
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-db-credentials
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-credentials
                  key: password
            - name: POSTGRES_SEEDS
              value: temporal-postgresql
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/config/dynamicconfig/dynamic_config.yaml
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config/config_template.yaml
              subPath: config_template.yaml
            - name: dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
          readinessProbe:
            grpc:
              port: 7233
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: temporal-config
        - name: dynamic-config
          configMap:
            name: temporal-dynamic-config
---
