## EMQX ACL Rules — Oil & Gas MQTT Topic Authorization
## Topic hierarchy: og/{well_id}/{data_type}/{sensor_id}

## Edge agents can publish telemetry and alarms for their well
{allow, {user, "edge-agent"}, publish, ["og/+/telemetry/#", "og/+/alarm/#"]}.

## SCADA systems can subscribe to all OG topics
{allow, {user, "scada"}, subscribe, ["og/#"]}.

## Platform backend can publish commands and subscribe to everything
{allow, {user, "og-platform"}, all, ["og/#", "$SYS/#"]}.

## Grafana/monitoring can subscribe to all telemetry
{allow, {user, "grafana"}, subscribe, ["og/+/telemetry/#"]}.

## Deny all other access by default
{deny, all, all, ["#"]}.
