## EMQX 5.x Configuration — Oil & Gas IoT MQTT Broker
## Spec: FRQ-002 — Edge device MQTT connectivity

node {
  name = "emqx@og-emqx"
  cookie = "og-rmm-emqx-secret"
  data_dir = "/var/lib/emqx"
}

cluster {
  name = og-rmm-emqx-cluster
  discovery_strategy = manual
}

log {
  file_handlers.default {
    level = info
    file = "/var/log/emqx/emqx.log"
    rotation_count = 10
    rotation_size = 50MB
  }
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 50000
  ## Enable for production TLS:
  # ssl_options.certfile = "/etc/emqx/certs/server.crt"
  # ssl_options.keyfile  = "/etc/emqx/certs/server.key"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 50000
  ssl_options {
    certfile = "/etc/emqx/certs/server.crt"
    keyfile  = "/etc/emqx/certs/server.key"
    cacertfile = "/etc/emqx/certs/ca.crt"
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

listeners.wss.default {
  bind = "0.0.0.0:8084"
  websocket.mqtt_path = "/mqtt"
}

## MQTT settings
mqtt {
  max_packet_size = 1MB
  max_qos_allowed = 2
  retain_available = true
  wildcard_subscription = true
  shared_subscription = true
  session_expiry_interval = 2h
}

## Authentication — username/password + client certificate
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    password_hash_algorithm {
      name = bcrypt
      salt_rounds = 10
    }
  }
]

## Authorization — ACL rules for OG topic hierarchy
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = built_in_database
      enable = true
    },
    {
      type = file
      enable = true
      path = "/etc/emqx/acl.conf"
    }
  ]
}

## Kafka bridge — forward og/# topics to Redpanda
bridges.kafka.og_telemetry_bridge {
  enable = true
  bootstrap_hosts = "redpanda:9092"
  connect_timeout = 5s
  min_metadata_refresh_interval = 3s
  metadata_request_timeout = 5s
  producer {
    topic_mapping = [
      {
        mqtt_topic = "og/+/telemetry/#"
        kafka_topic = "og-telemetry"
        qos = 1
        payload_template = "${payload}"
      },
      {
        mqtt_topic = "og/+/alarm/#"
        kafka_topic = "og-alarms"
        qos = 2
        payload_template = "${payload}"
      },
      {
        mqtt_topic = "og/+/command/response"
        kafka_topic = "og-commands-response"
        qos = 1
        payload_template = "${payload}"
      }
    ]
    partition_strategy = key_dispatch
    required_acks = all_isr
    compression = snappy
  }
}

## Rule engine — persist telemetry to PostgreSQL
rule_engine {
  rules {
    og_telemetry_persist {
      sql = "SELECT * FROM \"og/+/telemetry/#\""
      actions = [
        {
          function = "republish"
          args {
            topic = "og-internal/telemetry"
            qos = 1
          }
        }
      ]
    }
  }
}
