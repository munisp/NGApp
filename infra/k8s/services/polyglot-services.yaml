---
apiVersion: v1
kind: Service
metadata:
  name: protocol-adapter
  namespace: og-rmm
  labels:
    app: protocol-adapter
spec:
  selector:
    app: protocol-adapter
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: physics-engine
  namespace: og-rmm
  labels:
    app: physics-engine
spec:
  selector:
    app: physics-engine
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: og-rmm
  labels:
    app: ml-service
spec:
  selector:
    app: ml-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: og-rmm-app
  namespace: og-rmm
  labels:
    app: og-rmm-app
spec:
  selector:
    app: og-rmm-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
