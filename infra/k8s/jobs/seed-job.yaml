---
apiVersion: batch/v1
kind: Job
metadata:
  name: og-rmm-seed
  namespace: og-rmm
  labels:
    app: og-rmm-seed
    tier: ops
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: og-rmm/app:55.0.0
          command: ["node", "dist/seed.js"]
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: postgres_url
            - name: SEED_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
