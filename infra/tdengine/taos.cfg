# TDengine 3.x Configuration — Oil & Gas Secondary TSDB
# Spec: FRQ-009 — Time-series data storage for high-frequency sensor data

# Server settings
firstEp                 og-tdengine:6030
secondEp                og-tdengine-replica:6030
fqdn                    og-tdengine
serverPort              6030
logDir                  /var/log/taos
dataDir                 /var/lib/taos
tempDir                 /tmp

# Performance tuning for high-frequency telemetry
numOfThreadsPerCore     2.0
ratioOfQueryCores       0.5
numOfCommitThreads      4
numOfMnodeQueryThreads  8

# Write performance
walLevel                2
walFsyncPeriod          3000
minTablesPerVnode       1000
maxTablesPerVnode       1000000

# Retention policy — 90 days hot, 365 days warm, 5 years cold
# Configured via SQL: CREATE DATABASE og_telemetry KEEP 90,365,1825

# Compression — LZ4 for telemetry data
compress                1

# Replication factor for HA
replica                 1

# HTTP API (REST interface)
httpPort                6041
httpEnableCompress      1
httpMaxThreads          8

# Logging
debugFlag               131
mDebugFlag              135
sDebugFlag              135
rpcDebugFlag            131
tmrDebugFlag            131
cDebugFlag              131
jnidebugFlag            131
qdebugFlag              131
