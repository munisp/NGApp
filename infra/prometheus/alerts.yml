###############################################################################
# NDSEP Prometheus Alerting Rules
# Covers: API health, database, workers, compliance SLAs, security events
###############################################################################

groups:

  # ─── API / Application ─────────────────────────────────────────────────────
  - name: ndsep-api
    interval: 30s
    rules:

      - alert: APIDown
        expr: up{job="ndsep-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "NDSEP API is down"
          description: "The NDSEP API has been unreachable for more than 1 minute."

      - alert: HighAPIErrorRate
        expr: |
          rate(http_requests_total{job="ndsep-api",status=~"5.."}[5m])
          / rate(http_requests_total{job="ndsep-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High API error rate (>5%)"
          description: "API 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: SlowAPIResponses
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="ndsep-api"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow API responses (p95 > 2s)"
          description: "95th percentile API response time is {{ $value | humanizeDuration }}."

  # ─── Database ──────────────────────────────────────────────────────────────
  - name: ndsep-database
    interval: 30s
    rules:

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been unreachable for more than 1 minute."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 150
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection count high (>150)"
          description: "Current connections: {{ $value }}. Max is 200."

      - alert: PostgresSlowQueries
        expr: pg_stat_activity_max_tx_duration > 30
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Long-running PostgreSQL query detected"
          description: "A query has been running for {{ $value | humanizeDuration }}."

      - alert: PostgresDiskUsageHigh
        expr: |
          pg_database_size_bytes{datname="ndsep_db"}
          / (1024 * 1024 * 1024) > 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL database size > 10GB"
          description: "Database size is {{ $value | humanize }}GB."

  # ─── Workers ───────────────────────────────────────────────────────────────
  - name: ndsep-workers
    interval: 60s
    rules:

      - alert: WorkerDown
        expr: up{job=~"ndsep-worker-.*"} == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "NDSEP worker {{ $labels.job }} is down"
          description: "Worker {{ $labels.job }} has been unreachable for 5 minutes."

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} lag: {{ $value }} messages."

  # ─── Compliance SLA ────────────────────────────────────────────────────────
  - name: ndsep-compliance
    interval: 300s
    rules:

      - alert: CitizenRequestSLABreach
        expr: |
          (
            SELECT count(*) FROM citizen_requests
            WHERE status NOT IN ('completed', 'rejected', 'cancelled')
            AND submitted_at < NOW() - INTERVAL '30 days'
          ) > 0
        for: 0m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "Citizen data requests exceeding 30-day SLA"
          description: "{{ $value }} citizen requests have exceeded the statutory 30-day response window."

      - alert: HighCriticalComplianceAlerts
        expr: |
          increase(ndsep_compliance_alerts_total{severity="critical"}[1h]) > 5
        for: 0m
        labels:
          severity: critical
          team: compliance
        annotations:
          summary: "Spike in critical compliance alerts"
          description: "{{ $value }} critical compliance alerts in the last hour."

  # ─── Security ──────────────────────────────────────────────────────────────
  - name: ndsep-security
    interval: 60s
    rules:

      - alert: HighAuthFailureRate
        expr: |
          rate(ndsep_auth_failures_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High authentication failure rate"
          description: "Auth failures: {{ $value | humanize }}/s over the last 5 minutes."

      - alert: SuspiciousBGPRoute
        expr: ndsep_bgp_invalid_routes_total > 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Invalid BGP route detected"
          description: "{{ $value }} BGP routes with RPKI status INVALID detected."

      - alert: RateLimitThrottling
        expr: |
          rate(nginx_http_requests_total{status="429"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate of 429 responses from Nginx"
          description: "Rate limiting is triggering {{ $value | humanize }} times/s."

  # ─── Infrastructure ────────────────────────────────────────────────────────
  - name: ndsep-infra
    interval: 60s
    rules:

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% for 10 minutes."

      - alert: HighMemoryUsage
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}%."

      - alert: DiskSpaceLow
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | humanize }}% full."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for 2 minutes."
