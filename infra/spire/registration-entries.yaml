---
# SPIRE Registration Entries — OG-RMM Platform Services
# Spec: IEC 62443 SR 1.2 — Software process identification via SPIFFE IDs
#
# Each entry assigns a SPIFFE ID to a Kubernetes workload based on:
#   - Namespace
#   - Service account name
#   - Pod labels (optional, for fine-grained control)
#
# SPIFFE ID format: spiffe://og-rmm.internal/<namespace>/<service>
#
# Apply registration entries:
#   kubectl exec -n spire-system spire-server-0 -- \
#     spire-server entry create -f /entries/registration-entries.yaml
#
# Or use the SPIRE Controller Manager (recommended for production):
#   kubectl apply -f infra/spire/spire-controller-manager-entries.yaml

# ─── Platform Core Services ────────────────────────────────────────────────────

apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: og-rmm-platform-app
  labels:
    app.kubernetes.io/managed-by: spire-controller-manager
    og-rmm/compliance: iec-62443-sr-1.2
spec:
  spiffeIDTemplate: "spiffe://og-rmm.internal/platform-core/og-rmm-platform"
  podSelector:
    matchLabels:
      app.kubernetes.io/name: og-rmm-platform
  namespaceSelector:
    matchNames:
      - platform-core

