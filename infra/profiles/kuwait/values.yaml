# ─── Kuwait Sovereign Cloud Profile ──────────────────────────────────────────
# Compliant with:
#   - Kuwait NCSC Decision No. 1/2025 (Data Classification)
#   - Kuwait Oil Company (KOC) E-SCADA Standard KOC-E-027
#   - Kuwait Petroleum Corporation (KPC) IT Security Policy
#   - CITRA (Communications & Information Technology Regulatory Authority) Cloud Policy
#   - IEC 62443 SL-2 (OT Security)
#   - IEC 61511 SIL-2 (Functional Safety)
#
# Deployment target: Kuwait National Cloud (KNPC/CITRA-approved provider)
#   Approved providers: Zain Cloud, STC Cloud, KNPC Private Cloud
#
# Usage:
#   helm install og-rmm ./og-rmm-platform \
#     -f profiles/kuwait/values.yaml \
#     --namespace og-rmm-kw \
#     --create-namespace

global:
  region: "kuwait"
  # Kuwait-approved container registry (in-country mirror)
  imageRegistry: "registry.knpc-cloud.kw"
  imagePullPolicy: Always
  dataResidency:
    enabled: true
    country: "KW"
    # Encryption keys must be stored in Kuwait — use Kuwait-hosted HashiCorp Vault
    encryptionKeyRegion: "kw-central-1"
    # All data must remain within Kuwait borders per CITRA Cloud Policy
    dataEgressBlocked: true
  tls:
    enabled: true
    certManager: true
    # Use Kuwait-trusted CA (CITRA PKI)
    issuerName: "citra-pki-issuer"
    # Minimum TLS 1.3 per Kuwait NCSC
    minVersion: "TLSv1.3"
  networkPolicies:
    enabled: true
    # Block all egress to non-Kuwait IPs except approved external APIs
    egressWhitelist:
      - "10.0.0.0/8"       # Internal Kuwait cloud
      - "172.16.0.0/12"    # KOC field network
      - "192.168.0.0/16"   # Wellsite networks
  podSecurityStandards:
    level: "restricted"
  # NCSC data classification enforcement
  ncscClassification:
    enabled: true
    defaultLevel: "confidential"
    restrictedStorageClass: "encrypted-restricted-kw"

# ─── API Gateway — Kuwait-specific settings ───────────────────────────────────
apiGateway:
  replicaCount: 3  # HA for KPC critical infrastructure
  env:
    JWT_EXPIRY: "4h"  # Shorter session per KPC policy
    CORS_ORIGINS: "https://og-rmm.knpc-cloud.kw"
    # KPC IAMS federation endpoint
    KEYCLOAK_REALM: "kpc-realm"
    KEYCLOAK_URL: "https://iams.kpc.com.kw/auth"
    # Arabic locale default
    DEFAULT_LOCALE: "ar-KW"
    TIMEZONE: "Asia/Kuwait"
  ingress:
    hosts:
      - host: "og-rmm.knpc-cloud.kw"
        paths:
          - path: /
            pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # KPC WAF integration
      nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header X-KPC-Security-Zone "OT-DMZ";

# ─── Financial Ledger — Kuwait KD currency ────────────────────────────────────
financialLedger:
  env:
    DEFAULT_CURRENCY: "KWD"
    ROYALTY_RATE_PCT: "20"  # Kuwait standard royalty rate
    # KPC financial system integration
    KPC_ERP_ENDPOINT: "https://erp.kpc.com.kw/api/v1"

# ─── PostgreSQL — Kuwait data residency ───────────────────────────────────────
postgresql:
  primary:
    persistence:
      storageClass: "encrypted-ssd-kw"  # Kuwait-hosted encrypted storage
    # Enable WAL encryption for NCSC compliance
    extendedConfiguration: |
      ssl = on
      ssl_min_protocol_version = 'TLSv1.3'
      log_connections = on
      log_disconnections = on
      log_duration = on
      log_statement = 'ddl'
      # Row-level security for NCSC classification
      row_security = on
  # Backup to Kuwait-hosted S3 (KNPC MinIO)
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"  # 02:00 AST daily
      destination: "s3://og-rmm-backup-kw/postgresql"

# ─── MinIO — Kuwait in-country storage ────────────────────────────────────────
minio:
  # Force all data to Kuwait availability zones
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: minio
  # Server-side encryption with Kuwait KMS
  env:
    MINIO_KMS_KES_ENDPOINT: "https://kes.knpc-cloud.kw:7373"
    MINIO_KMS_KES_CERT_FILE: "/etc/kes/client.crt"
    MINIO_KMS_KES_KEY_FILE: "/etc/kes/client.key"

# ─── KOC E-SCADA Standard KOC-E-027 compliance ───────────────────────────────
kocEscada:
  enabled: true
  # KOC-E-027 Section 4.2: Modbus register map compliance
  modbusRegisterMap:
    enabled: true
    configMapName: "koc-modbus-register-map"
  # KOC-E-027 Section 5.1: DNP3 object definitions
  dnp3Objects:
    enabled: true
    configMapName: "koc-dnp3-object-definitions"
  # KOC-E-027 Section 6.3: Historian data retention
  historianRetention:
    rawData: "2y"
    aggregated1h: "10y"
    aggregated1d: "30y"

# ─── NCSC Classification — Restricted data storage ────────────────────────────
ncscClassification:
  restrictedStorageClass: "encrypted-restricted-kw"
  # Restricted data (financial) must use hardware-encrypted volumes
  financialDataPVC:
    storageClass: "hsm-encrypted-kw"
    size: "100Gi"

# ─── Locale and calendar ──────────────────────────────────────────────────────
locale:
  defaultLanguage: "ar"
  supportedLanguages: ["ar", "en"]
  timezone: "Asia/Kuwait"
  # Hijri calendar support (ME-10)
  hijriCalendar:
    enabled: true
    displayFormat: "dd/MM/yyyy (iDD/iMM/iYYYY)"
  # Kuwait working week: Sunday–Thursday
  workingWeek:
    start: 0  # Sunday
    end: 4    # Thursday
    weekendDays: [5, 6]  # Friday, Saturday

# ─── Monitoring and alerting ──────────────────────────────────────────────────
monitoring:
  # KPC NOC integration
  alertmanager:
    receivers:
      - name: "kpc-noc"
        webhook_configs:
          - url: "https://noc.kpc.com.kw/webhooks/og-rmm"
            send_resolved: true
  # Arabic alert messages
  alertLanguage: "ar"
