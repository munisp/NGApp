apiVersion: v2
name: og-rmm-platform
description: >
  Oil & Gas Remote Monitoring & Management Platform — Enterprise cloud-native
  deployment chart for Kuwait (KPC/KOC) and UAE (ADNOC) sovereign cloud environments.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - oil-gas
  - scada
  - rmm
  - iec-62443
  - iec-61511
  - adnoc
  - kpc
maintainers:
  - name: OG RMM Platform Team
    email: platform@og-rmm.internal
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: redpanda
    version: "5.x.x"
    repository: "https://charts.redpanda.com"
    condition: redpanda.enabled
