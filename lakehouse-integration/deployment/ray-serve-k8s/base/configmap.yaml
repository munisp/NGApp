apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-serve-config
  namespace: ray-serve
  labels:
    app: ray-serve-api
data:
  ray-serve-config.yaml: |
    # Ray Serve Configuration
    http_options:
      host: "0.0.0.0"
      port: 8000
      root_path: "/api/v1"
    
    grpc_options:
      port: 9000
      grpc_servicer_functions: []
    
    # Model configurations
    models:
      fraud_detection:
        name: "fraud-detection-xgboost"
        version: "v1.0.0"
        path: "/models/fraud_detection/model.pkl"
        num_replicas: 3
        max_concurrent_queries: 100
        ray_actor_options:
          num_cpus: 2
          num_gpus: 0
      
      risk_scoring:
        name: "risk-scoring-ml"
        version: "v1.0.0"
        path: "/models/risk_scoring/model.pkl"
        num_replicas: 2
        max_concurrent_queries: 50
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0
      
      claims_prediction:
        name: "claims-prediction"
        version: "v1.0.0"
        path: "/models/claims_prediction/model.pkl"
        num_replicas: 2
        max_concurrent_queries: 50
        ray_actor_options:
          num_cpus: 1
          num_gpus: 0
    
    # Logging
    logging:
      level: "INFO"
      format: "json"
    
    # Metrics
    metrics:
      enabled: true
      port: 9090
      path: "/metrics"
  
  models.json: |
    {
      "models": [
        {
          "name": "fraud-detection-xgboost",
          "version": "v1.0.0",
          "endpoint": "/predict/fraud",
          "description": "XGBoost fraud detection model",
          "input_schema": {
            "claim_amount": "float",
            "sum_assured": "float",
            "policy_age_days": "int",
            "claim_frequency": "int",
            "days_since_last_claim": "int"
          }
        },
        {
          "name": "risk-scoring-ml",
          "version": "v1.0.0",
          "endpoint": "/predict/risk",
          "description": "ML-based risk scoring model",
          "input_schema": {
            "customer_id": "string",
            "age": "int",
            "occupation": "string",
            "income": "float"
          }
        },
        {
          "name": "claims-prediction",
          "version": "v1.0.0",
          "endpoint": "/predict/claims",
          "description": "Claims prediction model",
          "input_schema": {
            "policy_type": "string",
            "coverage_amount": "float",
            "customer_age": "int"
          }
        }
      ]
    }
