apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ray-serve-api-ingress
  namespace: ray-serve
  labels:
    app: ray-serve-api
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/auth-url: "http://keycloak.kyc-kyb.svc.cluster.local:8080/auth/realms/lakehouse/protocol/openid-connect/userinfo"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User, X-Auth-Request-Email"
spec:
  tls:
  - hosts:
    - ml-api.lakehouse.example.com
    - ray-serve.lakehouse.example.com
    secretName: ray-serve-tls
  rules:
  - host: ml-api.lakehouse.example.com
    http:
      paths:
      - path: /api/v1/predict
        pathType: Prefix
        backend:
          service:
            name: ray-serve-api
            port:
              number: 8000
      - path: /api/v1/models
        pathType: Prefix
        backend:
          service:
            name: ray-serve-api
            port:
              number: 8000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: ray-serve-api
            port:
              number: 8000
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: ray-serve-api
            port:
              number: 9090
  - host: ray-serve.lakehouse.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ray-serve-api
            port:
              number: 8265
