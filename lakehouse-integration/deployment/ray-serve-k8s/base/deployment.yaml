apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-serve-api
  namespace: ray-serve
  labels:
    app: ray-serve-api
    component: ml-inference
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ray-serve-api
  template:
    metadata:
      labels:
        app: ray-serve-api
        component: ml-inference
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ray-serve-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      - name: model-downloader
        image: amazon/aws-cli:2.13.0
        command:
        - /bin/sh
        - -c
        - |
          echo "Downloading ML models from S3..."
          aws --endpoint-url=$S3_ENDPOINT s3 sync s3://$S3_BUCKET/fraud_detection /models/fraud_detection/
          aws --endpoint-url=$S3_ENDPOINT s3 sync s3://$S3_BUCKET/risk_scoring /models/risk_scoring/
          aws --endpoint-url=$S3_ENDPOINT s3 sync s3://$S3_BUCKET/claims_prediction /models/claims_prediction/
          echo "Models downloaded successfully"
          ls -lah /models/
        env:
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: S3_ENDPOINT
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: S3_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: S3_BUCKET
        volumeMounts:
        - name: models
          mountPath: /models
      
      containers:
      - name: ray-serve
        image: rayproject/ray-ml:2.9.0-py310
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - ray_serve_api.main
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: grpc
          containerPort: 9000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: dashboard
          containerPort: 8265
          protocol: TCP
        
        env:
        - name: RAY_SERVE_ENABLE_EXPERIMENTAL_STREAMING
          value: "1"
        - name: RAY_SERVE_HTTP_HOST
          value: "0.0.0.0"
        - name: RAY_SERVE_HTTP_PORT
          value: "8000"
        - name: RAY_DASHBOARD_HOST
          value: "0.0.0.0"
        - name: RAY_DASHBOARD_PORT
          value: "8265"
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: REDIS_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: KEYCLOAK_URL
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: KEYCLOAK_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: ray-serve-secrets
              key: KEYCLOAK_CLIENT_SECRET
        
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: ray-logs
          mountPath: /tmp/ray
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: models
        emptyDir:
          sizeLimit: 10Gi
      - name: config
        configMap:
          name: ray-serve-config
      - name: ray-logs
        emptyDir:
          sizeLimit: 5Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ray-serve-api
              topologyKey: kubernetes.io/hostname
      
      tolerations:
      - key: "ml-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
