apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-serve-sa
  namespace: ray-serve
  labels:
    app: ray-serve-api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-serve-role
  namespace: ray-serve
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-serve-rolebinding
  namespace: ray-serve
subjects:
- kind: ServiceAccount
  name: ray-serve-sa
  namespace: ray-serve
roleRef:
  kind: Role
  name: ray-serve-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ray-serve-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ray-serve-cluster-rolebinding
subjects:
- kind: ServiceAccount
  name: ray-serve-sa
  namespace: ray-serve
roleRef:
  kind: ClusterRole
  name: ray-serve-cluster-role
  apiGroup: rbac.authorization.k8s.io
