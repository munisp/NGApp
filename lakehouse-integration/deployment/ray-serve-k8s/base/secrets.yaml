apiVersion: v1
kind: Secret
metadata:
  name: ray-serve-secrets
  namespace: ray-serve
type: Opaque
stringData:
  # PostgreSQL connection
  POSTGRES_HOST: "postgresql.lakehouse.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "lakehouse"
  POSTGRES_USER: "ray_serve"
  POSTGRES_PASSWORD: "changeme_in_production"
  
  # Redis connection
  REDIS_HOST: "redis.lakehouse.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "changeme_in_production"
  
  # Kafka connection
  KAFKA_BOOTSTRAP_SERVERS: "kafka.lakehouse.svc.cluster.local:9092"
  KAFKA_SASL_USERNAME: "ray_serve"
  KAFKA_SASL_PASSWORD: "changeme_in_production"
  
  # S3/MinIO for model storage
  S3_ENDPOINT: "http://minio.lakehouse.svc.cluster.local:9000"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "changeme_in_production"
  S3_BUCKET: "ml-models"
  
  # Keycloak
  KEYCLOAK_URL: "http://keycloak.kyc-kyb.svc.cluster.local:8080"
  KEYCLOAK_REALM: "lakehouse"
  KEYCLOAK_CLIENT_ID: "ray-serve-api"
  KEYCLOAK_CLIENT_SECRET: "changeme_in_production"
  
  # API Keys
  API_KEY: "changeme_in_production"
  JWT_SECRET: "changeme_in_production"
---
