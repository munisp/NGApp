apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-serve-api
spec:
  template:
    spec:
      containers:
      - name: ray-serve
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
          limits:
            cpu: "8000m"
            memory: "16Gi"
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENABLE_DEBUG
          value: "false"
