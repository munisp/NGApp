apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ray-serve

bases:
- ../../base

patchesStrategicMerge:
- deployment-patch.yaml
- keda-patch.yaml

replicas:
- name: ray-serve-api
  count: 5

images:
- name: rayproject/ray-ml
  newName: your-registry.example.com/ray-serve-api
  newTag: v1.0.0-prod

configMapGenerator:
- name: ray-serve-config
  behavior: merge
  literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=INFO
  - ENABLE_DEBUG=false

secretGenerator:
- name: ray-serve-secrets
  behavior: replace
  envs:
  - secrets.env
