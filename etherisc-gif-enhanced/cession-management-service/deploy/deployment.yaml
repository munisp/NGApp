apiVersion: apps/v1
kind: Deployment
metadata:
  name: cession-management-service
  labels:
    app: cession-management-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cession-management-service
  template:
    metadata:
      labels:
        app: cession-management-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: cession-management-service
        image: cession-management-service:latest # Replace with your actual image
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_DSN
          valueFrom:
            secretKeyRef:
              name: cession-db-secret
              key: dsn
        - name: TEMPORAL_HOST_PORT
          value: "temporal-frontend.temporal.svc.cluster.local:7233"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cession-management-service
  labels:
    app: cession-management-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: cession-management-service
