apiVersion: apps/v1
kind: Deployment
metadata:
  name: treaty-reinsurance-service
  labels:
    app: treaty-reinsurance-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: treaty-reinsurance-service
  template:
    metadata:
      labels:
        app: treaty-reinsurance-service
    spec:
      containers:
      - name: treaty-reinsurance-service
        image: treaty-reinsurance-service:latest # Replace with your actual image path
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: dsn
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: treaty-reinsurance-service
spec:
  selector:
    app: treaty-reinsurance-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
