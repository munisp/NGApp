apiVersion: apps/v1
kind: Deployment
metadata:
  name: facultative-reinsurance-service
  labels:
    app: facultative-reinsurance-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facultative-reinsurance-service
  template:
    metadata:
      labels:
        app: facultative-reinsurance-service
    spec:
      containers:
      - name: facultative-reinsurance-service
        image: etherisc/facultative-reinsurance-service:latest # Placeholder image
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: TEMPORAL_HOST_PORT
          value: "temporal-frontend.temporal.svc.cluster.local:7233"
        - name: TEMPORAL_NAMESPACE
          value: "default"
        - name: LOG_LEVEL
          value: "info"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: facultative-reinsurance-service
spec:
  selector:
    app: facultative-reinsurance-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
