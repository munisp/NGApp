apiVersion: apps/v1
kind: Deployment
metadata:
  name: reinsurer-api
  labels:
    app: reinsurer-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reinsurer-api
  template:
    metadata:
      labels:
        app: reinsurer-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: reinsurer-api
        image: etherisc/reinsurer-api:latest # Placeholder image
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        # Configuration for external services (should be managed by config map or secret)
        - name: POLICY_SERVICE_URL
          value: "http://policy-service:8081"
        - name: CLAIMS_SERVICE_URL
          value: "http://claims-service:8082"
        - name: TEMPORAL_HOST_PORT
          value: "temporal:7233"
        # Database credentials (should be managed by secret)
        - name: DB_HOST
          value: "reinsurer-db"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: reinsurer-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reinsurer-secrets
              key: db_password
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reinsurer-api
  labels:
    app: reinsurer-api
spec:
  selector:
    app: reinsurer-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: reinsurer-api-metrics
  labels:
    app: reinsurer-api
spec:
  selector:
    app: reinsurer-api
  ports:
    - name: metrics
      protocol: TCP
      port: 9090 # Example port for Prometheus to scrape
      targetPort: 8080
  type: ClusterIP
