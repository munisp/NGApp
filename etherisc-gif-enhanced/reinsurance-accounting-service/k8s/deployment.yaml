apiVersion: apps/v1
kind: Deployment
metadata:
  name: reinsurance-accounting-service
  labels:
    app: reinsurance-accounting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reinsurance-accounting-service
  template:
    metadata:
      labels:
        app: reinsurance-accounting-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: reinsurance-accounting-service
        image: etherisc/reinsurance-accounting-service:latest # Placeholder image
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: PORT
          value: "8080"
        - name: METRICS_PORT
          value: "9090"
        - name: TIGERBEETLE_ADDRESSES
          value: "tigerbeetle-0.tigerbeetle.default.svc.cluster.local:3000" # Example
        - name: TIGERBEETLE_CLUSTER_ID
          value: "0"
        - name: TEMPORAL_HOST_PORT
          value: "temporal-frontend.default.svc.cluster.local:7233" # Example
        - name: TEMPORAL_TASK_QUEUE
          value: "reinsurance-accounting-task-queue"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reinsurance-accounting-service
  labels:
    app: reinsurance-accounting-service
spec:
  selector:
    app: reinsurance-accounting-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP
