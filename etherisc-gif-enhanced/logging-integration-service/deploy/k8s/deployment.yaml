apiVersion: apps/v1
kind: Deployment
metadata:
  name: gif-logging-service
  labels:
    app: gif-logging-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gif-logging-service
  template:
    metadata:
      labels:
        app: gif-logging-service
        version: v1
    spec:
      containers:
      - name: gif-logging-service
        image: gif-logging-service:latest # Placeholder for actual image
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: SERVICE_NAME
          value: "gif-logging-service"
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        - name: SERVER_PORT
          value: "8080"
        - name: OPENSEARCH_URL
          valueFrom:
            configMapKeyRef:
              name: opensearch-config
              key: opensearch_url
        - name: OPENSEARCH_INDEX
          value: "gif-logs"
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gif-logging-service
  labels:
    app: gif-logging-service
spec:
  selector:
    app: gif-logging-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gif-logging-service-monitor
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: gif-logging-service
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
