apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-integration-service
  labels:
    app: lakehouse-integration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lakehouse-integration-service
  template:
    metadata:
      labels:
        app: lakehouse-integration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: lakehouse-integration-service
        image: etherisc/lakehouse-integration-service:latest # Placeholder image
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-broker:9092" # Replace with actual Kafka service address
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: gif-db-secret
              key: dsn
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lakehouse-integration-service
  labels:
    app: lakehouse-integration-service
spec:
  selector:
    app: lakehouse-integration-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
