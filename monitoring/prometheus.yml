global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'payment-switch-platform'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # Web-Checkout Portal
  - job_name: 'web-portal'
    static_configs:
      - targets: ['web-portal:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Go Ledger Service
  - job_name: 'go-ledger'
    static_configs:
      - targets: ['go-ledger:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Fraud Detection Service
  - job_name: 'fraud-detection'
    static_configs:
      - targets: ['fraud-detection:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Data Pipeline Service
  - job_name: 'data-pipeline'
    static_configs:
      - targets: ['data-pipeline:8082']
    metrics_path: '/metrics'
    scrape_interval: 10s

