name: og_rmm_mobile
description: OG-RMM Platform — Flutter mobile app (iOS + Android + Web)
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP / API
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI
  material_design_icons_flutter: ^7.0.7296
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Push notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.3

  # Local notifications
  flutter_local_notifications: ^17.1.2

  # Background sync
  workmanager: ^0.5.2

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
