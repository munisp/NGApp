version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: etherisc-postgres
    environment:
      POSTGRES_DB: etherisc_insurance
      POSTGRES_USER: etherisc
      POSTGRES_PASSWORD: etherisc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-service/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - etherisc-network

  # Oracle Service
  oracle-service:
    build:
      context: ./oracle-service
      dockerfile: Dockerfile
    container_name: etherisc-oracle
    environment:
      RPC_URL: ${RPC_URL:-https://polygon-rpc.com}
      PRIVATE_KEY: ${PRIVATE_KEY}
      ORACLE_ADDRESS: ${ORACLE_ADDRESS}
      PRODUCT_ADDRESS: ${PRODUCT_ADDRESS}
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY}
      NIMET_API_KEY: ${NIMET_API_KEY}
      USE_MOCK_CLIENTS: ${USE_MOCK_CLIENTS:-true}
    depends_on:
      - postgres
    networks:
      - etherisc-network
    restart: unless-stopped

  # Backend Service
  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: etherisc-backend
    environment:
      DATABASE_URL: postgresql://etherisc:etherisc_password@postgres:5432/etherisc_insurance
      RPC_URL: ${RPC_URL:-https://polygon-rpc.com}
      PRIVATE_KEY: ${PRIVATE_KEY}
      PRODUCT_ADDRESS: ${PRODUCT_ADDRESS}
      POOL_ADDRESS: ${POOL_ADDRESS}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - etherisc-network
    restart: unless-stopped

  # Blockchain Sync Service
  blockchain-sync:
    build:
      context: ./blockchain-sync
      dockerfile: Dockerfile
    container_name: etherisc-sync
    environment:
      DATABASE_URL: postgresql://etherisc:etherisc_password@postgres:5432/etherisc_insurance
      RPC_URL: ${RPC_URL:-https://polygon-rpc.com}
      PRODUCT_ADDRESS: ${PRODUCT_ADDRESS}
      ORACLE_ADDRESS: ${ORACLE_ADDRESS}
      POOL_ADDRESS: ${POOL_ADDRESS}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-localhost:9092}
    depends_on:
      - postgres
    networks:
      - etherisc-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  etherisc-network:
    driver: bridge
