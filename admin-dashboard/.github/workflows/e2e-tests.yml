name: E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL for testing'
        required: false
        default: 'http://localhost:3001'

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3001' }}

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: admin-dashboard
        run: npx playwright install chromium --with-deps

      - name: Build application
        working-directory: admin-dashboard
        run: npm run build

      - name: Start application
        working-directory: admin-dashboard
        run: |
          npm run start &
          sleep 10
          curl -f http://localhost:3001 || exit 1

      - name: Run E2E tests
        working-directory: admin-dashboard
        run: npm run test:e2e
        env:
          CI: true
          BASE_URL: http://localhost:3001

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: admin-dashboard/test-results/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: admin-dashboard/test-results/**/*.png
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-results

      - name: Generate summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/results.json ]; then
            TOTAL=$(jq '.stats.expected' test-results/results.json 2>/dev/null || echo "N/A")
            PASSED=$(jq '.stats.expected - .stats.unexpected' test-results/results.json 2>/dev/null || echo "N/A")
            FAILED=$(jq '.stats.unexpected' test-results/results.json 2>/dev/null || echo "N/A")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Test results not found" >> $GITHUB_STEP_SUMMARY
          fi
