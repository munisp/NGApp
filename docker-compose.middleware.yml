version: "3.9"

services:
  # Kafka message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache and session store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL (primary database)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ndsep_user
      POSTGRES_PASSWORD: ndsep_secure_2026
      POSTGRES_DB: ndsep_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndsep_user -d ndsep_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # OpenSearch for transaction search and analytics
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Temporal workflow engine
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ndsep_user
      POSTGRES_PWD: ndsep_secure_2026
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    ports:
      - "8180:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ndsep_db
      KC_DB_USERNAME: ndsep_user
      KC_DB_PASSWORD: ndsep_secure_2026
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy

  # APISIX API Gateway
  apisix:
    image: apache/apisix:3.7.0-debian
    ports:
      - "9080:9080"
      - "9443:9443"
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml
    depends_on:
      - redis

  # Dapr sidecar (runs alongside application services)
  dapr-placement:
    image: daprio/dapr:1.12.0
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Metrics
    volumes:
      - ./infra/otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    environment:
      JAEGER_ENDPOINT: jaeger:4317
      PROMETHEUS_ENDPOINT: http://prometheus:9090/api/v1/write
    depends_on:
      - jaeger

  # Jaeger for trace visualization
  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Collector HTTP
      - "14250:14250"  # Collector gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: true

  # Prometheus for metrics storage
  prometheus:
    image: prom/prometheus:v2.49.1
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-remote-write-receiver'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus
      - jaeger

  # TigerBeetle high-performance ledger
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.6
    ports:
      - "3000:3000"
    command: start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle
    volumes:
      - tigerbeetle_data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'health check' | nc -w 1 localhost 3000 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Permify authorization service (PBAC/ReBAC)
  permify:
    image: ghcr.io/permify/permify:latest
    ports:
      - "3476:3476"
      - "3478:3478"
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: "postgres://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db"
    depends_on:
      postgres:
        condition: service_healthy

  # Fluvio real-time streaming
  fluvio:
    image: infinyon/fluvio:latest
    ports:
      - "9003:9003"
    environment:
      FLUVIO_NODE_BIND_ADDR: 0.0.0.0:9003

  # OpenAppSec WAF
  openappsec:
    image: ghcr.io/openappsec/smartsync:latest
    ports:
      - "4000:4000"
    environment:
      LEARNING_MODE: "true"
      LOG_LEVEL: info

  # Mojaloop Hub (Central Ledger + ALS)
  mojaloop-hub:
    image: mojaloop/central-ledger:latest
    ports:
      - "4001:3001"
    environment:
      CLED_DATABASE_URI: "postgres://ndsep_user:ndsep_secure_2026@postgres:5432/ndsep_db"
      CLED_KAFKA__PRODUCER__BROKER_LIST: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # MinIO object storage (Lakehouse backing)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Lakehouse API (Python FastAPI)
  lakehouse-api:
    build:
      context: ./payment-core/data-integration/lakehouse-api
      dockerfile: Dockerfile
    ports:
      - "8090:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DELTA_BASE_PATH: s3a://lakehouse/delta
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  tigerbeetle_data:
  minio_data:
