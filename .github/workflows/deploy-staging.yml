name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.payment-switch.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/staging_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "mkdir -p /opt/payment-switch/staging"
      
      - name: Copy deployment files
        run: |
          scp -i ~/.ssh/staging_key \
            docker-compose.unified.yml \
            .env.example \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/payment-switch/staging/
      
      - name: Deploy application
        run: |
          ssh -i ~/.ssh/staging_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/payment-switch/staging
            
            # Set environment variables
            export IMAGE_TAG=${{ steps.version.outputs.VERSION }}
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}
            
            # Pull latest images
            docker login $REGISTRY -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker-compose -f docker-compose.unified.yml pull
            
            # Stop old containers
            docker-compose -f docker-compose.unified.yml down
            
            # Start new containers
            docker-compose -f docker-compose.unified.yml up -d
            
            # Wait for services to be healthy
            sleep 30
            
            # Run database migrations
            docker-compose -f docker-compose.unified.yml exec -T web-portal pnpm db:push
          EOF
      
      - name: Run health checks
        run: |
          ssh -i ~/.ssh/staging_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd /opt/payment-switch/staging && ./scripts/health-check.sh"
      
      - name: Run smoke tests
        run: |
          # Test critical endpoints
          curl -f https://staging.payment-switch.com/health || exit 1
          curl -f https://staging.payment-switch.com/api/health || exit 1
      
      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/staging_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/payment-switch/staging
            
            # Rollback to previous version
            docker-compose -f docker-compose.unified.yml down
            docker-compose -f docker-compose.unified.yml up -d --force-recreate
          EOF
      
      - name: Clean up old images
        run: |
          ssh -i ~/.ssh/staging_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "docker image prune -af --filter 'until=72h'"
      
      - name: Send deployment notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            Staging Deployment ${{ job.status }}
            Version: ${{ steps.version.outputs.VERSION }}
            Environment: https://staging.payment-switch.com
            Deployed by: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  load-test:
    name: Run Load Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.45.0/k6-v0.45.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-v0.45.0-linux-amd64/k6 /usr/local/bin/
      
      - name: Run payment processing test
        run: |
          cd load-tests
          BASE_URL=https://staging.payment-switch.com k6 run --duration 5m --vus 100 payment-processing.js
        continue-on-error: true
      
      - name: Run fraud detection test
        run: |
          cd load-tests
          BASE_URL=https://staging.payment-switch.com k6 run --duration 5m --vus 50 fraud-detection.js
        continue-on-error: true
      
      - name: Generate performance report
        run: |
          cd load-tests
          ./generate-performance-report.sh
      
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-staging
          path: load-tests/reports/*.html
          retention-days: 30
