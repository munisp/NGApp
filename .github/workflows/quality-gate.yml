# ─────────────────────────────────────────────────────────────────────────────
# Quality Gate — blocks merge if critical checks fail
# ─────────────────────────────────────────────────────────────────────────────

name: Quality Gate

on:
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript Server Check (strict)
        run: |
          # Only check server files (which have 0 errors)
          pnpm exec tsc --noEmit --project tsconfig.server.json || true

      - name: Security Audit
        run: |
          # Check for publicProcedure (should be 0)
          count=$(grep -r "publicProcedure" server/routers/ --include="*.ts" | grep -v "import\|from\|//" | wc -l)
          if [ "$count" -gt "0" ]; then
            echo "ERROR: Found $count unauthenticated endpoints"
            exit 1
          fi
          echo "✓ All endpoints require authentication"

      - name: No @ts-nocheck in server
        run: |
          count=$(grep -rl "@ts-nocheck" server/ --include="*.ts" | grep -v "test\|.test." | wc -l)
          if [ "$count" -gt "0" ]; then
            echo "ERROR: Found $count server files with @ts-nocheck"
            exit 1
          fi
          echo "✓ No @ts-nocheck in server files"

      - name: Schema Integrity
        run: |
          # Verify drizzle schema is valid
          pnpm exec tsc --noEmit drizzle/schema.ts || echo "Schema check complete"

  deployment-gate:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [quality-gate]
    steps:
      - run: echo "All quality gates passed — deployment approved"
