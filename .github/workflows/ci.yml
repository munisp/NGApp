  python-services:
    name: Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python Services
        run: |
          for svc in islamic-banking-py education-loans-py dispute-management-py erpnext-sync-py regulatory-reporting-py treasury-liquidity-py customer-engagement-py batch-processing-py workflow-engine-py opensearch-analytics-py keycloak-identity-py customer-360-py diaspora-banking-py kyc-aml-screening-py savings-products-py customer-insights-py document-management-py customer-feedback-py wealth-mgmt-py chatbot-py microfinance-py inventory-py insurance-py pension-py; do
            echo "Checking services/$svc/service.py..."
            python3 -c "import py_compile; py_compile.compile('services/$svc/service.py', doraise=True)"
          done
          for svc in opensearch-indexer-py lakehouse-etl-py cbn-returns-py statement-generator-py exam-management-py kyc-engine-py ab-testing-py; do
            echo "Checking services/$svc/main.py..."
            python3 -c "import py_compile; py_compile.compile('services/$svc/main.py', doraise=True)"
          done
          for svc in branded-comms-py plugin-marketplace-py billing-analytics-py billing-event-processor-py regulatory-automation-py; do
            echo "Checking services/$svc/service.py..."
            python3 -c "import py_compile; py_compile.compile('services/$svc/service.py', doraise=True)"
          done

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, go-services, rust-services, python-services]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t 54bank-platform:ci .

  deploy-staging:
    name: Deploy Staging
    needs: [lint-typecheck, build, unit-tests, go-services, rust-services, python-services, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image: 54bank/platform:${{ github.sha }}"
          echo "Helm upgrade --install 54bank helm/54bank/ --set image.tag=${{ github.sha }} --namespace staging"
          echo "Staging deployment complete"
        env:
          DEPLOY_ENV: staging
