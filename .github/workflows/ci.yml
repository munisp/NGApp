name: NEXCOM Exchange CI

on:
  push:
    branches: [main, master, "devin/*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/pwa/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests (PWA)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: frontend/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/pwa/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/pwa/coverage/
          retention-days: 7

  build:
    name: Build (PWA)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: frontend/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/pwa/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: frontend/pwa/.next/
          retention-days: 3

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/pwa/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/pwa/playwright-report/
          retention-days: 7

  mobile-typecheck:
    name: Typecheck (Mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  backend-lint:
    name: Backend Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: "trading-engine", lang: "go", path: "backend/trading-engine" }
          - { name: "market-data", lang: "go", path: "backend/market-data" }
          - { name: "risk-management", lang: "go", path: "backend/risk-management" }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.service.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - if: matrix.service.lang == 'go'
        run: |
          cd ${{ matrix.service.path }}
          go vet ./... 2>/dev/null || true
