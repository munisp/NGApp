apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-mobile-app
  labels:
    app: agent-mobile-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-mobile-app
  template:
    metadata:
      labels:
        app: agent-mobile-app
    spec:
      containers:
      - name: agent-mobile-app
        image: agent-mobile-app:latest
        ports:
        - containerPort: 8110
        env:
        - name: PORT
          value: "8110"
        livenessProbe:
          httpGet:
            path: /health
            port: 8110
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8110
          initialDelaySeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
