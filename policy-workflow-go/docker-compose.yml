version: '3.8'

services:
  # TigerBeetle - Distributed ledger for financial transactions
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: tigerbeetle
    ports:
      - "3000:3000"
    command: start --addresses=0.0.0.0:3000
    networks:
      - insurance-network

  # PostgreSQL - Primary database
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_DB: insurance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - insurance-network

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:latest
    container_name: temporal
    ports:
      - "7233:7233"
      - "8080:8080"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    depends_on:
      - postgres
    networks:
      - insurance-network

  # Kafka - Event streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - insurance-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - insurance-network

  # Redis - Dapr state store
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - insurance-network

  # Go Worker - Temporal workflow worker
  workflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: workflow-worker
    environment:
      TIGERBEETLE_ADDRESSES: tigerbeetle:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/insurance_db
      TEMPORAL_SERVICE_URL: temporal:7233
      TEMPORAL_TASK_QUEUE: policy-task-queue
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - tigerbeetle
      - postgres
      - temporal
      - kafka
    networks:
      - insurance-network
    restart: unless-stopped

  # Python Webhook Service (if running together)
  webhook-service:
    build:
      context: ../policy-webhook-service
      dockerfile: Dockerfile
    container_name: webhook-service
    ports:
      - "8000:8000"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      DAPR_GRPC_PORT: 50001
      DAPR_HTTP_PORT: 3500
    depends_on:
      - temporal
      - redis
      - kafka
    networks:
      - insurance-network
    restart: unless-stopped

  # Dapr Sidecar for webhook service
  webhook-dapr:
    image: daprio/daprd:latest
    container_name: webhook-dapr
    command: [
      "./daprd",
      "-app-id", "policy-webhook-service",
      "-app-port", "8000",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-placement-host-address", "dapr-placement:50006",
      "-components-path", "/components"
    ]
    volumes:
      - ../policy-webhook-service/dapr:/components
    depends_on:
      - webhook-service
      - dapr-placement
    network_mode: "service:webhook-service"

  # Dapr Placement Service
  dapr-placement:
    image: daprio/dapr:latest
    container_name: dapr-placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"
    networks:
      - insurance-network

networks:
  insurance-network:
    driver: bridge

volumes:
  postgres-data:
