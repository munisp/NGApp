apiVersion: apps/v1
kind: Deployment
metadata:
  name: underwriting-risk-integrator
  labels:
    app: underwriting-risk-integrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: underwriting-risk-integrator
  template:
    metadata:
      labels:
        app: underwriting-risk-integrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: integrator
        image: underwriting-risk-integrator:latest # Placeholder for actual image
        ports:
        - containerPort: 8080 # API port
        - containerPort: 9090 # Metrics port
        env:
        - name: TEMPORAL_HOST_PORT
          value: "temporal-frontend:7233"
        - name: TEMPORAL_NAMESPACE
          value: "default"
        - name: OPENIMIS_BASE_URL
          value: "http://openimis-risk-assessor:8080"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: underwriting-risk-integrator
spec:
  selector:
    app: underwriting-risk-integrator
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
  type: ClusterIP
