apiVersion: apps/v1
kind: Deployment
metadata:
  name: openimis-policy-integration
  labels:
    app: openimis-policy-integration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openimis-policy-integration
  template:
    metadata:
      labels:
        app: openimis-policy-integration
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080" # Assuming metrics are exposed on the main port
    spec:
      containers:
      - name: openimis-policy-integration
        image: your-registry/openimis-policy-integration:latest # Replace with your image
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_FILE
          value: "/root/configs/config.yaml"
        - name: OPENIMIS_BASE_URL
          value: "http://openimis-actuarial-service:8081"
        - name: TEMPORAL_HOST_PORT
          value: "temporal-frontend:7233"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: openimis-policy-integration
  labels:
    app: openimis-policy-integration
spec:
  selector:
    app: openimis-policy-integration
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
    - protocol: TCP
      port: 9090 # Example port for Prometheus metrics if separate
      targetPort: 9090
      name: metrics
  type: ClusterIP
