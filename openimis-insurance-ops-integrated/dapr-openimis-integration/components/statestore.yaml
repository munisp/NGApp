apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis-master:6379 # Assumes a Redis service named redis-master in K8s
  - name: redisPassword
    secretKeyRef:
      name: redis-secret
      key: redis-password
auth:
  secretStore: secretstore
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
type: Opaque
data:
  redis-password: cGFzc3dvcmQ= # Base64 encoded "password"
