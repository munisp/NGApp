apiVersion: apps/v1
kind: Deployment
metadata:
  name: openimis-consumer-service
  labels:
    app: openimis-consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: openimis-consumer
  template:
    metadata:
      labels:
        app: openimis-consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: openimis-consumer
        image: openimis-consumer-service:latest # Replace with your image registry path
        ports:
        - containerPort: 8081
          name: metrics
        env:
        - name: KAFKA_BROKER
          value: "kafka-broker-service:9092" # Replace with your Kafka service address
        - name: KAFKA_TOPIC
          value: "claim-lifecycle-events"
        - name: KAFKA_GROUP_ID
          value: "openimis-claims-consumer-group"
        # Database Configuration (OpenIMIS DB)
        - name: DB_HOST
          value: "openimis-db-service" # Replace with your OpenIMIS DB service address
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: openimis-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openimis-db-credentials
              key: password
        - name: DB_NAME
          value: "openimis_db"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: openimis-consumer-service
spec:
  selector:
    app: openimis-consumer
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      name: metrics
  type: ClusterIP
