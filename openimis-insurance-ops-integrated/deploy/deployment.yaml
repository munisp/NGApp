apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-openimis-sync
  labels:
    app: claims-openimis-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-openimis-sync
  template:
    metadata:
      labels:
        app: claims-openimis-sync
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: claims-openimis-sync
        image: claims-openimis-sync:latest # Placeholder for built image
        ports:
        - containerPort: 9090 # Prometheus metrics port
        envFrom:
        - configMapRef:
            name: claims-openimis-sync-config
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: claims-openimis-sync-metrics
  labels:
    app: claims-openimis-sync
spec:
  selector:
    app: claims-openimis-sync
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      name: metrics
