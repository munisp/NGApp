apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-openimis-sync-config
data:
  TEMPORAL_HOST_PORT: "temporal-frontend.temporal.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "claims-sync-queue"
  CLAIMS_SERVICE_URL: "http://claims-service.default.svc.cluster.local:8080"
  OPENIMIS_SERVICE_URL: "http://openimis-service.default.svc.cluster.local:8081"
  SYNC_INTERVAL: "5m"
  LOSS_RATIO_RECONCILIATION_INTERVAL: "24h"
