apiVersion: v1
kind: Service
metadata:
  name: openimis-db-service
spec:
  selector:
    app: openimis-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openimis-db
  labels:
    app: openimis-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openimis-db
  template:
    metadata:
      labels:
        app: openimis-db
    spec:
      containers:
      - name: postgres
        image: postgres:14-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "openimis_user"
        - name: POSTGRES_PASSWORD
          value: "openimis_password"
        - name: POSTGRES_DB
          value: "openimis_db"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: openimis-db-credentials
type: Opaque
data:
  username: b3BlbmltaXNfdXNlcg== # base64("openimis_user")
  password: b3BlbmltaXNfcGFzc3dvcmQ= # base64("openimis_password")
