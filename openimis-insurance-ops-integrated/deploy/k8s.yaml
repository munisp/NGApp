---
# Kubernetes Deployment for the Temporal Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openimis-underwriting-sync
  labels:
    app: openimis-underwriting-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openimis-underwriting-sync
  template:
    metadata:
      labels:
        app: openimis-underwriting-sync
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: sync-worker
        image: your-registry/openimis-underwriting-sync:latest # Replace with your image
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: SYNC_TEMPORAL_HOSTPORT
          value: "temporal-frontend.temporal.svc.cluster.local:7233" # Temporal service address
        - name: SYNC_TEMPORAL_NAMESPACE
          value: "production"
        - name: SYNC_CLIENTS_OPENIMIS_BASEURL
          value: "http://openimis-api.default.svc.cluster.local:8000"
        - name: SYNC_CLIENTS_UNDERWRITING_BASEURL
          value: "http://underwriting-service.default.svc.cluster.local:8081"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Kubernetes Service for Prometheus Scraping
apiVersion: v1
kind: Service
metadata:
  name: openimis-underwriting-sync-metrics
  labels:
    app: openimis-underwriting-sync
spec:
  selector:
    app: openimis-underwriting-sync
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
  type: ClusterIP
