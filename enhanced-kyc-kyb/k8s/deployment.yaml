apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-kyc-kyb
  labels:
    app: enhanced-kyc-kyb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enhanced-kyc-kyb
  template:
    metadata:
      labels:
        app: enhanced-kyc-kyb
    spec:
      containers:
      - name: enhanced-kyc-kyb
        image: enhanced-kyc-kyb:latest
        ports:
        - containerPort: 8108
        env:
        - name: PORT
          value: "8108"
        livenessProbe:
          httpGet:
            path: /health
            port: 8108
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8108
          initialDelaySeconds: 5
