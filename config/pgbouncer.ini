; PgBouncer Configuration (#14) — Connection Pooling for PostgreSQL
; Deploy between Express gateway and PostgreSQL for production.
;
; Usage: pgbouncer config/pgbouncer.ini

[databases]
ndsep_db = host=localhost port=5432 dbname=ndsep_db auth_user=postgres

[pgbouncer]
; Pool settings
pool_mode = transaction
default_pool_size = 20
min_pool_size = 5
max_client_conn = 200
max_db_connections = 50
reserve_pool_size = 5
reserve_pool_timeout = 3

; Connection lifecycle
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 300
client_login_timeout = 60
query_timeout = 30
query_wait_timeout = 120

; Listening
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer

; Auth
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Admin
admin_users = postgres
stats_users = monitoring

; TLS (production)
; client_tls_sslmode = require
; client_tls_cert_file = /etc/ssl/certs/pgbouncer.crt
; client_tls_key_file = /etc/ssl/private/pgbouncer.key
; server_tls_sslmode = verify-full
; server_tls_ca_file = /etc/ssl/certs/ca.crt
