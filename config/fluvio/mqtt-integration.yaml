apiVersion: v1
kind: Secret
metadata:
  name: fluvio-mqtt-secrets
  namespace: enterprise-crm
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  iot-mqtt-username: aW90X2NsaWVudA==  # iot_client
  iot-mqtt-password: aW90X3NlY3VyZV9wYXNzd29yZA==  # iot_secure_password
  pos-mqtt-username: cG9zX2NsaWVudA==  # pos_client
  pos-mqtt-password: cG9zX3NlY3VyZV9wYXNzd29yZA==  # pos_secure_password
  analytics-mqtt-username: YW5hbHl0aWNzX2NsaWVudA==  # analytics_client
  analytics-mqtt-password: YW5hbHl0aWNzX3NlY3VyZV9wYXNzd29yZA==  # analytics_secure_password
  iot-webhook-token: aW90X3dlYmhvb2tfdG9rZW5fMTIz  # iot_webhook_token_123
  pos-webhook-token: cG9zX3dlYmhvb2tfdG9rZW5fMTIz  # pos_webhook_token_123
  server-cert: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # SSL certificate
  server-key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t  # SSL private key
  ca-cert: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # CA certificate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-mqtt-iot
  namespace: enterprise-crm
  labels:
    app: fluvio-mqtt-iot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluvio-mqtt-iot
  template:
    metadata:
      labels:
        app: fluvio-mqtt-iot
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
          name: mqtt
        - containerPort: 8883
          name: mqtt-ssl
        - containerPort: 8080
          name: websocket
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config
        - name: certs
          mountPath: /mosquitto/certs
          readOnly: true
        - name: data
          mountPath: /mosquitto/data
        - name: logs
          mountPath: /mosquitto/log
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: fluvio-mqtt-config
      - name: certs
        secret:
          secretName: fluvio-mqtt-secrets
          items:
          - key: server-cert
            path: server.crt
          - key: server-key
            path: server.key
          - key: ca-cert
            path: ca.crt
      - name: data
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-mqtt-pos
  namespace: enterprise-crm
  labels:
    app: fluvio-mqtt-pos
spec:
