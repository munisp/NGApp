---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluvio-mqtt-bridge
  namespace: enterprise-crm
  labels:
    app: fluvio-mqtt-bridge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fluvio-mqtt-bridge
  template:
    metadata:
      labels:
        app: fluvio-mqtt-bridge
    spec:
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-kafka:7.5.0
        command:
        - sh
        - -c
        - |
          echo "Waiting for Kafka..."
          until kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
            echo "Kafka not ready, waiting..."
            sleep 5
          done
          echo "Kafka is ready!"
      containers:
      - name: mqtt-bridge
        image: python:3.11-slim
        command:
        - /bin/bash
        - -c
        - |
          pip install -r /app/requirements.txt
          python /app/mqtt-bridge.py
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: IOT_MQTT_HOST
          value: "fluvio-mqtt-iot"
        - name: IOT_MQTT_PORT
          value: "8883"
        - name: POS_MQTT_HOST
          value: "fluvio-mqtt-pos"
        - name: POS_MQTT_PORT
          value: "8884"
        - name: IOT_MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: fluvio-mqtt-secrets
              key: iot-mqtt-username
        - name: IOT_MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluvio-mqtt-secrets
              key: iot-mqtt-password
        - name: POS_MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: fluvio-mqtt-secrets
              key: pos-mqtt-username
        - name: POS_MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fluvio-mqtt-secrets
              key: pos-mqtt-password
        volumeMounts:
        - name: app
          mountPath: /app
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: app
        configMap:
          name: fluvio-mqtt-config
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-mqtt-iot
  namespace: enterprise-crm
  labels:
    app: fluvio-mqtt-iot
spec:
  ports:
  - port: 1883
    targetPort: 1883
    name: mqtt
  - port: 8883
    targetPort: 8883
    name: mqtt-ssl
  - port: 8080
    targetPort: 8080
    name: websocket
  selector:
    app: fluvio-mqtt-iot
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: fluvio-mqtt-pos
  namespace: enterprise-crm
  labels:
    app: fluvio-mqtt-pos
spec:
  ports:
  - port: 1884
    targetPort: 1884
    name: mqtt
  - port: 8884
    targetPort: 8884
    name: mqtt-ssl
  - port: 8081
    targetPort: 8081
    name: websocket
  selector:
    app: fluvio-mqtt-pos
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-mqtt-pdb
  namespace: enterprise-crm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fluvio-mqtt-iot
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluvio-mqtt-pos-pdb
  namespace: enterprise-crm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fluvio-mqtt-pos
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fluvio-mqtt-bridge-hpa
  namespace: enterprise-crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fluvio-mqtt-bridge
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

