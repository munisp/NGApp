apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_listen:
    ip: 0.0.0.0
    port: 9180
  admin_key:
    - name: admin
      key: edd1c9f034335f136f87ad84b625c8f1
      role: admin
    - name: viewer
      key: 4054f7cf07e344346cd3f287985e76a2
      role: viewer

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - http://apisix-etcd:2379
    prefix: /apisix
    timeout: 30

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: 0.0.0.0
      port: 9091

plugins:
  - real-ip
  - ai
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - ext-plugin-pre-req
  - fault-injection
  - mocking
  - serverless-pre-function
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - uri-blocker
  - request-validation
  - openid-connect
  - cas-auth
  - authz-casbin
  - authz-casdoor
  - wolf-rbac
  - ldap-auth
  - hmac-auth
  - basic-auth
  - jwt-auth
  - key-auth
  - consumer-restriction
  - forward-auth
  - opa
  - authz-keycloak
  - proxy-cache
  - body-transformer
  - proxy-mirror
  - proxy-rewrite
  - workflow
  - api-breaker
  - limit-conn
  - limit-count
  - limit-req
  - gzip
  - traffic-split
  - redirect
  - response-rewrite
  - kafka-logger
  - http-logger
  - tcp-logger
  - udp-logger
  - file-logger
  - clickhouse-logger
  - error-log-logger
  - syslog
  - log-rotate
  - skywalking
  - opentelemetry
  - prometheus
  - datadog
  - echo
  - loggly
  - splunk-hec-logging
  - skywalking-logger
  - google-cloud-logging
  - sls-logger
  - kafka-proxy
  - dubbo-proxy
  - grpc-transcode
  - grpc-web
