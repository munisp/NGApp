# APISIX Configuration for Payment Switch Platform
# Integrates with Keycloak for authentication and Permify for authorization

apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_key:
    - name: admin
      key: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
      role: admin
  ssl:
    enable: true
    listen_port: 9443
    ssl_protocols: TLSv1.2 TLSv1.3
    ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

nginx_config:
  error_log: /dev/stderr
  error_log_level: warn
  http:
    access_log: /dev/stdout
    keepalive_timeout: 60s
    client_max_body_size: 10m

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
  opentelemetry:
    trace_id_source: x-request-id
    resource:
      service.name: payment-switch-gateway

plugins:
  - real-ip
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - opentelemetry
  - ext-plugin-pre-req
  - ext-plugin-post-req
  - ext-plugin-post-resp
  - api-breaker
  - limit-conn
  - limit-count
  - limit-req
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - uri-blocker
  - request-validation
  - openid-connect
  - authz-keycloak
