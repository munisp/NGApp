routes:
  - id: 200
    name: crm_customer_api
    uri: /api/v1/crm/customers/*
    upstream:
      type: roundrobin
      nodes:
        "crm-customer-service:8080": 1
    plugins:
      jwt-auth:
        header: Authorization
        query: token
        cookie: jwt
        hide_credentials: true
      proxy-rewrite:
        regex_uri: ["^/api/v1/crm/customers/(.*)", "/api/customers/$1"]
      request-validation:
        body_schema:
          type: object
          required:
            - customer_id
          properties:
            customer_id:
              type: string
              pattern: "^[a-zA-Z0-9-]+$"
      response-rewrite:
        headers:
          set:
            X-API-Version: "v1"
      limit-req:
        rate: 10
        burst: 5
        rejected_code: 429
        key: remote_addr
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
        allow_headers: "Content-Type,Authorization"
        expose_headers: "X-Request-ID"
        max_age: 3600
      prometheus:
        prefer_name: true
      proxy-cache:
        cache_zone: crm_cache
        cache_key: "$uri$args"
        cache_bypass: "$arg_bypass_cache"
        cache_method: ["GET"]
        cache_http_status: [200]
        hide_cache_headers: true
        no_cache: "$arg_no_cache"
  
