apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: configuration
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://jaeger-collector:14268/api/traces"
  metric:
    enabled: true
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  secrets:
    scopes:
      - storeName: "kubernetes"
        defaultAccess: "allow"
        deniedSecrets: ["secret1", "secret2"]
  accessControl:
    defaultAction: "allow"
    trustDomain: "cluster.local"
    policies:
      - appId: "customer-service"
        defaultAction: "allow"
        trustDomain: "cluster.local"
        namespace: "enterprise-crm"
        operations:
          - name: "/api/customers"
            httpVerb: ["GET", "POST"]
            action: "allow"
          - name: "/api/customers/*"
            httpVerb: ["GET", "PUT", "DELETE"]
            action: "allow"
      - appId: "crm-core-service"
        defaultAction: "allow"
        trustDomain: "cluster.local"
        namespace: "enterprise-crm"
        operations:
          - name: "/api/leads"
            httpVerb: ["GET", "POST"]
            action: "allow"
          - name: "/api/opportunities"
            httpVerb: ["GET", "POST", "PUT"]
            action: "allow"
  nameResolution:
    component: "kubernetes"
    version: "v1"
    configuration:
      clusterDomain: "cluster.local"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-master:6379
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: redis-password
    - name: enableTLS
      value: "false"
    - name: maxRetries
      value: "3"
    - name: maxRetryBackoff
      value: "2s"
    - name: ttlInSeconds
      value: "3600"
  scopes:
    - customer-service
    - crm-core-service
    - inventory-service
    - analytics-service
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "enterprise-kafka-cluster-kafka-bootstrap.data-platform.svc.cluster.local:9092"
    - name: consumerGroup
      value: "enterprise-crm-group"
    - name: clientID
      value: "enterprise-crm-client"
    - name: authType
      value: "none"
    - name: maxMessageBytes
      value: "1024000"
    - name: version
      value: "2.8.0"
  scopes:
    - customer-service
    - crm-core-service
    - inventory-service
    - analytics-service
    - customer-intelligence-service
    - data-quality-service
    - recommendation-service
    - geospatial-service
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: secretstore
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    - name: vaultKubernetesMountPath
      value: "kubernetes"
    - name: vaultServerURL
      value: "https://vault.security.svc.cluster.local:8200"
    - name: vaultKubernetesRole
      value: "dapr"
  scopes:
    - customer-service
    - crm-core-service
    - inventory-service
    - analytics-service
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: bindings
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: bindings
spec:
  type: bindings.kafka
  version: v1
  metadata:
    - name: brokers
      value: "enterprise-kafka-cluster-kafka-bootstrap.data-platform.svc.cluster.local:9092"
    - name: topics
      value: "customer-events,crm-events,inventory-events,analytics-events"
    - name: consumerGroup
      value: "enterprise-crm-bindings"
    - name: publishTopic
      value: "outbound-events"
    - name: authType
      value: "none"
  scopes:
    - customer-service
    - crm-core-service
    - inventory-service
    - analytics-service
---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: customer-events-subscription
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: subscription
spec:
  topic: customer-events
  route: /api/events/customer
  pubsubname: pubsub
  scopes:
    - customer-intelligence-service
    - data-quality-service
    - recommendation-service
---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: crm-events-subscription
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: subscription
spec:
  topic: crm-events
  route: /api/events/crm
  pubsubname: pubsub
  scopes:
    - analytics-service
    - customer-intelligence-service
---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: inventory-events-subscription
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: subscription
spec:
  topic: inventory-events
  route: /api/events/inventory
  pubsubname: pubsub
  scopes:
    - analytics-service
    - recommendation-service
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: workflow
spec:
  type: workflow.temporal
  version: v1
  metadata:
    - name: host
      value: "temporal-server.enterprise-crm.svc.cluster.local:7233"
    - name: namespace
      value: "default"
    - name: dataConverter
      value: "json"
  scopes:
    - customer-service
    - crm-core-service
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: secret
type: Opaque
data:
  redis-password: cmVkaXNfcGFzcw== # redis_pass
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: dapr-mtls
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: mtls
spec:
  host: "*.enterprise-crm.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
  exportTo:
    - "."
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: dapr-mtls
  namespace: enterprise-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: mtls
spec:
  mtls:
    mode: STRICT

