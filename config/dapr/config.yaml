apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: banking-crm
  labels:
    app.kubernetes.io/name: dapr
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: banking-crm-integration
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "otel-collector.observability.svc:4317"
      isSecure: false
      protocol: grpc
  metric:
    enabled: true
    rules:
      - name: dapr_http_server_request_count
        labels:
          - name: method
          - name: path
          - name: status
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  secrets:
    scopes:
      - storeName: "kubernetes"
        defaultAccess: "deny"
        allowedSecrets:
          - crm-db-credentials
          - crm-redis-credentials
          - crm-kafka-credentials
          - crm-encryption-keys
          - crm-email-credentials
  accessControl:
    defaultAction: "deny"
    trustDomain: "banking-crm.local"
    policies:
      - appId: crm-api-gateway
        defaultAction: allow
        trustDomain: "banking-crm.local"
        namespace: "banking-crm"
      - appId: crm-customer-service
        defaultAction: allow
        trustDomain: "banking-crm.local"
        namespace: "banking-crm"
        operations:
          - name: "/api/v1/customers/*"
            httpVerb: ["GET", "POST", "PUT", "DELETE"]
            action: allow
      - appId: crm-campaign-service
        defaultAction: allow
        trustDomain: "banking-crm.local"
        namespace: "banking-crm"
      - appId: crm-audit-service
        defaultAction: allow
        trustDomain: "banking-crm.local"
        namespace: "banking-crm"
      - appId: crm-core-service
        defaultAction: allow
        trustDomain: "banking-crm.local"
        namespace: "banking-crm"
        operations:
          - name: "/api/leads"
            httpVerb: ["GET", "POST"]
            action: allow
          - name: "/api/opportunities"
            httpVerb: ["GET", "POST", "PUT"]
            action: allow
      - appId: payment-service
        defaultAction: allow
        trustDomain: "banking-crm.local"
        namespace: "banking-crm"
  nameResolution:
    component: "kubernetes"
    version: "v1"
    configuration:
      clusterDomain: "cluster.local"
---
# State Store (PostgreSQL)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-statestore
  namespace: banking-crm
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: crm-db-credentials
        key: connection-string
    - name: tableName
      value: "crm_state"
    - name: metadataTableName
      value: "crm_state_metadata"
    - name: cleanupIntervalInSeconds
      value: "3600"
---
# Pub/Sub (Kafka)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-pubsub
  namespace: banking-crm
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka-0.kafka.banking-crm.svc:9092,kafka-1.kafka.banking-crm.svc:9092,kafka-2.kafka.banking-crm.svc:9092"
    - name: authType
      value: "password"
    - name: saslUsername
      value: "crm-dapr"
    - name: saslPassword
      secretKeyRef:
        name: crm-kafka-credentials
        key: password
    - name: saslMechanism
      value: "SCRAM-SHA-256"
    - name: consumeRetryInterval
      value: "200ms"
    - name: maxRetryCount
      value: "5"
    - name: version
      value: "2.0.0"
---
# Cache (Redis)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-cache
  namespace: banking-crm
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.banking-crm.svc:6379"
    - name: redisPassword
      secretKeyRef:
        name: crm-redis-credentials
        key: password
    - name: enableTLS
      value: "true"
    - name: failover
      value: "true"
    - name: sentinelMasterName
      value: "crm-master"
    - name: sentinelAddresses
      value: "redis-sentinel.banking-crm.svc:26379"
---
# Email Binding (SendGrid)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-bindings-email
  namespace: banking-crm
spec:
  type: bindings.smtp
  version: v1
  metadata:
    - name: host
      value: "smtp.sendgrid.net"
    - name: port
      value: "587"
    - name: user
      value: "apikey"
    - name: password
      secretKeyRef:
        name: crm-email-credentials
        key: api-key
    - name: emailFrom
      value: "noreply@banking-crm.ng"
---
# Secret Store
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-secrets
  namespace: banking-crm
spec:
  type: secretstores.kubernetes
  version: v1
---
# Scheduled Jobs
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-cron-compliance
  namespace: banking-crm
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "@monthly"
    - name: direction
      value: "input"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-cron-retention
  namespace: banking-crm
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "@weekly"
    - name: direction
      value: "input"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: crm-cron-analytics
  namespace: banking-crm
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "0 */6 * * *"
    - name: direction
      value: "input"
