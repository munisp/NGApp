{{- if .Values.permify.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escrow-platform.fullname" . }}-permify
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: permify
spec:
  replicas: {{ .Values.permify.replicaCount }}
  selector:
    matchLabels:
      {{- include "escrow-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: permify
  template:
    metadata:
      labels:
        {{- include "escrow-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: permify
    spec:
      containers:
        - name: permify
          image: "ghcr.io/permify/permify:{{ .Values.permify.image.tag | default "v0.7.0" }}"
          imagePullPolicy: {{ .Values.permify.image.pullPolicy | default "IfNotPresent" }}
          args:
            - serve
          ports:
            - name: grpc
              containerPort: 3476
              protocol: TCP
            - name: http
              containerPort: 3478
              protocol: TCP
          env:
            - name: PERMIFY_DATABASE_ENGINE
              value: "postgres"
            - name: PERMIFY_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "escrow-platform.fullname" . }}-secrets
                  key: database-url
            - name: PERMIFY_LOG_LEVEL
              value: "info"
          resources:
            {{- toYaml .Values.permify.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "escrow-platform.fullname" . }}-permify
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: permify
spec:
  type: ClusterIP
  ports:
    - port: 3476
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 3478
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "escrow-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: permify
{{- end }}
