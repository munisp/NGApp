{{- if .Values.api.pdb.enabled | default true }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "escrow-platform.fullname" . }}-api
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "escrow-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
---
