{{- if .Values.secrets.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "escrow-platform.fullname" . }}-secrets
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: {{ include "escrow-platform.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.keys }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .key }}
    {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "escrow-platform.fullname" . }}-secrets
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default "postgresql://escrow:escrow@localhost:5432/escrow" | quote }}
  database-username: {{ .Values.secrets.databaseUsername | default "escrow" | quote }}
  database-password: {{ .Values.secrets.databasePassword | default "escrow" | quote }}
  redis-password: {{ .Values.secrets.redisPassword | default "" | quote }}
  kafka-username: {{ .Values.secrets.kafkaUsername | default "" | quote }}
  kafka-password: {{ .Values.secrets.kafkaPassword | default "" | quote }}
  tigerbeetle-cluster-id: {{ .Values.secrets.tigerbeetleClusterId | default "0" | quote }}
  paystack-secret-key: {{ .Values.secrets.paystackSecretKey | default "" | quote }}
  flutterwave-secret-key: {{ .Values.secrets.flutterwaveSecretKey | default "" | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | default (randAlphaNum 64) | quote }}
  opensearch-username: {{ .Values.secrets.opensearchUsername | default "admin" | quote }}
  opensearch-password: {{ .Values.secrets.opensearchPassword | default "admin" | quote }}
  permify-api-key: {{ .Values.secrets.permifyApiKey | default "" | quote }}
{{- end }}
