{{- if .Values.rustServices.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escrow-platform.fullname" . }}-webhook-dispatcher
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-dispatcher
spec:
  replicas: {{ .Values.rustServices.webhookDispatcher.replicaCount }}
  selector:
    matchLabels:
      {{- include "escrow-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook-dispatcher
  template:
    metadata:
      labels:
        {{- include "escrow-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webhook-dispatcher
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "escrow-platform.fullname" . }}-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: webhook-dispatcher
          image: "{{ .Values.rustServices.image.repository }}/webhook-dispatcher:{{ .Values.rustServices.image.tag }}"
          imagePullPolicy: {{ .Values.rustServices.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.rustServices.logLevel | quote }}
            - name: ESCROW__HOST
              value: "0.0.0.0"
            - name: ESCROW__PORT
              value: "8080"
            - name: ESCROW__DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "escrow-platform.fullname" . }}-secrets
                  key: database-url
            - name: ESCROW__REDIS__URL
              value: "redis://{{ include "escrow-platform.fullname" . }}-redis:6379"
            - name: ESCROW__KAFKA__BOOTSTRAP_SERVERS
              value: {{ include "escrow-platform.kafka.bootstrapServers" . | quote }}
            - name: ESCROW__RUSTFS__ENDPOINT
              value: "http://{{ include "escrow-platform.fullname" . }}-rustfs:9000"
            - name: ESCROW__RUSTFS__ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "escrow-platform.fullname" . }}-rustfs-secret
                  key: access-key
            - name: ESCROW__RUSTFS__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "escrow-platform.fullname" . }}-rustfs-secret
                  key: secret-key
            - name: ESCROW__RUSTFS__REGION
              value: {{ .Values.rustfs.region | quote }}
            - name: ESCROW__RUSTFS__BUCKET
              value: "escrow-documents"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.rustServices.webhookDispatcher.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "escrow-platform.fullname" . }}-webhook-dispatcher
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-dispatcher
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "escrow-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-dispatcher
---
