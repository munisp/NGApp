{{- if .Values.temporal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escrow-platform.fullname" . }}-temporal
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  replicas: {{ .Values.temporal.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "escrow-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal
  template:
    metadata:
      labels:
        {{- include "escrow-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal
    spec:
      containers:
        - name: temporal
          image: "temporalio/auto-setup:{{ .Values.temporal.server.image.tag | default "1.22.0" }}"
          imagePullPolicy: {{ .Values.temporal.server.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "escrow-platform.fullname" . }}-secrets
                  key: database-username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "escrow-platform.fullname" . }}-secrets
                  key: database-password
            - name: POSTGRES_SEEDS
              value: "{{ include "escrow-platform.fullname" . }}-postgresql"
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: "/etc/temporal/config/dynamicconfig/development-sql.yaml"
          resources:
            {{- toYaml .Values.temporal.server.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "escrow-platform.fullname" . }}-temporal
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  type: ClusterIP
  ports:
    - port: 7233
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 8000
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "escrow-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
---
{{- if .Values.temporal.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escrow-platform.fullname" . }}-temporal-web
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-web
spec:
  replicas: {{ .Values.temporal.web.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "escrow-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-web
  template:
    metadata:
      labels:
        {{- include "escrow-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-web
    spec:
      containers:
        - name: temporal-web
          image: "temporalio/ui:{{ .Values.temporal.web.image.tag | default "2.21.0" }}"
          imagePullPolicy: {{ .Values.temporal.web.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TEMPORAL_ADDRESS
              value: "{{ include "escrow-platform.fullname" . }}-temporal:7233"
            - name: TEMPORAL_CORS_ORIGINS
              value: "http://localhost:3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "escrow-platform.fullname" . }}-temporal-web
  labels:
    {{- include "escrow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-web
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "escrow-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-web
{{- end }}
{{- end }}
