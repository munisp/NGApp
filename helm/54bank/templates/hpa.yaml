{{- range $name, $svc := .Values.services }}
{{- if ($.Values.serviceDefaults.autoscaling).enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $.Values.serviceDefaults.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.serviceDefaults.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.serviceDefaults.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
