[package]
name = "performance-gateway"
version = "0.1.0"
edition = "2021"
description = "High-performance API gateway with rate limiting, caching, and circuit breaking"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
