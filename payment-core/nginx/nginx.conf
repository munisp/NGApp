events {
    worker_connections 1024;
}

http {
    upstream payment_gateway {
        server payment-gateway:8001;
    }

    upstream fraud_detection_service {
        server fraud-detection-service:8002;
    }

    upstream settlement_service {
        server settlement-service:8003;
    }

    upstream offline_payments_service {
        server offline-payments-service:8004;
    }

    upstream fraud_detection {
        server fraud-detection:8005;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=fraud_limit:10m rate=100r/s;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Payment Gateway
        location /api/v1/payments/ {
            limit_req zone=payment_limit burst=20 nodelay;
            proxy_pass http://payment_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fraud Detection Service
        location /api/v1/fraud/ {
            limit_req zone=fraud_limit burst=200 nodelay;
            proxy_pass http://fraud_detection_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Settlement Service
        location /api/v1/settlement/ {
            limit_req zone=payment_limit burst=10 nodelay;
            proxy_pass http://settlement_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Offline Payments Service
        location /api/v1/offline/ {
            limit_req zone=payment_limit burst=20 nodelay;
            proxy_pass http://offline_payments_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
