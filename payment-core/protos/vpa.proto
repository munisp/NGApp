syntax = "proto3";

package vpa;

option go_package = "github.com/nextgen-payment-switch/protos/vpa";

// VPA Service for Virtual Payment Address management
service VPAService {
  // Create a new VPA
  rpc CreateVPA(CreateVPARequest) returns (CreateVPAResponse);
  
  // Resolve a VPA to account details
  rpc ResolveVPA(ResolveVPARequest) returns (ResolveVPAResponse);
  
  // List VPAs for an account
  rpc ListVPAs(ListVPAsRequest) returns (ListVPAsResponse);
  
  // Update VPA
  rpc UpdateVPA(UpdateVPARequest) returns (UpdateVPAResponse);
  
  // Delete VPA
  rpc DeleteVPA(DeleteVPARequest) returns (DeleteVPAResponse);
  
  // Check VPA availability
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  
  // Transfer VPA to another bank
  rpc TransferVPA(TransferVPARequest) returns (TransferVPAResponse);
}

message CreateVPARequest {
  string account_id = 1;
  string vpa_handle = 2;  // e.g., "john" in john@bank
  string bank_code = 3;    // e.g., "bank" in john@bank
  string display_name = 4;
  VPAType vpa_type = 5;
  map<string, string> metadata = 6;
}

message CreateVPAResponse {
  string vpa_id = 1;
  string full_vpa = 2;  // e.g., "john@bank"
  int64 created_at = 3;
  VPAStatus status = 4;
}

message ResolveVPARequest {
  string vpa = 1;  // Full VPA e.g., "john@bank"
  bool include_metadata = 2;
}

message ResolveVPAResponse {
  string vpa_id = 1;
  string account_id = 2;
  string bank_id = 3;
  string account_holder_name = 4;
  VPAType vpa_type = 5;
  VPAStatus status = 6;
  map<string, string> metadata = 7;
}

message ListVPAsRequest {
  string account_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListVPAsResponse {
  repeated VPAInfo vpas = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message VPAInfo {
  string vpa_id = 1;
  string full_vpa = 2;
  string display_name = 3;
  VPAType vpa_type = 4;
  VPAStatus status = 5;
  int64 created_at = 6;
  int64 last_used_at = 7;
}

message UpdateVPARequest {
  string vpa_id = 1;
  string display_name = 2;
  VPAStatus status = 3;
  map<string, string> metadata = 4;
}

message UpdateVPAResponse {
  bool success = 1;
  string message = 2;
}

message DeleteVPARequest {
  string vpa_id = 1;
  string reason = 2;
}

message DeleteVPAResponse {
  bool success = 1;
  string message = 2;
}

message CheckAvailabilityRequest {
  string vpa_handle = 1;
  string bank_code = 2;
}

message CheckAvailabilityResponse {
  bool available = 1;
  repeated string suggestions = 2;
}

message TransferVPARequest {
  string vpa_id = 1;
  string from_bank_id = 2;
  string to_bank_id = 3;
  string authorization_code = 4;
}

message TransferVPAResponse {
  bool success = 1;
  string new_vpa = 2;
  string message = 3;
}

enum VPAType {
  PERSONAL = 0;
  BUSINESS = 1;
  MERCHANT = 2;
  TEMPORARY = 3;
}

enum VPAStatus {
  ACTIVE = 0;
  INACTIVE = 1;
  SUSPENDED = 2;
  PENDING_VERIFICATION = 3;
}
