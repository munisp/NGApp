input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Extract service name from container name
  if [container][name] {
    grok {
      match => { "[container][name]" => "^/?%{DATA:service_name}$" }
    }
  }
  
  # Parse payment transaction logs
  if [service_name] == "payment-gateway" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}" }
    }
    
    if [transaction_id] {
      mutate {
        add_tag => [ "payment_transaction" ]
      }
    }
  }
  
  # Parse fraud detection logs
  if [service_name] == "fraud-detection-service" {
    if [fraud_score] {
      mutate {
        add_tag => [ "fraud_detection" ]
        convert => { "fraud_score" => "float" }
      }
    }
  }
  
  # Add geolocation for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "agent", "ecs", "input", "host" ]
  }
}

output {
  opensearch {
    hosts => ["https://opensearch:9200"]
    index => "payment-switch-logs-%{+YYYY.MM.dd}"
    user => "admin"
    password => "Admin@123"
    ssl_certificate_verification => false
  }
  
  # Output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
