# Next Generation Payment Switch - Helm Chart Values
# Production Configuration

global:
  environment: production
  region: us-east-1
  domain: payment-switch.example.com

# Infrastructure Components

kafka:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"
  persistence:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd
  config:
    replicationFactor: 3
    minInsyncReplicas: 2
    retentionHours: 168

tigerbeetle:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"
  persistence:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd
  cluster:
    id: 0

temporal:
  enabled: true
  server:
    replicas:
      frontend: 3
      history: 3
      matching: 3
      worker: 2
    resources:
      frontend:
        requests:
          memory: "2Gi"
          cpu: "1000m"
        limits:
          memory: "4Gi"
          cpu: "2000m"
      history:
        requests:
          memory: "4Gi"
          cpu: "2000m"
        limits:
          memory: "8Gi"
          cpu: "4000m"
  persistence:
    driver: postgres
    postgres:
      host: postgresql
      port: 5432
      database: temporal
      user: temporal

redis:
  enabled: true
  architecture: replication
  master:
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    persistence:
      enabled: true
      size: 20Gi
      storageClass: fast-ssd
  replica:
    replicaCount: 2
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

apisix:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  service:
    type: LoadBalancer
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: api.payment-switch.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: payment-switch-tls
        hosts:
          - api.payment-switch.example.com

# Application Services

paymentGateway:
  enabled: true
  replicas: 3
  image:
    repository: payment-switch/payment-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    TEMPORAL_HOST: temporal-frontend:7233
    REDIS_HOST: redis-master
    TIGERBEETLE_HOST: tigerbeetle

workflowOrchestrator:
  enabled: true
  replicas: 2
  image:
    repository: payment-switch/workflow-orchestrator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  env:
    TEMPORAL_HOST: temporal-frontend:7233

fraudDetection:
  enabled: true
  replicas: 3
  image:
    repository: payment-switch/fraud-detection
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  env:
    REDIS_HOST: redis-master

settlement:
  enabled: true
  replicas: 2
  image:
    repository: payment-switch/settlement
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  env:
    MOJALOOP_SETTLEMENT_URL: http://mojaloop-central-settlements:3007
    TIGERBEETLE_HOST: tigerbeetle

# Mojaloop Components

mojaloop:
  enabled: true
  apiAdapter:
    replicas: 3
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  centralLedger:
    replicas: 3
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  accountLookup:
    replicas: 2
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  quotingService:
    replicas: 2
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

# Security & Monitoring

wazuh:
  enabled: true
  manager:
    replicas: 1
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    persistence:
      enabled: true
      size: 50Gi

opencti:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

opensearch:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"
  persistence:
    enabled: true
    size: 100Gi
    storageClass: fast-ssd

prometheus:
  enabled: true
  server:
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    persistence:
      enabled: true
      size: 50Gi

grafana:
  enabled: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi

kubecost:
  enabled: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Data Platform (Lakehouse)

deltaLake:
  enabled: true
  storageClass: standard
  size: 500Gi

spark:
  enabled: true
  master:
    replicas: 1
    resources:
      requests:
        memory: "4Gi"
        cpu: "2000m"
      limits:
        memory: "8Gi"
        cpu: "4000m"
  worker:
    replicas: 3
    resources:
      requests:
        memory: "8Gi"
        cpu: "4000m"
      limits:
        memory: "16Gi"
        cpu: "8000m"

flink:
  enabled: true
  jobmanager:
    replicas: 1
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  taskmanager:
    replicas: 3
    resources:
      requests:
        memory: "4Gi"
        cpu: "2000m"
      limits:
        memory: "8Gi"
        cpu: "4000m"

# Dapr Configuration

dapr:
  enabled: true
  config:
    tracing:
      enabled: true
      samplingRate: "1"
    mtls:
      enabled: true
      workloadCertTTL: "24h"
