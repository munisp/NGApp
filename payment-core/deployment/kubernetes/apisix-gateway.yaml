---
# APISIX API Gateway - Kubernetes Deployment Manifest
# High-performance API Gateway with Openappsec security integration

apiVersion: v1
kind: Namespace
metadata:
  name: apisix
  labels:
    name: apisix

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: apisix
  labels:
    app: apisix
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      enable_ipv6: false
      enable_control: true
      enable_admin: true
      enable_admin_cors: true
      enable_debug: false
      enable_dev_mode: false
      enable_reuseport: true
      enable_server_tokens: false
      
      proxy_cache:
        cache_ttl: 10s
        zones:
          - name: disk_cache_one
            memory_size: 50m
            disk_size: 1G
            disk_path: /tmp/disk_cache_one
            cache_levels: 1:2
      
      router:
        http: radixtree_uri
        ssl: radixtree_sni
      
      stream_proxy:
        tcp:
          - addr: 9100
        udp:
          - addr: 9200
      
      dns_resolver:
        - 10.96.0.10
      
      dns_resolver_valid: 30
      resolver_timeout: 5
      
      ssl:
        enable: true
        listen:
          - port: 9443
            enable_http2: true
        ssl_protocols: TLSv1.2 TLSv1.3
        ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
        ssl_session_tickets: false
      
      allow_admin:
        - 0.0.0.0/0
      
      port_admin: 9180
      
      real_ip_header: X-Real-IP
      real_ip_from:
        - 0.0.0.0/0
        - ::/0
      
    nginx_config:
      error_log: /dev/stderr
      error_log_level: warn
      worker_processes: auto
      worker_rlimit_nofile: 20480
      worker_shutdown_timeout: 240s
      
      event:
        worker_connections: 10620
        use: epoll
      
      http:
        access_log: /dev/stdout
        keepalive_timeout: 60s
        client_header_timeout: 60s
        client_body_timeout: 60s
        send_timeout: 10s
        underscores_in_headers: on
        real_ip_header: X-Real-IP
        real_ip_from:
          - 0.0.0.0/0
          - ::/0
        real_ip_recursive: off
        
        upstream:
          keepalive: 320
          keepalive_requests: 1000
          keepalive_timeout: 60s
    
    etcd:
      host:
        - http://apisix-etcd:2379
      prefix: /apisix
      timeout: 30
      watch_timeout: 5
      startup_retry: 2
    
    plugins:
      - real-ip
      - client-control
      - proxy-rewrite
      - ext-plugin-pre-req
      - request-id
      - zipkin
      - prometheus
      - opentelemetry
      - jwt-auth
      - key-auth
      - basic-auth
      - authz-keycloak
      - wolf-rbac
      - openid-connect
      - hmac-auth
      - ip-restriction
      - ua-restriction
      - referer-restriction
      - csrf
      - uri-blocker
      - request-validation
      - openwhisk
      - serverless-pre-function
      - serverless-post-function
      - ext-plugin-post-req
      - ext-plugin-post-resp
      - limit-req
      - limit-conn
      - limit-count
      - proxy-cache
      - proxy-mirror
      - api-breaker
      - traffic-split
      - request-validation
      - cors
      - response-rewrite
      - grpc-transcode
      - grpc-web
      - fault-injection
      - mocking
      - degraphql
      - echo
      - http-logger
      - sls-logger
      - tcp-logger
      - kafka-logger
      - syslog
      - udp-logger
      - file-logger
      - loggly
      - datadog
      - rocketmq-logger
      - skywalking-logger
      - google-cloud-logging
      - splunk-hec-logging
      - redirect
      - forward-auth
      - opa
      - authz-casbin
      - wolf-rbac
      - ldap-auth
      - hmac-auth
      - consumer-restriction
    
    plugin_attr:
      prometheus:
        export_addr:
          ip: 0.0.0.0
          port: 9091
        export_uri: /apisix/prometheus/metrics
        metric_prefix: apisix_
      
      zipkin:
        endpoint: http://zipkin.monitoring:9411/api/v2/spans
        sample_ratio: 1
      
      opentelemetry:
        trace_id_source: x-request-id
        resource:
          service.name: APISIX
        collector:
          address: opentelemetry-collector.monitoring:4318
          request_timeout: 3
          request_headers:
            foo: bar
      
      request-id:
        header_name: X-Request-Id
        include_in_response: true
        algorithm: uuid

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-gw-config
  namespace: apisix
  labels:
    app: apisix
data:
  APISIX_STAND_ALONE: "false"
  APISIX_ENABLE_ADMIN: "true"
  APISIX_ADMIN_API_VERSION: "v3"
  APISIX_ENABLE_CONTROL: "true"
  APISIX_ENABLE_IPV6: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: apisix-secrets
  namespace: apisix
  labels:
    app: apisix
type: Opaque
stringData:
  APISIX_ADMIN_KEY: "edd1c9f034335f136f87ad84b625c8f1"
  APISIX_VIEWER_KEY: "4054f7cf07e344346cd3f287985e76a2"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apisix
  namespace: apisix
  labels:
    app: apisix

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apisix
  labels:
    app: apisix
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - pods
      - replicationcontrollers
      - replicationcontrollers/scale
      - serviceaccounts
      - services
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - bindings
      - events
      - limitranges
      - namespaces/status
      - pods/log
      - pods/status
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - controllerrevisions
      - daemonsets
      - deployments
      - deployments/scale
      - replicasets
      - replicasets/scale
      - statefulsets
      - statefulsets/scale
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apisix.apache.org
    resources:
      - apisixroutes
      - apisixupstreams
      - apisixtlses
      - apisixclusterconfigs
      - apisixconsumers
      - apisixpluginconfigs
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apisix
  labels:
    app: apisix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apisix
subjects:
  - kind: ServiceAccount
    name: apisix
    namespace: apisix

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: apisix
  labels:
    app: apisix
    version: v3.7.0
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
        version: v3.7.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/apisix/prometheus/metrics"
    spec:
      serviceAccountName: apisix
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: apisix
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: apisix
                topologyKey: topology.kubernetes.io/zone
      
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: apisix
      
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z apisix-etcd 2379; do
                echo "Waiting for etcd..."
                sleep 2
              done
              echo "etcd is ready"
      
      containers:
        - name: apisix
          image: apache/apisix:3.7.0-debian
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
            - name: https
              containerPort: 9443
              protocol: TCP
            - name: admin
              containerPort: 9180
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
            - name: control
              containerPort: 9092
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: apisix-gw-config
            - secretRef:
                name: apisix-secrets
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          livenessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /apisix/status
              port: 9080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          startupProbe:
            httpGet:
              path: /apisix/status
              port: 9080
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15
          
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: cache
              mountPath: /tmp
      
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
        - name: cache
          emptyDir: {}
      
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: apisix-gateway
  namespace: apisix
  labels:
    app: apisix
spec:
  type: LoadBalancer
  sessionAffinity: None
  selector:
    app: apisix
  ports:
    - name: http
      port: 80
      targetPort: 9080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 9443
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin
  namespace: apisix
  labels:
    app: apisix
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
    - name: admin
      port: 9180
      targetPort: 9180
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: apisix-metrics
  namespace: apisix
  labels:
    app: apisix
spec:
  type: ClusterIP
  selector:
    app: apisix
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apisix-hpa
  namespace: apisix
  labels:
    app: apisix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apisix
  minReplicas: 6
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 3
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-pdb
  namespace: apisix
  labels:
    app: apisix
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: apisix

---
# etcd for APISIX configuration storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-etcd
  namespace: apisix
  labels:
    app: apisix-etcd
spec:
  serviceName: apisix-etcd
  replicas: 3
  selector:
    matchLabels:
      app: apisix-etcd
  template:
    metadata:
      labels:
        app: apisix-etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.11
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_DATA_DIR
              value: /etcd-data
            - name: ETCD_LISTEN_CLIENT_URLS
              value: http://0.0.0.0:2379
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: http://$(ETCD_NAME).apisix-etcd:2379
            - name: ETCD_LISTEN_PEER_URLS
              value: http://0.0.0.0:2380
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://$(ETCD_NAME).apisix-etcd:2380
            - name: ETCD_INITIAL_CLUSTER
              value: apisix-etcd-0=http://apisix-etcd-0.apisix-etcd:2380,apisix-etcd-1=http://apisix-etcd-1.apisix-etcd:2380,apisix-etcd-2=http://apisix-etcd-2.apisix-etcd:2380
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: apisix-etcd-cluster
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: apisix
  labels:
    app: apisix-etcd
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: apisix-etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
