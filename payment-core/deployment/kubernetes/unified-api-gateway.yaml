---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unified-api-gateway-config
  namespace: payment-switch
data:
  PORT: "8080"
  LEDGER_SERVICE_ADDR: "ledger-service:50051"
  VPA_SERVICE_ADDR: "vpa-service:50052"
  FRAUD_DETECTION_ADDR: "fraud-detection-service:8000"
  BIOMETRIC_AUTH_ADDR: "biometric-auth:8001"
  OFFLINE_PAYMENTS_ADDR: "offline-payments:8003"
  INSTANT_SETTLEMENT_ADDR: "instant-settlement:8004"
  POS_GATEWAY_ADDR: "pos-gateway:8005"
  QR_PAYMENT_ADDR: "qr-payment:8006"
  ENABLE_RATE_LIMITING: "true"
  ENABLE_AUTHENTICATION: "true"
  ENABLE_FRAUD_DETECTION: "true"
  ENABLE_BIOMETRIC_AUTH: "true"
  MAX_REQUESTS_PER_MINUTE: "10000"
  REQUEST_TIMEOUT_SECONDS: "30"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-api-gateway
  namespace: payment-switch
  labels:
    app: unified-api-gateway
    component: api-gateway
spec:
  replicas: 10
  selector:
    matchLabels:
      app: unified-api-gateway
  template:
    metadata:
      labels:
        app: unified-api-gateway
        component: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: unified-api-gateway
        image: ghcr.io/payment-switch/unified-api-gateway:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: unified-api-gateway-config
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: unified-api-gateway
  namespace: payment-switch
  labels:
    app: unified-api-gateway
spec:
  type: LoadBalancer
  selector:
    app: unified-api-gateway
  ports:
  - port: 80
    targetPort: 8080
    name: http
  - port: 443
    targetPort: 8080
    name: https

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unified-api-gateway-hpa
  namespace: payment-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-api-gateway
  minReplicas: 10
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unified-api-gateway-ingress
  namespace: payment-switch
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.payment-switch.example.com
    secretName: api-gateway-tls
  rules:
  - host: api.payment-switch.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: unified-api-gateway
            port:
              number: 80
