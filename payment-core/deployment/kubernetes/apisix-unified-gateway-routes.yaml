---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-unified-gateway-config
  namespace: payment-switch
data:
  config.yaml: |
    # APISIX Configuration for Unified Gateway Integration
    apisix:
      node_listen: 9080
      enable_ipv6: false
      
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      
      admin:
        admin_key:
          - name: "admin"
            key: "${ADMIN_API_KEY}"
            role: admin
      
      etcd:
        host:
          - "http://apisix-etcd:2379"
        prefix: "/apisix"
        timeout: 30
    
    nginx_config:
      error_log: "/dev/stderr"
      error_log_level: "warn"
      
    plugin_attr:
      prometheus:
        export_addr:
          ip: "0.0.0.0"
          port: 9091

---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: unified-api-gateway-upstream
  namespace: payment-switch
spec:
  name: unified-api-gateway
  scheme: http
  loadbalancer:
    type: roundrobin
  healthCheck:
    active:
      type: http
      httpPath: /health
      healthy:
        interval: 2
        successes: 2
      unhealthy:
        interval: 1
        httpFailures: 2
  discovery:
    type: kubernetes
    serviceName: unified-api-gateway
    servicePort: 8080

---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: unified-gateway-vpa-routes
  namespace: payment-switch
spec:
  http:
  - name: vpa-create
    match:
      paths:
      - /api/v1/vpa/create
      methods:
      - POST
    backends:
    - serviceName: unified-api-gateway
      servicePort: 8080
    plugins:
    - name: request-id
      enable: true
    - name: jwt-auth
      enable: true
    - name: limit-req
      enable: true
      config:
        rate: 100
        burst: 200
        key: remote_addr
    - name: prometheus
      enable: true
    - name: opentelemetry
      enable: true
      config:
        sampler:
          name: always_on
  
  - name: vpa-resolve
    match:
      paths:
      - /api/v1/vpa/resolve/*
      methods:
      - GET
    backends:
    - serviceName: unified-api-gateway
      servicePort: 8080
    plugins:
    - name: request-id
      enable: true
    - name: jwt-auth
      enable: true
    - name: limit-req
      enable: true
      config:
        rate: 1000
        burst: 2000
        key: remote_addr
    - name: proxy-cache
      enable: true
      config:
        cache_ttl: 60
        cache_key:
        - "$uri"
    - name: prometheus
      enable: true

---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: unified-gateway-payment-routes
  namespace: payment-switch
spec:
  http:
  - name: payment-transfer
    match:
      paths:
      - /api/v1/payments/transfer
      methods:
      - POST
    backends:
    - serviceName: unified-api-gateway
      servicePort: 8080
    plugins:
    - name: request-id
      enable: true
    - name: jwt-auth
      enable: true
    - name: limit-req
      enable: true
      config:
        rate: 500
        burst: 1000
        key: consumer_name
    - name: request-validation
      enable: true
      config:
        body_schema:
          type: object
          required:
          - payer_vpa
          - payee_vpa
          - amount
          - currency
          properties:
            payer_vpa:
              type: string
            payee_vpa:
              type: string
            amount:
              type: number
              minimum: 0.01
            currency:
              type: string
              enum: ["NGN", "USD", "EUR", "GBP"]
    - name: prometheus
      enable: true
    - name: opentelemetry
      enable: true
  
  - name: qr-payment
    match:
      paths:
      - /api/v1/payments/qr
      methods:
      - POST
    backends:
    - serviceName: unified-api-gateway
      servicePort: 8080
    plugins:
    - name: request-id
      enable: true
    - name: jwt-auth
      enable: true
    - name: limit-req
      enable: true
      config:
        rate: 500
        burst: 1000
        key: consumer_name
    - name: prometheus
      enable: true
  
  - name: offline-payment
    match:
      paths:
      - /api/v1/payments/offline
      methods:
      - POST
    backends:
    - serviceName: unified-api-gateway
      servicePort: 8080
    plugins:
    - name: request-id
      enable: true
    - name: jwt-auth
      enable: true
    - name: limit-req
      enable: true
      config:
        rate: 200
        burst: 400
        key: consumer_name
    - name: prometheus
      enable: true
  
  - name: payment-status
    match:
      paths:
      - /api/v1/payments/*
      methods:
      - GET
    backends:
    - serviceName: unified-api-gateway
      servicePort: 8080
    plugins:
    - name: request-id
      enable: true
    - name: jwt-auth
      enable: true
    - name: limit-req
      enable: true
      config:
        rate: 2000
        burst: 4000
        key: consumer_name
    - name: proxy-cache
      enable: true
      config:
        cache_ttl: 30
    - name: prometheus
      enable: true

