---
apiVersion: v1
kind: ConfigMap
metadata:
  name: offline-payments-config
  namespace: payment-switch
data:
  REDIS_HOST: "redis-master.payment-switch.svc.cluster.local"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  MAX_OFFLINE_DURATION_HOURS: "24"
  MAX_SYNC_ATTEMPTS: "5"
  SYNC_BATCH_SIZE: "100"
  AUTO_SYNC_INTERVAL_SECONDS: "60"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offline-payments
  namespace: payment-switch
  labels:
    app: offline-payments
    component: payment-service
spec:
  replicas: 5
  selector:
    matchLabels:
      app: offline-payments
  template:
    metadata:
      labels:
        app: offline-payments
        component: payment-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "offline-payments"
        dapr.io/app-port: "8003"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
    spec:
      containers:
      - name: offline-payments
        image: ghcr.io/payment-switch/offline-payments:latest
        ports:
        - containerPort: 8003
        envFrom:
        - configMapRef:
            name: offline-payments-config
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: offline-payments
  namespace: payment-switch
spec:
  selector:
    app: offline-payments
  ports:
  - port: 8003
    targetPort: 8003

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: offline-payments-hpa
  namespace: payment-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: offline-payments
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
