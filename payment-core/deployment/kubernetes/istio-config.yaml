---
# Istio Service Mesh Configuration for Payment Switch
# Optimized for high availability and performance

# Install Istio with optimized configuration
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: payment-switch-istio
  namespace: istio-system
spec:
  profile: production
  
  # Hub and tag for Istio images
  hub: docker.io/istio
  tag: 1.20.0
  
  # Mesh configuration
  meshConfig:
    # Enable access logging
    accessLogFile: /dev/stdout
    accessLogEncoding: JSON
    
    # Default configuration for proxies
    defaultConfig:
      # Tracing configuration
      tracing:
        sampling: 1.0
        zipkin:
          address: zipkin.istio-system:9411
      
      # Concurrency for worker threads
      concurrency: 4
      
      # Connection pool settings
      connectionPool:
        tcp:
          maxConnections: 100000
          connectTimeout: 30s
        http:
          http1MaxPendingRequests: 100000
          http2MaxRequests: 100000
          maxRequestsPerConnection: 10
          maxRetries: 3
    
    # Enable locality load balancing
    localityLbSetting:
      enabled: true
      distribute:
        - from: us-east-1/*
          to:
            "us-east-1/*": 80
            "us-west-2/*": 15
            "eu-west-1/*": 5
    
    # Enable mTLS by default
    enableAutoMtls: true
    
  # Components configuration
  components:
    # Istiod (control plane)
    pilot:
      enabled: true
      k8s:
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        replicaCount: 3
        hpaSpec:
          minReplicas: 3
          maxReplicas: 10
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: istiod
                topologyKey: kubernetes.io/hostname
    
    # Ingress gateway
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          resources:
            requests:
              cpu: 2000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          replicaCount: 3
          hpaSpec:
            minReplicas: 3
            maxReplicas: 20
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 80
          service:
            type: LoadBalancer
            ports:
              - port: 80
                targetPort: 8080
                name: http2
              - port: 443
                targetPort: 8443
                name: https
              - port: 15021
                targetPort: 15021
                name: status-port
    
    # Egress gateway
    egressGateways:
      - name: istio-egressgateway
        enabled: true
        k8s:
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          replicaCount: 2
          hpaSpec:
            minReplicas: 2
            maxReplicas: 5

---
# PeerAuthentication - Enable strict mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: payment-switch
spec:
  mtls:
    mode: STRICT

---
# DestinationRule - Circuit breaker and connection pool settings for all services
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: payment-services-circuit-breaker
  namespace: payment-switch
spec:
  host: "*.payment-switch.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10000
        connectTimeout: 30s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 10000
        http2MaxRequests: 10000
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 300s
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true

---
# DestinationRule - TigerBeetle specific settings
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: tigerbeetle-destination
  namespace: payment-switch
spec:
  host: tigerbeetle.payment-switch.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50000
        connectTimeout: 10s
      http:
        http2MaxRequests: 50000
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
    loadBalancer:
      consistentHash:
        httpHeaderName: "x-account-id"

---
# DestinationRule - PostgreSQL specific settings
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: postgresql-destination
  namespace: payment-switch
spec:
  host: postgresql.payment-switch.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 5000
        connectTimeout: 5s
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
    loadBalancer:
      simple: ROUND_ROBIN

---
# VirtualService - Payment Gateway routing with retries and timeouts
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-gateway
  namespace: payment-switch
spec:
  hosts:
    - payment-gateway.payment-switch.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: "/payments"
      route:
        - destination:
            host: payment-gateway.payment-switch.svc.cluster.local
            port:
              number: 8000
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: 5xx,reset,connect-failure,refused-stream
      timeout: 10s
      fault:
        delay:
          percentage:
            value: 0.1
          fixedDelay: 5ms

---
# VirtualService - Fraud Detection routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fraud-detection
  namespace: payment-switch
spec:
  hosts:
    - fraud-detection.payment-switch.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: "/check"
      route:
        - destination:
            host: fraud-detection.payment-switch.svc.cluster.local
            port:
              number: 8001
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
      timeout: 5s

---
# ServiceEntry - External Mojaloop services
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: mojaloop-external
  namespace: payment-switch
spec:
  hosts:
    - mojaloop-central-ledger.mojaloop.svc.cluster.local
    - mojaloop-account-lookup.mojaloop.svc.cluster.local
  ports:
    - number: 3001
      name: http
      protocol: HTTP
  location: MESH_EXTERNAL
  resolution: DNS

---
# Gateway - Ingress gateway for external traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: payment-switch-gateway
  namespace: payment-switch
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "api.payment-switch.example.com"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "api.payment-switch.example.com"
      tls:
        mode: SIMPLE
        credentialName: payment-switch-tls-cert

---
# VirtualService - Ingress routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-switch-ingress
  namespace: payment-switch
spec:
  hosts:
    - "api.payment-switch.example.com"
  gateways:
    - payment-switch-gateway
  http:
    - match:
        - uri:
            prefix: "/api/v1/payments"
      route:
        - destination:
            host: payment-gateway.payment-switch.svc.cluster.local
            port:
              number: 8000
      corsPolicy:
        allowOrigins:
          - exact: "https://dashboard.payment-switch.example.com"
        allowMethods:
          - POST
          - GET
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
        maxAge: "24h"

---
# AuthorizationPolicy - RBAC for payment services
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: payment-gateway-authz
  namespace: payment-switch
spec:
  selector:
    matchLabels:
      app: payment-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/payment-switch/sa/api-gateway"]
      to:
        - operation:
            methods: ["POST", "GET"]
            paths: ["/payments/*"]

---
# RequestAuthentication - JWT validation
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: payment-gateway-jwt
  namespace: payment-switch
spec:
  selector:
    matchLabels:
      app: payment-gateway
  jwtRules:
    - issuer: "https://auth.payment-switch.example.com"
      jwksUri: "https://auth.payment-switch.example.com/.well-known/jwks.json"
      audiences:
        - "payment-switch-api"

---
# Telemetry - Custom metrics and logging
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: payment-switch-telemetry
  namespace: payment-switch
spec:
  metrics:
    - providers:
        - name: prometheus
      dimensions:
        transaction_type:
          value: request.headers["x-transaction-type"]
        currency:
          value: request.headers["x-currency"]
      overrides:
        - match:
            metric: REQUEST_COUNT
          tagOverrides:
            transaction_type:
              value: request.headers["x-transaction-type"]
  accessLogging:
    - providers:
        - name: envoy
      filter:
        expression: response.code >= 400
