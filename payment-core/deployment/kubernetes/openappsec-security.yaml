---
# Openappsec Security Integration for APISIX
# Provides WAF, API security, and threat prevention

apiVersion: v1
kind: Namespace
metadata:
  name: openappsec
  labels:
    name: openappsec

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openappsec-config
  namespace: openappsec
  labels:
    app: openappsec
data:
  local_policy.yaml: |
    apiVersion: v1beta2
    kind: Policy
    metadata:
      name: payment-switch-security-policy
    spec:
      mode: prevent-learn
      
      # Web Application Firewall settings
      webApplicationFirewall:
        enabled: true
        mode: prevent
        
        # OWASP Top 10 protection
        owaspTop10:
          enabled: true
          sqlInjection:
            enabled: true
            sensitivity: high
          xss:
            enabled: true
            sensitivity: high
          commandInjection:
            enabled: true
            sensitivity: high
          pathTraversal:
            enabled: true
            sensitivity: high
          remoteFileInclusion:
            enabled: true
            sensitivity: high
          xxe:
            enabled: true
            sensitivity: high
        
        # Custom rules
        customRules:
          - name: block-suspicious-user-agents
            pattern: "(bot|crawler|spider|scraper)"
            action: block
            severity: medium
          
          - name: rate-limit-exceeded
            pattern: "rate.*limit.*exceeded"
            action: block
            severity: high
          
          - name: block-admin-access
            pattern: "/admin/.*"
            action: block
            severity: critical
            exceptions:
              - sourceIP: "10.0.0.0/8"
      
      # API Security settings
      apiSecurity:
        enabled: true
        
        # Schema validation
        schemaValidation:
          enabled: true
          strictMode: true
          blockInvalidRequests: true
        
        # API discovery
        apiDiscovery:
          enabled: true
          autoLearn: true
        
        # JWT validation
        jwtValidation:
          enabled: true
          algorithms:
            - RS256
            - ES256
          requiredClaims:
            - sub
            - exp
            - iat
        
        # Rate limiting
        rateLimiting:
          enabled: true
          global:
            requestsPerSecond: 10000
            burstSize: 20000
          perClient:
            requestsPerSecond: 1000
            burstSize: 2000
          perEndpoint:
            - path: "/api/v1/payments/process"
              requestsPerSecond: 5000
              burstSize: 10000
            - path: "/api/v1/payments/status/*"
              requestsPerSecond: 8000
              burstSize: 16000
      
      # Threat prevention
      threatPrevention:
        enabled: true
        
        # Bot protection
        botProtection:
          enabled: true
          blockMaliciousBots: true
          challengeSuspiciousBots: true
          allowGoodBots: true
        
        # DDoS protection
        ddosProtection:
          enabled: true
          threshold:
            requestsPerSecond: 50000
            connectionsPerSecond: 10000
          action: challenge
        
        # IP reputation
        ipReputation:
          enabled: true
          blockMaliciousIPs: true
          blockTorExitNodes: true
          blockProxies: false
        
        # Geo-blocking
        geoBlocking:
          enabled: true
          mode: allowlist
          allowedCountries:
            - US
            - CA
            - GB
            - DE
            - FR
            - JP
            - AU
          blockedCountries:
            - KP
            - IR
            - SY
      
      # Data protection
      dataProtection:
        enabled: true
        
        # PII detection
        piiDetection:
          enabled: true
          blockPIIInLogs: true
          maskPIIInResponses: true
          patterns:
            - creditCard
            - ssn
            - email
            - phoneNumber
        
        # Sensitive data masking
        sensitiveDataMasking:
          enabled: true
          fields:
            - password
            - apiKey
            - token
            - secret
            - creditCard
            - cvv
            - pin
      
      # Compliance
      compliance:
        enabled: true
        standards:
          - PCI-DSS
          - GDPR
          - SOC2
        
        # Audit logging
        auditLogging:
          enabled: true
          logLevel: info
          includeRequestBody: true
          includeResponseBody: false
          sensitiveFieldsMasking: true
      
      # Incident response
      incidentResponse:
        enabled: true
        
        # Alert thresholds
        alertThresholds:
          critical: 10
          high: 50
          medium: 100
        
        # Notification channels
        notifications:
          - type: webhook
            url: http://alertmanager.monitoring:9093/api/v1/alerts
          - type: email
            recipients:
              - security@payment-switch.com
          - type: slack
            webhookUrl: https://hooks.slack.com/services/YOUR/WEBHOOK/URL

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openappsec-agent-config
  namespace: openappsec
  labels:
    app: openappsec
data:
  agent.conf: |
    {
      "agent": {
        "mode": "inline",
        "log_level": "info",
        "threads": 4,
        "connection_timeout": 30,
        "request_timeout": 60
      },
      "enforcement": {
        "mode": "prevent",
        "block_page": {
          "enabled": true,
          "template": "default",
          "custom_message": "Your request has been blocked by security policy."
        }
      },
      "learning": {
        "enabled": true,
        "duration_days": 7,
        "min_samples": 1000
      },
      "telemetry": {
        "enabled": true,
        "endpoint": "http://openappsec-management:8080/telemetry",
        "interval_seconds": 60
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openappsec-agent
  namespace: openappsec
  labels:
    app: openappsec-agent
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: openappsec-agent
  template:
    metadata:
      labels:
        app: openappsec-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: openappsec
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: openappsec-agent
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: openappsec-agent
          image: ghcr.io/openappsec/agent:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          env:
            - name: AGENT_MODE
              value: "inline"
            - name: POLICY_FILE
              value: "/etc/openappsec/local_policy.yaml"
            - name: AGENT_CONFIG_FILE
              value: "/etc/openappsec/agent.conf"
            - name: LOG_LEVEL
              value: "info"
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          volumeMounts:
            - name: policy
              mountPath: /etc/openappsec/local_policy.yaml
              subPath: local_policy.yaml
            - name: agent-config
              mountPath: /etc/openappsec/agent.conf
              subPath: agent.conf
            - name: logs
              mountPath: /var/log/openappsec
      
      volumes:
        - name: policy
          configMap:
            name: openappsec-config
        - name: agent-config
          configMap:
            name: openappsec-agent-config
        - name: logs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: openappsec-agent
  namespace: openappsec
  labels:
    app: openappsec-agent
spec:
  type: ClusterIP
  selector:
    app: openappsec-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openappsec
  namespace: openappsec
  labels:
    app: openappsec

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openappsec-management
  namespace: openappsec
  labels:
    app: openappsec-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openappsec-management
  template:
    metadata:
      labels:
        app: openappsec-management
    spec:
      serviceAccountName: openappsec
      
      containers:
        - name: management
          image: ghcr.io/openappsec/management:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9000
              protocol: TCP
          
          env:
            - name: DATABASE_URL
              value: "postgresql://openappsec:password@postgresql.openappsec:5432/openappsec"
            - name: LOG_LEVEL
              value: "info"
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: openappsec-management
  namespace: openappsec
  labels:
    app: openappsec-management
spec:
  type: ClusterIP
  selector:
    app: openappsec-management
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9000
      targetPort: 9000
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openappsec-agent-hpa
  namespace: openappsec
  labels:
    app: openappsec-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openappsec-agent
  minReplicas: 6
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openappsec-agent-pdb
  namespace: openappsec
  labels:
    app: openappsec-agent
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: openappsec-agent

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openappsec-network-policy
  namespace: openappsec
  labels:
    app: openappsec
spec:
  podSelector:
    matchLabels:
      app: openappsec-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from APISIX
    - from:
        - namespaceSelector:
            matchLabels:
              name: apisix
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8080
    # Allow metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow traffic to management
    - to:
        - podSelector:
            matchLabels:
              app: openappsec-management
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow external threat intelligence
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
