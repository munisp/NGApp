---
# ExternalSecrets Configuration for Mojaloop
# Integrates with HashiCorp Vault or AWS Secrets Manager for secure credential management
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: mojaloop-secret-store
  namespace: payment-switch
spec:
  provider:
    # Option 1: HashiCorp Vault
    vault:
      server: "https://vault.payment-switch.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "mojaloop-role"
          serviceAccountRef:
            name: "mojaloop-sa"
    # Option 2: AWS Secrets Manager (uncomment to use)
    # aws:
    #   service: SecretsManager
    #   region: us-east-1
    #   auth:
    #     jwt:
    #       serviceAccountRef:
    #         name: mojaloop-sa
---
# PostgreSQL Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mojaloop-secret-store
    kind: SecretStore
  target:
    name: postgres-ha-credentials
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: mojaloop/postgres
        property: postgres-password
    - secretKey: replication-password
      remoteRef:
        key: mojaloop/postgres
        property: replication-password
    - secretKey: mojaloop-password
      remoteRef:
        key: mojaloop/postgres
        property: mojaloop-password
    - secretKey: replication-user
      remoteRef:
        key: mojaloop/postgres
        property: replication-user
    - secretKey: mojaloop-user
      remoteRef:
        key: mojaloop/postgres
        property: mojaloop-user
---
# Mojaloop Database Connection Strings
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mojaloop-db-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mojaloop-secret-store
    kind: SecretStore
  target:
    name: mojaloop-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: central-ledger-uri
      remoteRef:
        key: mojaloop/database
        property: central-ledger-uri
    - secretKey: account-lookup-uri
      remoteRef:
        key: mojaloop/database
        property: account-lookup-uri
    - secretKey: quoting-uri
      remoteRef:
        key: mojaloop/database
        property: quoting-uri
    - secretKey: central-settlements-uri
      remoteRef:
        key: mojaloop/database
        property: central-settlements-uri
---
# Kafka Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mojaloop-secret-store
    kind: SecretStore
  target:
    name: kafka-credentials
    creationPolicy: Owner
  data:
    - secretKey: bootstrap-servers
      remoteRef:
        key: mojaloop/kafka
        property: bootstrap-servers
    - secretKey: sasl-username
      remoteRef:
        key: mojaloop/kafka
        property: sasl-username
    - secretKey: sasl-password
      remoteRef:
        key: mojaloop/kafka
        property: sasl-password
    - secretKey: ssl-truststore-password
      remoteRef:
        key: mojaloop/kafka
        property: ssl-truststore-password
---
# ILP Secret Key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ilp-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mojaloop-secret-store
    kind: SecretStore
  target:
    name: ilp-credentials
    creationPolicy: Owner
  data:
    - secretKey: ilp-secret-key
      remoteRef:
        key: mojaloop/ilp
        property: secret-key
---
# TigerBeetle Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tigerbeetle-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mojaloop-secret-store
    kind: SecretStore
  target:
    name: tigerbeetle-credentials
    creationPolicy: Owner
  data:
    - secretKey: cluster-id
      remoteRef:
        key: mojaloop/tigerbeetle
        property: cluster-id
    - secretKey: addresses
      remoteRef:
        key: mojaloop/tigerbeetle
        property: addresses
---
# Central Settlements API Keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: central-settlements-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mojaloop-secret-store
    kind: SecretStore
  target:
    name: central-settlements-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: mojaloop/central-settlements
        property: api-key
    - secretKey: admin-key
      remoteRef:
        key: mojaloop/central-settlements
        property: admin-key
---
# Service Account for Mojaloop
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mojaloop-sa
  namespace: payment-switch
  annotations:
    # For AWS IRSA
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/mojaloop-secrets-role
---
# RBAC for ExternalSecrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-role
  namespace: payment-switch
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-binding
  namespace: payment-switch
subjects:
  - kind: ServiceAccount
    name: mojaloop-sa
    namespace: payment-switch
roleRef:
  kind: Role
  name: external-secrets-role
  apiGroup: rbac.authorization.k8s.io
---
# Vault Policy (for reference - apply in Vault)
# path "secret/data/mojaloop/*" {
#   capabilities = ["read"]
# }
#
# Vault Kubernetes Auth Role (for reference - apply in Vault)
# vault write auth/kubernetes/role/mojaloop-role \
#   bound_service_account_names=mojaloop-sa \
#   bound_service_account_namespaces=payment-switch \
#   policies=mojaloop-policy \
#   ttl=1h
