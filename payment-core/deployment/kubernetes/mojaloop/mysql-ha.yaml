---
# MySQL High Availability Configuration for Mojaloop
# Uses MySQL InnoDB Cluster with Group Replication for HA
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-ha-config
  namespace: payment-switch
data:
  my.cnf: |
    [mysqld]
    # InnoDB Cluster / Group Replication Settings
    server-id=1
    gtid_mode=ON
    enforce_gtid_consistency=ON
    binlog_checksum=NONE
    log_bin=mysql-bin
    log_slave_updates=ON
    binlog_format=ROW
    master_info_repository=TABLE
    relay_log_info_repository=TABLE
    transaction_write_set_extraction=XXHASH64
    
    # Group Replication Settings
    plugin_load_add='group_replication.so'
    group_replication_group_name="aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    group_replication_start_on_boot=OFF
    group_replication_local_address="HOSTNAME:33061"
    group_replication_group_seeds="mysql-ha-0.mysql-ha-headless.payment-switch.svc.cluster.local:33061,mysql-ha-1.mysql-ha-headless.payment-switch.svc.cluster.local:33061,mysql-ha-2.mysql-ha-headless.payment-switch.svc.cluster.local:33061"
    group_replication_bootstrap_group=OFF
    group_replication_single_primary_mode=ON
    group_replication_enforce_update_everywhere_checks=OFF
    
    # Performance Settings
    innodb_buffer_pool_size=1G
    innodb_log_file_size=256M
    innodb_flush_log_at_trx_commit=1
    sync_binlog=1
    
    # Connection Settings
    max_connections=500
    wait_timeout=28800
    interactive_timeout=28800
    
    # Character Set
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-ha-credentials
  namespace: payment-switch
  annotations:
    external-secrets.io/managed: "true"
type: Opaque
stringData:
  # These should be injected from Vault/AWS Secrets Manager in production
  root-password: "${MYSQL_ROOT_PASSWORD}"
  replication-user: "repl_user"
  replication-password: "${MYSQL_REPLICATION_PASSWORD}"
  mojaloop-user: "mojaloop"
  mojaloop-password: "${MYSQL_MOJALOOP_PASSWORD}"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-ha
  namespace: payment-switch
  labels:
    app: mysql-ha
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: mysql-ha
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-ha-headless
  namespace: payment-switch
  labels:
    app: mysql-ha
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: group-replication
      port: 33061
      targetPort: 33061
  selector:
    app: mysql-ha
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-ha-read
  namespace: payment-switch
  labels:
    app: mysql-ha
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: mysql-ha
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-ha
  namespace: payment-switch
spec:
  serviceName: mysql-ha-headless
  replicas: 3
  selector:
    matchLabels:
      app: mysql-ha
  template:
    metadata:
      labels:
        app: mysql-ha
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-mysql
          image: mysql:8.0
          command:
            - bash
            - "-c"
            - |
              set -ex
              # Generate server-id from pod ordinal
              [[ `hostname` =~ -([0-9]+)$ ]] || exit 1
              ordinal=${BASH_REMATCH[1]}
              echo "[mysqld]" > /mnt/conf.d/server-id.cnf
              echo "server-id=$((100 + $ordinal))" >> /mnt/conf.d/server-id.cnf
              # Set local address for group replication
              echo "group_replication_local_address=\"$(hostname).mysql-ha-headless.payment-switch.svc.cluster.local:33061\"" >> /mnt/conf.d/server-id.cnf
              # Copy base config
              cp /mnt/config-map/my.cnf /mnt/conf.d/
          volumeMounts:
            - name: conf
              mountPath: /mnt/conf.d
            - name: config-map
              mountPath: /mnt/config-map
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-ha-credentials
                  key: root-password
            - name: MYSQL_REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-ha-credentials
                  key: replication-user
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-ha-credentials
                  key: replication-password
          ports:
            - name: mysql
              containerPort: 3306
            - name: group-repl
              containerPort: 33061
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: conf
              mountPath: /etc/mysql/conf.d
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - bash
                - "-c"
                - |
                  mysql -h localhost -u root -p$MYSQL_ROOT_PASSWORD -e "SELECT 1" && \
                  mysql -h localhost -u root -p$MYSQL_ROOT_PASSWORD -e "SELECT MEMBER_STATE FROM performance_schema.replication_group_members WHERE MEMBER_HOST = @@hostname" | grep -q ONLINE
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
        - name: mysql-router
          image: mysql/mysql-router:8.0
          env:
            - name: MYSQL_HOST
              value: "localhost"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "root"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-ha-credentials
                  key: root-password
          ports:
            - name: router-rw
              containerPort: 6446
            - name: router-ro
              containerPort: 6447
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: conf
          emptyDir: {}
        - name: config-map
          configMap:
            name: mysql-ha-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mysql-ha-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mysql-ha
---
# MySQL Router Service for read/write splitting
apiVersion: v1
kind: Service
metadata:
  name: mysql-router
  namespace: payment-switch
  labels:
    app: mysql-ha
spec:
  type: ClusterIP
  ports:
    - name: mysql-rw
      port: 6446
      targetPort: 6446
    - name: mysql-ro
      port: 6447
      targetPort: 6447
  selector:
    app: mysql-ha
---
# Mojaloop Database Initialization Job
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-ha-init-mojaloop
  namespace: payment-switch
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mysql:8.0
          command:
            - bash
            - "-c"
            - |
              set -ex
              # Wait for MySQL to be ready
              until mysql -h mysql-ha -u root -p$MYSQL_ROOT_PASSWORD -e "SELECT 1"; do
                echo "Waiting for MySQL..."
                sleep 5
              done
              
              # Create Mojaloop databases
              mysql -h mysql-ha -u root -p$MYSQL_ROOT_PASSWORD <<EOF
              CREATE DATABASE IF NOT EXISTS central_ledger;
              CREATE DATABASE IF NOT EXISTS account_lookup;
              CREATE DATABASE IF NOT EXISTS quoting;
              CREATE DATABASE IF NOT EXISTS central_settlements;
              
              CREATE USER IF NOT EXISTS 'mojaloop'@'%' IDENTIFIED BY '$MYSQL_MOJALOOP_PASSWORD';
              GRANT ALL PRIVILEGES ON central_ledger.* TO 'mojaloop'@'%';
              GRANT ALL PRIVILEGES ON account_lookup.* TO 'mojaloop'@'%';
              GRANT ALL PRIVILEGES ON quoting.* TO 'mojaloop'@'%';
              GRANT ALL PRIVILEGES ON central_settlements.* TO 'mojaloop'@'%';
              FLUSH PRIVILEGES;
              EOF
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-ha-credentials
                  key: root-password
            - name: MYSQL_MOJALOOP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-ha-credentials
                  key: mojaloop-password
