apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-go-service
  namespace: payment-switch
  labels:
    app: mojaloop-go-service
    component: mojaloop
    language: go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mojaloop-go-service
  template:
    metadata:
      labels:
        app: mojaloop-go-service
        component: mojaloop
        language: go
    spec:
      serviceAccountName: mojaloop-service-account
      containers:
        - name: mojaloop-go-service
          image: payment-switch/mojaloop-go-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: TIGERBEETLE_HOST
              value: "tigerbeetle.payment-switch.svc.cluster.local"
            - name: TIGERBEETLE_PORT
              value: "3000"
            - name: MOJALOOP_CENTRAL_LEDGER_URL
              value: "http://mojaloop-central-ledger.payment-switch.svc.cluster.local:3001"
            - name: ILP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mojaloop-secrets
                  key: ilp-secret-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mojaloop-go-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-go-service
  namespace: payment-switch
  labels:
    app: mojaloop-go-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: mojaloop-go-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mojaloop-go-service-hpa
  namespace: payment-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mojaloop-go-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mojaloop-go-service-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mojaloop-go-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mojaloop-service-account
  namespace: payment-switch
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mojaloop-go-service-network-policy
  namespace: payment-switch
spec:
  podSelector:
    matchLabels:
      app: mojaloop-go-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: payment-switch
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: payment-switch
      ports:
        - protocol: TCP
          port: 3000  # TigerBeetle
        - protocol: TCP
          port: 3001  # Mojaloop Central Ledger
        - protocol: TCP
          port: 9092  # Kafka
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53  # DNS
