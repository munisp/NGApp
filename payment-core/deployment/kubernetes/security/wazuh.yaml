---
# Wazuh Security Monitoring Stack
# SIEM, log analysis, file integrity monitoring, and vulnerability detection

apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    name: security

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh
  namespace: security
  labels:
    app: wazuh

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wazuh
  labels:
    app: wazuh
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - services
      - endpoints
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wazuh
  labels:
    app: wazuh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wazuh
subjects:
  - kind: ServiceAccount
    name: wazuh
    namespace: security

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-config
  namespace: security
  labels:
    app: wazuh
    component: manager
data:
  ossec.conf: |
    <ossec_config>
      <global>
        <jsonout_output>yes</jsonout_output>
        <alerts_log>yes</alerts_log>
        <logall>no</logall>
        <logall_json>no</logall_json>
        <email_notification>no</email_notification>
        <smtp_server>smtp.example.com</smtp_server>
        <email_from>wazuh@example.com</email_from>
        <email_to>security@example.com</email_to>
        <email_maxperhour>12</email_maxperhour>
        <email_log_source>alerts.log</email_log_source>
      </global>

      <alerts>
        <log_alert_level>3</log_alert_level>
        <email_alert_level>12</email_alert_level>
      </alerts>

      <remote>
        <connection>secure</connection>
        <port>1514</port>
        <protocol>tcp</protocol>
        <queue_size>131072</queue_size>
      </remote>

      <ruleset>
        <decoder_dir>ruleset/decoders</decoder_dir>
        <rule_dir>ruleset/rules</rule_dir>
        <rule_exclude>0215-policy_rules.xml</rule_exclude>
        <list>etc/lists/audit-keys</list>
        <list>etc/lists/amazon/aws-eventnames</list>
        <list>etc/lists/security-eventchannel</list>
      </ruleset>

      <auth>
        <disabled>no</disabled>
        <port>1515</port>
        <use_source_ip>no</use_source_ip>
        <force_insert>yes</force_insert>
        <force_time>0</force_time>
        <purge>yes</purge>
        <use_password>no</use_password>
        <limit_maxagents>yes</limit_maxagents>
        <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
        <ssl_agent_ca></ssl_agent_ca>
        <ssl_verify_host>no</ssl_verify_host>
        <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
        <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
        <ssl_auto_negotiate>no</ssl_auto_negotiate>
      </auth>

      <cluster>
        <name>wazuh</name>
        <node_name>wazuh-manager</node_name>
        <node_type>master</node_type>
        <key>c98b62a9b6169ac5f67dde8b3674b90e</key>
        <port>1516</port>
        <bind_addr>0.0.0.0</bind_addr>
        <nodes>
          <node>wazuh-manager-0.wazuh-manager.security.svc.cluster.local</node>
        </nodes>
        <hidden>no</hidden>
        <disabled>no</disabled>
      </cluster>

      <vulnerability-detector>
        <enabled>yes</enabled>
        <interval>5m</interval>
        <min_full_scan_interval>6h</min_full_scan_interval>
        <run_on_start>yes</run_on_start>
        
        <provider name="canonical">
          <enabled>yes</enabled>
          <os>trusty</os>
          <os>xenial</os>
          <os>bionic</os>
          <os>focal</os>
          <update_interval>1h</update_interval>
        </provider>
        
        <provider name="debian">
          <enabled>yes</enabled>
          <os>wheezy</os>
          <os>stretch</os>
          <os>jessie</os>
          <os>buster</os>
          <update_interval>1h</update_interval>
        </provider>
        
        <provider name="redhat">
          <enabled>yes</enabled>
          <os>5</os>
          <os>6</os>
          <os>7</os>
          <os>8</os>
          <update_interval>1h</update_interval>
        </provider>
      </vulnerability-detector>

      <sca>
        <enabled>yes</enabled>
        <scan_on_start>yes</scan_on_start>
        <interval>12h</interval>
        <skip_nfs>yes</skip_nfs>
      </sca>
    </ossec_config>

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: security
  labels:
    app: wazuh
    component: manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh
      component: manager
  template:
    metadata:
      labels:
        app: wazuh
        component: manager
    spec:
      serviceAccountName: wazuh
      
      securityContext:
        runAsUser: 0
        fsGroup: 0
      
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.7.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: registration
              containerPort: 1515
            - name: cluster
              containerPort: 1516
            - name: api
              containerPort: 55000
          
          env:
            - name: INDEXER_URL
              value: "https://wazuh-indexer:9200"
            - name: INDEXER_USERNAME
              value: "admin"
            - name: INDEXER_PASSWORD
              value: "SecretPassword"
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: "none"
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: ""
            - name: SSL_CERTIFICATE
              value: ""
            - name: SSL_KEY
              value: ""
          
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          livenessProbe:
            exec:
              command:
                - /var/ossec/bin/wazuh-control
                - status
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            exec:
              command:
                - /var/ossec/bin/wazuh-control
                - status
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          volumeMounts:
            - name: config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
            - name: data
              mountPath: /var/ossec/data
            - name: logs
              mountPath: /var/ossec/logs
      
      volumes:
        - name: config
          configMap:
            name: wazuh-manager-config
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: security
  labels:
    app: wazuh
    component: manager
spec:
  type: ClusterIP
  selector:
    app: wazuh
    component: manager
  ports:
    - name: registration
      port: 1515
      targetPort: 1515
    - name: cluster
      port: 1516
      targetPort: 1516
    - name: api
      port: 55000
      targetPort: 55000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-agent-config
  namespace: security
  labels:
    app: wazuh
    component: agent
data:
  ossec.conf: |
    <ossec_config>
      <client>
        <server>
          <address>wazuh-manager.security.svc.cluster.local</address>
          <port>1514</port>
          <protocol>tcp</protocol>
        </server>
        <config-profile>ubuntu, ubuntu20, ubuntu20.04</config-profile>
        <notify_time>10</notify_time>
        <time-reconnect>60</time-reconnect>
        <auto_restart>yes</auto_restart>
        <crypto_method>aes</crypto_method>
      </client>

      <client_buffer>
        <disabled>no</disabled>
        <queue_size>5000</queue_size>
        <events_per_second>500</events_per_second>
      </client_buffer>

      <logging>
        <log_format>plain</log_format>
      </logging>

      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/syslog</location>
      </localfile>

      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/auth.log</location>
      </localfile>

      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/kern.log</location>
      </localfile>

      <localfile>
        <log_format>audit</log_format>
        <location>/var/log/audit/audit.log</location>
      </localfile>

      <syscheck>
        <disabled>no</disabled>
        <frequency>43200</frequency>
        <scan_on_start>yes</scan_on_start>
        <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
        <directories check_all="yes">/bin,/sbin,/boot</directories>
        <ignore>/etc/mtab</ignore>
        <ignore>/etc/hosts.deny</ignore>
        <ignore>/etc/mail/statistics</ignore>
        <ignore>/etc/random-seed</ignore>
        <ignore>/etc/random.seed</ignore>
        <ignore>/etc/adjtime</ignore>
        <ignore>/etc/httpd/logs</ignore>
        <ignore>/etc/utmpx</ignore>
        <ignore>/etc/wtmpx</ignore>
        <ignore>/etc/cups/certs</ignore>
        <ignore>/etc/dumpdates</ignore>
        <ignore>/etc/svc/volatile</ignore>
      </syscheck>

      <rootcheck>
        <disabled>no</disabled>
        <check_files>yes</check_files>
        <check_trojans>yes</check_trojans>
        <check_dev>yes</check_dev>
        <check_sys>yes</check_sys>
        <check_pids>yes</check_pids>
        <check_ports>yes</check_ports>
        <check_if>yes</check_if>
        <frequency>43200</frequency>
        <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
        <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
        <skip_nfs>yes</skip_nfs>
      </rootcheck>

      <wodle name="open-scap">
        <disabled>yes</disabled>
        <timeout>1800</timeout>
        <interval>1d</interval>
        <scan-on-start>yes</scan-on-start>
      </wodle>

      <wodle name="cis-cat">
        <disabled>yes</disabled>
        <timeout>1800</timeout>
        <interval>1d</interval>
        <scan-on-start>yes</scan-on-start>
      </wodle>

      <wodle name="osquery">
        <disabled>yes</disabled>
        <run_daemon>yes</run_daemon>
        <log_path>/var/log/osquery/osqueryd.results.log</log_path>
        <config_path>/etc/osquery/osquery.conf</config_path>
        <add_labels>yes</add_labels>
      </wodle>

      <wodle name="syscollector">
        <disabled>no</disabled>
        <interval>1h</interval>
        <scan_on_start>yes</scan_on_start>
        <hardware>yes</hardware>
        <os>yes</os>
        <network>yes</network>
        <packages>yes</packages>
        <ports all="no">yes</ports>
        <processes>yes</processes>
      </wodle>

      <sca>
        <enabled>yes</enabled>
        <scan_on_start>yes</scan_on_start>
        <interval>12h</interval>
        <skip_nfs>yes</skip_nfs>
      </sca>
    </ossec_config>

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: security
  labels:
    app: wazuh
    component: agent
spec:
  selector:
    matchLabels:
      app: wazuh
      component: agent
  template:
    metadata:
      labels:
        app: wazuh
        component: agent
    spec:
      serviceAccountName: wazuh
      hostNetwork: true
      hostPID: true
      
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
      
      containers:
        - name: wazuh-agent
          image: wazuh/wazuh-agent:4.7.0
          imagePullPolicy: IfNotPresent
          
          securityContext:
            privileged: true
          
          env:
            - name: WAZUH_MANAGER
              value: "wazuh-manager.security.svc.cluster.local"
            - name: WAZUH_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          
          volumeMounts:
            - name: config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
      
      volumes:
        - name: config
          configMap:
            name: wazuh-agent-config
        - name: host-root
          hostPath:
            path: /
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-run
          hostPath:
            path: /var/run

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-agent
  namespace: security
  labels:
    app: wazuh
    component: agent
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: wazuh
    component: agent
