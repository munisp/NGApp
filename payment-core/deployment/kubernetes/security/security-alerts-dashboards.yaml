---
# Security-Focused Alerting Rules and Grafana Dashboards

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-security-rules
  namespace: monitoring
  labels:
    app: prometheus
data:
  security-alerts.yml: |
    groups:
      - name: wazuh_security_alerts
        interval: 30s
        rules:
          - alert: WazuhAgentDisconnected
            expr: wazuh_agents_disconnected > 5
            for: 5m
            labels:
              severity: warning
              component: wazuh
              category: security
            annotations:
              summary: "Multiple Wazuh agents disconnected"
              description: "{{ $value }} Wazuh agents are disconnected"
          
          - alert: WazuhHighAlertRate
            expr: rate(wazuh_alerts_total[5m]) > 100
            for: 5m
            labels:
              severity: warning
              component: wazuh
              category: security
            annotations:
              summary: "High rate of Wazuh alerts"
              description: "Alert rate is {{ $value }} per second"
          
          - alert: WazuhVulnerabilitiesDetected
            expr: wazuh_vulnerabilities_total > 50
            for: 10m
            labels:
              severity: critical
              component: wazuh
              category: security
            annotations:
              summary: "High number of vulnerabilities detected"
              description: "{{ $value }} vulnerabilities detected across the infrastructure"
          
          - alert: WazuhManagerDown
            expr: up{job="wazuh-exporter"} == 0
            for: 5m
            labels:
              severity: critical
              component: wazuh
              category: security
            annotations:
              summary: "Wazuh manager is down"
              description: "Wazuh manager has been down for more than 5 minutes"
      
      - name: opencti_security_alerts
        interval: 60s
        rules:
          - alert: OpenCTIHighThreatActivity
            expr: rate(opencti_indicators_total[1h]) > 100
            for: 10m
            labels:
              severity: warning
              component: opencti
              category: threat-intelligence
            annotations:
              summary: "High threat intelligence activity"
              description: "Indicator rate is {{ $value }} per hour"
          
          - alert: OpenCTIPlatformDown
            expr: up{job="opencti-exporter"} == 0
            for: 5m
            labels:
              severity: critical
              component: opencti
              category: threat-intelligence
            annotations:
              summary: "OpenCTI platform is down"
              description: "OpenCTI platform has been down for more than 5 minutes"
      
      - name: general_security_alerts
        interval: 30s
        rules:
          - alert: SuspiciousNetworkActivity
            expr: rate(container_network_receive_bytes_total[5m]) > 100000000
            for: 5m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "Suspicious network activity detected"
              description: "High network receive rate: {{ $value }} bytes/sec"
          
          - alert: UnauthorizedAPIAccess
            expr: sum(rate(http_requests_total{code=~"401|403"}[5m])) by (service) > 10
            for: 5m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "High rate of unauthorized API access attempts"
              description: "Service {{ $labels.service }} has {{ $value }} unauthorized requests/sec"
          
          - alert: PotentialDDoSAttack
            expr: sum(rate(http_requests_total[1m])) > 10000
            for: 2m
            labels:
              severity: critical
              category: security
            annotations:
              summary: "Potential DDoS attack detected"
              description: "Request rate is {{ $value }} per second"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-security-overview
  namespace: monitoring
  labels:
    app: grafana
    dashboard: security-overview
data:
  security-overview.json: |
    {
      "dashboard": {
        "title": "Security Overview",
        "tags": ["security", "wazuh", "opencti"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Wazuh Agents Status",
            "type": "stat",
            "targets": [
              {
                "expr": "wazuh_agents_active",
                "legendFormat": "Active"
              },
              {
                "expr": "wazuh_agents_disconnected",
                "legendFormat": "Disconnected"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Wazuh Alert Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(wazuh_alerts_total[5m])",
                "legendFormat": "Alerts/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "Vulnerabilities Detected",
            "type": "stat",
            "targets": [
              {
                "expr": "wazuh_vulnerabilities_total"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0}
          },
          {
            "id": 4,
            "title": "OpenCTI Indicators",
            "type": "stat",
            "targets": [
              {
                "expr": "opencti_indicators_total"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 4}
          },
          {
            "id": 5,
            "title": "OpenCTI Threat Actors",
            "type": "stat",
            "targets": [
              {
                "expr": "opencti_threats_total"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 4}
          },
          {
            "id": 6,
            "title": "Security Alerts Timeline",
            "type": "graph",
            "targets": [
              {
                "expr": "ALERTS{category=\"security\"}",
                "legendFormat": "{{ alertname }}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          }
        ]
      }
    }

