---
# Canary/Blue-Green Deployment Configuration
# Supports automated rollback based on SLOs

apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-config
  namespace: payment-switch
data:
  # Canary configuration
  canary-weight: "10"  # Initial canary traffic percentage
  canary-increment: "10"  # Traffic increment per step
  canary-max-weight: "100"  # Maximum canary weight
  canary-interval: "60s"  # Time between weight increments
  
  # SLO thresholds for automatic rollback
  error-rate-threshold: "1"  # Max error rate percentage
  latency-p99-threshold: "500"  # Max p99 latency in ms
  latency-p95-threshold: "200"  # Max p95 latency in ms
  success-rate-threshold: "99"  # Min success rate percentage
  
  # Rollback configuration
  rollback-on-error: "true"
  rollback-on-latency: "true"
  min-requests-threshold: "100"  # Min requests before evaluation

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-service-rollout
  namespace: payment-switch
spec:
  replicas: 10
  strategy:
    canary:
      canaryService: payment-service-canary
      stableService: payment-service-stable
      trafficRouting:
        apisix:
          route:
            name: payment-service-route
            rules:
              - backends:
                  - serviceName: payment-service-canary
                    servicePort: 8080
                    weight: 10
                  - serviceName: payment-service-stable
                    servicePort: 8080
                    weight: 90
      steps:
        # Step 1: 10% traffic
        - setWeight: 10
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: payment-service-analysis
            args:
              - name: service-name
                value: payment-service-canary
        
        # Step 2: 25% traffic
        - setWeight: 25
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: payment-service-analysis
        
        # Step 3: 50% traffic
        - setWeight: 50
        - pause: {duration: 5m}
        - analysis:
            templates:
              - templateName: payment-service-analysis
        
        # Step 4: 75% traffic
        - setWeight: 75
        - pause: {duration: 5m}
        - analysis:
            templates:
              - templateName: payment-service-analysis
        
        # Step 5: 100% traffic (full promotion)
        - setWeight: 100
      
      # Automatic rollback on failure
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      
      # Anti-affinity for canary pods
      antiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          weight: 100
  
  selector:
    matchLabels:
      app: payment-service
  
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: payment-switch/payment-service:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-service-analysis
  namespace: payment-switch
spec:
  args:
    - name: service-name
      value: payment-service-canary
  metrics:
    # Error rate check
    - name: error-rate
      interval: 30s
      successCondition: result[0] < 0.01
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[2m])) 
            / 
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
    
    # P99 latency check
    - name: latency-p99
      interval: 30s
      successCondition: result[0] < 500
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            histogram_quantile(0.99, 
              sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) 
              by (le)
            ) * 1000
    
    # P95 latency check
    - name: latency-p95
      interval: 30s
      successCondition: result[0] < 200
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            histogram_quantile(0.95, 
              sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) 
              by (le)
            ) * 1000
    
    # Success rate check
    - name: success-rate
      interval: 30s
      successCondition: result[0] > 0.99
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"2.."}[2m])) 
            / 
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
    
    # TigerBeetle transaction success rate
    - name: tigerbeetle-success-rate
      interval: 30s
      successCondition: result[0] > 0.999
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(tigerbeetle_transfers_committed_total[2m])) 
            / 
            sum(rate(tigerbeetle_transfers_total[2m]))

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-canary
  namespace: payment-switch
spec:
  selector:
    app: payment-service
    rollouts-pod-template-hash: canary
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-stable
  namespace: payment-switch
spec:
  selector:
    app: payment-service
    rollouts-pod-template-hash: stable
  ports:
    - port: 8080
      targetPort: 8080

---
# Blue-Green Deployment Alternative
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mojaloop-service-rollout
  namespace: payment-switch
spec:
  replicas: 5
  strategy:
    blueGreen:
      activeService: mojaloop-service-active
      previewService: mojaloop-service-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
          - templateName: mojaloop-service-analysis
        args:
          - name: service-name
            value: mojaloop-service-preview
      postPromotionAnalysis:
        templates:
          - templateName: mojaloop-service-analysis
        args:
          - name: service-name
            value: mojaloop-service-active
  
  selector:
    matchLabels:
      app: mojaloop-service
  
  template:
    metadata:
      labels:
        app: mojaloop-service
    spec:
      containers:
        - name: mojaloop-service
          image: payment-switch/mojaloop-service:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mojaloop-service-analysis
  namespace: payment-switch
spec:
  args:
    - name: service-name
  metrics:
    - name: mojaloop-transfer-success
      interval: 60s
      successCondition: result[0] > 0.99
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(mojaloop_transfers_completed_total{service="{{args.service-name}}"}[5m])) 
            / 
            sum(rate(mojaloop_transfers_total{service="{{args.service-name}}"}[5m]))
    
    - name: mojaloop-quote-latency
      interval: 60s
      successCondition: result[0] < 1000
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            histogram_quantile(0.99, 
              sum(rate(mojaloop_quote_duration_seconds_bucket{service="{{args.service-name}}"}[5m])) 
              by (le)
            ) * 1000

---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-service-active
  namespace: payment-switch
spec:
  selector:
    app: mojaloop-service
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-service-preview
  namespace: payment-switch
spec:
  selector:
    app: mojaloop-service
  ports:
    - port: 8080
      targetPort: 8080
