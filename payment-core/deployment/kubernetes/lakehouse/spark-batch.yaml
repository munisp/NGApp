---
# Apache Spark for Batch Processing and Analytics
# Processes large-scale data from Delta Lake with Sedona for geospatial analytics

apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: lakehouse
  labels:
    app: spark
data:
  spark-defaults.conf: |
    # Spark Configuration
    spark.master                                k8s://https://kubernetes.default.svc:443
    spark.kubernetes.namespace                  lakehouse
    spark.kubernetes.authenticate.driver.serviceAccountName spark
    spark.kubernetes.container.image            apache/spark:3.5.0-scala2.12-java11-python3-ubuntu
    
    # Delta Lake Configuration
    spark.sql.extensions                        io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog             org.apache.spark.sql.delta.catalog.DeltaCatalog
    spark.databricks.delta.retentionDurationCheck.enabled false
    spark.databricks.delta.properties.defaults.enableChangeDataFeed true
    
    # Apache Sedona Configuration
    spark.sql.extensions                        org.apache.sedona.sql.SedonaSqlExtensions
    spark.serializer                            org.apache.spark.serializer.KryoSerializer
    spark.kryo.registrator                      org.apache.sedona.core.serde.SedonaKryoRegistrator
    
    # S3/MinIO Configuration - credentials injected via environment variables from minio-secrets
    spark.hadoop.fs.s3a.endpoint                http://rustfs.lakehouse:9000
    # Use EnvironmentVariableCredentialsProvider to read AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
    spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    spark.hadoop.fs.s3a.path.style.access       true
    spark.hadoop.fs.s3a.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled  false
    spark.hadoop.fs.s3a.fast.upload             true
    spark.hadoop.fs.s3a.multipart.size          104857600
    
    # Performance Tuning
    spark.sql.adaptive.enabled                  true
    spark.sql.adaptive.coalescePartitions.enabled true
    spark.sql.adaptive.skewJoin.enabled         true
    spark.sql.cbo.enabled                       true
    spark.sql.cbo.joinReorder.enabled           true
    spark.sql.autoBroadcastJoinThreshold        104857600
    
    # Memory Configuration
    spark.driver.memory                         8g
    spark.executor.memory                       16g
    spark.executor.memoryOverhead               4g
    spark.memory.fraction                       0.8
    spark.memory.storageFraction                0.3
    
    # Executor Configuration
    spark.executor.cores                        4
    spark.executor.instances                    20
    spark.dynamicAllocation.enabled             true
    spark.dynamicAllocation.minExecutors        10
    spark.dynamicAllocation.maxExecutors        100
    spark.dynamicAllocation.initialExecutors    20
    
    # Shuffle Configuration
    spark.shuffle.service.enabled               true
    spark.shuffle.service.port                  7337
    spark.shuffle.compress                      true
    spark.shuffle.spill.compress                true
    
    # Event Log
    spark.eventLog.enabled                      true
    spark.eventLog.dir                          s3a://checkpoints/spark-events
    spark.history.fs.logDirectory               s3a://checkpoints/spark-events
    
    # Metrics
    spark.metrics.namespace                     spark
    spark.metrics.conf.*.sink.prometheus.class  org.apache.spark.metrics.sink.PrometheusServlet
    spark.metrics.conf.*.sink.prometheus.path   /metrics/prometheus
    spark.ui.prometheus.enabled                 true
    
    # Kubernetes Configuration
    spark.kubernetes.driver.pod.name            spark-driver
    spark.kubernetes.executor.request.cores     4
    spark.kubernetes.executor.limit.cores       8
    spark.kubernetes.driver.request.cores       2
    spark.kubernetes.driver.limit.cores         4
    spark.kubernetes.memoryOverheadFactor       0.2

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: lakehouse
  labels:
    app: spark

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark
  namespace: lakehouse
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark
  namespace: lakehouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: lakehouse

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: lakehouse
  labels:
    app: spark
    component: history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      component: history-server
  template:
    metadata:
      labels:
        app: spark
        component: history-server
    spec:
      serviceAccountName: spark
      
      containers:
        - name: history-server
          image: apache/spark:3.5.0-scala2.12-java11-python3-ubuntu
          imagePullPolicy: IfNotPresent
          
          command:
            - /opt/spark/sbin/start-history-server.sh
          
          ports:
            - name: ui
              containerPort: 18080
          
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_SECRET_KEY
            - name: SPARK_HISTORY_OPTS
              value: "-Dspark.history.fs.logDirectory=s3a://checkpoints/spark-events -Dspark.hadoop.fs.s3a.endpoint=http://rustfs.lakehouse:9000 -Dspark.hadoop.fs.s3a.path.style.access=true -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem"
          
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          livenessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: lakehouse
  labels:
    app: spark
    component: history-server
spec:
  type: LoadBalancer
  selector:
    app: spark
    component: history-server
  ports:
    - name: ui
      port: 18080
      targetPort: 18080

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spark-shuffle-service
  namespace: lakehouse
  labels:
    app: spark
    component: shuffle-service
spec:
  selector:
    matchLabels:
      app: spark
      component: shuffle-service
  template:
    metadata:
      labels:
        app: spark
        component: shuffle-service
    spec:
      hostNetwork: true
      
      containers:
        - name: shuffle-service
          image: apache/spark:3.5.0-scala2.12-java11-python3-ubuntu
          imagePullPolicy: IfNotPresent
          
          command:
            - /opt/spark/sbin/start-shuffle-service.sh
          
          ports:
            - name: shuffle
              containerPort: 7337
              hostPort: 7337
          
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          
          volumeMounts:
            - name: shuffle-data
              mountPath: /tmp/spark-shuffle
      
      volumes:
        - name: shuffle-data
          hostPath:
            path: /tmp/spark-shuffle
            type: DirectoryOrCreate

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-operator-config
  namespace: lakehouse
  labels:
    app: spark-operator
data:
  controller_threads: "10"
  resync_interval: "30"
  enable_batch_scheduler: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-operator
  namespace: lakehouse
  labels:
    app: spark-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-operator
  template:
    metadata:
      labels:
        app: spark-operator
    spec:
      serviceAccountName: spark
      
      containers:
        - name: spark-operator
          image: ghcr.io/googlecloudplatform/spark-operator:v1beta2-1.3.8-3.1.1
          imagePullPolicy: IfNotPresent
          
          args:
            - -v=2
            - -namespace=lakehouse
            - -enable-ui-service=true
            - -ingress-url-format=
          
          ports:
            - name: metrics
              containerPort: 10254
          
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: spark-operator-metrics
  namespace: lakehouse
  labels:
    app: spark-operator
spec:
  type: ClusterIP
  selector:
    app: spark-operator
  ports:
    - name: metrics
      port: 10254
      targetPort: 10254

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-network-policy
  namespace: lakehouse
  labels:
    app: spark
spec:
  podSelector:
    matchLabels:
      app: spark
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic between Spark components
    - from:
        - podSelector:
            matchLabels:
              app: spark
      ports:
        - protocol: TCP
          port: 7077
        - protocol: TCP
          port: 7337
    # Allow UI access
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4040
        - protocol: TCP
          port: 18080
    # Allow metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 10254
  egress:
    # Allow traffic to MinIO
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # Allow traffic between Spark components
    - to:
        - podSelector:
            matchLabels:
              app: spark
      ports:
        - protocol: TCP
          port: 7077
        - protocol: TCP
          port: 7337
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow all egress for Kubernetes API
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
