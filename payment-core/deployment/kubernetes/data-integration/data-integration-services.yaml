  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: feedback-service
            image: nextgen-payment-switch/lakehouse-postgres-feedback:latest
            env:
            - name: DELTA_LAKE_PATH
              value: "s3a://lakehouse/delta"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dsn
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            resources:
              requests:
                cpu: "2000m"
                memory: "4Gi"
              limits:
                cpu: "4000m"
                memory: "8Gi"
          restartPolicy: OnFailure

---
# Lakehouse to TigerBeetle Feedback CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lakehouse-tigerbeetle-feedback
  namespace: data-integration
  labels:
    app: lakehouse-tigerbeetle-feedback
spec:
  schedule: "*/30 * * * *"  # Every 30 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: feedback-service
            image: nextgen-payment-switch/lakehouse-tigerbeetle-feedback:latest
            env:
            - name: DELTA_LAKE_PATH
              value: "s3a://lakehouse/delta"
            - name: TIGERBEETLE_ADDRESS
              value: "ledger-service.payment-switch:50051"
            - name: TIGERBEETLE_CLUSTER_ID
              value: "0"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            resources:
              requests:
                cpu: "1000m"
                memory: "2Gi"
              limits:
                cpu: "2000m"
                memory: "4Gi"
          restartPolicy: OnFailure

---
# Service for Flink JobManager
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager-postgres-lakehouse
  namespace: data-integration
spec:
  type: ClusterIP
  ports:
  - name: rpc
    port: 6123
  - name: blob-server
    port: 6124
  - name: webui
    port: 8081
  selector:
    app: flink
    component: jobmanager
    pipeline: postgres-lakehouse

---
# NetworkPolicy for data integration services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-integration-network-policy
  namespace: data-integration
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: payment-switch
    - namespaceSelector:
        matchLabels:
          name: monitoring
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: payment-switch
    - namespaceSelector:
        matchLabels:
          name: lakehouse
    ports:
    - protocol: TCP
      port: 9092  # Kafka
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 3000  # TigerBeetle
    - protocol: TCP
      port: 9000  # MinIO
    - protocol: TCP
      port: 50051  # gRPC

---
# HorizontalPodAutoscaler for TigerBeetle CDC Connector
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tigerbeetle-cdc-connector-hpa
  namespace: data-integration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tigerbeetle-cdc-connector
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# HorizontalPodAutoscaler for Kafka to PostgreSQL Sync
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-postgres-sync-hpa
  namespace: data-integration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafka-postgres-sync
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# HorizontalPodAutoscaler for Fraud Score Ingestion
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-score-ingestion-hpa
  namespace: data-integration
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-score-ingestion
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
