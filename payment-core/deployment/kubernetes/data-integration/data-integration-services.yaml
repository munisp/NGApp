---
# Namespace for data integration services
apiVersion: v1
kind: Namespace
metadata:
  name: data-integration
  labels:
    name: data-integration

---
# TigerBeetle CDC Connector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigerbeetle-cdc-connector
  namespace: data-integration
  labels:
    app: tigerbeetle-cdc
    component: connector
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tigerbeetle-cdc
      component: connector
  template:
    metadata:
      labels:
        app: tigerbeetle-cdc
        component: connector
    spec:
      containers:
      - name: cdc-connector
        image: nextgen-payment-switch/tigerbeetle-cdc-connector:latest
        env:
        - name: TIGERBEETLE_ADDRESS
          value: "tigerbeetle-0.tigerbeetle:3000"
        - name: TIGERBEETLE_CLUSTER_ID
          value: "0"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: KAFKA_TOPIC_ACCOUNTS
          value: "tigerbeetle.accounts"
        - name: KAFKA_TOPIC_TRANSFERS
          value: "tigerbeetle.transfers"
        - name: POLL_INTERVAL
          value: "5"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 10
          periodSeconds: 10

---
# Kafka to PostgreSQL Sync Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-postgres-sync
  namespace: data-integration
  labels:
    app: kafka-postgres-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-postgres-sync
  template:
    metadata:
      labels:
        app: kafka-postgres-sync
    spec:
      containers:
      - name: sync-service
        image: nextgen-payment-switch/kafka-postgres-sync:latest
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: KAFKA_TOPICS
          value: "tigerbeetle.accounts,tigerbeetle.transfers"
        - name: KAFKA_GROUP_ID
          value: "kafka-postgres-sync"
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: dsn
        - name: BATCH_SIZE
          value: "1000"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

---
# Flink Job Manager for PostgreSQL to Lakehouse Streaming
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager-postgres-lakehouse
  namespace: data-integration
  labels:
    app: flink
    component: jobmanager
    pipeline: postgres-lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
      pipeline: postgres-lakehouse
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
        pipeline: postgres-lakehouse
    spec:
      containers:
      - name: jobmanager
        image: flink:1.18
        args: ["jobmanager"]
        ports:
        - containerPort: 6123
          name: rpc
        - containerPort: 6124
          name: blob-server
        - containerPort: 8081
          name: webui
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-jobmanager-postgres-lakehouse
            taskmanager.numberOfTaskSlots: 4
            parallelism.default: 4
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: KAFKA_TOPIC_POSTGRES_CDC
          value: "postgres.public.transactions"
        - name: DELTA_LAKE_PATH
          value: "s3a://lakehouse/delta/transactions"
        - name: S3_ENDPOINT
          value: "http://minio:9000"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: secret-key
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

---
# Flink Task Manager for PostgreSQL to Lakehouse Streaming
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager-postgres-lakehouse
  namespace: data-integration
  labels:
    app: flink
    component: taskmanager
    pipeline: postgres-lakehouse
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flink
      component: taskmanager
      pipeline: postgres-lakehouse
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
        pipeline: postgres-lakehouse
    spec:
      containers:
      - name: taskmanager
        image: flink:1.18
        args: ["taskmanager"]
        ports:
        - containerPort: 6122
          name: rpc
        - containerPort: 6125
          name: query-state
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-jobmanager-postgres-lakehouse
            taskmanager.numberOfTaskSlots: 4
            parallelism.default: 4
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"

---
# PostgreSQL to Lakehouse Batch Sync CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-lakehouse-batch-sync
  namespace: data-integration
  labels:
    app: postgres-lakehouse-batch-sync
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: batch-sync
            image: nextgen-payment-switch/postgres-lakehouse-batch-sync:latest
            env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dsn
            - name: DELTA_LAKE_PATH
              value: "s3a://lakehouse/delta"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: SYNC_MODE
              value: "incremental"
            resources:
              requests:
                cpu: "2000m"
                memory: "4Gi"
              limits:
                cpu: "4000m"
                memory: "8Gi"
          restartPolicy: OnFailure

---
# Fraud GNN Training Pipeline CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fraud-gnn-training
  namespace: data-integration
  labels:
    app: fraud-gnn-training
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: gnn-training
            image: nextgen-payment-switch/fraud-gnn-training:latest
            env:
            - name: DELTA_LAKE_PATH
              value: "s3a://lakehouse/delta"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
            - name: MODEL_OUTPUT_PATH
              value: "s3a://lakehouse/models"
            resources:
              requests:
                cpu: "4000m"
                memory: "8Gi"
                nvidia.com/gpu: "1"
              limits:
                cpu: "8000m"
                memory: "16Gi"
                nvidia.com/gpu: "1"
          restartPolicy: OnFailure
          nodeSelector:
            nvidia.com/gpu: "true"

---
# Fraud Score Ingestion Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-score-ingestion
  namespace: data-integration
  labels:
    app: fraud-score-ingestion
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-score-ingestion
  template:
    metadata:
      labels:
        app: fraud-score-ingestion
    spec:
      containers:
      - name: ingestion-service
        image: nextgen-payment-switch/fraud-score-ingestion:latest
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: KAFKA_TOPIC
          value: "fraud.scores"
        - name: KAFKA_GROUP_ID
          value: "fraud-score-ingestion"
        - name: DELTA_LAKE_PATH
          value: "s3a://lakehouse/delta"
        - name: S3_ENDPOINT
          value: "http://minio:9000"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: secret-key
        - name: BATCH_SIZE
          value: "1000"
        - name: BATCH_TIMEOUT
          value: "10.0"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

---
