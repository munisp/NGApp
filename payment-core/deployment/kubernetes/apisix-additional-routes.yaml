---
# Additional APISIX Routes for Payment Services
# These routes wire the remaining services to the API gateway

# Mojaloop Go Service Routes (Default Implementation)
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: mojaloop-go-service-upstream
  namespace: payment-switch
spec:
  scheme: http
  loadbalancer:
    type: roundrobin
  discovery:
    serviceName: mojaloop-go-service.payment-switch
    type: kubernetes
  healthCheck:
    active:
      type: http
      httpPath: /health
      timeout: 3
      healthy:
        interval: 5
        successes: 2
      unhealthy:
        interval: 5
        httpFailures: 3
  retries: 3
  timeout:
    connect: 5
    send: 30
    read: 30

---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mojaloop-go-service-route
  namespace: payment-switch
spec:
  http:
    - name: mojaloop-ilp-operations
      match:
        paths:
          - /api/v1/ilp/*
        methods:
          - GET
          - POST
      backends:
        - serviceName: mojaloop-go-service
          servicePort: 8080
      plugins:
        - name: request-id
          enable: true
        - name: jwt-auth
          enable: true
        - name: limit-count
          enable: true
          config:
            count: 10000
            time_window: 1
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: redis
            redis_host: redis-master.payment-switch
            redis_port: 6379
        - name: prometheus
          enable: true
    - name: mojaloop-transfer-operations
      match:
        paths:
          - /api/v1/transfers/*
        methods:
          - GET
          - POST
          - PUT
      backends:
        - serviceName: mojaloop-go-service
          servicePort: 8080
      plugins:
        - name: request-id
          enable: true
        - name: jwt-auth
          enable: true
        - name: limit-count
          enable: true
          config:
            count: 5000
            time_window: 1
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: redis
            redis_host: redis-master.payment-switch
            redis_port: 6379
        - name: prometheus
          enable: true
    - name: mojaloop-ledger-operations
      match:
        paths:
          - /api/v1/ledger/*
        methods:
          - GET
          - POST
      backends:
        - serviceName: mojaloop-go-service
          servicePort: 8080
      plugins:
        - name: request-id
          enable: true
        - name: jwt-auth
          enable: true
        - name: limit-count
          enable: true
          config:
            count: 5000
            time_window: 1
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: redis
            redis_host: redis-master.payment-switch
            redis_port: 6379
        - name: prometheus
          enable: true
    - name: mojaloop-tigerbeetle-operations
      match:
        paths:
          - /api/v1/tigerbeetle/*
        methods:
          - GET
          - POST
      backends:
        - serviceName: mojaloop-go-service
          servicePort: 8080
      plugins:
        - name: request-id
          enable: true
        - name: jwt-auth
          enable: true
        - name: limit-count
          enable: true
          config:
            count: 5000
            time_window: 1
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: redis
            redis_host: redis-master.payment-switch
            redis_port: 6379
        - name: prometheus
          enable: true

