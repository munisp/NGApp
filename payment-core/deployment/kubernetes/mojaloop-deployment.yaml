apiVersion: v1
kind: Service
metadata:
  name: mojaloop-api-adapter
  namespace: payment-switch
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: mojaloop
    component: api-adapter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-api-adapter
  namespace: payment-switch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mojaloop
      component: api-adapter
  template:
    metadata:
      labels:
        app: mojaloop
        component: api-adapter
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mojaloop-api-adapter"
        dapr.io/app-port: "3000"
        dapr.io/config: "dapr-config"
    spec:
      containers:
      - name: api-adapter
        image: mojaloop/ml-api-adapter:v14.0.0
        ports:
        - containerPort: 3000
        env:
        - name: MLAPI_ENDPOINT_SOURCE_URL
          value: "http://mojaloop-api-adapter:3000"
        - name: MLAPI_ENDPOINT_HEALTH_URL
          value: "http://mojaloop-api-adapter:3000/health"
        - name: MLAPI_KAFKA_HOST
          value: "kafka"
        - name: MLAPI_KAFKA_PORT
          value: "9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mojaloop-central-ledger
  namespace: payment-switch
spec:
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  selector:
    app: mojaloop
    component: central-ledger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-central-ledger
  namespace: payment-switch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mojaloop
      component: central-ledger
  template:
    metadata:
      labels:
        app: mojaloop
        component: central-ledger
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mojaloop-central-ledger"
        dapr.io/app-port: "3001"
        dapr.io/config: "dapr-config"
    spec:
      containers:
      - name: central-ledger
        image: mojaloop/central-ledger:v17.0.0
        ports:
        - containerPort: 3001
        env:
        - name: CLEDG_DATABASE_URI
          value: "mysql://central_ledger:password@mysql:3306/central_ledger"
        - name: CLEDG_KAFKA_HOST
          value: "kafka"
        - name: CLEDG_KAFKA_PORT
          value: "9092"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
