apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle
  namespace: payment-switch
  labels:
    app: tigerbeetle
spec:
  ports:
  - port: 3000
    name: client
    protocol: TCP
  clusterIP: None
  selector:
    app: tigerbeetle
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: payment-switch
spec:
  serviceName: "tigerbeetle"
  replicas: 3
  selector:
    matchLabels:
      app: tigerbeetle
  template:
    metadata:
      labels:
        app: tigerbeetle
    spec:
      containers:
      - name: tigerbeetle
        image: ghcr.io/tigerbeetle/tigerbeetle:latest
        ports:
        - containerPort: 3000
          name: client
        env:
        - name: TIGERBEETLE_CLUSTER_ID
          value: "0"
        - name: TIGERBEETLE_REPLICA_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: data
          mountPath: /var/lib/tigerbeetle
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 100Gi
