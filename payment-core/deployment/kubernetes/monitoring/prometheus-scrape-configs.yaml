---
# Additional Prometheus scrape configurations for all components
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-additional-scrape-configs
  namespace: monitoring
data:
  additional-scrape-configs.yaml: |
    # TigerBeetle metrics
    - job_name: 'tigerbeetle'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - payment-core
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: tigerbeetle
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9090
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
    
    # Mojaloop services
    - job_name: 'mojaloop'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - mojaloop
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          target_label: __address__
          regex: (.+)
          replacement: $1
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
    
    # OpenAppSec WAF
    - job_name: 'openappsec'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - openappsec
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: openappsec.*
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9090
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    
    # Wazuh SIEM
    - job_name: 'wazuh'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - security
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: wazuh.*
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9090
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    
    # OpenCTI Threat Intelligence
    - job_name: 'opencti'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - security
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: opencti.*
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9090
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    
    # OpenSearch
    - job_name: 'opensearch'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - logging
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: opensearch
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9600
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    
    # APISIX Gateway
    - job_name: 'apisix'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - apisix
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: apisix
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9091
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    
    # Unified Integration Service
    - job_name: 'unified-integration'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - integrations
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: unified-integration-service
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9090
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    
    # Python payment services
    - job_name: 'python-services'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - payment-core
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_label_language]
          action: keep
          regex: python
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
    
    # Kubecost
    - job_name: 'kubecost'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - monitoring
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: kubecost.*
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $1:9003
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
---
# Prometheus alerting rules for all components
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerting-rules
  namespace: monitoring
data:
  payment-alerts.yml: |
    groups:
      - name: payment-switch-alerts
        rules:
          - alert: HighTransactionLatency
            expr: histogram_quantile(0.99, sum(rate(payment_switch_transaction_duration_seconds_bucket[5m])) by (le)) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High transaction latency detected
              description: P99 transaction latency is above 5 seconds
          
          - alert: LowSuccessRate
            expr: (sum(rate(payment_switch_transactions_total{status="success"}[5m])) / sum(rate(payment_switch_transactions_total[5m]))) < 0.95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Low transaction success rate
              description: Transaction success rate is below 95%
          
          - alert: HighFraudAlerts
            expr: payment_switch_fraud_alerts_open > 50
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: High number of open fraud alerts
              description: More than 50 fraud alerts are open
          
          - alert: SettlementBacklog
            expr: payment_switch_settlements_pending > 500
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Settlement backlog detected
              description: More than 500 settlements are pending
  
  tigerbeetle-alerts.yml: |
    groups:
      - name: tigerbeetle-alerts
        rules:
          - alert: TigerBeetleUnhealthy
            expr: tigerbeetle_cluster_health == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: TigerBeetle cluster is unhealthy
              description: TigerBeetle cluster health check failed
          
          - alert: HighPendingTransfers
            expr: tigerbeetle_pending_transfers > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High number of pending transfers in TigerBeetle
              description: More than 1000 transfers are pending
          
          - alert: HighReplicationLag
            expr: tigerbeetle_replication_lag_bytes > 1000000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High TigerBeetle replication lag
              description: Replication lag is above 1MB
  
  security-alerts.yml: |
    groups:
      - name: security-alerts
        rules:
          - alert: HighBlockedRequests
            expr: sum(rate(openappsec_blocked_requests_total[5m])) > 100
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High rate of blocked requests
              description: More than 100 requests per second are being blocked
          
          - alert: CriticalSIEMAlerts
            expr: sum(wazuh_alerts_by_severity{severity="critical"}) > 10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Critical SIEM alerts detected
              description: More than 10 critical SIEM alerts are open
          
          - alert: ThreatIntelSyncFailed
            expr: (time() - opencti_last_sync_timestamp) > 3600
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Threat intelligence sync is stale
              description: Last threat intel sync was more than 1 hour ago
          
          - alert: LowSecurityScore
            expr: security_score < 70
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Low security score
              description: Overall security score is below 70
  
  mojaloop-alerts.yml: |
    groups:
      - name: mojaloop-alerts
        rules:
          - alert: MojaLoopLowSuccessRate
            expr: mojaloop_transfer_success_rate < 0.95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Low Mojaloop transfer success rate
              description: Transfer success rate is below 95%
          
          - alert: HighSettlementsPending
            expr: mojaloop_settlements_pending > 100
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: High number of pending Mojaloop settlements
              description: More than 100 settlements are pending
          
          - alert: ParticipantUnhealthy
            expr: mojaloop_participant_health < 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Mojaloop participant is unhealthy
              description: A participant is reporting degraded or down status
