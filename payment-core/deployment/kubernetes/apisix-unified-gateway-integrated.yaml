---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: payment-switch

---
# APISIX Deployment (Updated to work with Unified Gateway)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: payment-switch
  labels:
    app: apisix
spec:
  replicas: 6
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
    spec:
      containers:
      - name: apisix
        image: apache/apisix:3.7.0-debian
        ports:
        - containerPort: 9080
          name: http
        - containerPort: 9443
          name: https
        - containerPort: 9091
          name: metrics
        env:
        - name: APISIX_STAND_ALONE
          value: "false"
        volumeMounts:
        - name: apisix-config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /apisix/status
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /apisix/status
            port: 9080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: apisix-config
        configMap:
          name: apisix-unified-gateway-config

---
# APISIX Service
apiVersion: v1
kind: Service
metadata:
  name: apisix
  namespace: payment-switch
  labels:
    app: apisix
spec:
  type: LoadBalancer
  selector:
    app: apisix
  ports:
  - port: 80
    targetPort: 9080
    name: http
  - port: 443
    targetPort: 9443
    name: https
  - port: 9091
    targetPort: 9091
    name: metrics

---
# APISIX HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apisix-hpa
  namespace: payment-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apisix
  minReplicas: 6
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Unified API Gateway Deployment (Updated to work behind APISIX)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-api-gateway
  namespace: payment-switch
  labels:
    app: unified-api-gateway
    component: api-gateway
spec:
  replicas: 10
  selector:
    matchLabels:
      app: unified-api-gateway
  template:
    metadata:
      labels:
        app: unified-api-gateway
        component: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: unified-api-gateway
        image: ghcr.io/payment-switch/unified-api-gateway:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: unified-api-gateway-config
        env:
        - name: BEHIND_PROXY
          value: "true"
        - name: PROXY_NAME
          value: "APISIX"
        - name: TRUST_PROXY
          value: "true"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
# Unified API Gateway Service (Internal only - accessed via APISIX)
apiVersion: v1
kind: Service
metadata:
  name: unified-api-gateway
  namespace: payment-switch
  labels:
    app: unified-api-gateway
spec:
  type: ClusterIP
  selector:
    app: unified-api-gateway
  ports:
  - port: 8080
    targetPort: 8080
    name: http

---
# Unified API Gateway HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unified-api-gateway-hpa
  namespace: payment-switch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-api-gateway
  minReplicas: 10
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Network Policy - APISIX to Unified Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-to-unified-gateway
  namespace: payment-switch
spec:
  podSelector:
    matchLabels:
      app: unified-api-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: apisix
    ports:
    - protocol: TCP
      port: 8080

---
# Network Policy - Unified Gateway to Backend Services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unified-gateway-to-backends
  namespace: payment-switch
spec:
  podSelector:
    matchLabels:
      app: unified-api-gateway
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: ledger-service
    ports:
    - protocol: TCP
      port: 50051
  - to:
    - podSelector:
        matchLabels:
          app: vpa-service
    ports:
    - protocol: TCP
      port: 50052
  - to:
    - podSelector:
        matchLabels:
          app: fraud-detection-service
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: biometric-auth
    ports:
    - protocol: TCP
      port: 8001
  - to:
    - podSelector:
        matchLabels:
          app: offline-payments
    ports:
    - protocol: TCP
      port: 8003
  - to:
    - podSelector:
        matchLabels:
          app: instant-settlement
    ports:
    - protocol: TCP
      port: 8004
  - to:
    - podSelector:
        matchLabels:
          app: pos-gateway
    ports:
    - protocol: TCP
      port: 8005

---
# Ingress for APISIX (External Access)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apisix-ingress
  namespace: payment-switch
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.payment-switch.example.com
    secretName: apisix-tls
  rules:
  - host: api.payment-switch.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apisix
            port:
              number: 80

---
# Pod Disruption Budget for APISIX
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-pdb
  namespace: payment-switch
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: apisix

---
# Pod Disruption Budget for Unified Gateway
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unified-api-gateway-pdb
  namespace: payment-switch
spec:
  minAvailable: 5
  selector:
    matchLabels:
      app: unified-api-gateway
