---
# Dapr Configuration for Python Workflow Orchestrator
# Enables service mesh capabilities, state management, and pub/sub

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-statestore
  namespace: payment-switch
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-master.payment-switch:6379
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: password
    - name: enableTLS
      value: "false"
    - name: maxRetries
      value: "3"
    - name: maxRetryBackoff
      value: "2s"
    - name: ttlInSeconds
      value: "7200"
    - name: queryIndexes
      value: |
        [
          {
            "name": "transaction_id",
            "indexes": [
              {
                "key": "transaction_id",
                "type": "TEXT"
              }
            ]
          },
          {
            "name": "workflow_status",
            "indexes": [
              {
                "key": "status",
                "type": "TEXT"
              }
            ]
          }
        ]

---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-pubsub
  namespace: payment-switch
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: kafka.payment-switch:9092
    - name: consumerGroup
      value: workflow-orchestrator-group
    - name: clientId
      value: workflow-orchestrator
    - name: authType
      value: none
    - name: maxMessageBytes
      value: "1048576"
    - name: version
      value: "2.8.0"
    - name: consumeRetryInterval
      value: "200ms"
    - name: consumeRetryEnabled
      value: "true"

---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-secretstore
  namespace: payment-switch
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    - name: vaultName
      value: payment-switch

---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflow-bindings-kafka
  namespace: payment-switch
spec:
  type: bindings.kafka
  version: v1
  metadata:
    - name: brokers
      value: kafka.payment-switch:9092
    - name: topics
      value: payment-events,workflow-events,transaction-events
    - name: consumerGroup
      value: workflow-orchestrator-bindings
    - name: authType
      value: none
    - name: publishTopic
      value: workflow-events
    - name: direction
      value: output

---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: workflow-orchestrator-config
  namespace: payment-switch
spec:
  # Tracing configuration
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.monitoring:9411/api/v2/spans"
  
  # Metrics configuration
  metric:
    enabled: true
  
  # mTLS configuration
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  
  # Access control
  accessControl:
    defaultAction: deny
    trustDomain: "payment-switch"
    policies:
      - appId: payment-gateway
        defaultAction: allow
        trustDomain: "payment-switch"
        namespace: "payment-switch"
        operations:
          - name: /api/v1/payments/process
            httpVerb: ["POST"]
            action: allow
          - name: /api/v1/payments/status/*
            httpVerb: ["GET"]
            action: allow
      
      - appId: ledger-service
        defaultAction: allow
        trustDomain: "payment-switch"
        namespace: "payment-switch"
        operations:
          - name: /ledger.LedgerService/*
            httpVerb: ["POST", "GET"]
            action: allow
      
      - appId: party-service
        defaultAction: allow
        trustDomain: "payment-switch"
        namespace: "payment-switch"
        operations:
          - name: /party.PartyService/*
            httpVerb: ["POST", "GET"]
            action: allow
      
      - appId: account-service
        defaultAction: allow
        trustDomain: "payment-switch"
        namespace: "payment-switch"
        operations:
          - name: /account.AccountService/*
            httpVerb: ["POST", "GET"]
            action: allow
      
      - appId: fraud-detection
        defaultAction: allow
        trustDomain: "payment-switch"
        namespace: "payment-switch"
        operations:
          - name: /api/v1/fraud/check
            httpVerb: ["POST"]
            action: allow
  
  # API logging
  apiLogging:
    enabled: true
    obfuscateURLs: false
    omitHealthChecks: true

---
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: workflow-orchestrator-resiliency
  namespace: payment-switch
spec:
  policies:
    # Timeout policies
    timeouts:
      general: 10s
      workflow-execution: 120s
      activity-execution: 30s
      grpc-call: 15s
      database-query: 10s
    
    # Retry policies
    retries:
      retryForever:
        policy: constant
        duration: 5s
        maxRetries: -1
      
      retryThreeTimes:
        policy: exponential
        maxInterval: 30s
        maxRetries: 3
      
      retryFiveTimes:
        policy: exponential
        maxInterval: 60s
        maxRetries: 5
      
      retryTenTimes:
        policy: exponential
        maxInterval: 120s
        maxRetries: 10
    
    # Circuit breaker policies
    circuitBreakers:
      simpleCB:
        maxRequests: 1
        interval: 30s
        timeout: 60s
        trip: consecutiveFailures >= 5
      
      aggressiveCB:
        maxRequests: 1
        interval: 10s
        timeout: 30s
        trip: consecutiveFailures >= 3
      
      tolerantCB:
        maxRequests: 3
        interval: 60s
        timeout: 120s
        trip: consecutiveFailures >= 10
  
  targets:
    apps:
      ledger-service:
        timeout: grpc-call
        retry: retryFiveTimes
        circuitBreaker: simpleCB
      
      party-service:
        timeout: grpc-call
        retry: retryThreeTimes
        circuitBreaker: simpleCB
      
      account-service:
        timeout: grpc-call
        retry: retryFiveTimes
        circuitBreaker: simpleCB
      
      fraud-detection:
        timeout: activity-execution
        retry: retryThreeTimes
        circuitBreaker: aggressiveCB
    
    components:
      workflow-statestore:
        outbound:
          timeout: general
          retry: retryFiveTimes
          circuitBreaker: simpleCB
      
      workflow-pubsub:
        outbound:
          timeout: general
          retry: retryForever
          circuitBreaker: tolerantCB
      
      workflow-bindings-kafka:
        outbound:
          timeout: general
          retry: retryForever
          circuitBreaker: tolerantCB
    
    actors:
      workflowActor:
        timeout: workflow-execution
        retry: retryTenTimes
        circuitBreaker: tolerantCB

---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: workflow-payment-subscription
  namespace: payment-switch
spec:
  topic: payment-requests
  route: /api/v1/payments/process
  pubsubname: workflow-pubsub
  metadata:
    rawPayload: "true"
  scopes:
    - workflow-orchestrator
  bulkSubscribe:
    enabled: true
    maxMessagesCount: 100
    maxAwaitDurationMs: 1000

---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: workflow-status-subscription
  namespace: payment-switch
spec:
  topic: transaction-status-updates
  route: /api/v1/workflows/status-update
  pubsubname: workflow-pubsub
  metadata:
    rawPayload: "true"
  scopes:
    - workflow-orchestrator

---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: workflow-retry-subscription
  namespace: payment-switch
spec:
  topic: workflow-retry-requests
  route: /api/v1/workflows/retry
  pubsubname: workflow-pubsub
  metadata:
    rawPayload: "true"
  scopes:
    - workflow-orchestrator

---
# Service-to-Service invocation endpoints
apiVersion: dapr.io/v1alpha1
kind: HTTPEndpoint
metadata:
  name: workflow-orchestrator-endpoint
  namespace: payment-switch
spec:
  baseUrl: http://workflow-orchestrator.payment-switch:8080
  headers:
    - name: Content-Type
      value: application/json
  scopes:
    - payment-gateway
    - settlement-service

---
apiVersion: dapr.io/v1alpha1
kind: HTTPEndpoint
metadata:
  name: ledger-service-grpc-endpoint
  namespace: payment-switch
spec:
  baseUrl: grpc://ledger-service.payment-switch:50051
  headers:
    - name: Content-Type
      value: application/grpc
  scopes:
    - workflow-orchestrator

---
apiVersion: dapr.io/v1alpha1
kind: HTTPEndpoint
metadata:
  name: party-service-grpc-endpoint
  namespace: payment-switch
spec:
  baseUrl: grpc://party-service.payment-switch:50052
  headers:
    - name: Content-Type
      value: application/grpc
  scopes:
    - workflow-orchestrator

---
apiVersion: dapr.io/v1alpha1
kind: HTTPEndpoint
metadata:
  name: account-service-grpc-endpoint
  namespace: payment-switch
spec:
  baseUrl: grpc://account-service.payment-switch:50053
  headers:
    - name: Content-Type
      value: application/grpc
  scopes:
    - workflow-orchestrator

---
# Rate limiting configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-ratelimit
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
data:
  ratelimit.yaml: |
    domain: workflow-orchestrator
    descriptors:
      # Global rate limit
      - key: global
        rate_limit:
          unit: second
          requests_per_unit: 5000
      
      # Per-client rate limit
      - key: client_id
        rate_limit:
          unit: second
          requests_per_unit: 500
      
      # Per-operation rate limits
      - key: operation
        value: ProcessPayment
        rate_limit:
          unit: second
          requests_per_unit: 3000
      
      - key: operation
        value: GetPaymentStatus
        rate_limit:
          unit: second
          requests_per_unit: 5000
      
      - key: operation
        value: RetryPayment
        rate_limit:
          unit: second
          requests_per_unit: 100

---
# Observability - Distributed tracing
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-tracing
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
data:
  tracing.yaml: |
    tracing:
      enabled: true
      samplingRate: 1.0
      exporters:
        - type: zipkin
          endpoint: http://zipkin.monitoring:9411/api/v2/spans
        - type: jaeger
          endpoint: http://jaeger-collector.monitoring:14268/api/traces
      attributes:
        service.name: workflow-orchestrator
        service.version: v1.0.0
        deployment.environment: production
        service.namespace: payment-switch
        service.language: python

---
# Observability - Metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-metrics
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
data:
  metrics.yaml: |
    metrics:
      enabled: true
      port: 9090
      path: /metrics
      exporters:
        - type: prometheus
      custom_metrics:
        - name: workflow_executions_total
          type: counter
          description: Total number of workflow executions
          labels:
            - status
            - workflow_type
        
        - name: workflow_execution_duration_seconds
          type: histogram
          description: Workflow execution duration in seconds
          buckets: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0, 30.0, 60.0, 120.0]
          labels:
            - status
            - workflow_type
        
        - name: workflow_activity_executions_total
          type: counter
          description: Total number of activity executions
          labels:
            - activity_name
            - status
        
        - name: workflow_activity_duration_seconds
          type: histogram
          description: Activity execution duration in seconds
          buckets: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0, 5.0, 10.0]
          labels:
            - activity_name
            - status
        
        - name: grpc_client_requests_total
          type: counter
          description: Total number of gRPC client requests
          labels:
            - service
            - method
            - status
        
        - name: grpc_client_request_duration_seconds
          type: histogram
          description: gRPC client request duration in seconds
          buckets: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]
          labels:
            - service
            - method
        
        - name: temporal_workflow_queue_depth
          type: gauge
          description: Current depth of Temporal workflow queue
        
        - name: temporal_activity_queue_depth
          type: gauge
          description: Current depth of Temporal activity queue

---
# Health check configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-health
  namespace: payment-switch
  labels:
    app: workflow-orchestrator
data:
  health.yaml: |
    health:
      liveness:
        enabled: true
        path: /health/live
        port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
        checks:
          - name: temporal_connection
            type: tcp
            host: temporal-frontend.payment-switch
            port: 7233
          - name: redis_connection
            type: tcp
            host: redis-master.payment-switch
            port: 6379
      
      readiness:
        enabled: true
        path: /health/ready
        port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2
        checks:
          - name: temporal_connection
            type: tcp
            host: temporal-frontend.payment-switch
            port: 7233
          - name: ledger_service_connection
            type: grpc
            host: ledger-service.payment-switch
            port: 50051
          - name: party_service_connection
            type: grpc
            host: party-service.payment-switch
            port: 50052
          - name: account_service_connection
            type: grpc
            host: account-service.payment-switch
            port: 50053
      
      startup:
        enabled: true
        path: /health/startup
        port: 8080
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 30
