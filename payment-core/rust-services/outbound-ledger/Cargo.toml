[package]
name = "outbound-ledger"
version = "1.0.0"
edition = "2021"
description = "Ultra-low-latency TigerBeetle ledger service for outbound remittance double-entry postings"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "ledger_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
