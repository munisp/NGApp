[package]
name = "resilience-engine"
version = "1.0.0"
edition = "2021"
description = "Resilience engine for payment switch platform - circuit breakers, rate limiting, DDoS mitigation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
