[package]
name = "gateway-engine"
version = "1.0.0"
edition = "2021"
description = "Ultra-low-latency gateway engine for payment switch - rate limiting, JWT validation, circuit breaking"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dashmap = "5"
jsonwebtoken = "9"
base64 = "0.21"
ring = "0.17"
parking_lot = "0.12"
crossbeam-utils = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "gateway_bench"
harness = false
