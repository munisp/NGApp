[pytest]
testpaths = regression integration security performance chaos ux e2e
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -v
    --timeout=60
    --junitxml=test-results/junit.xml
    --html=test-results/report.html
    --self-contained-html
markers =
    regression: Regression tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests
    chaos: Chaos engineering tests
    ux: User experience tests
    e2e: End-to-end tests
    slow: Tests that take > 30 seconds
    requires_kafka: Tests requiring Kafka
    requires_temporal: Tests requiring Temporal
    requires_dapr: Tests requiring Dapr
    requires_chaos_mesh: Tests requiring Chaos Mesh
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
