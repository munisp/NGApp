apiVersion: apps/v1
kind: Deployment
metadata:
  name: og-rmm-app
  namespace: og-rmm
  labels:
    app: og-rmm-app
    version: v43
spec:
  replicas: 3
  selector:
    matchLabels:
      app: og-rmm-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: og-rmm-app
        version: v43
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: og-rmm-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: og-rmm-app
          image: og-rmm-platform:v43
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: JWT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: BUILT_IN_FORGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: BUILT_IN_FORGE_API_KEY
            - name: BUILT_IN_FORGE_API_URL
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: BUILT_IN_FORGE_API_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "og-rmm-app"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: og-rmm-app
  namespace: og-rmm
  labels:
    app: og-rmm-app
spec:
  selector:
    app: og-rmm-app
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: og-rmm-app
  namespace: og-rmm
  labels:
    app: og-rmm-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: og-rmm-app-hpa
  namespace: og-rmm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: og-rmm-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
