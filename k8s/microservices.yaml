---
# ── Telemetry Ingestion Service ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingestion
  namespace: og-rmm
  labels:
    app: telemetry-ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-ingestion
  template:
    metadata:
      labels:
        app: telemetry-ingestion
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "telemetry-ingestion"
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: telemetry-ingestion
          image: og-rmm/telemetry-ingestion:v43
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: KAFKA_BROKERS
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: og-rmm-secrets
                  key: POSTGRES_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingestion
  namespace: og-rmm
spec:
  selector:
    app: telemetry-ingestion
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
---
