---
# Disaster Recovery / BCP Service (Go)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-recovery
  namespace: ag-insurance
  labels:
    app: disaster-recovery
    tier: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disaster-recovery
  template:
    metadata:
      labels:
        app: disaster-recovery
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "disaster-recovery"
        dapr.io/app-port: "8090"
    spec:
      containers:
        - name: disaster-recovery
          image: ag-insurance/disaster-recovery:latest
          ports:
            - containerPort: 8090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: REDIS_URL
              value: "redis-master.ag-insurance.svc.cluster.local:6379"
            - name: KAFKA_BROKER
              value: "kafka.ag-insurance.svc.cluster.local:9092"
            - name: TEMPORAL_ADDR
              value: "temporal.ag-insurance.svc.cluster.local:7233"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
