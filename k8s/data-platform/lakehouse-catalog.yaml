---
# Data Catalog Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-data-catalog
  namespace: enterprise-crm
  labels:
    app: lakehouse-data-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lakehouse-data-catalog
  template:
    metadata:
      labels:
        app: lakehouse-data-catalog
    spec:
      containers:
      - name: catalog-service
        image: apache/spark:v3.5.0
        command:
        - /bin/bash
        - -c
        - |
          # Install Python dependencies
          pip install --upgrade pip
          pip install -r /config/requirements.txt
          
          # Download Delta Lake JARs
          cd /opt/spark/jars
          wget -q https://repo1.maven.org/maven2/io/delta/delta-spark_2.12/3.0.0/delta-spark_2.12-3.0.0.jar
          
          # Wait for Spark cluster to be ready
          until curl -s http://spark-master:8080 > /dev/null; do
            echo "Waiting for Spark cluster..."
            sleep 5
          done
          
          # Run data catalog service
          python /config/catalog-service.py
        env:
        - name: SPARK_MASTER_URL
          value: "spark://spark-master:7077"
        - name: PYSPARK_PYTHON
          value: "python3"
        - name: PYSPARK_DRIVER_PYTHON
          value: "python3"
        volumeMounts:
        - name: config
          mountPath: /config
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: lakehouse-catalog-config
---
apiVersion: v1
kind: Service
metadata:
  name: lakehouse-data-catalog
  namespace: enterprise-crm
  labels:
    app: lakehouse-data-catalog
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: lakehouse-data-catalog
  type: ClusterIP
---
# Data Discovery CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-discovery-job
  namespace: enterprise-crm
spec:
  schedule: "0 6 * * *"  # Daily at 6 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: data-discovery
            image: apache/spark:v3.5.0
            command:
            - /bin/bash
            - -c
            - |
              # Install dependencies
              pip install --upgrade pip
              pip install pyspark delta-spark pandas requests
              
              # Run data discovery for all sources
              python -c "
              import requests
              import time
              
              catalog_url = 'http://lakehouse-data-catalog:8080'
              sources = ['customer_service_db', 'crm_core_db', 'inventory_service_db', 'kafka_events']
              
              for source in sources:
                  try:
                      response = requests.post(f'{catalog_url}/discover/{source}')
                      print(f'Discovered tables for {source}: {response.status_code}')
                      time.sleep(5)
                  except Exception as e:
                      print(f'Error discovering {source}: {e}')
              "
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"
          restartPolicy: OnFailure

