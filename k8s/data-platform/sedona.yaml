---
# Apache Sedona Geospatial Analytics Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sedona-geospatial-analytics
  namespace: enterprise-crm
  labels:
    app: sedona-geospatial-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sedona-geospatial-analytics
  template:
    metadata:
      labels:
        app: sedona-geospatial-analytics
    spec:
      containers:
      - name: sedona-analytics
        image: apache/spark:v3.5.0
        command:
        - /bin/bash
        - -c
        - |
          # Install Python dependencies
          pip install --upgrade pip
          pip install -r /config/requirements.txt
          
          # Download Sedona JARs
          cd /opt/spark/jars
          wget -q https://repo1.maven.org/maven2/org/apache/sedona/sedona-spark-shaded-3.4_2.12/1.5.0/sedona-spark-shaded-3.4_2.12-1.5.0.jar
          wget -q https://repo1.maven.org/maven2/org/datasyslab/geotools-wrapper/1.5.0-28.2/geotools-wrapper-1.5.0-28.2.jar
          
          # Set Spark configuration
          export SPARK_CONF_DIR=/config
          
          # Wait for Spark cluster to be ready
          until curl -s http://spark-master:8080 > /dev/null; do
            echo "Waiting for Spark cluster..."
            sleep 5
          done
          
          # Run geospatial analytics service
          python /config/geospatial-analytics-service.py
        env:
        - name: SPARK_MASTER_URL
          value: "spark://spark-master:7077"
        - name: PYSPARK_PYTHON
          value: "python3"
        - name: PYSPARK_DRIVER_PYTHON
          value: "python3"
        - name: SPARK_CONF_DIR
          value: "/config"
        volumeMounts:
        - name: config
          mountPath: /config
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 4040
          name: spark-ui
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: sedona-config
---
apiVersion: v1
kind: Service
metadata:
  name: sedona-geospatial-analytics
  namespace: enterprise-crm
  labels:
    app: sedona-geospatial-analytics
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 4040
    targetPort: 4040
    name: spark-ui
  selector:
    app: sedona-geospatial-analytics
  type: ClusterIP
---
# Geospatial Data Processing Job
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geospatial-data-processing
  namespace: enterprise-crm
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: geospatial-processor
            image: apache/spark:v3.5.0
            command:
            - /bin/bash
            - -c
            - |
              # Install dependencies
              pip install --upgrade pip
              pip install pyspark apache-sedona geopandas pandas
              
              # Download Sedona JARs
              cd /opt/spark/jars
              wget -q https://repo1.maven.org/maven2/org/apache/sedona/sedona-spark-shaded-3.4_2.12/1.5.0/sedona-spark-shaded-3.4_2.12-1.5.0.jar
              wget -q https://repo1.maven.org/maven2/org/datasyslab/geotools-wrapper/1.5.0-28.2/geotools-wrapper-1.5.0-28.2.jar
              
              # Run geospatial data processing
              python /scripts/process-geospatial-data.py
            env:
            - name: SPARK_MASTER_URL
              value: "spark://spark-master:7077"
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"
          volumes:
          - name: scripts
            configMap:
              name: sedona-config
          restartPolicy: OnFailure
---
# HPA for Sedona Analytics Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sedona-analytics-hpa
  namespace: enterprise-crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sedona-geospatial-analytics
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

