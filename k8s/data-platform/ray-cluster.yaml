# Ray ML Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-ml-service
  namespace: enterprise-crm
  labels:
    app: ray-ml-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ray-ml-service
  template:
    metadata:
      labels:
        app: ray-ml-service
    spec:
      containers:
      - name: ray-ml-service
        image: rayproject/ray:2.8.0-py310
        command:
        - /bin/bash
        - -c
        - |
          # Install additional dependencies
          pip install --upgrade pip
          pip install fastapi uvicorn
          pip install pandas numpy scikit-learn xgboost lightgbm
          pip install mlflow wandb optuna
          pip install psycopg2-binary redis kafka-python
          
          # Wait for Ray cluster to be ready
          until ray status --address=ray-head:6379; do
            echo "Waiting for Ray cluster..."
            sleep 5
          done
          
          # Run ML service
          python /ray-config/ray-ml-service.py
        env:
        - name: RAY_ADDRESS
          value: "ray-head:6379"
        - name: RAY_DISABLE_IMPORT_WARNING
          value: "1"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: ray-config
          mountPath: /ray-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: ray-config
        configMap:
          name: ray-config
