---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: data
  labels:
    app.kubernetes.io/part-of: paygate
    security.paygate.io/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    # Allow from payment-core
    - from:
        - namespaceSelector:
            matchLabels:
              name: payment-core
          podSelector:
            matchLabels:
              app.kubernetes.io/requires: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow from security (session storage)
    - from:
        - namespaceSelector:
            matchLabels:
              name: security
      ports:
        - protocol: TCP
          port: 6379
    # Allow cluster communication
    - from:
        - namespaceSelector:
            matchLabels:
              name: data
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379  # Cluster bus

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: data
  labels:
    app.kubernetes.io/part-of: paygate
    security.paygate.io/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    # Allow from payment-core
    - from:
        - namespaceSelector:
            matchLabels:
              name: payment-core
          podSelector:
            matchLabels:
              app.kubernetes.io/requires: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
    # Allow from mojaloop
    - from:
        - namespaceSelector:
            matchLabels:
              name: mojaloop
          podSelector:
            matchLabels:
              app.kubernetes.io/requires: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
    # Allow from Flink (data processing)
    - from:
        - namespaceSelector:
            matchLabels:
              name: data
          podSelector:
            matchLabels:
              app: flink
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
    # Allow broker communication
    - from:
        - namespaceSelector:
            matchLabels:
              name: data
          podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094  # Controller

