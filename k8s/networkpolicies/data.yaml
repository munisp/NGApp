apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs-ingress
  namespace: data
  labels:
    app.kubernetes.io/part-of: paygate
    security.paygate.io/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes:
    - Ingress
  ingress:
    # Allow from payment-core
    - from:
        - namespaceSelector:
            matchLabels:
              name: payment-core
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001  # Console
