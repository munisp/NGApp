# Data Namespace Network Policies
# Implements Zero Trust micro-segmentation for data services

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigerbeetle-ingress
  namespace: data
  labels:
    app.kubernetes.io/part-of: paygate
    security.paygate.io/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app: tigerbeetle
  policyTypes:
    - Ingress
  ingress:
    # Allow from payment-core only
    - from:
        - namespaceSelector:
            matchLabels:
              name: payment-core
          podSelector:
            matchLabels:
              app.kubernetes.io/requires: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
    # Allow from mojaloop
    - from:
        - namespaceSelector:
            matchLabels:
              name: mojaloop
          podSelector:
            matchLabels:
              app.kubernetes.io/requires: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
    # Allow cluster replication
    - from:
        - namespaceSelector:
            matchLabels:
              name: data
          podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - protocol: TCP
          port: 3001  # Replication port

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigerbeetle-egress
  namespace: data
  labels:
    app.kubernetes.io/part-of: paygate
    security.paygate.io/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app: tigerbeetle
  policyTypes:
    - Egress
  egress:
    # Allow cluster replication
    - to:
        - namespaceSelector:
            matchLabels:
              name: data
          podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - protocol: TCP
          port: 3001
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

