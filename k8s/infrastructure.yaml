# A6: Infrastructure components — PostgreSQL, Redis, Kafka, OpenSearch
# Production: Replace with managed services (RDS, ElastiCache, MSK, etc.)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: 54bank-config
  namespace: 54bank
data:
  kafka-brokers: "kafka:9092"
  opensearch-url: "http://opensearch:9200"
  apisix-admin-url: "http://apisix-admin:9180"
  environment: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: 54bank-secrets
  namespace: 54bank
type: Opaque
stringData:
  database-url: "postgresql://banking:CHANGE_ME@postgres:5432/banking54"
  redis-url: "redis://redis:6379"
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  encryption-key: "CHANGE_ME_IN_PRODUCTION"
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: 54bank
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "banking54"
            - name: POSTGRES_USER
              value: "banking"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 54bank-secrets
                  key: database-url
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "banking", "-d", "banking54"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: 54bank
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
  clusterIP: None
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: 54bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: 54bank
spec:
  selector:
    app: redis
  ports:
    - port: 6379
