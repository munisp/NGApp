apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-service
  namespace: ngapp
  labels:
    app: liveness-service
    component: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liveness-service
  template:
    metadata:
      labels:
        app: liveness-service
        component: security
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "liveness-service"
        dapr.io/app-port: "8090"
    spec:
      containers:
        - name: liveness-service
          image: ngapp/liveness-service:latest
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: PORT
              value: "8090"
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cors-config
                  key: allowed_origins
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: PUBSUB_NAME
              value: "kafka-pubsub"
            - name: LIVENESS_TOPIC
              value: "liveness-events"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: liveness-service
  namespace: ngapp
spec:
  selector:
    app: liveness-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepfake-detector
  namespace: ngapp
  labels:
    app: deepfake-detector
    component: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deepfake-detector
  template:
    metadata:
      labels:
        app: deepfake-detector
        component: security
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "deepfake-detector"
        dapr.io/app-port: "8091"
    spec:
      containers:
        - name: deepfake-detector
          image: ngapp/deepfake-detector:latest
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: PORT
              value: "8091"
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cors-config
                  key: allowed_origins
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: deepfake-detector
  namespace: ngapp
spec:
  selector:
    app: deepfake-detector
  ports:
    - name: http
      port: 8091
      targetPort: 8091
