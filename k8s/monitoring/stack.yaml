apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-cluster-master
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: master
spec:
  serviceName: opensearch-cluster-master
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/component: master
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      initContainers:
        - name: configure-sysctl
          image: docker.io/busybox:1.35
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true
            runAsUser: 0
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.11.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: cluster.name
              value: "opensearch-cluster"
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.seed_hosts
              value: "opensearch-cluster-master-0.opensearch-cluster-master,opensearch-cluster-master-1.opensearch-cluster-master,opensearch-cluster-master-2.opensearch-cluster-master"
            - name: cluster.initial_master_nodes
              value: "opensearch-cluster-master-0,opensearch-cluster-master-1,opensearch-cluster-master-2"
            - name: bootstrap.memory_lock
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: node.roles
              value: "master,ingest,data,remote_cluster_client"
            - name: DISABLE_SECURITY_PLUGIN
              value: "false"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
            - name: opensearch-config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
      volumes:
        - name: opensearch-config
          configMap:
            name: opensearch-config
  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
        storageClassName: fast-ssd
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-cluster-master
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: master
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: 9300
      protocol: TCP
  selector:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: master
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: client
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
  selector:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: master
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: config
data:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    
    plugins:
      security:
        ssl:
          transport:
            pemcert_filepath: esnode.pem
            pemkey_filepath: esnode-key.pem
            pemtrustedcas_filepath: root-ca.pem
            enforce_hostname_verification: false
          http:
            enabled: true
            pemcert_filepath: esnode.pem
            pemkey_filepath: esnode-key.pem
            pemtrustedcas_filepath: root-ca.pem
        allow_unsafe_democertificates: true
        allow_default_init_securityindex: true
        authcz:
          admin_dn:
            - CN=kirk,OU=client,O=client,L=test,C=de
        audit.type: internal_opensearch
        enable_snapshot_restore_privilege: true
        check_snapshot_restore_write_privileges: true
        restapi:
          roles_enabled: ["all_access", "security_rest_api_access"]
        system_indices:
          enabled: true
          indices:
            [
              ".opendistro-alerting-config",
              ".opendistro-alerting-alert*",
              ".opendistro-anomaly-results*",
              ".opendistro-anomaly-detector*",
              ".opendistro-anomaly-checkpoints",
              ".opendistro-anomaly-detection-state",
              ".opendistro-reports-*",
              ".opendistro-notifications-*",
              ".opendistro-notebooks",
              ".opendistro-asynchronous-search-response*",
            ]
    
    http.port: 9200
    transport.port: 9300
    
    discovery.type: zen
    discovery.zen.minimum_master_nodes: 2
    discovery.zen.ping.unicast.hosts: ["opensearch-cluster-master-0.opensearch-cluster-master", "opensearch-cluster-master-1.opensearch-cluster-master", "opensearch-cluster-master-2.opensearch-cluster-master"]
    
    gateway.expected_nodes: 3
    gateway.expected_master_nodes: 2
    gateway.recover_after_nodes: 2
    gateway.recover_after_master_nodes: 2
    
    action.destructive_requires_name: true
    
    indices.recovery.max_bytes_per_sec: 100mb
    indices.memory.index_buffer_size: 30%
    
    thread_pool:
      write:
        size: 30
        queue_size: 10000
      search:
        size: 30
        queue_size: 10000
      get:
        size: 30
        queue_size: 10000
      analyze:
        size: 1
        queue_size: 16
      
    cluster.routing.allocation.disk.threshold_enabled: true
    cluster.routing.allocation.disk.watermark.low: 85%
    cluster.routing.allocation.disk.watermark.high: 90%
    cluster.routing.allocation.disk.watermark.flood_stage: 95%
    cluster.info.update.interval: 1m
    
    logger.level: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/component: dashboards
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch-dashboards
      app.kubernetes.io/component: dashboards
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-dashboards
        app.kubernetes.io/component: dashboards
    spec:
      containers:
        - name: opensearch-dashboards
          image: opensearchproject/opensearch-dashboards:2.11.0
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: OPENSEARCH_HOSTS
              value: '["https://opensearch:9200"]'
            - name: SERVER_HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: opensearch-dashboards-config
              mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
      volumes:
        - name: opensearch-dashboards-config
          configMap:
            name: opensearch-dashboards-config
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/component: dashboards
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5601
      targetPort: 5601
      protocol: TCP
  selector:
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/component: dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-dashboards-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/component: config
data:
  opensearch_dashboards.yml: |
    server.name: opensearch-dashboards
    server.host: "0.0.0.0"
    server.port: 5601
    
    opensearch.hosts: ["https://opensearch:9200"]
    opensearch.ssl.verificationMode: none
    opensearch.username: "kibanaserver"
    opensearch.password: "kibanaserver"
    opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]
    
    opensearch_security.multitenancy.enabled: true
    opensearch_security.multitenancy.tenants.preferred: ["Private", "Global"]
    opensearch_security.readonly_mode.roles: ["kibana_read_only"]
    
    opensearch_security.cookie.secure: false
    opensearch_security.cookie.password: "security_cookie_default_password"
    
    logging.dest: stdout
    logging.silent: false
    logging.quiet: false
    logging.verbose: false
    
    pid.file: /var/run/opensearchDashboards.pid
    
    ops.interval: 5000
    
    i18n.locale: "en"

