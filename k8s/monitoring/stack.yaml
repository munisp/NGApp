apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubecost
      app.kubernetes.io/component: cost-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubecost
        app.kubernetes.io/component: cost-analyzer
    spec:
      containers:
        - name: cost-analyzer-frontend
          image: gcr.io/kubecost1/frontend:v1.106.2
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: GET_HOSTS_FROM
              value: "dns"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        - name: cost-analyzer-server
          image: gcr.io/kubecost1/server:v1.106.2
          ports:
            - containerPort: 9003
              name: server
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://prometheus-server.monitoring.svc.cluster.local"
            - name: CLOUD_PROVIDER_API_KEY
              value: "AIzaSyDXQPG_MHUEy9neR7stolq6l0ujXmjJlvk"
            - name: CLUSTER_ID
              value: "enterprise-crm-cluster"
            - name: KUBECOST_NAMESPACE
              value: "monitoring"
            - name: KUBECOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubecost-token
                  key: token
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: persistent-configs
              mountPath: /var/configs
        - name: cost-model
          image: gcr.io/kubecost1/cost-model:v1.106.2
          ports:
            - containerPort: 9003
              name: cost-model
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://prometheus-server.monitoring.svc.cluster.local"
            - name: CLOUD_PROVIDER_API_KEY
              value: "AIzaSyDXQPG_MHUEy9neR7stolq6l0ujXmjJlvk"
            - name: CLUSTER_ID
              value: "enterprise-crm-cluster"
            - name: KUBECOST_NAMESPACE
              value: "monitoring"
            - name: CONFIG_PATH
              value: "/var/configs/"
            - name: DB_BASIC_AUTH_USERNAME
              value: "admin"
            - name: DB_BASIC_AUTH_PW
              valueFrom:
                secretKeyRef:
                  name: kubecost-cost-analyzer
                  key: DB_BASIC_AUTH_PW
            - name: KUBECOST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubecost-token
                  key: token
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: persistent-configs
              mountPath: /var/configs
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: persistent-configs
          persistentVolumeClaim:
            claimName: kubecost-cost-analyzer
---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-cost-analyzer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analyzer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: server
      port: 9003
      targetPort: 9003
      protocol: TCP
  selector:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analyzer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubecost-cost-analyzer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 32Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: config
data:
  default.conf: |
    server {
        listen 9090;
        server_name _;
        root /var/www;
        index index.html;
        
        add_header Cache-Control "max-age=300";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type' always;
        
        location /api/ {
            proxy_pass http://127.0.0.1:9001/;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /model/ {
            proxy_pass http://127.0.0.1:9003/;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: kubecost-token
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: secret
type: Opaque
data:
  token: a3ViZWNvc3QtdG9rZW4tMjAyNA== # kubecost-token-2024
---
apiVersion: v1
kind: Secret
metadata:
  name: kubecost-cost-analyzer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: secret
type: Opaque
data:
  DB_BASIC_AUTH_PW: YWRtaW4xMjM= # admin123
