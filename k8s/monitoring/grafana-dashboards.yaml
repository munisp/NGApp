apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: enterprise-crm
  labels:
    grafana_dashboard: "1"
data:
  # Executive Dashboard
  executive-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Enterprise CRM - Executive Dashboard",
        "tags": ["enterprise-crm", "executive", "business"],
        "timezone": "browser",
        "refresh": "30s",
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "System Health Overview",
            "type": "stat",
            "targets": [
              {
                "expr": "avg(enterprise_crm:availability)",
                "legendFormat": "Overall Availability"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0.95,
                "max": 1,
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0.95},
                    {"color": "yellow", "value": 0.99},
                    {"color": "green", "value": 0.999}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Daily Active Users",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(increase(user_sessions_total[24h]))",
                "legendFormat": "Daily Active Users"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 6, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "Revenue Today",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(increase(revenue_total[24h]))",
                "legendFormat": "Daily Revenue"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "currencyUSD",
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0}
          },
          {
            "id": 4,
            "title": "Infrastructure Cost",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(kubecost_cluster_cost_per_hour)",
                "legendFormat": "Hourly Cost"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "currencyUSD",
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0}
          },
          {
            "id": 5,
            "title": "Customer Growth Trend",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(increase(customer_created_total[1h]))",
                "legendFormat": "New Customers/Hour"
              }
            ],
            "yAxes": [
              {"label": "Customers", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 6,
            "title": "Sales Pipeline Value",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(opportunity_value_total) by (stage)",
                "legendFormat": "{{stage}}"
              }
            ],
            "yAxes": [
              {"label": "Value ($)", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 7,
            "title": "Service Performance SLOs",
            "type": "table",
            "targets": [
              {
                "expr": "enterprise_crm:availability",
                "legendFormat": "{{service}}"
              },
              {
                "expr": "enterprise_crm:latency_p95",
                "legendFormat": "{{service}}"
              },
              {
                "expr": "enterprise_crm:error_rate",
                "legendFormat": "{{service}}"
              }
            ],
            "transformations": [
              {
                "id": "merge",
                "options": {}
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16}
          }
        ]
      }
    }

  # Operational Dashboard
  operational-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Enterprise CRM - Operational Dashboard",
        "tags": ["enterprise-crm", "operations", "sre"],
        "timezone": "browser",
        "refresh": "15s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Request Rate by Service",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:request_rate",
                "legendFormat": "{{service}}"
              }
            ],
            "yAxes": [
              {"label": "Requests/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Error Rate by Service",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:error_rate * 100",
                "legendFormat": "{{service}}"
              }
            ],
            "yAxes": [
              {"label": "Error Rate (%)", "min": 0, "max": 5}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Response Time Percentiles",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:latency_p50",
                "legendFormat": "{{service}} P50"
              },
              {
                "expr": "enterprise_crm:latency_p95",
                "legendFormat": "{{service}} P95"
              },
              {
                "expr": "enterprise_crm:latency_p99",
                "legendFormat": "{{service}} P99"
              }
            ],
            "yAxes": [
              {"label": "Response Time (s)", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Database Performance",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:db_connection_utilization * 100",
                "legendFormat": "{{service}} Connection Pool"
              },
              {
                "expr": "enterprise_crm:db_query_duration_p95",
                "legendFormat": "{{service}} Query P95"
              }
            ],
            "yAxes": [
              {"label": "Utilization (%) / Duration (s)", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Cache Performance",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:cache_hit_rate * 100",
                "legendFormat": "{{service}} Hit Rate"
              }
            ],
            "yAxes": [
              {"label": "Hit Rate (%)", "min": 0, "max": 100}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Resource Utilization",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:cpu_utilization * 100",
                "legendFormat": "CPU {{pod}}"
              },
              {
                "expr": "enterprise_crm:memory_utilization * 100",
                "legendFormat": "Memory {{pod}}"
              }
            ],
            "yAxes": [
              {"label": "Utilization (%)", "min": 0, "max": 100}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          }
        ]
      }
    }

  # Business Intelligence Dashboard
  business-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Enterprise CRM - Business Intelligence",
        "tags": ["enterprise-crm", "business", "analytics"],
        "timezone": "browser",
        "refresh": "5m",
        "time": {
          "from": "now-7d",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Customer Acquisition Funnel",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(increase(lead_created_total[1h]))",
                "legendFormat": "Leads Created"
              },
              {
                "expr": "sum(increase(lead_qualified_total[1h]))",
                "legendFormat": "Leads Qualified"
              },
              {
                "expr": "sum(increase(opportunity_created_total[1h]))",
                "legendFormat": "Opportunities Created"
              },
              {
                "expr": "sum(increase(customer_created_total[1h]))",
                "legendFormat": "Customers Created"
              }
            ],
            "yAxes": [
              {"label": "Count", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Sales Performance",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(increase(opportunity_won_total[1h])) * 100 / sum(increase(opportunity_created_total[1h]))",
                "legendFormat": "Win Rate %"
              },
              {
                "expr": "avg(opportunity_cycle_time_days)",
                "legendFormat": "Avg Cycle Time (days)"
              }
            ],
            "yAxes": [
              {"label": "Rate (%) / Days", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Revenue Trends",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(increase(revenue_total[1d]))",
                "legendFormat": "Daily Revenue"
              },
              {
                "expr": "sum(increase(revenue_total[7d])) / 7",
                "legendFormat": "7-Day Average"
              }
            ],
            "yAxes": [
              {"label": "Revenue ($)", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Customer Segments",
            "type": "piechart",
            "targets": [
              {
                "expr": "sum(customer_segment_count) by (segment)",
                "legendFormat": "{{segment}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Inventory Turnover",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:inventory_turnover_rate",
                "legendFormat": "Turnover Rate"
              },
              {
                "expr": "avg(inventory_stock_level)",
                "legendFormat": "Average Stock Level"
              }
            ],
            "yAxes": [
              {"label": "Rate / Level", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Top Products by Revenue",
            "type": "table",
            "targets": [
              {
                "expr": "topk(10, sum(increase(product_revenue_total[7d])) by (product_name))",
                "legendFormat": "{{product_name}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          }
        ]
      }
    }

  # Infrastructure Dashboard
  infrastructure-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Enterprise CRM - Infrastructure",
        "tags": ["enterprise-crm", "infrastructure", "kubernetes"],
        "timezone": "browser",
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Cluster Resource Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(enterprise_crm:node_cpu_utilization) / count(enterprise_crm:node_cpu_utilization) * 100",
                "legendFormat": "CPU Utilization %"
              },
              {
                "expr": "sum(enterprise_crm:node_memory_utilization) / count(enterprise_crm:node_memory_utilization) * 100",
                "legendFormat": "Memory Utilization %"
              }
            ],
            "yAxes": [
              {"label": "Utilization (%)", "min": 0, "max": 100}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Pod Status",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(kube_pod_status_phase{namespace=\"enterprise-crm\", phase=\"Running\"})",
                "legendFormat": "Running"
              },
              {
                "expr": "sum(kube_pod_status_phase{namespace=\"enterprise-crm\", phase=\"Pending\"})",
                "legendFormat": "Pending"
              },
              {
                "expr": "sum(kube_pod_status_phase{namespace=\"enterprise-crm\", phase=\"Failed\"})",
                "legendFormat": "Failed"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"}
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Network Traffic",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"enterprise-crm\"}[5m]))",
                "legendFormat": "Ingress"
              },
              {
                "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"enterprise-crm\"}[5m]))",
                "legendFormat": "Egress"
              }
            ],
            "yAxes": [
              {"label": "Bytes/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Storage Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(container_fs_usage_bytes{namespace=\"enterprise-crm\"}) / sum(container_fs_limit_bytes{namespace=\"enterprise-crm\"}) * 100",
                "legendFormat": "Storage Utilization %"
              }
            ],
            "yAxes": [
              {"label": "Utilization (%)", "min": 0, "max": 100}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Kafka Performance",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:kafka_message_rate",
                "legendFormat": "{{topic}}"
              }
            ],
            "yAxes": [
              {"label": "Messages/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Service Mesh Performance",
            "type": "graph",
            "targets": [
              {
                "expr": "enterprise_crm:dapr_service_invocation_rate",
                "legendFormat": "{{app_id}} -> {{target}}"
              }
            ],
            "yAxes": [
              {"label": "Invocations/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          }
        ]
      }
    }

  # Cost Management Dashboard
  cost-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Enterprise CRM - Cost Management",
        "tags": ["enterprise-crm", "cost", "kubecost"],
        "timezone": "browser",
        "refresh": "5m",
        "time": {
          "from": "now-30d",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Monthly Cost Trend",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(increase(kubecost_cluster_cost_total[1d]))",
                "legendFormat": "Daily Cost"
              }
            ],
            "yAxes": [
              {"label": "Cost ($)", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Cost by Service",
            "type": "piechart",
            "targets": [
              {
                "expr": "sum(kubecost_pod_cost_total) by (service)",
                "legendFormat": "{{service}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Resource Cost Breakdown",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(kubecost_cpu_cost_total)",
                "legendFormat": "CPU Cost"
              },
              {
                "expr": "sum(kubecost_memory_cost_total)",
                "legendFormat": "Memory Cost"
              },
              {
                "expr": "sum(kubecost_storage_cost_total)",
                "legendFormat": "Storage Cost"
              },
              {
                "expr": "sum(kubecost_network_cost_total)",
                "legendFormat": "Network Cost"
              }
            ],
            "yAxes": [
              {"label": "Cost ($)", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Cost Efficiency",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(kubecost_idle_cost_total) / sum(kubecost_cluster_cost_total) * 100",
                "legendFormat": "Idle Cost %"
              },
              {
                "expr": "sum(kubecost_utilized_cost_total) / sum(kubecost_cluster_cost_total) * 100",
                "legendFormat": "Utilized Cost %"
              }
            ],
            "yAxes": [
              {"label": "Percentage (%)", "min": 0, "max": 100}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Budget vs Actual",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(increase(kubecost_cluster_cost_total[1d]))",
                "legendFormat": "Actual Daily Cost"
              },
              {
                "expr": "350",
                "legendFormat": "Daily Budget"
              }
            ],
            "yAxes": [
              {"label": "Cost ($)", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Cost Optimization Opportunities",
            "type": "table",
            "targets": [
              {
                "expr": "topk(10, kubecost_idle_cost_total)",
                "legendFormat": "{{pod}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          }
        ]
      }
    }

  # Security Dashboard
  security-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Enterprise CRM - Security Monitoring",
        "tags": ["enterprise-crm", "security", "compliance"],
        "timezone": "browser",
        "refresh": "30s",
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Authentication Events",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(keycloak_login_attempts_total[5m]))",
                "legendFormat": "Login Attempts"
              },
              {
                "expr": "sum(rate(keycloak_login_failures_total[5m]))",
                "legendFormat": "Login Failures"
              }
            ],
            "yAxes": [
              {"label": "Events/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "API Security Events",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(apisix_http_requests_total{status=~\"4..\"}[5m]))",
                "legendFormat": "4xx Errors"
              },
              {
                "expr": "sum(rate(apisix_http_requests_total{status=\"429\"}[5m]))",
                "legendFormat": "Rate Limited"
              }
            ],
            "yAxes": [
              {"label": "Events/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Threat Detection",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(wazuh_alerts_total[5m])) by (severity)",
                "legendFormat": "{{severity}}"
              }
            ],
            "yAxes": [
              {"label": "Alerts/sec", "min": 0}
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Compliance Status",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(compliance_check_passed_total) / sum(compliance_check_total) * 100",
                "legendFormat": "Compliance Score"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 80},
                    {"color": "yellow", "value": 90},
                    {"color": "green", "value": 95}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ]
      }
    }

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: enterprise-crm
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      containers:
      - name: grafana
        image: grafana/grafana:10.1.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secret
              key: admin-password
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel"
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana.enterprise-crm.local"
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: "KeyCloak"
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: "grafana"
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-secret
              key: oauth-client-secret
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: "openid profile email"
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: "https://keycloak.enterprise-crm.local/auth/realms/enterprise-crm/protocol/openid-connect/auth"
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: "https://keycloak.enterprise-crm.local/auth/realms/enterprise-crm/protocol/openid-connect/token"
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: "https://keycloak.enterprise-crm.local/auth/realms/enterprise-crm/protocol/openid-connect/userinfo"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: datasources
        configMap:
          name: grafana-datasources

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: enterprise-crm
  labels:
    app: grafana
spec:
  ports:
  - port: 80
    targetPort: 3000
    name: http
  selector:
    app: grafana
  type: ClusterIP

---
# Grafana ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: enterprise-crm
  labels:
    app: grafana

---
# Grafana PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: enterprise-crm
  labels:
    app: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
# Grafana Datasources
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: enterprise-crm
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-server:80
      isDefault: true
      editable: true
      jsonData:
        timeInterval: "15s"
        queryTimeout: "60s"
        httpMethod: "POST"
    - name: Kubecost
      type: prometheus
      access: proxy
      url: http://kubecost-cost-analyzer.kubecost:9090
      editable: true
      jsonData:
        timeInterval: "30s"
        queryTimeout: "60s"
        httpMethod: "POST"

---
# Grafana Secrets
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: enterprise-crm
type: Opaque
data:
  admin-password: "Z3JhZmFuYS1hZG1pbi0yMDI0"  # Base64 encoded
  oauth-client-secret: "Z3JhZmFuYS1vYXV0aC1zZWNyZXQ="  # Base64 encoded

---
# Grafana Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: enterprise-crm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - grafana.enterprise-crm.local
    secretName: grafana-tls
  rules:
  - host: grafana.enterprise-crm.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 80

