apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: enterprise-crm
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.enterprise-crm.local:587'
      smtp_from: 'alerts@enterprise-crm.local'
      smtp_auth_username: 'alerts@enterprise-crm.local'
      smtp_auth_password: 'smtp-password'
      slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
      resolve_timeout: 5m

    # Alert routing configuration
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default-receiver'
      routes:
      # Critical alerts - immediate escalation
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 5m
        routes:
        - match:
            alertname: ServiceDown
          receiver: 'service-down-critical'
        - match:
            alertname: DatabaseDown
          receiver: 'database-critical'
        - match:
            alertname: SecurityBreach
          receiver: 'security-critical'

      # High severity alerts - escalate to on-call
      - match:
          severity: high
        receiver: 'high-severity-alerts'
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h

      # Warning alerts - team notifications
      - match:
          severity: warning
        receiver: 'warning-alerts'
        group_wait: 2m
        group_interval: 10m
        repeat_interval: 4h

      # Business alerts - business team notifications
      - match:
          category: business
        receiver: 'business-alerts'
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h

      # Cost alerts - finance team notifications
      - match:
          category: cost
        receiver: 'cost-alerts'
        group_wait: 10m
        group_interval: 1h
        repeat_interval: 24h

      # Security alerts - security team notifications
      - match:
          category: security
        receiver: 'security-alerts'
        group_wait: 1m
        group_interval: 5m
        repeat_interval: 2h

    # Alert receivers configuration
    receivers:
    # Default receiver
    - name: 'default-receiver'
      email_configs:
      - to: 'devops@enterprise-crm.local'
        subject: '[Enterprise CRM] Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}

    # Critical alerts - multiple channels
    - name: 'critical-alerts'
      email_configs:
      - to: 'sre-team@enterprise-crm.local,management@enterprise-crm.local'
        subject: '[CRITICAL] Enterprise CRM Alert: {{ .GroupLabels.alertname }}'
        body: |
          🚨 CRITICAL ALERT 🚨
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          
          Runbook: {{ .Annotations.runbook_url }}
          Dashboard: {{ .Annotations.dashboard_url }}
          {{ end }}
      slack_configs:
      - channel: '#critical-alerts'
        title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          *Started:* {{ .StartsAt }}
          {{ end }}
        actions:
        - type: button
          text: 'View Dashboard'
          url: '{{ .Annotations.dashboard_url }}'
        - type: button
          text: 'View Runbook'
          url: '{{ .Annotations.runbook_url }}'
      pagerduty_configs:
      - routing_key: 'enterprise-crm-critical'
        description: '{{ .GroupLabels.alertname }}: {{ .Annotations.summary }}'
        severity: 'critical'
        details:
          service: '{{ .Labels.service }}'
          instance: '{{ .Labels.instance }}'
          description: '{{ .Annotations.description }}'

    # Service down critical alerts
    - name: 'service-down-critical'
      email_configs:
      - to: 'sre-team@enterprise-crm.local,platform-team@enterprise-crm.local'
        subject: '[SERVICE DOWN] {{ .GroupLabels.service }} is unavailable'
        body: |
          🔴 SERVICE DOWN ALERT 🔴
          
          Service: {{ .GroupLabels.service }}
          Status: UNAVAILABLE
          
          {{ range .Alerts }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          
          Immediate Actions Required:
          1. Check service health dashboard
          2. Review recent deployments
          3. Check infrastructure status
          4. Escalate to on-call engineer
          
          Dashboard: {{ .Annotations.dashboard_url }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
      slack_configs:
      - channel: '#service-alerts'
        title: '🔴 SERVICE DOWN: {{ .GroupLabels.service }}'
        text: |
          Service {{ .GroupLabels.service }} is currently unavailable.
          Immediate attention required!
          
          {{ range .Alerts }}
          *Instance:* {{ .Labels.instance }}
          *Started:* {{ .StartsAt }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
      pagerduty_configs:
      - routing_key: 'enterprise-crm-service-down'
        description: 'Service Down: {{ .GroupLabels.service }}'
        severity: 'critical'

    # Database critical alerts
    - name: 'database-critical'
      email_configs:
      - to: 'dba-team@enterprise-crm.local,sre-team@enterprise-crm.local'
        subject: '[DATABASE CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          🔴 DATABASE CRITICAL ALERT 🔴
          
          {{ range .Alerts }}
          Database: {{ .Labels.database }}
          Issue: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          
          Immediate Actions:
          1. Check database connectivity
          2. Review connection pool status
          3. Check disk space and performance
          4. Review recent schema changes
          
          Dashboard: {{ .Annotations.dashboard_url }}
          {{ end }}
      slack_configs:
      - channel: '#database-alerts'
        title: '🔴 DATABASE CRITICAL: {{ .GroupLabels.alertname }}'

    # Security critical alerts
    - name: 'security-critical'
      email_configs:
      - to: 'security-team@enterprise-crm.local,soc@enterprise-crm.local'
        subject: '[SECURITY BREACH] {{ .GroupLabels.alertname }}'
        body: |
          🚨 SECURITY CRITICAL ALERT 🚨
          
          {{ range .Alerts }}
          Security Event: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Source: {{ .Labels.source }}
          Severity: {{ .Labels.severity }}
          Started: {{ .StartsAt }}
          
          Immediate Actions:
          1. Isolate affected systems
          2. Review security logs
          3. Check for data breach indicators
          4. Notify incident response team
          
          SIEM Dashboard: {{ .Annotations.siem_url }}
          {{ end }}
      slack_configs:
      - channel: '#security-alerts'
        title: '🚨 SECURITY BREACH: {{ .GroupLabels.alertname }}'

    # High severity alerts
    - name: 'high-severity-alerts'
      email_configs:
      - to: 'on-call@enterprise-crm.local'
        subject: '[HIGH] Enterprise CRM Alert: {{ .GroupLabels.alertname }}'
        body: |
          ⚠️ HIGH SEVERITY ALERT ⚠️
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          
          Dashboard: {{ .Annotations.dashboard_url }}
          {{ end }}
      slack_configs:
      - channel: '#high-priority-alerts'
        title: '⚠️ High Severity: {{ .GroupLabels.alertname }}'

    # Warning alerts
    - name: 'warning-alerts'
      email_configs:
      - to: 'devops@enterprise-crm.local'
        subject: '[WARNING] {{ .GroupLabels.alertname }}'
      slack_configs:
      - channel: '#monitoring-alerts'
        title: '⚠️ Warning: {{ .GroupLabels.alertname }}'

    # Business alerts
    - name: 'business-alerts'
      email_configs:
      - to: 'business-team@enterprise-crm.local,analytics@enterprise-crm.local'
        subject: '[BUSINESS ALERT] {{ .GroupLabels.alertname }}'
        body: |
          📊 BUSINESS ALERT 📊
          
          {{ range .Alerts }}
          Metric: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Current Value: {{ .Labels.value }}
          Threshold: {{ .Labels.threshold }}
          Started: {{ .StartsAt }}
          
          Business Impact: {{ .Annotations.business_impact }}
          Recommended Actions: {{ .Annotations.recommended_actions }}
          
          Dashboard: {{ .Annotations.dashboard_url }}
          {{ end }}
      slack_configs:
      - channel: '#business-alerts'
        title: '📊 Business Alert: {{ .GroupLabels.alertname }}'

    # Cost alerts
    - name: 'cost-alerts'
      email_configs:
      - to: 'finance@enterprise-crm.local,devops@enterprise-crm.local'
        subject: '[COST ALERT] {{ .GroupLabels.alertname }}'
        body: |
          💰 COST ALERT 💰
          
          {{ range .Alerts }}
          Cost Issue: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Current Cost: {{ .Labels.current_cost }}
          Budget: {{ .Labels.budget }}
          Overage: {{ .Labels.overage }}
          Started: {{ .StartsAt }}
          
          Cost Optimization Recommendations:
          {{ .Annotations.optimization_recommendations }}
          
          Kubecost Dashboard: {{ .Annotations.kubecost_url }}
          {{ end }}
      slack_configs:
      - channel: '#cost-alerts'
        title: '💰 Cost Alert: {{ .GroupLabels.alertname }}'

    # Security alerts
    - name: 'security-alerts'
      email_configs:
      - to: 'security-team@enterprise-crm.local'
        subject: '[SECURITY] {{ .GroupLabels.alertname }}'
        body: |
          🔒 SECURITY ALERT 🔒
          
          {{ range .Alerts }}
          Security Event: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Source: {{ .Labels.source }}
          Risk Level: {{ .Labels.risk_level }}
          Started: {{ .StartsAt }}
          
          Recommended Actions:
          {{ .Annotations.security_actions }}
          
          Security Dashboard: {{ .Annotations.security_dashboard_url }}
          {{ end }}
      slack_configs:
      - channel: '#security-monitoring'
        title: '🔒 Security Alert: {{ .GroupLabels.alertname }}'

    # Inhibition rules - prevent alert spam
    inhibit_rules:
    # Inhibit warning alerts when critical alerts are firing
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['service', 'instance']

    # Inhibit individual service alerts when service is down
    - source_match:
        alertname: 'ServiceDown'
      target_match_re:
        alertname: '(HighLatency|HighErrorRate|DatabaseSlow)'
      equal: ['service']

    # Inhibit node alerts when entire cluster is down
    - source_match:
        alertname: 'ClusterDown'
      target_match_re:
        alertname: '(NodeDown|NodeHighCPU|NodeHighMemory)'
      equal: ['cluster']

---
# AlertManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: enterprise-crm
  labels:
    app: alertmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      serviceAccountName: alertmanager
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.26.0
        ports:
        - containerPort: 9093
          name: http
        - containerPort: 9094
          name: cluster
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        - '--data.retention=120h'
        - '--cluster.listen-address=0.0.0.0:9094'
        - '--cluster.peer=alertmanager-0.alertmanager.enterprise-crm.svc.cluster.local:9094'
        - '--cluster.peer=alertmanager-1.alertmanager.enterprise-crm.svc.cluster.local:9094'
        - '--web.external-url=https://alertmanager.enterprise-crm.local'
        - '--web.route-prefix=/'
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: storage
          mountPath: /alertmanager
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        persistentVolumeClaim:
          claimName: alertmanager-pvc

---
# AlertManager Service
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: enterprise-crm
  labels:
    app: alertmanager
spec:
  ports:
  - port: 80
    targetPort: 9093
    name: http
  - port: 9094
    targetPort: 9094
    name: cluster
  selector:
    app: alertmanager
  type: ClusterIP

---
# AlertManager ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: enterprise-crm
  labels:
    app: alertmanager

---
# AlertManager PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-pvc
  namespace: enterprise-crm
  labels:
    app: alertmanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd

---
# AlertManager Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager-ingress
  namespace: enterprise-crm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: alertmanager-auth
spec:
  tls:
  - hosts:
    - alertmanager.enterprise-crm.local
    secretName: alertmanager-tls
  rules:
  - host: alertmanager.enterprise-crm.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alertmanager
            port:
              number: 80

---
# AlertManager Authentication Secret
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-auth
  namespace: enterprise-crm
type: Opaque
data:
  auth: "YWRtaW46JGFwcjEkSDY1dnVhJE9wNzJGWkJuUVFGVUNGRzJCUUNaLi4="  # admin:alertmanager-2024

---
# Prometheus AlertRules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: enterprise-crm-alerts
  namespace: enterprise-crm
  labels:
    app: prometheus
spec:
  groups:
  - name: enterprise-crm.rules
    interval: 30s
    rules:
    # Service availability alerts
    - alert: ServiceDown
      expr: up{job=~"enterprise-crm-.*"} == 0
      for: 1m
      labels:
        severity: critical
        category: infrastructure
      annotations:
        summary: "Service {{ $labels.job }} is down"
        description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."
        runbook_url: "https://runbooks.enterprise-crm.local/service-down"
        dashboard_url: "https://grafana.enterprise-crm.local/d/operational-dashboard"

    # High error rate alerts
    - alert: HighErrorRate
      expr: enterprise_crm:error_rate > 0.05
      for: 5m
      labels:
        severity: high
        category: performance
      annotations:
        summary: "High error rate on {{ $labels.service }}"
        description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.service }}"
        dashboard_url: "https://grafana.enterprise-crm.local/d/operational-dashboard"

    # High latency alerts
    - alert: HighLatency
      expr: enterprise_crm:latency_p95 > 2
      for: 5m
      labels:
        severity: high
        category: performance
      annotations:
        summary: "High latency on {{ $labels.service }}"
        description: "95th percentile latency is {{ $value }}s on {{ $labels.service }}"
        dashboard_url: "https://grafana.enterprise-crm.local/d/operational-dashboard"

    # Database alerts
    - alert: DatabaseDown
      expr: up{job="postgresql"} == 0
      for: 1m
      labels:
        severity: critical
        category: database
      annotations:
        summary: "Database is down"
        description: "PostgreSQL database on {{ $labels.instance }} is down"
        runbook_url: "https://runbooks.enterprise-crm.local/database-down"

    - alert: DatabaseHighConnections
      expr: enterprise_crm:db_connection_utilization > 0.9
      for: 5m
      labels:
        severity: high
        category: database
      annotations:
        summary: "Database connection pool nearly exhausted"
        description: "Database connection utilization is {{ $value | humanizePercentage }} on {{ $labels.service }}"

    # Resource alerts
    - alert: HighCPUUsage
      expr: enterprise_crm:cpu_utilization > 0.8
      for: 10m
      labels:
        severity: warning
        category: resources
      annotations:
        summary: "High CPU usage on {{ $labels.pod }}"
        description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"

    - alert: HighMemoryUsage
      expr: enterprise_crm:memory_utilization > 0.9
      for: 5m
      labels:
        severity: high
        category: resources
      annotations:
        summary: "High memory usage on {{ $labels.pod }}"
        description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"

    # Business alerts
    - alert: LowCustomerCreationRate
      expr: rate(customer_created_total[1h]) < 0.1
      for: 30m
      labels:
        severity: warning
        category: business
      annotations:
        summary: "Low customer creation rate"
        description: "Customer creation rate is {{ $value }} customers/hour, below threshold of 0.1"
        business_impact: "Potential impact on growth targets"
        recommended_actions: "Review marketing campaigns and lead generation"
        dashboard_url: "https://grafana.enterprise-crm.local/d/business-dashboard"

    - alert: LowOpportunityConversionRate
      expr: (rate(opportunity_won_total[24h]) / rate(opportunity_created_total[24h])) < 0.2
      for: 1h
      labels:
        severity: warning
        category: business
      annotations:
        summary: "Low opportunity conversion rate"
        description: "Opportunity conversion rate is {{ $value | humanizePercentage }}, below 20% threshold"
        business_impact: "Revenue targets at risk"
        recommended_actions: "Review sales process and training"

    # Cost alerts
    - alert: BudgetOverrun
      expr: increase(kubecost_cluster_cost_total[1d]) > 350
      for: 1h
      labels:
        severity: high
        category: cost
      annotations:
        summary: "Daily budget exceeded"
        description: "Daily cost is ${{ $value }}, exceeding budget of $350"
        current_cost: "{{ $value }}"
        budget: "350"
        overage: "{{ $value | humanize }}%"
        optimization_recommendations: "Review idle resources and right-size workloads"
        kubecost_url: "https://kubecost.enterprise-crm.local"

    # Security alerts
    - alert: HighFailedLogins
      expr: rate(keycloak_login_failures_total[5m]) > 10
      for: 2m
      labels:
        severity: high
        category: security
        risk_level: medium
      annotations:
        summary: "High number of failed login attempts"
        description: "Failed login rate is {{ $value }} attempts/second"
        security_actions: "Review authentication logs and consider IP blocking"
        security_dashboard_url: "https://grafana.enterprise-crm.local/d/security-dashboard"

    - alert: SecurityBreach
      expr: wazuh_alerts_total{severity="critical"} > 0
      for: 0s
      labels:
        severity: critical
        category: security
      annotations:
        summary: "Critical security alert detected"
        description: "Wazuh has detected a critical security event"
        siem_url: "https://wazuh.enterprise-crm.local"

