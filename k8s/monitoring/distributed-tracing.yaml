apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: enterprise-crm
data:
  jaeger-config.yaml: |
    # Jaeger Distributed Tracing Configuration
    apiVersion: jaegertracing.io/v1
    kind: Jaeger
    metadata:
      name: enterprise-crm-jaeger
      namespace: enterprise-crm
    spec:
      strategy: production
      storage:
        type: elasticsearch
        elasticsearch:
          nodeCount: 3
          redundancyPolicy: SingleRedundancy
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          storage:
            storageClassName: "fast-ssd"
            size: "100Gi"
        options:
          es:
            server-urls: "http://elasticsearch:9200"
            index-prefix: "jaeger"
            username: "jaeger"
            password: "jaeger-password"
            tls:
              enabled: false
      collector:
        replicas: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        options:
          collector:
            num-workers: 100
            queue-size: 2000
            log-level: "info"
      query:
        replicas: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        options:
          query:
            base-path: "/jaeger"
            log-level: "info"
            max-clock-skew-adjustment: "0s"
      agent:
        strategy: DaemonSet
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        options:
          agent:
            log-level: "info"
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: "nginx"
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
        hosts:
          - jaeger.enterprise-crm.local
        tls:
          - secretName: jaeger-tls
            hosts:
              - jaeger.enterprise-crm.local

  zipkin-config.yaml: |
    # Zipkin Distributed Tracing Configuration
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: zipkin
      namespace: enterprise-crm
      labels:
        app: zipkin
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: zipkin
      template:
        metadata:
          labels:
            app: zipkin
        spec:
          containers:
          - name: zipkin
            image: openzipkin/zipkin:2.24
            ports:
            - containerPort: 9411
              name: http
            env:
            - name: STORAGE_TYPE
              value: "elasticsearch"
            - name: ES_HOSTS
              value: "http://elasticsearch:9200"
            - name: ES_INDEX
              value: "zipkin"
            - name: ES_USERNAME
              value: "zipkin"
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zipkin-secret
                  key: password
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
            livenessProbe:
              httpGet:
                path: /health
                port: 9411
              initialDelaySeconds: 30
              periodSeconds: 30
            readinessProbe:
              httpGet:
                path: /health
                port: 9411
              initialDelaySeconds: 10
              periodSeconds: 10

  otel-collector-config.yaml: |
    # OpenTelemetry Collector Configuration
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: otel-collector-config
      namespace: enterprise-crm
    data:
      otel-collector-config.yaml: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
          jaeger:
            protocols:
              grpc:
                endpoint: 0.0.0.0:14250
              thrift_http:
                endpoint: 0.0.0.0:14268
              thrift_compact:
                endpoint: 0.0.0.0:6831
              thrift_binary:
                endpoint: 0.0.0.0:6832
          zipkin:
            endpoint: 0.0.0.0:9411
          prometheus:
            config:
              scrape_configs:
                - job_name: 'enterprise-crm-services'
                  static_configs:
                    - targets: 
                      - 'customer-service:8080'
                      - 'crm-core-service:8080'
                      - 'inventory-service:8080'
                      - 'analytics-service:8080'
                  metrics_path: '/metrics'
                  scrape_interval: 15s
                - job_name: 'apisix-gateway'
                  static_configs:
                    - targets: ['apisix-gateway:9092']
                  metrics_path: '/apisix/prometheus/metrics'
                  scrape_interval: 15s
                - job_name: 'dapr-sidecars'
                  kubernetes_sd_configs:
                    - role: pod
                      namespaces:
                        names: ['enterprise-crm']
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_enabled]
                      action: keep
                      regex: true
                    - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_metrics_port]
                      action: replace
                      target_label: __address__
                      regex: (.+)
                      replacement: ${1}:9090
        
        processors:
          batch:
            timeout: 1s
            send_batch_size: 1024
            send_batch_max_size: 2048
          memory_limiter:
            limit_mib: 512
            spike_limit_mib: 128
          resource:
            attributes:
              - key: service.namespace
                value: enterprise-crm
                action: upsert
              - key: deployment.environment
                value: production
                action: upsert
          attributes:
            actions:
              - key: http.user_agent
                action: delete
              - key: http.request.header.authorization
                action: delete
          span:
            name:
              to_attributes:
                rules:
                  - ^\/api\/v1\/customers\/(?P<customer_id>.*)$
                  - ^\/api\/v1\/inventory\/products\/(?P<product_id>.*)$
                  - ^\/api\/v1\/crm\/opportunities\/(?P<opportunity_id>.*)$
        
        exporters:
          jaeger:
            endpoint: jaeger-collector:14250
            tls:
              insecure: true
          zipkin:
            endpoint: "http://zipkin:9411/api/v2/spans"
            format: proto
          prometheus:
            endpoint: "0.0.0.0:8889"
            namespace: enterprise_crm
            const_labels:
              environment: production
              service_namespace: enterprise-crm
          elasticsearch:
            endpoints: ["http://elasticsearch:9200"]
            index: "otel-traces"
            mapping:
              mode: "ecs"
            auth:
              authenticator: basicauth
              basicauth:
                username: "otel"
                password: "otel-password"
          kafka:
            brokers: ["kafka-cluster:9092"]
            topic: "otel-traces"
            encoding: "otlp_proto"
            producer:
              max_message_bytes: 1000000
              compression: "gzip"
        
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
          pprof:
            endpoint: 0.0.0.0:1777
          zpages:
            endpoint: 0.0.0.0:55679
        
        service:
          extensions: [health_check, pprof, zpages]
          pipelines:
            traces:
              receivers: [otlp, jaeger, zipkin]
              processors: [memory_limiter, resource, attributes, span, batch]
              exporters: [jaeger, zipkin, elasticsearch, kafka]
            metrics:
              receivers: [otlp, prometheus]
              processors: [memory_limiter, resource, batch]
              exporters: [prometheus]
          telemetry:
            logs:
              level: "info"
            metrics:
              address: 0.0.0.0:8888

  grafana-dashboards.yaml: |
    # Grafana Dashboards for Enterprise CRM Observability
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-dashboards
      namespace: enterprise-crm
      labels:
        grafana_dashboard: "1"
    data:
      enterprise-crm-overview.json: |
        {
          "dashboard": {
            "id": null,
            "title": "Enterprise CRM - System Overview",
            "tags": ["enterprise-crm", "overview"],
            "timezone": "browser",
            "panels": [
              {
                "id": 1,
                "title": "Service Health Status",
                "type": "stat",
                "targets": [
                  {
                    "expr": "up{job=~\"enterprise-crm-services\"}",
                    "legendFormat": "{{instance}}"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "steps": [
                        {"color": "red", "value": 0},
                        {"color": "green", "value": 1}
                      ]
                    }
                  }
                },
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
              },
              {
                "id": 2,
                "title": "Request Rate (RPS)",
                "type": "graph",
                "targets": [
                  {
                    "expr": "sum(rate(http_requests_total{job=~\"enterprise-crm-services\"}[5m])) by (service)",
                    "legendFormat": "{{service}}"
                  }
                ],
                "yAxes": [
                  {"label": "Requests/sec", "min": 0}
                ],
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
              },
              {
                "id": 3,
                "title": "Response Time (P95)",
                "type": "graph",
                "targets": [
                  {
                    "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\"enterprise-crm-services\"}[5m])) by (service, le))",
                    "legendFormat": "{{service}} P95"
                  }
                ],
                "yAxes": [
                  {"label": "Seconds", "min": 0}
                ],
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
              },
              {
                "id": 4,
                "title": "Error Rate",
                "type": "graph",
                "targets": [
                  {
                    "expr": "sum(rate(http_requests_total{job=~\"enterprise-crm-services\",status=~\"5..\"}[5m])) by (service) / sum(rate(http_requests_total{job=~\"enterprise-crm-services\"}[5m])) by (service)",
                    "legendFormat": "{{service}} Error Rate"
                  }
                ],
                "yAxes": [
                  {"label": "Error Rate", "min": 0, "max": 1}
                ],
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
              },
              {
                "id": 5,
                "title": "Database Connection Pool",
                "type": "graph",
                "targets": [
                  {
                    "expr": "database_connections_active{job=~\"enterprise-crm-services\"}",
                    "legendFormat": "{{service}} Active Connections"
                  },
                  {
                    "expr": "database_connections_idle{job=~\"enterprise-crm-services\"}",
                    "legendFormat": "{{service}} Idle Connections"
                  }
                ],
                "yAxes": [
                  {"label": "Connections", "min": 0}
                ],
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
              },
              {
                "id": 6,
                "title": "Cache Hit Rate",
                "type": "graph",
                "targets": [
                  {
                    "expr": "cache_hits_total{job=~\"enterprise-crm-services\"} / (cache_hits_total{job=~\"enterprise-crm-services\"} + cache_misses_total{job=~\"enterprise-crm-services\"})",
                    "legendFormat": "{{service}} Cache Hit Rate"
                  }
                ],
                "yAxes": [
                  {"label": "Hit Rate", "min": 0, "max": 1}
                ],
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
              }
            ],
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "refresh": "30s"
          }
        }
      
      service-mesh-dashboard.json: |
        {
          "dashboard": {
            "id": null,
            "title": "Enterprise CRM - Service Mesh",
            "tags": ["enterprise-crm", "service-mesh", "dapr"],
            "timezone": "browser",
            "panels": [
              {
                "id": 1,
                "title": "Service Invocation Success Rate",
                "type": "stat",
                "targets": [
                  {
                    "expr": "sum(rate(dapr_service_invocation_req_sent_total{result=\"success\"}[5m])) / sum(rate(dapr_service_invocation_req_sent_total[5m]))",
                    "legendFormat": "Success Rate"
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit",
                    "thresholds": {
                      "steps": [
                        {"color": "red", "value": 0.95},
                        {"color": "yellow", "value": 0.98},
                        {"color": "green", "value": 0.99}
                      ]
                    }
                  }
                },
                "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
              },
              {
                "id": 2,
                "title": "Circuit Breaker Status",
                "type": "table",
                "targets": [
                  {
                    "expr": "dapr_circuit_breaker_state",
                    "legendFormat": "{{app_id}} - {{target}}"
                  }
                ],
                "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0}
              },
              {
                "id": 3,
                "title": "Pub/Sub Message Rate",
                "type": "graph",
                "targets": [
                  {
                    "expr": "sum(rate(dapr_pubsub_published_total[5m])) by (app_id, topic)",
                    "legendFormat": "{{app_id}} - {{topic}} Published"
                  },
                  {
                    "expr": "sum(rate(dapr_pubsub_received_total[5m])) by (app_id, topic)",
                    "legendFormat": "{{app_id}} - {{topic}} Received"
                  }
                ],
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
              },
              {
                "id": 4,
                "title": "State Store Operations",
                "type": "graph",
                "targets": [
                  {
                    "expr": "sum(rate(dapr_state_operation_total[5m])) by (app_id, operation)",
                    "legendFormat": "{{app_id}} - {{operation}}"
                  }
                ],
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
              }
            ],
            "time": {
              "from": "now-1h",
              "to": "now"
            },
            "refresh": "30s"
          }
        }

  alerting-rules.yaml: |
    # Prometheus Alerting Rules for Enterprise CRM
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: enterprise-crm-alerts
      namespace: enterprise-crm
      labels:
        prometheus: enterprise-crm
        role: alert-rules
    spec:
      groups:
      - name: enterprise-crm.rules
        rules:
        # Service Health Alerts
        - alert: ServiceDown
          expr: up{job=~"enterprise-crm-services"} == 0
          for: 1m
          labels:
            severity: critical
            service: "{{ $labels.instance }}"
          annotations:
            summary: "Enterprise CRM service is down"
            description: "Service {{ $labels.instance }} has been down for more than 1 minute."
        
        # Performance Alerts
        - alert: HighResponseTime
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~"enterprise-crm-services"}[5m])) by (service, le)) > 2
          for: 5m
          labels:
            severity: warning
            service: "{{ $labels.service }}"
          annotations:
            summary: "High response time detected"
            description: "Service {{ $labels.service }} has P95 response time > 2s for more than 5 minutes."
        
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{job=~"enterprise-crm-services",status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total{job=~"enterprise-crm-services"}[5m])) by (service) > 0.05
          for: 5m
          labels:
            severity: critical
            service: "{{ $labels.service }}"
          annotations:
            summary: "High error rate detected"
            description: "Service {{ $labels.service }} has error rate > 5% for more than 5 minutes."
        
        # Resource Alerts
        - alert: HighMemoryUsage
          expr: container_memory_usage_bytes{pod=~".*enterprise-crm.*"} / container_spec_memory_limit_bytes > 0.9
          for: 5m
          labels:
            severity: warning
            pod: "{{ $labels.pod }}"
          annotations:
            summary: "High memory usage detected"
            description: "Pod {{ $labels.pod }} is using > 90% of memory limit for more than 5 minutes."
        
        - alert: HighCPUUsage
          expr: rate(container_cpu_usage_seconds_total{pod=~".*enterprise-crm.*"}[5m]) / container_spec_cpu_quota * container_spec_cpu_period > 0.8
          for: 5m
          labels:
            severity: warning
            pod: "{{ $labels.pod }}"
          annotations:
            summary: "High CPU usage detected"
            description: "Pod {{ $labels.pod }} is using > 80% of CPU limit for more than 5 minutes."
        
        # Database Alerts
        - alert: DatabaseConnectionPoolExhausted
          expr: database_connections_active{job=~"enterprise-crm-services"} / database_connections_max > 0.9
          for: 2m
          labels:
            severity: critical
            service: "{{ $labels.service }}"
          annotations:
            summary: "Database connection pool nearly exhausted"
            description: "Service {{ $labels.service }} is using > 90% of database connection pool for more than 2 minutes."
        
        # Cache Alerts
        - alert: LowCacheHitRate
          expr: cache_hits_total{job=~"enterprise-crm-services"} / (cache_hits_total{job=~"enterprise-crm-services"} + cache_misses_total{job=~"enterprise-crm-services"}) < 0.7
          for: 10m
          labels:
            severity: warning
            service: "{{ $labels.service }}"
          annotations:
            summary: "Low cache hit rate detected"
            description: "Service {{ $labels.service }} has cache hit rate < 70% for more than 10 minutes."
        
        # Service Mesh Alerts
        - alert: CircuitBreakerOpen
          expr: dapr_circuit_breaker_state == 2
          for: 1m
          labels:
            severity: critical
            app: "{{ $labels.app_id }}"
            target: "{{ $labels.target }}"
          annotations:
            summary: "Circuit breaker is open"
            description: "Circuit breaker for {{ $labels.app_id }} -> {{ $labels.target }} has been open for more than 1 minute."
        
        - alert: ServiceInvocationFailureRate
          expr: sum(rate(dapr_service_invocation_req_sent_total{result="failure"}[5m])) by (app_id, target) / sum(rate(dapr_service_invocation_req_sent_total[5m])) by (app_id, target) > 0.1
          for: 5m
          labels:
            severity: warning
            app: "{{ $labels.app_id }}"
            target: "{{ $labels.target }}"
          annotations:
            summary: "High service invocation failure rate"
            description: "Service invocation from {{ $labels.app_id }} to {{ $labels.target }} has failure rate > 10% for more than 5 minutes."

---
# OpenTelemetry Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: enterprise-crm
  labels:
    app: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.89.0
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 14250
          name: jaeger-grpc
        - containerPort: 14268
          name: jaeger-http
        - containerPort: 9411
          name: zipkin
        - containerPort: 8889
          name: prometheus
        - containerPort: 13133
          name: health
        volumeMounts:
        - name: config
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: enterprise-crm
  labels:
    app: otel-collector
spec:
  ports:
  - port: 4317
    targetPort: 4317
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    name: otlp-http
  - port: 14250
    targetPort: 14250
    name: jaeger-grpc
  - port: 14268
    targetPort: 14268
    name: jaeger-http
  - port: 9411
    targetPort: 9411
    name: zipkin
  - port: 8889
    targetPort: 8889
    name: prometheus
  selector:
    app: otel-collector
  type: ClusterIP

