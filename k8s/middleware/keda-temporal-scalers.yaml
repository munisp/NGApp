# KEDA ScaledObjects for Temporal worker auto-scaling (#26)
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nip-transfer-worker-scaler
  namespace: payment-switch
spec:
  scaleTargetRef:
    name: nip-transfer-worker
  minReplicaCount: 3
  maxReplicaCount: 30
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: temporal
      metadata:
        address: temporal.payment-switch.svc:7233
        namespace: payment-switch
        taskQueue: nip-transfer-queue
        targetBacklogPerReplica: "100"
