apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: permify-postgres-pvc
  namespace: security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: Secret
metadata:
  name: permify-secrets
  namespace: security
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  postgres-password: cGVybWlmeV9wYXNzd29yZA==  # permify_password
  permify-secret-key: cGVybWlmeV9zZWNyZXRfa2V5XzEyMw==  # permify_secret_key_123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: security
data:
  config.yaml: |
    server:
      grpc:
        port: 3476
      http:
        enabled: true
        port: 3477
        cors_allowed_origins:
          - "*"
        cors_allowed_headers:
          - "*"
    logger:
      level: info
      output: stdout
    authn:
      method: preshared
      preshared:
        keys:
          - "permify_secret_key_123"
    database:
      engine: postgres
      uri: "postgres://permify:permify_password@permify-postgres:5432/permify?sslmode=disable"
      auto_migrate: true
      max_open_connections: 20
      max_idle_connections: 1
      max_connection_lifetime: 300s
      max_connection_idle_time: 60s
    cache:
      number_of_counters: 1000
      max_cost: 10MiB
    tracer:
      exporter: jaeger
      endpoint: http://jaeger-collector:14268/api/traces
      insecure: true
    meter:
      exporter: otlp
      endpoint: http://otel-collector:4317
      insecure: true
    service:
      circuit_breaker: false
      watch:
        enabled: true
      schema:
        cache:
          number_of_counters: 1000
          max_cost: 10MiB
      permission:
        bulk_limit: 100
        concurrency_limit: 100
      data:
        cache:
          number_of_counters: 1000
          max_cost: 10MiB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify-postgres
  namespace: security
  labels:
    app: permify-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: permify-postgres
  template:
    metadata:
      labels:
        app: permify-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: permify
        - name: POSTGRES_USER
          value: permify
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - permify
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - permify
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: permify-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: permify-postgres
  namespace: security
  labels:
    app: permify-postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: permify-postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: security
  labels:
    app: permify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: permify
  template:
    metadata:
      labels:
        app: permify
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:13
        command:
        - sh
        - -c
        - |
          until pg_isready -h permify-postgres -p 5432 -U permify; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: postgres-password
      containers:
      - name: permify
        image: ghcr.io/permify/permify:latest
        ports:
        - containerPort: 3476
          name: grpc
        - containerPort: 3477
          name: http
        command:
        - ./permify
        - serve
        - --config=/etc/permify/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/permify
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3477
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3477
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: PERMIFY_DATABASE_URI
          value: "postgres://permify:$(POSTGRES_PASSWORD)@permify-postgres:5432/permify?sslmode=disable"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: permify-secrets
              key: postgres-password
      volumes:
      - name: config
        configMap:
          name: permify-config
---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: security
  labels:
    app: permify
spec:
  ports:
  - name: grpc
    port: 3476
    targetPort: 3476
  - name: http
    port: 3477
    targetPort: 3477
  selector:
    app: permify
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: permify-ingress
  namespace: security
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  tls:
  - hosts:
    - authz.enterprise-crm.com
    secretName: permify-tls
  rules:
  - host: authz.enterprise-crm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: permify
            port:
              number: 3477
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-pdb
  namespace: security
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: permify
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permify-hpa
  namespace: security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: permify
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: permify-metrics
  namespace: security
  labels:
    app: permify
spec:
  selector:
    matchLabels:
      app: permify
  endpoints:
  - port: http
    interval: 30s
    path: /metrics

