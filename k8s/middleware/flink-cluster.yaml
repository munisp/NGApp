apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: enterprise-flink-cluster
  namespace: data-platform
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: flink-cluster
spec:
  image: flink:1.18.0-scala_2.12-java11
  flinkVersion: v1_18
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    state.backend: rocksdb
    state.backend.incremental: "true"
    state.checkpoints.dir: "s3://flink-checkpoints/enterprise-crm"
    state.savepoints.dir: "s3://flink-savepoints/enterprise-crm"
    checkpoint.interval: "60000"
    checkpoint.timeout: "600000"
    checkpoint.max-concurrent-checkpoints: "1"
    checkpoint.min-pause: "5000"
    restart-strategy: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: "10s"
    restart-strategy.exponential-delay.max-backoff: "2min"
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    restart-strategy.exponential-delay.reset-backoff-threshold: "10min"
    restart-strategy.exponential-delay.jitter-factor: "0.1"
    high-availability: kubernetes
    high-availability.storageDir: "s3://flink-ha/enterprise-crm"
    kubernetes.cluster-id: enterprise-flink-cluster
    kubernetes.namespace: data-platform
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
    metrics.reporter.prom.host: localhost
    metrics.reporter.prom.port: "9249"
    web.upload.dir: /tmp/flink-web-ui
    blob.server.port: "6124"
    query.server.port: "6125"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.min-pause: "5000"
    execution.checkpointing.timeout: "600000"
    table.exec.source.idle-timeout: "30s"
    pipeline.auto-watermark-interval: "1000"
    pipeline.max-parallelism: "128"
    parallelism.default: "4"
    jobmanager.memory.process.size: "2048m"
    taskmanager.memory.process.size: "4096m"
    taskmanager.memory.flink.size: "3072m"
    jobmanager.memory.flink.size: "1536m"
  serviceAccount: flink
  podTemplate:
    apiVersion: v1
    kind: Pod
    metadata:
      name: pod-template
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-access-key
            - name: AWS_DEFAULT_REGION
              value: "us-west-2"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: flink-config-volume
              mountPath: /opt/flink/conf
            - name: flink-logs
              mountPath: /opt/flink/log
      volumes:
        - name: flink-config-volume
          configMap:
            name: flink-config
        - name: flink-logs
          emptyDir: {}
      securityContext:
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 2
    podTemplate:
      apiVersion: v1
      kind: Pod
      metadata:
        name: job-manager-pod-template
      spec:
        containers:
          - name: flink-main-container
            ports:
              - containerPort: 8081
                name: rest
              - containerPort: 6123
                name: rpc
              - containerPort: 6124
                name: blob
              - containerPort: 9249
                name: metrics
            livenessProbe:
              httpGet:
                path: /
                port: 8081
              initialDelaySeconds: 30
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /
                port: 8081
              initialDelaySeconds: 10
              periodSeconds: 5
  taskManager:
    resource:
      memory: "4096m"
      cpu: 2
    replicas: 3
    podTemplate:
      apiVersion: v1
      kind: Pod
      metadata:
        name: task-manager-pod-template
      spec:
        containers:
          - name: flink-main-container
            ports:
              - containerPort: 6122
                name: rpc
              - containerPort: 6125
                name: query
              - containerPort: 9249
                name: metrics
            livenessProbe:
              tcpSocket:
                port: 6122
              initialDelaySeconds: 30
              periodSeconds: 10
            readinessProbe:
              tcpSocket:
                port: 6122
              initialDelaySeconds: 10
              periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: data-platform
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flink-cluster-role
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions"]
    resources: ["deployments", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flink-cluster-role-binding
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flink-cluster-role
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: data-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: data-platform
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: config
data:
  log4j-console.properties: |
    rootLogger.level = INFO
    rootLogger.appenderRef.console.ref = ConsoleAppender
    rootLogger.appenderRef.rolling.ref = RollingFileAppender

    logger.akka.name = akka
    logger.akka.level = INFO
    logger.kafka.name = org.apache.kafka
    logger.kafka.level = INFO
    logger.hadoop.name = org.apache.hadoop
    logger.hadoop.level = INFO
    logger.zookeeper.name = org.apache.zookeeper
    logger.zookeeper.level = INFO

    appender.console.name = ConsoleAppender
    appender.console.type = CONSOLE
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

    appender.rolling.name = RollingFileAppender
    appender.rolling.type = RollingFile
    appender.rolling.append = false
    appender.rolling.fileName = ${sys:log.file}
    appender.rolling.filePattern = ${sys:log.file}.%i
    appender.rolling.layout.type = PatternLayout
    appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
    appender.rolling.policies.type = Policies
    appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
    appender.rolling.policies.size.size = 100MB
    appender.rolling.strategy.type = DefaultRolloverStrategy
    appender.rolling.strategy.max = 10

    logger.netty.name = org.apache.flink.shaded.akka.org.jboss.netty.channel.DefaultChannelPipeline
    logger.netty.level = OFF
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-flink-cluster-rest
  namespace: data-platform
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: jobmanager
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: enterprise-flink-cluster
    component: jobmanager

