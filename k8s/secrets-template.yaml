apiVersion: v1
kind: ConfigMap
metadata:
  name: og-rmm-config
  namespace: og-rmm
  labels:
    app: og-rmm-platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_VERSION: "v1"
  PLATFORM_NAME: "OG-RMM Platform"
  PLATFORM_VERSION: "v43"
  OTEL_SERVICE_NAME: "og-rmm-app"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.og-rmm:4317"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  RATE_LIMIT_API: "200"
  RATE_LIMIT_AUTH: "20"
  RATE_LIMIT_WINDOW_MS: "60000"
  GRACEFUL_SHUTDOWN_TIMEOUT_MS: "30000"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"
  CACHE_TTL_SECONDS: "60"
  HISTORIAN_RETENTION_DAYS: "365"
  DRONE_MAX_UPLOAD_MB: "16"
  PAYPAL_MODE: "live"
  PAYPAL_BASE_URL: "https://api-m.paypal.com"
  OLLAMA_MODEL: "qwen2.5-vl:7b"
  OLLAMA_VISION_MODEL: "qwen2.5-vl:7b"
  KEYCLOAK_REALM: "og-rmm"
  TEMPORAL_NAMESPACE: "og-rmm"
  KAFKA_GROUP_ID: "og-rmm-platform"
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"
  APISIX_BASE_URL: "http://apisix-admin.og-rmm:9180"
