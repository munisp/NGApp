[package]
name        = "physics-engine"
version     = "1.0.0"
edition     = "2021"
description = "OG-RMM Physics Engine — IPR/VLP nodal analysis, Arps decline, sensitivity"
authors     = ["OG-RMM Platform"]

[[bin]]
name = "physics-engine"
path = "src/main.rs"

[lib]
name       = "physics_engine"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
axum              = { version = "0.8", features = ["json", "tracing"] }
tokio             = { version = "1",   features = ["full"] }
tower             = "0.5"
tower-http        = { version = "0.6", features = ["cors", "trace"] }
serde             = { version = "1",   features = ["derive"] }
serde_json        = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libm              = "0.2"
dotenvy           = "0.15"
nalgebra          = { version = "0.33", features = ["serde-serialize"] }
ndarray           = { version = "0.16", features = ["serde"] }
statrs            = "0.18"
itertools         = "0.13"

[dev-dependencies]
proptest  = "1"
approx    = "0.5"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
