global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "kafka-service"
    static_configs:
      - targets: ["kafka-service:8081"]
    metrics_path: "/prometheus"
    scrape_interval: 10s

  - job_name: "redis-service"
    static_configs:
      - targets: ["redis-service:8082"]
    metrics_path: "/prometheus"
    scrape_interval: 10s

  - job_name: "tigerbeetle-service"
    static_configs:
      - targets: ["tigerbeetle-service:8083"]
    metrics_path: "/prometheus"
    scrape_interval: 10s

  - job_name: "apisix-service"
    static_configs:
      - targets: ["apisix-service:8084"]
    metrics_path: "/prometheus"
    scrape_interval: 10s

  - job_name: "temporal-service"
    static_configs:
      - targets: ["temporal-service:8085"]
    metrics_path: "/prometheus"
    scrape_interval: 10s

  - job_name: "fluvio-service"
    static_configs:
      - targets: ["fluvio-service:8086"]
    metrics_path: "/prometheus"
    scrape_interval: 10s

  - job_name: "openappsec-service"
    static_configs:
