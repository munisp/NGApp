routes:
  # Priority Tier 1: CRITICAL - Payment processing, account balance, fraud scoring
  # These get highest connection priority and lowest timeouts
  - uri: /api/v1/payments/*
    name: payments-critical
    plugins:
      limit-conn:
        conn: 500
        burst: 100
        default_conn_delay: 0.1
        key_type: var
        key: remote_addr
      proxy-rewrite:
        headers:
          set:
            X-Priority-Tier: critical
            X-Workload-Class: realtime
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 10
        read: 10
      nodes:
        payments-service:8114: 1
    priority: 100

  - uri: /api/v1/accounts/*/balance
    name: account-balance-critical
    plugins:
      limit-conn:
        conn: 500
        burst: 100
        default_conn_delay: 0.1
