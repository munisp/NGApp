routes:
  # Core Banking Routes
  - uri: /api/corebanking/accounts/create
    name: corebanking-create-account
    methods: ["POST"]
    upstream:
      type: roundrobin
      nodes:
        "corebanking-service:8113": 1
      timeout: { connect: 5, send: 10, read: 10 }
    plugins:
      proxy-rewrite: { uri: /accounts/create }
      limit-count: { count: 30, time_window: 60, rejected_code: 429 }
      cors: { allow_origins: "*", allow_methods: "POST,OPTIONS" }

  - uri: /api/corebanking/accounts/user
    name: corebanking-user-accounts
    methods: ["GET"]
