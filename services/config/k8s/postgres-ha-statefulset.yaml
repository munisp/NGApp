        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: fintech
spec:
  selector:
    app: postgres
    role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: pgbouncer
      port: 6432
      targetPort: 6432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: fintech
spec:
  selector:
    app: postgres
    role: replica
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: pgbouncer
      port: 6432
      targetPort: 6432
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: fintech
data:
  pgbouncer.ini: |
    [databases]
    fintech = host=localhost port=5432 dbname=fintech pool_size=20

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    server_lifetime = 3600
    server_idle_timeout = 600
    query_timeout = 30
    stats_period = 60
  userlist.txt: |
    "fintech" "${POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: fintech
type: Opaque
stringData:
  username: REPLACE_WITH_POSTGRES_USER
  password: REPLACE_WITH_POSTGRES_PASSWORD
  replication-username: REPLACE_WITH_REPLICATION_USER
  replication-password: REPLACE_WITH_REPLICATION_PASSWORD
