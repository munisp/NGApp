[databases]
fintech = host=postgres-primary port=5432 dbname=fintech pool_size=20
fintech_readonly = host=postgres-replica port=5432 dbname=fintech pool_size=40

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 1
query_timeout = 30
query_wait_timeout = 120
client_idle_timeout = 0
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
admin_users = ${PGBOUNCER_ADMIN_USER}
stats_users = ${PGBOUNCER_STATS_USER}
ignore_startup_parameters = extra_float_digits,search_path
application_name_add_host = 1
