      - redis-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8117/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  african-markets-service:
    build:
      context: ./go/africanmarkets
      dockerfile: Dockerfile
    ports:
      - "8118:8118"
    environment:
      - KAFKA_SERVICE_URL=http://kafka-service:8081
      - REDIS_SERVICE_URL=http://redis-service:8082
      - TEMPORAL_SERVICE_URL=http://temporal-service:8085
