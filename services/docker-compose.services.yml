      - TEMPORAL_SERVICE_URL=http://temporal-service:8085
      - LAKEHOUSE_SERVICE_URL=http://lakehouse-service:8090
      - ML_GATEWAY_URL=http://ml-gateway-service:8119
    depends_on:
      - kafka-service
      - redis-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8115/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  investments-service:
