      - TIGERBEETLE_SERVICE_URL=http://tigerbeetle-service:8083
      - TEMPORAL_SERVICE_URL=http://temporal-service:8085
      - PERMIFY_SERVICE_URL=http://permify-service:8089
      - LAKEHOUSE_SERVICE_URL=http://lakehouse-service:8090
    depends_on:
