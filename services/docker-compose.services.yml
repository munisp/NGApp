version: "3.8"

services:
  kafka-service:
    build:
      context: ./go
      dockerfile: Dockerfile.kafka
    ports:
      - "8081:8081"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=fintech-producer
      - KAFKA_GROUP_ID=fintech-consumer-group
    depends_on:
      - kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-service:
    build:
      context: ./go
      dockerfile: Dockerfile.redis
    ports:
      - "8082:8082"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=fintech:
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  tigerbeetle-service:
    build:
      context: ./go
      dockerfile: Dockerfile.tigerbeetle
    ports:
      - "8083:8083"
    environment:
      - TIGERBEETLE_ADDRESSES=tigerbeetle:3001
      - TIGERBEETLE_CLUSTER_ID=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  apisix-service:
    build:
      context: ./go
      dockerfile: Dockerfile.apisix
    ports:
      - "8084:8084"
    environment:
      - APISIX_ADMIN_URL=http://apisix:9180
      - APISIX_GATEWAY_URL=http://apisix:9080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  fluvio-service:
    build:
      context: ./go
      dockerfile: Dockerfile.fluvio
    ports:
      - "8086:8086"
    environment:
      - FLUVIO_ENDPOINT=fluvio:9003
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  openappsec-service:
    build:
      context: ./go
      dockerfile: Dockerfile.openappsec
    ports:
      - "8087:8087"
    environment:
      - OPENAPPSEC_MODE=prevent
      - OPENAPPSEC_THREAT_PREVENTION=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  kubernetes-service:
    build:
      context: ./go
      dockerfile: Dockerfile.kubernetes
    ports:
      - "8088:8088"
    environment:
      - K8S_NAMESPACE=fintech
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  temporal-service:
    build:
      context: ./python
      dockerfile: Dockerfile.temporal
    ports:
      - "8085:8085"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=fintech
    depends_on:
      - temporal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  permify-service:
    build:
      context: ./python
      dockerfile: Dockerfile.permify
    ports:
      - "8089:8089"
    environment:
      - PERMIFY_HOST=permify
      - PERMIFY_PORT=3476
    depends_on:
      - permify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  lakehouse-service:
    build:
      context: ./python
      dockerfile: Dockerfile.lakehouse
    ports:
      - "8090:8090"
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - MINIO_ENDPOINT=minio:9000
      - SEDONA_SERVICE_URL=http://sedona-geospatial-service:8102
      - FEATURE_STORE_URL=http://feature-store-service:8104
      - MLFLOW_URL=http://mlflow-registry-service:8105
      - REALTIME_INFERENCE_URL=http://realtime-inference-service:8106
    depends_on:
      - trino
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak-service:
    build:
      context: ./python
      dockerfile: Dockerfile.keycloak
    ports:
      - "8091:8091"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=fintech
      - KEYCLOAK_CLIENT_ID=fintech-app
    depends_on:
      - keycloak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  dapr-service:
    build:
      context: ./python
      dockerfile: Dockerfile.dapr
    ports:
      - "8092:8092"
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_APP_ID=fintech-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # AI/ML Services
  ray-cluster-service:
    build:
      context: ../python-services/ray
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - RAY_CLUSTER_PORT=8100
      - RAY_HEAD_ADDRESS=ray-head:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gnn-fraud-service:
    build:
      context: ../python-services/gnn-fraud
      dockerfile: Dockerfile
    ports:
      - "8101:8101"
    environment:
      - GNN_FRAUD_PORT=8101
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  sedona-geospatial-service:
    build:
      context: ../python-services/sedona
      dockerfile: Dockerfile
    ports:
      - "8102:8102"
    environment:
      - SEDONA_SERVICE_PORT=8102
      - TRINO_HOST=trino
      - TRINO_PORT=8080
    depends_on:
      - trino
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  deep-learning-service:
    build:
      context: ../python-services/deep-learning
      dockerfile: Dockerfile
    ports:
      - "8103:8103"
    environment:
      - DEEP_LEARNING_PORT=8103
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  feature-store-service:
    build:
      context: ../python-services/feature-store
      dockerfile: Dockerfile
    ports:
      - "8104:8104"
    environment:
      - FEATURE_STORE_PORT=8104
      - REDIS_URL=redis://redis:6379
      - LAKEHOUSE_URL=http://lakehouse-service:8090
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8104/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow-registry-service:
    build:
      context: ../python-services/mlflow-registry
      dockerfile: Dockerfile
    ports:
      - "8105:8105"
    environment:
      - MLFLOW_REGISTRY_PORT=8105
      - ARTIFACT_STORE=/data/mlflow/artifacts
      - RAY_SERVICE_URL=http://ray-cluster-service:8100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8105/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  realtime-inference-service:
    build:
      context: ../python-services/realtime-inference
      dockerfile: Dockerfile
    ports:
      - "8106:8106"
    environment:
      - REALTIME_INFERENCE_PORT=8106
      - KAFKA_BROKERS=kafka:9092
      - FEATURE_STORE_URL=http://feature-store-service:8104
      - RAY_SERVICE_URL=http://ray-cluster-service:8100
      - GNN_SERVICE_URL=http://gnn-fraud-service:8101
      - DL_SERVICE_URL=http://deep-learning-service:8103
      - MLFLOW_URL=http://mlflow-registry-service:8105
      - LAKEHOUSE_URL=http://lakehouse-service:8090
    depends_on:
      - kafka
      - feature-store-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8106/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # KYC/KYB Services
  kyc-unified-service:
    build:
      context: ../python-services/kyc-unified
      dockerfile: Dockerfile
    ports:
      - "8110:8110"
    environment:
      - KYC_UNIFIED_PORT=8110
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - TEMPORAL_ADDRESS=temporal:7233
      - PERMIFY_HOST=permify
      - PERMIFY_PORT=3476
      - LAKEHOUSE_URL=http://lakehouse-service:8090
      - GNN_SERVICE_URL=http://gnn-fraud-service:8101
      - FEATURE_STORE_URL=http://feature-store-service:8104
      - REALTIME_INFERENCE_URL=http://realtime-inference-service:8106
    depends_on:
      - kafka
      - redis
      - minio
      - temporal
      - permify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8110/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  kyb-service:
    build:
      context: ../python-services/kyb
      dockerfile: Dockerfile
    ports:
      - "8111:8111"
    environment:
      - KYB_SERVICE_PORT=8111
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - TEMPORAL_ADDRESS=temporal:7233
      - PERMIFY_HOST=permify
      - PERMIFY_PORT=3476
      - LAKEHOUSE_URL=http://lakehouse-service:8090
      - GNN_SERVICE_URL=http://gnn-fraud-service:8101
      - FEATURE_STORE_URL=http://feature-store-service:8104
      - REALTIME_INFERENCE_URL=http://realtime-inference-service:8106
    depends_on:
      - kafka
      - redis
      - minio
      - temporal
      - permify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8111/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Infrastructure services
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintech}
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c wal_level=replica
        -c hot_standby=on
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.max=10000
        -c pg_stat_statements.track=all
        -c max_connections=200
        -c shared_buffers=256MB
        -c statement_timeout=30000
        -c idle_in_transaction_session_timeout=60000
        -c log_min_duration_statement=500
        -c log_checkpoints=on
        -c log_lock_waits=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres-ha/monitoring-queries.sql:/docker-entrypoint-initdb.d/monitoring.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintech}
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
        -c hot_standby=on
        -c max_connections=200
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.max=10000
        -c statement_timeout=30000
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    ports:
      - "6432:6432"
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  pgbouncer-replica:
    image: edoburu/pgbouncer:1.22.0
    ports:
      - "6433:6432"
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fintech}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB:-fintech}
    depends_on:
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fintech}
      KC_DB_USERNAME: ${POSTGRES_USER:-fintech}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: start-dev
    depends_on:
      - postgres

  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres

  permify:
    image: ghcr.io/permify/permify:latest
    ports:
      - "3476:3476"
      - "3478:3478"
    command: serve

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  trino:
    image: trinodb/trino:439
    ports:
      - "8070:8080"
    volumes:
      - trino-data:/data/trino

  # Core Banking & Feature Services
  corebanking-service:
    build:
      context: ./go/corebanking
      dockerfile: Dockerfile
    ports:
      - "8113:8113"
    environment:
      - KAFKA_SERVICE_URL=http://kafka-service:8081
      - REDIS_SERVICE_URL=http://redis-service:8082
      - TIGERBEETLE_SERVICE_URL=http://tigerbeetle-service:8083
      - TEMPORAL_SERVICE_URL=http://temporal-service:8085
      - PERMIFY_SERVICE_URL=http://permify-service:8089
      - LAKEHOUSE_SERVICE_URL=http://lakehouse-service:8090
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=6432
      - PGBOUNCER_REPLICA_HOST=pgbouncer-replica
      - POSTGRES_USER=fintech
      - POSTGRES_PASSWORD=fintech_secret
      - POSTGRES_DB=fintech
      - STATEMENT_TIMEOUT_MS=30000
    depends_on:
      - kafka-service
      - redis-service
      - pgbouncer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8113/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  payments-service:
