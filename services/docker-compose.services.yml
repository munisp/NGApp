      dockerfile: Dockerfile
    ports:
      - "8114:8114"
    environment:
      - KAFKA_SERVICE_URL=http://kafka-service:8081
      - REDIS_SERVICE_URL=http://redis-service:8082
      - TIGERBEETLE_SERVICE_URL=http://tigerbeetle-service:8083
      - TEMPORAL_SERVICE_URL=http://temporal-service:8085
      - GNN_FRAUD_SERVICE_URL=http://gnn-fraud-service:8101
      - REALTIME_INFERENCE_URL=http://realtime-inference-service:8106
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=6432
      - PGBOUNCER_REPLICA_HOST=pgbouncer-replica
      - POSTGRES_USER=fintech
      - POSTGRES_PASSWORD=fintech_secret
      - POSTGRES_DB=fintech
      - STATEMENT_TIMEOUT_MS=15000
    depends_on:
      - kafka-service
      - redis-service
      - pgbouncer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8114/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  insurance-service:
