---
# Apache Flink for Real-Time Stream Processing
# Processes transaction data from Kafka and writes to Delta Lake

apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: lakehouse
  labels:
    app: flink
data:
  flink-conf.yaml: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.rpc.port: 6123
    jobmanager.memory.process.size: 4096m
    taskmanager.memory.process.size: 8192m
    taskmanager.numberOfTaskSlots: 4
    parallelism.default: 8
    
    # High Availability
    high-availability: kubernetes
    high-availability.storageDir: s3a://checkpoints/flink-ha
    high-availability.cluster-id: flink-cluster
    
    # Checkpointing
    state.backend: rocksdb
    state.checkpoints.dir: s3a://checkpoints/flink
    state.savepoints.dir: s3a://checkpoints/savepoints
    execution.checkpointing.interval: 60000
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.timeout: 600000
    execution.checkpointing.max-concurrent-checkpoints: 1
    
    # Restart Strategy
    restart-strategy: fixed-delay
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 10s
    
    # S3 Configuration - credentials from secrets
    s3.endpoint: http://rustfs.lakehouse:9000
    s3.path.style.access: true
    # Credentials injected from Kubernetes secrets via environment variables
    # s3.access-key and s3.secret-key are set via FLINK_PROPERTIES env var from minio-credentials secret
    
    # Metrics
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
    metrics.reporter.prom.port: 9249
    
    # Web UI
    web.submit.enable: true
    web.cancel.enable: true
    
    # Kafka Consumer
    consumer.bootstrap.servers: kafka.payment-switch:9092
    consumer.group.id: flink-consumer-group
    consumer.auto.offset.reset: earliest
    
    # Delta Lake
    delta.lake.catalog: delta_catalog
    delta.lake.warehouse: s3a://delta-lake/

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: lakehouse
  labels:
    app: flink

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: lakehouse
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: lakehouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: lakehouse

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: lakehouse
  labels:
    app: flink
    component: jobmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
    spec:
      serviceAccountName: flink
      
      securityContext:
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: flink
                    component: jobmanager
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: jobmanager
          image: flink:1.18.0-scala_2.12-java11
          imagePullPolicy: IfNotPresent
          
          args:
            - jobmanager
          
          ports:
            - name: rpc
              containerPort: 6123
            - name: blob
              containerPort: 6124
            - name: ui
              containerPort: 8081
            - name: metrics
              containerPort: 9249
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          livenessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          
          volumeMounts:
            - name: flink-config
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
      
      volumes:
        - name: flink-config
          configMap:
            name: flink-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: lakehouse
  labels:
    app: flink
    component: taskmanager
spec:
  replicas: 10
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
    spec:
      serviceAccountName: flink
      
      securityContext:
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: flink
                    component: taskmanager
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: taskmanager
          image: flink:1.18.0-scala_2.12-java11
          imagePullPolicy: IfNotPresent
          
          args:
            - taskmanager
          
          ports:
            - name: data
              containerPort: 6121
            - name: rpc
              containerPort: 6122
            - name: metrics
              containerPort: 9249
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          
          resources:
            requests:
              cpu: 4000m
              memory: 8Gi
            limits:
              cpu: 8000m
              memory: 16Gi
          
          livenessProbe:
            tcpSocket:
              port: 6122
            initialDelaySeconds: 30
            periodSeconds: 10
          
          volumeMounts:
            - name: flink-config
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
      
      volumes:
        - name: flink-config
          configMap:
            name: flink-config

---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: lakehouse
  labels:
    app: flink
    component: jobmanager
spec:
  type: ClusterIP
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob
      port: 6124
      targetPort: 6124
    - name: ui
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9249
      targetPort: 9249

---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager-ui
  namespace: lakehouse
  labels:
    app: flink
    component: jobmanager
spec:
  type: LoadBalancer
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: ui
      port: 8081
      targetPort: 8081

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flink-taskmanager-hpa
  namespace: lakehouse
  labels:
    app: flink
    component: taskmanager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flink-taskmanager
  minReplicas: 10
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flink-jobmanager-pdb
  namespace: lakehouse
  labels:
    app: flink
    component: jobmanager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flink-taskmanager-pdb
  namespace: lakehouse
  labels:
    app: flink
    component: taskmanager
spec:
  minAvailable: 5
  selector:
    matchLabels:
      app: flink
      component: taskmanager

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flink-network-policy
  namespace: lakehouse
  labels:
    app: flink
spec:
  podSelector:
    matchLabels:
      app: flink
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic between Flink components
    - from:
        - podSelector:
            matchLabels:
              app: flink
      ports:
        - protocol: TCP
          port: 6121
        - protocol: TCP
          port: 6122
        - protocol: TCP
          port: 6123
        - protocol: TCP
          port: 6124
    # Allow UI access
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8081
    # Allow metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9249
  egress:
    # Allow traffic to Kafka
    - to:
        - namespaceSelector:
            matchLabels:
              name: payment-switch
          podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow traffic to MinIO
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # Allow traffic between Flink components
    - to:
        - podSelector:
            matchLabels:
              app: flink
      ports:
        - protocol: TCP
          port: 6121
        - protocol: TCP
          port: 6122
        - protocol: TCP
          port: 6123
        - protocol: TCP
          port: 6124
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
