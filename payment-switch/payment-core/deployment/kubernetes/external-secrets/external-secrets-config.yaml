---
# External Secrets Operator Configuration
# This configuration enables automatic secret injection from external secret managers
# (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager)
#
# Prerequisites:
# 1. Install External Secrets Operator: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
# 2. Configure your secret backend (Vault, AWS SM, etc.)
# 3. Apply these manifests to create ExternalSecret resources

apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    name: external-secrets

---
# ClusterSecretStore for HashiCorp Vault
# This is the recommended backend for production deployments
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "payment-switch"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets"

---
# ClusterSecretStore for AWS Secrets Manager (alternative)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets"

---
# ServiceAccount for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    # For AWS IRSA (IAM Roles for Service Accounts)
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/external-secrets-role"

---
# ExternalSecret for MinIO credentials (Lakehouse)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rustfs-secrets
  namespace: lakehouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rustfs-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        MINIO_ROOT_USER: "{{ .rustfs_root_user }}"
        MINIO_ROOT_PASSWORD: "{{ .rustfs_root_password }}"
        MINIO_ACCESS_KEY: "{{ .rustfs_access_key }}"
        MINIO_SECRET_KEY: "{{ .rustfs_secret_key }}"
  data:
    - secretKey: rustfs_root_user
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: root_user
    - secretKey: rustfs_root_password
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: root_password
    - secretKey: rustfs_access_key
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: access_key
    - secretKey: rustfs_secret_key
      remoteRef:
        key: payment-switch/lakehouse/rustfs
        property: secret_key

---
# ExternalSecret for Kafka credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-secrets
  namespace: lakehouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        KAFKA_SASL_USERNAME: "{{ .kafka_username }}"
        KAFKA_SASL_PASSWORD: "{{ .kafka_password }}"
        KAFKA_SSL_TRUSTSTORE_PASSWORD: "{{ .kafka_truststore_password }}"
        KAFKA_SSL_KEYSTORE_PASSWORD: "{{ .kafka_keystore_password }}"
  data:
    - secretKey: kafka_username
      remoteRef:
        key: payment-switch/kafka
        property: sasl_username
    - secretKey: kafka_password
      remoteRef:
        key: payment-switch/kafka
        property: sasl_password
    - secretKey: kafka_truststore_password
      remoteRef:
        key: payment-switch/kafka
        property: truststore_password
    - secretKey: kafka_keystore_password
      remoteRef:
        key: payment-switch/kafka
        property: keystore_password

---
# ExternalSecret for TigerBeetle credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tigerbeetle-secrets
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tigerbeetle-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        TIGERBEETLE_CLUSTER_ID: "{{ .cluster_id }}"
        TIGERBEETLE_REPLICA_ADDRESSES: "{{ .replica_addresses }}"
  data:
    - secretKey: cluster_id
      remoteRef:
        key: payment-switch/tigerbeetle
        property: cluster_id
    - secretKey: replica_addresses
      remoteRef:
        key: payment-switch/tigerbeetle
        property: replica_addresses

---
# ExternalSecret for PostgreSQL credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_HOST: "{{ .host }}"
        POSTGRES_PORT: "{{ .port }}"
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .database }}"
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}"
  data:
    - secretKey: host
      remoteRef:
        key: payment-switch/postgres
        property: host
    - secretKey: port
      remoteRef:
        key: payment-switch/postgres
        property: port
    - secretKey: username
      remoteRef:
        key: payment-switch/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: payment-switch/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: payment-switch/postgres
        property: database

---
# ExternalSecret for Redis credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secrets
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REDIS_HOST: "{{ .host }}"
        REDIS_PORT: "{{ .port }}"
        REDIS_PASSWORD: "{{ .password }}"
        REDIS_URL: "redis://:{{ .password }}@{{ .host }}:{{ .port }}"
  data:
    - secretKey: host
      remoteRef:
        key: payment-switch/redis
        property: host
    - secretKey: port
      remoteRef:
        key: payment-switch/redis
        property: port
    - secretKey: password
      remoteRef:
        key: payment-switch/redis
        property: password

---
# ExternalSecret for Keycloak credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        KEYCLOAK_ADMIN: "{{ .admin_username }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .admin_password }}"
        KC_DB_PASSWORD: "{{ .db_password }}"
  data:
    - secretKey: admin_username
      remoteRef:
        key: payment-switch/keycloak
        property: admin_username
    - secretKey: admin_password
      remoteRef:
        key: payment-switch/keycloak
        property: admin_password
    - secretKey: db_password
      remoteRef:
        key: payment-switch/keycloak
        property: db_password

---
# ExternalSecret for API Keys (external services)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-keys-secrets
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: api-keys-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        SMILE_IDENTITY_API_KEY: "{{ .smile_identity_api_key }}"
        SMILE_IDENTITY_PARTNER_ID: "{{ .smile_identity_partner_id }}"
        COMPLY_ADVANTAGE_API_KEY: "{{ .comply_advantage_api_key }}"
        COINBASE_API_KEY: "{{ .coinbase_api_key }}"
        COINBASE_API_SECRET: "{{ .coinbase_api_secret }}"
        CIRCLE_API_KEY: "{{ .circle_api_key }}"
        NIBSS_API_KEY: "{{ .nibss_api_key }}"
        NIBSS_SECRET_KEY: "{{ .nibss_secret_key }}"
  data:
    - secretKey: smile_identity_api_key
      remoteRef:
        key: payment-switch/external-apis/smile-identity
        property: api_key
    - secretKey: smile_identity_partner_id
      remoteRef:
        key: payment-switch/external-apis/smile-identity
        property: partner_id
    - secretKey: comply_advantage_api_key
      remoteRef:
        key: payment-switch/external-apis/comply-advantage
        property: api_key
    - secretKey: coinbase_api_key
      remoteRef:
        key: payment-switch/external-apis/coinbase
        property: api_key
    - secretKey: coinbase_api_secret
      remoteRef:
        key: payment-switch/external-apis/coinbase
        property: api_secret
    - secretKey: circle_api_key
      remoteRef:
        key: payment-switch/external-apis/circle
        property: api_key
    - secretKey: nibss_api_key
      remoteRef:
        key: payment-switch/external-apis/nibss
        property: api_key
    - secretKey: nibss_secret_key
      remoteRef:
        key: payment-switch/external-apis/nibss
        property: secret_key

---
# ExternalSecret for JWT/Encryption keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: encryption-secrets
  namespace: payment-switch
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: encryption-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        JWT_REFRESH_SECRET: "{{ .jwt_refresh_secret }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        PII_MASKING_SALT: "{{ .pii_masking_salt }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: payment-switch/encryption
        property: jwt_secret
    - secretKey: jwt_refresh_secret
      remoteRef:
        key: payment-switch/encryption
        property: jwt_refresh_secret
    - secretKey: encryption_key
      remoteRef:
        key: payment-switch/encryption
        property: encryption_key
    - secretKey: pii_masking_salt
      remoteRef:
        key: payment-switch/encryption
        property: pii_masking_salt

---
# PushSecret to sync secrets back to Vault (for generated secrets)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: generated-secrets-push
  namespace: payment-switch
spec:
  refreshInterval: 10s
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: generated-api-keys
  data:
    - match:
        secretKey: api_key
        remoteRef:
          remoteKey: payment-switch/generated/api-keys
          property: api_key

---
# ClusterRole for External Secrets Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "clustersecretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets/status"]
    verbs: ["get", "update", "patch"]

---
# ClusterRoleBinding for External Secrets Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-controller
subjects:
  - kind: ServiceAccount
    name: external-secrets-sa
    namespace: external-secrets
