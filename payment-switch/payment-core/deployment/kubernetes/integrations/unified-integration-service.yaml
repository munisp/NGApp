apiVersion: v1
kind: Namespace
metadata:
  name: integrations
  labels:
    app.kubernetes.io/name: unified-integration
    app.kubernetes.io/component: security-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unified-integration-config
  namespace: integrations
data:
  config.yaml: |
    server:
      port: 8080
      
    openappsec:
      management_url: "http://openappsec-management.openappsec.svc.cluster.local:8080"
      agent_url: "http://openappsec-agent.openappsec.svc.cluster.local:8080"
      refresh_interval: 5m
      enable_blocking: true
      enable_learning: true
      
    opencti:
      url: "http://opencti-platform.security.svc.cluster.local:8080"
      refresh_interval: 15m
      auto_enforce: true
      threat_threshold: 70
      fraud_service_url: "http://fraud-detection.payment-core.svc.cluster.local:8080"
      gateway_url: "http://apisix-admin.apisix.svc.cluster.local:9180"
      
    wazuh:
      manager_url: "https://wazuh-manager.security.svc.cluster.local:55000"
      refresh_interval: 30s
      alert_threshold: 10
      audit_log_url: "http://audit-log.payment-core.svc.cluster.local:8080"
      incident_url: "http://incident-management.operations.svc.cluster.local:8080"
      
    opensearch:
      url: "https://opensearch.logging.svc.cluster.local:9200"
      index_prefix: "payment-switch"
      retention_days: 30
      bulk_size: 1000
      flush_interval: 5s
      
    kubecost:
      url: "http://kubecost-cost-analyzer.monitoring.svc.cluster.local:9003"
      refresh_interval: 15m
      cost_optimizer_url: "http://cost-optimizer.payment-core.svc.cluster.local:8080"
      admin_dashboard_url: "http://admin-dashboard.payment-core.svc.cluster.local:3000"
      budget_alerts:
        - name: "payment-core-budget"
          namespace: "payment-core"
          budget: 5000
          period: "monthly"
          alert_at: 0.8
        - name: "security-budget"
          namespace: "security"
          budget: 2000
          period: "monthly"
          alert_at: 0.8
          
    kafka:
      brokers:
        - "kafka-0.kafka.kafka.svc.cluster.local:9092"
        - "kafka-1.kafka.kafka.svc.cluster.local:9092"
        - "kafka-2.kafka.kafka.svc.cluster.local:9092"
      topic: "security-events"
      
    alerting:
      webhook_url: "http://alertmanager.monitoring.svc.cluster.local:9093/api/v1/alerts"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-integration-service
  namespace: integrations
  labels:
    app: unified-integration-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unified-integration-service
  template:
    metadata:
      labels:
        app: unified-integration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: unified-integration-service
      containers:
      - name: service
        image: payment-switch/unified-integration-service:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: CONFIG_PATH
          value: "/etc/config/config.yaml"
        - name: OPENAPPSEC_API_KEY
          valueFrom:
            secretKeyRef:
              name: integration-secrets
              key: openappsec-api-key
        - name: OPENCTI_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: integration-secrets
              key: opencti-api-token
        - name: WAZUH_API_USER
          valueFrom:
            secretKeyRef:
              name: integration-secrets
              key: wazuh-api-user
        - name: WAZUH_API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: integration-secrets
              key: wazuh-api-password
        - name: OPENSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: integration-secrets
              key: opensearch-username
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: integration-secrets
              key: opensearch-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /etc/config
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: unified-integration-config
---
apiVersion: v1
kind: Service
metadata:
  name: unified-integration-service
  namespace: integrations
  labels:
    app: unified-integration-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    name: http
    targetPort: 8080
  - port: 9090
    name: metrics
    targetPort: 9090
  selector:
    app: unified-integration-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unified-integration-service
  namespace: integrations
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: unified-integration-service
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: unified-integration-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: unified-integration-service
subjects:
- kind: ServiceAccount
  name: unified-integration-service
  namespace: integrations
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: integration-secrets
  namespace: integrations
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: integration-secrets
    creationPolicy: Owner
  data:
  - secretKey: openappsec-api-key
    remoteRef:
      key: secret/data/payment-switch/openappsec
      property: api_key
  - secretKey: opencti-api-token
    remoteRef:
      key: secret/data/payment-switch/opencti
      property: api_token
  - secretKey: wazuh-api-user
    remoteRef:
      key: secret/data/payment-switch/wazuh
      property: api_user
  - secretKey: wazuh-api-password
    remoteRef:
      key: secret/data/payment-switch/wazuh
      property: api_password
  - secretKey: opensearch-username
    remoteRef:
      key: secret/data/payment-switch/opensearch
      property: admin_username
  - secretKey: opensearch-password
    remoteRef:
      key: secret/data/payment-switch/opensearch
      property: admin_password
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unified-integration-service-hpa
  namespace: integrations
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-integration-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unified-integration-service-pdb
  namespace: integrations
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: unified-integration-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unified-integration-service-network-policy
  namespace: integrations
spec:
  podSelector:
    matchLabels:
      app: unified-integration-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: payment-core
    - namespaceSelector:
        matchLabels:
          name: apisix
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: openappsec
    - namespaceSelector:
        matchLabels:
          name: security
    - namespaceSelector:
        matchLabels:
          name: logging
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - namespaceSelector:
        matchLabels:
          name: kafka
    - namespaceSelector:
        matchLabels:
          name: payment-core
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9200
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 55000
    - protocol: TCP
      port: 9003
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
