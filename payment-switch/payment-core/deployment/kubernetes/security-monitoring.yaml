apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: payment-switch-security
spec:
  ports:
  - port: 1514
    targetPort: 1514
    protocol: UDP
    name: agents
  - port: 1515
    targetPort: 1515
    protocol: TCP
    name: agents-tcp
  - port: 55000
    targetPort: 55000
    protocol: TCP
    name: api
  selector:
    app: wazuh
    component: manager
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: payment-switch-security
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh
      component: manager
  template:
    metadata:
      labels:
        app: wazuh
        component: manager
    spec:
      containers:
      - name: wazuh-manager
        image: wazuh/wazuh-manager:4.7.0
        ports:
        - containerPort: 1514
          protocol: UDP
          name: agents
        - containerPort: 1515
          protocol: TCP
          name: agents-tcp
        - containerPort: 55000
          protocol: TCP
          name: api
        env:
        - name: INDEXER_URL
          value: "https://opensearch:9200"
        - name: INDEXER_USERNAME
          value: "admin"
        - name: INDEXER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-secret
              key: password
        volumeMounts:
        - name: wazuh-data
          mountPath: /var/ossec/data
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
  volumeClaimTemplates:
  - metadata:
      name: wazuh-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencti
  namespace: payment-switch-security
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: opencti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencti
  namespace: payment-switch-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opencti
  template:
    metadata:
      labels:
        app: opencti
    spec:
      containers:
      - name: opencti
        image: opencti/platform:5.12.0
        ports:
        - containerPort: 8080
        env:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=8096"
        - name: APP__PORT
          value: "8080"
        - name: APP__BASE_URL
          value: "http://opencti:8080"
        - name: APP__ADMIN__EMAIL
          value: "admin@payment-switch.local"
        - name: APP__ADMIN__PASSWORD
          valueFrom:
            secretKeyRef:
              name: opencti-secret
              key: admin-password
        - name: APP__ADMIN__TOKEN
          valueFrom:
            secretKeyRef:
              name: opencti-secret
              key: admin-token
        - name: REDIS__HOSTNAME
          value: "redis-master.payment-switch"
        - name: REDIS__PORT
          value: "6379"
        - name: ELASTICSEARCH__URL
          value: "http://opensearch:9200"
        - name: MINIO__ENDPOINT
          value: "rustfs:9000"
        - name: MINIO__ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: access-key
        - name: MINIO__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: secret-key
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: payment-switch-security
spec:
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  - port: 9300
    targetPort: 9300
    name: transport
  selector:
    app: opensearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: payment-switch-security
spec:
  serviceName: opensearch
  replicas: 3
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      initContainers:
      - name: increase-vm-max-map
        image: busybox
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:2.11.0
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        env:
        - name: cluster.name
          value: "payment-switch-cluster"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: "opensearch-0.opensearch,opensearch-1.opensearch,opensearch-2.opensearch"
        - name: cluster.initial_master_nodes
          value: "opensearch-0,opensearch-1,opensearch-2"
        - name: bootstrap.memory_lock
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        volumeMounts:
        - name: opensearch-data
          mountPath: /usr/share/opensearch/data
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
  volumeClaimTemplates:
  - metadata:
      name: opensearch-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 100Gi
---
