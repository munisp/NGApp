  namespace: payment-switch-security
type: Opaque
data:
  admin-password: cGF5bWVudC1zd2l0Y2gtb3BlbmN0aQ==  # base64 encoded
  admin-token: b3BlbmN0aS1hZG1pbi10b2tlbi1wYXltZW50LXN3aXRjaA==  # base64 encoded
---
