---
# Kubecost for Cost Monitoring and Optimization
# Provides detailed cost analysis and optimization recommendations

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecost
  namespace: monitoring
  labels:
    app: kubecost

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubecost
  labels:
    app: kubecost
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - deployments
      - nodes
      - pods
      - services
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - daemonsets
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - deployments
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubecost
  labels:
    app: kubecost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubecost
subjects:
  - kind: ServiceAccount
    name: kubecost
    namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecost-config
  namespace: monitoring
  labels:
    app: kubecost
data:
  kubecost-config.yaml: |
    # Kubecost configuration
    prometheus:
      enabled: true
      server:
        global:
          external_labels:
            cluster_id: payment-switch
    
    # Cost allocation settings
    costAllocation:
      enabled: true
      
    # Cloud provider settings
    cloudProvider:
      # Set to your cloud provider: aws, gcp, azure, or custom
      type: custom
      
    # Currency settings
    currency: USD
    
    # Savings recommendations
    savings:
      enabled: true
      
    # Cluster efficiency
    efficiency:
      enabled: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost-cost-analyzer
  namespace: monitoring
  labels:
    app: kubecost
    component: cost-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecost
      component: cost-analyzer
  template:
    metadata:
      labels:
        app: kubecost
        component: cost-analyzer
    spec:
      serviceAccountName: kubecost
      
      containers:
        - name: cost-analyzer
          image: gcr.io/kubecost1/cost-model:prod-1.108.1
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 9003
            - name: http-ui
              containerPort: 9090
          
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://prometheus.monitoring:9090"
            - name: CLUSTER_ID
              value: "payment-switch"
            - name: KUBECOST_NAMESPACE
              value: "monitoring"
            - name: KUBECOST_TOKEN
              value: ""  # Add your Kubecost token here for enterprise features
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9003
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9003
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          volumeMounts:
            - name: persistent-configs
              mountPath: /var/configs
      
      volumes:
        - name: persistent-configs
          persistentVolumeClaim:
            claimName: kubecost-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubecost-pvc
  namespace: monitoring
  labels:
    app: kubecost
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 32Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-cost-analyzer
  namespace: monitoring
  labels:
    app: kubecost
    component: cost-analyzer
spec:
  type: ClusterIP
  selector:
    app: kubecost
    component: cost-analyzer
  ports:
    - name: http
      port: 9003
      targetPort: 9003
    - name: http-ui
      port: 9090
      targetPort: 9090

---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-external
  namespace: monitoring
  labels:
    app: kubecost
spec:
  type: LoadBalancer
  selector:
    app: kubecost
    component: cost-analyzer
  ports:
    - name: http-ui
      port: 9090
      targetPort: 9090

---
# Network Cost Daemon (optional, for network cost tracking)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubecost-network-costs
  namespace: monitoring
  labels:
    app: kubecost
    component: network-costs
spec:
  selector:
    matchLabels:
      app: kubecost
      component: network-costs
  template:
    metadata:
      labels:
        app: kubecost
        component: network-costs
    spec:
      hostNetwork: true
      
      containers:
        - name: network-costs
          image: gcr.io/kubecost1/kubecost-network-costs:v16.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: metrics
              containerPort: 3001
          
          env:
            - name: KUBECOST_NAMESPACE
              value: "monitoring"
          
          resources:
            requests:
              cpu: 50m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 50Mi
          
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
      
      volumes:
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: sys
          hostPath:
            path: /sys

---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-network-costs
  namespace: monitoring
  labels:
    app: kubecost
    component: network-costs
spec:
  type: ClusterIP
  selector:
    app: kubecost
    component: network-costs
  ports:
    - name: metrics
      port: 3001
      targetPort: 3001
