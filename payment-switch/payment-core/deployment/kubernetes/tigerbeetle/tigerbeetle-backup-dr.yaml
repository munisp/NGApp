---
# TigerBeetle Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tigerbeetle-backup
  namespace: payment-switch
  labels:
    app: tigerbeetle-backup
    component: backup
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: tigerbeetle-backup
        spec:
          serviceAccountName: tigerbeetle-backup
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: amazon/aws-cli:2.13.0
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_NAME="tigerbeetle-backup-${TIMESTAMP}"
                  
                  echo "Starting TigerBeetle backup: ${BACKUP_NAME}"
                  
                  # Create backup directory
                  mkdir -p /backup
                  
                  # Copy data files from TigerBeetle PVC
                  echo "Copying TigerBeetle data files..."
                  cp -r /tigerbeetle-data/* /backup/
                  
                  # Create tarball
                  echo "Creating backup archive..."
                  tar -czvf /tmp/${BACKUP_NAME}.tar.gz -C /backup .
                  
                  # Upload to S3
                  echo "Uploading to S3..."
                  aws s3 cp /tmp/${BACKUP_NAME}.tar.gz s3://${S3_BUCKET}/tigerbeetle/${BACKUP_NAME}.tar.gz
                  
                  # Verify upload
                  aws s3 ls s3://${S3_BUCKET}/tigerbeetle/${BACKUP_NAME}.tar.gz
                  
                  # Cleanup old backups (keep last 7 days)
                  echo "Cleaning up old backups..."
                  aws s3 ls s3://${S3_BUCKET}/tigerbeetle/ | while read -r line; do
                    createDate=$(echo $line | awk '{print $1" "$2}')
                    createDate=$(date -d "$createDate" +%s)
                    olderThan=$(date -d "7 days ago" +%s)
                    if [[ $createDate -lt $olderThan ]]; then
                      fileName=$(echo $line | awk '{print $4}')
                      if [[ $fileName != "" ]]; then
                        echo "Deleting old backup: $fileName"
                        aws s3 rm s3://${S3_BUCKET}/tigerbeetle/$fileName
                      fi
                    fi
                  done
                  
                  echo "Backup completed successfully: ${BACKUP_NAME}"
              env:
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: s3-bucket
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-secret-access-key
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-region
              volumeMounts:
                - name: tigerbeetle-data
                  mountPath: /tigerbeetle-data
                  readOnly: true
                - name: backup-scratch
                  mountPath: /backup
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          volumes:
            - name: tigerbeetle-data
              persistentVolumeClaim:
                claimName: tigerbeetle-data-tigerbeetle-0
            - name: backup-scratch
              emptyDir:
                sizeLimit: 10Gi

---
# ServiceAccount for backup jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tigerbeetle-backup
  namespace: payment-switch

---
# Role for backup operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tigerbeetle-backup
  namespace: payment-switch
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tigerbeetle-backup
  namespace: payment-switch
subjects:
  - kind: ServiceAccount
    name: tigerbeetle-backup
    namespace: payment-switch
roleRef:
  kind: Role
  name: tigerbeetle-backup
  apiGroup: rbac.authorization.k8s.io

---
# Backup credentials ExternalSecret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backup-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: s3-bucket
      remoteRef:
        key: payment-switch/backup
        property: s3-bucket
    - secretKey: aws-access-key-id
      remoteRef:
        key: payment-switch/backup
        property: aws-access-key-id
    - secretKey: aws-secret-access-key
      remoteRef:
        key: payment-switch/backup
        property: aws-secret-access-key
    - secretKey: aws-region
      remoteRef:
        key: payment-switch/backup
        property: aws-region

---
# TigerBeetle Restore Job Template
apiVersion: batch/v1
kind: Job
metadata:
  name: tigerbeetle-restore
  namespace: payment-switch
  labels:
    app: tigerbeetle-restore
    component: disaster-recovery
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: tigerbeetle-restore
    spec:
      serviceAccountName: tigerbeetle-backup
      restartPolicy: Never
      initContainers:
        - name: download-backup
          image: amazon/aws-cli:2.13.0
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              if [ -z "${BACKUP_NAME}" ]; then
                echo "BACKUP_NAME not set, using latest backup"
                BACKUP_NAME=$(aws s3 ls s3://${S3_BUCKET}/tigerbeetle/ | sort | tail -1 | awk '{print $4}')
              fi
              
              echo "Downloading backup: ${BACKUP_NAME}"
              aws s3 cp s3://${S3_BUCKET}/tigerbeetle/${BACKUP_NAME} /restore/backup.tar.gz
              
              echo "Extracting backup..."
              tar -xzvf /restore/backup.tar.gz -C /restore/
              
              echo "Backup downloaded and extracted"
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: backup-credentials
                  key: s3-bucket
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backup-credentials
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-credentials
                  key: aws-secret-access-key
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: backup-credentials
                  key: aws-region
            - name: BACKUP_NAME
              value: ""  # Set this to restore specific backup
          volumeMounts:
            - name: restore-data
              mountPath: /restore
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: restore
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "WARNING: This will overwrite TigerBeetle data!"
              echo "Ensure TigerBeetle StatefulSet is scaled to 0 before running"
              
              # Verify TigerBeetle is not running
              if [ -f /tigerbeetle-data/.lock ]; then
                echo "ERROR: TigerBeetle appears to be running. Scale down first."
                exit 1
              fi
              
              # Backup current data (just in case)
              if [ -d /tigerbeetle-data/data ]; then
                echo "Backing up current data..."
                mv /tigerbeetle-data/data /tigerbeetle-data/data.bak.$(date +%s)
              fi
              
              # Restore data
              echo "Restoring TigerBeetle data..."
              cp -r /restore/* /tigerbeetle-data/
              
              echo "Restore completed successfully"
              echo "Scale up TigerBeetle StatefulSet to resume operations"
          volumeMounts:
            - name: tigerbeetle-data
              mountPath: /tigerbeetle-data
            - name: restore-data
              mountPath: /restore
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: tigerbeetle-data
          persistentVolumeClaim:
            claimName: tigerbeetle-data-tigerbeetle-0
        - name: restore-data
          emptyDir:
            sizeLimit: 10Gi

---
# PostgreSQL Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: payment-switch
  labels:
    app: postgres-backup
    component: backup
spec:
  schedule: "0 */4 * * *"  # Every 4 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          serviceAccountName: tigerbeetle-backup
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:15-alpine
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_NAME="postgres-backup-${TIMESTAMP}"
                  
                  echo "Starting PostgreSQL backup: ${BACKUP_NAME}"
                  
                  # Dump all databases
                  pg_dump -h ${POSTGRES_HOST} -U ${POSTGRES_USER} -d ${POSTGRES_DB} \
                    --format=custom --compress=9 \
                    -f /tmp/${BACKUP_NAME}.dump
                  
                  # Upload to S3
                  echo "Uploading to S3..."
                  aws s3 cp /tmp/${BACKUP_NAME}.dump s3://${S3_BUCKET}/postgres/${BACKUP_NAME}.dump
                  
                  echo "Backup completed successfully: ${BACKUP_NAME}"
              env:
                - name: POSTGRES_HOST
                  value: "postgres.payment-switch.svc.cluster.local"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: POSTGRES_DB
                  value: "mojaloop_transfers"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: s3-bucket
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-secret-access-key
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: aws-region
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"

---
# PodDisruptionBudget for TigerBeetle
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tigerbeetle-pdb
  namespace: payment-switch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tigerbeetle

---
# Alerting rules for backup failures
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: payment-switch
  labels:
    prometheus: payment-switch
spec:
  groups:
    - name: backup-alerts
      rules:
        - alert: TigerBeetleBackupFailed
          expr: |
            kube_job_status_failed{job_name=~"tigerbeetle-backup.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "TigerBeetle backup job failed"
            description: "TigerBeetle backup job {{ $labels.job_name }} has failed"
            
        - alert: TigerBeetleBackupMissing
          expr: |
            time() - max(kube_job_status_completion_time{job_name=~"tigerbeetle-backup.*"}) > 28800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TigerBeetle backup is overdue"
            description: "No successful TigerBeetle backup in the last 8 hours"
            
        - alert: PostgresBackupFailed
          expr: |
            kube_job_status_failed{job_name=~"postgres-backup.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL backup job failed"
            description: "PostgreSQL backup job {{ $labels.job_name }} has failed"
