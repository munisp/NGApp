---
# Comprehensive ExternalSecrets for Mojaloop Services
# This ensures all secrets are pulled from external secret managers
# No hardcoded credentials in any deployment manifests

# PostgreSQL credentials for Mojaloop transfer store
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: payment-switch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: payment-switch/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: payment-switch/postgres
        property: password
    - secretKey: host
      remoteRef:
        key: payment-switch/postgres
        property: host
    - secretKey: database
      remoteRef:
        key: payment-switch/postgres
        property: database

