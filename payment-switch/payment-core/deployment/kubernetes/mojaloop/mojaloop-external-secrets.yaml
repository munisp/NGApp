---
# Updated Mojaloop Go Service deployment with ExternalSecrets references
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mojaloop-go-service
  namespace: payment-switch
  labels:
    app: mojaloop-go-service
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mojaloop-go-service
  template:
    metadata:
      labels:
        app: mojaloop-go-service
        version: v1
    spec:
      serviceAccountName: mojaloop-go-service
      containers:
        - name: mojaloop-go-service
          image: payment-switch/mojaloop-go-service:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            # PostgreSQL - from ExternalSecret
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: host
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            # TigerBeetle - from ExternalSecret
            - name: TIGERBEETLE_HOST
              valueFrom:
                secretKeyRef:
                  name: tigerbeetle-credentials
                  key: host
            - name: TIGERBEETLE_PORT
              valueFrom:
                secretKeyRef:
                  name: tigerbeetle-credentials
                  key: port
            - name: TIGERBEETLE_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: tigerbeetle-credentials
                  key: cluster-id
            # Kafka - from ExternalSecret
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: brokers
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: password
            # PII encryption - from ExternalSecret
            - name: PII_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pii-encryption-keys
                  key: encryption-key
            - name: PII_MASKING_SALT
              valueFrom:
                secretKeyRef:
                  name: pii-encryption-keys
                  key: masking-salt
            # ILP - from ExternalSecret
            - name: ILP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ilp-secrets
                  key: ilp-secret
            # Admin token - from ExternalSecret
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: admin-api-tokens
                  key: admin-token
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false

---
# ServiceAccount for Mojaloop Go Service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mojaloop-go-service
  namespace: payment-switch

---
# NetworkPolicy to restrict secret access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mojaloop-secrets-access
  namespace: payment-switch
spec:
  podSelector:
    matchLabels:
      app: mojaloop-go-service
  policyTypes:
    - Egress
  egress:
    # Allow access to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow access to TigerBeetle
    - to:
        - podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - protocol: TCP
          port: 3000
    # Allow access to Kafka
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow access to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
