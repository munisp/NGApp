apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-adapters
  namespace: payment-switch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: integration-adapters
  template:
    metadata:
      labels:
        app: integration-adapters
    spec:
      containers:
      - name: integration-adapters
        image: your-repo/integration-adapters:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: integration-adapters
  namespace: payment-switch
spec:
  selector:
    app: integration-adapters
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
