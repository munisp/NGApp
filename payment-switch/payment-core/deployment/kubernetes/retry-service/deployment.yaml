apiVersion: apps/v1
kind: Deployment
metadata:
  name: retry-service
  namespace: payment-switch
  labels:
    app: retry-service
    tier: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retry-service
  template:
    metadata:
      labels:
        app: retry-service
    spec:
      containers:
        - name: retry-service
          image: payment-switch/retry-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.payment-switch.svc.cluster.local:9092"
            - name: KAFKA_CONSUMER_GROUP
              value: "retry-service-consumer"
            - name: KAFKA_RETRY_TOPIC
              value: "payment.retry"
            - name: REDIS_HOST
              value: "redis.payment-switch.svc.cluster.local"
            - name: MAX_RETRY_ATTEMPTS
              value: "5"
            - name: RETRY_BACKOFF_MS
              value: "1000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: retry-service
  namespace: payment-switch
  labels:
    app: retry-service
spec:
  selector:
    app: retry-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
