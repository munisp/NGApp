# Kafka Consumer Services - K8s Service definitions
# These services allow monitoring and health checks for Kafka consumers
apiVersion: v1
kind: Service
metadata:
  name: payment-retry-consumer
  namespace: payment-switch
  labels:
    app: payment-retry-consumer
    component: kafka-consumer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: payment-retry-consumer
---
