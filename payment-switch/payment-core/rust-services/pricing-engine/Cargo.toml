[package]
name = "pricing-engine"
version = "1.0.0"
edition = "2021"
description = "Zero-allocation FX pricing and fee calculation engine for payment switch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pricing_bench"
harness = false
