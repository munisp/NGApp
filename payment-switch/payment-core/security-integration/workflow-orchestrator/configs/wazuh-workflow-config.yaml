---
# Kubernetes ConfigMaps for Wazuh Workflow Orchestrator Monitoring

apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-workflow-orchestrator-decoder
  namespace: security
  labels:
    app: wazuh
    component: decoder
    service: workflow-orchestrator
data:
  workflow-orchestrator-decoder.xml: |
    <!--
      Wazuh Custom Decoder for Python Workflow Orchestrator
      Parses structured JSON logs from the Temporal-based workflow orchestrator
    -->

    <decoder name="workflow-orchestrator-json">
      <program_name>workflow-orchestrator</program_name>
      <plugin_decoder>JSON_Decoder</plugin_decoder>
    </decoder>

    <decoder name="workflow-orchestrator-json">
      <parent>workflow-orchestrator-json</parent>
      <use_own_name>true</use_own_name>
      <json_decoder>level</json_decoder>
      <json_decoder>msg</json_decoder>
      <json_decoder>time</json_decoder>
      <json_decoder>service</json_decoder>
      <json_decoder>workflow_id</json_decoder>
      <json_decoder>workflow_type</json_decoder>
      <json_decoder>run_id</json_decoder>
      <json_decoder>user_id</json_decoder>
      <json_decoder>source_ip</json_decoder>
      <json_decoder>api_key</json_decoder>
      <json_decoder>status</json_decoder>
      <json_decoder>error</json_decoder>
      <json_decoder>activity_name</json_decoder>
      <json_decoder>transaction_id</json_decoder>
      <json_decoder>account_id</json_decoder>
      <json_decoder>amount</json_decoder>
      <json_decoder>authorization_level</json_decoder>
      <json_decoder>required_authorization_level</json_decoder>
    </decoder>

    <decoder name="workflow-orchestrator-auth-failure">
      <parent>workflow-orchestrator-json</parent>
      <prematch>unauthorized|authentication failed|permission denied</prematch>
      <regex offset="after_parent">\"source_ip\":\"(\d+\.\d+\.\d+\.\d+)\".*\"user_id\":\"([^\"]+)\"</regex>
      <order>srcip,user</order>
    </decoder>

    <decoder name="workflow-orchestrator-invalid-api-key">
      <parent>workflow-orchestrator-json</parent>
      <prematch>invalid api key</prematch>
      <regex offset="after_parent">\"api_key\":\"([^\"]+)\".*\"source_ip\":\"(\d+\.\d+\.\d+\.\d+)\"</regex>
      <order>api_key,srcip</order>
    </decoder>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-workflow-orchestrator-rules
  namespace: security
  labels:
    app: wazuh
    component: rules
    service: workflow-orchestrator
data:
  workflow-orchestrator-rules.xml: |
    <!--
      Wazuh Custom Rules for Python Workflow Orchestrator Security Monitoring
      Rule ID range: 101000-101099 (workflow orchestrator rules)
    -->

    <group name="workflow-orchestrator,application,temporal,">

      <!-- Base rule for Workflow Orchestrator service -->
      <rule id="101000" level="0">
        <decoded_as>workflow-orchestrator-json</decoded_as>
        <description>Workflow Orchestrator service event</description>
      </rule>

      <!-- Authentication failures -->
      <rule id="101001" level="5">
        <if_sid>101000</if_sid>
        <decoded_as>workflow-orchestrator-auth-failure</decoded_as>
        <description>Workflow Orchestrator: Authentication failure from $(srcip)</description>
        <group>authentication_failed,pci_dss_10.2.4,pci_dss_10.2.5,</group>
      </rule>

      <rule id="101002" level="10" frequency="5" timeframe="300">
        <if_matched_sid>101001</if_matched_sid>
        <same_source_ip />
        <description>Workflow Orchestrator: Multiple authentication failures from $(srcip)</description>
        <mitre>
          <id>T1110</id>
        </mitre>
        <group>authentication_failures,brute_force,pci_dss_11.4,</group>
      </rule>

      <!-- Unauthorized workflow execution -->
      <rule id="101010" level="8">
        <if_sid>101000</if_sid>
        <field name="msg">unauthorized workflow execution</field>
        <description>Workflow Orchestrator: Unauthorized workflow execution attempt - $(workflow_type)</description>
        <mitre>
          <id>T1204</id>
        </mitre>
        <group>unauthorized_execution,</group>
      </rule>

      <rule id="101011" level="12" frequency="3" timeframe="300">
        <if_matched_sid>101010</if_matched_sid>
        <same_source_ip />
        <description>Workflow Orchestrator: Multiple unauthorized workflow execution attempts from $(srcip)</description>
        <mitre>
          <id>T1204</id>
          <id>T1078</id>
        </mitre>
        <group>unauthorized_execution,attack,</group>
      </rule>

      <!-- Privilege escalation -->
      <rule id="101005" level="12">
        <if_sid>101000</if_sid>
        <field name="msg">privilege escalation</field>
        <description>Workflow Orchestrator: Privilege escalation attempt detected</description>
        <mitre>
          <id>T1068</id>
          <id>T1548</id>
        </mitre>
        <group>privilege_escalation,attack,</group>
      </rule>

      <!-- Critical alerts for OpenCTI integration -->
      <rule id="101080" level="12">
        <if_sid>101002,101005,101011</if_sid>
        <description>Workflow Orchestrator: Critical security event - Trigger threat intelligence correlation</description>
        <group>critical,opencti_integration,</group>
      </rule>

    </group>

---
# Updated Wazuh Manager StatefulSet with workflow orchestrator monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-ossec-config
  namespace: security
  labels:
    app: wazuh
    component: config
data:
  ossec.conf: |
    <ossec_config>
      <global>
        <jsonout_output>yes</jsonout_output>
        <alerts_log>yes</alerts_log>
        <logall>no</logall>
        <logall_json>no</logall_json>
        <email_notification>no</email_notification>
      </global>

      <alerts>
        <log_alert_level>3</log_alert_level>
        <email_alert_level>12</email_alert_level>
      </alerts>

      <!-- Integration with OpenCTI -->
      <integration>
        <name>custom-opencti</name>
        <hook_url>/var/ossec/integrations/wazuh_opencti_integration.py</hook_url>
        <level>12</level>
        <group>opencti_integration</group>
        <alert_format>json</alert_format>
      </integration>

      <!-- Remote syslog configuration -->
      <remote>
        <connection>syslog</connection>
        <port>514</port>
        <protocol>tcp</protocol>
        <allowed-ips>10.0.0.0/8</allowed-ips>
        <allowed-ips>172.16.0.0/12</allowed-ips>
        <allowed-ips>192.168.0.0/16</allowed-ips>
      </remote>

      <!-- Ruleset configuration -->
      <ruleset>
        <!-- Default ruleset -->
        <decoder_dir>ruleset/decoders</decoder_dir>
        <rule_dir>ruleset/rules</rule_dir>
        
        <!-- Custom decoders -->
        <decoder_dir>etc/decoders</decoder_dir>
        
        <!-- Custom rules -->
        <rule_dir>etc/rules</rule_dir>
        
        <rule_exclude>0215-policy_rules.xml</rule_exclude>
        <list>etc/lists/audit-keys</list>
      </ruleset>

      <!-- Log analysis -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/ossec/logs/active-responses.log</location>
      </localfile>

    </ossec_config>

---
# Service for Wazuh syslog receiver
apiVersion: v1
kind: Service
metadata:
  name: wazuh-syslog
  namespace: security
  labels:
    app: wazuh
    component: syslog
spec:
  type: ClusterIP
  ports:
    - name: syslog-tcp
      port: 514
      targetPort: 514
      protocol: TCP
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
  selector:
    app: wazuh
    component: manager

---
# Fluentd DaemonSet for collecting workflow orchestrator logs
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-workflow-config
  namespace: security
  labels:
    app: fluentd
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/workflow-orchestrator-*.log
      pos_file /var/log/fluentd-workflow-orchestrator.pos
      tag workflow-orchestrator
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>

    <filter workflow-orchestrator>
      @type parser
      key_name log
      reserve_data true
      <parse>
        @type json
      </parse>
    </filter>

    <match workflow-orchestrator>
      @type forward
      <server>
        host wazuh-syslog.security.svc.cluster.local
        port 514
      </server>
      <buffer>
        @type file
        path /var/log/fluentd-buffers/workflow-orchestrator.buffer
        flush_mode interval
        flush_interval 5s
        retry_type exponential_backoff
        retry_wait 1s
        retry_max_interval 60s
      </buffer>
    </match>

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd-workflow-collector
  namespace: security
  labels:
    app: fluentd
    component: log-collector
spec:
  selector:
    matchLabels:
      app: fluentd
      component: log-collector
  template:
    metadata:
      labels:
        app: fluentd
        component: log-collector
    spec:
      serviceAccountName: fluentd
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-forward-1
          env:
            - name: FLUENT_UID
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluentd-workflow-config

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: security

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  kind: ClusterRole
  name: fluentd
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: security
