groups:
  - name: payment_switch_alerts
    interval: 30s
    rules:
      # Service Health Alerts
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
          /
          sum(rate(http_requests_total[5m])) by (job)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} has error rate above 5% (current: {{ $value | humanizePercentage }})."

      # Performance Alerts
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "P95 response time is above 500ms (current: {{ $value }}s)."

      - alert: PaymentProcessingSlowdown
        expr: |
          histogram_quantile(0.95,
            rate(payment_processing_duration_seconds_bucket[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Payment processing is slow"
          description: "P95 payment processing time is above 100ms (current: {{ $value }}s)."

      - alert: FraudDetectionSlowdown
        expr: |
          histogram_quantile(0.95,
            rate(fraud_detection_duration_seconds_bucket[5m])
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fraud detection is slow"
          description: "P95 fraud detection time is above 200ms (current: {{ $value }}s)."

      # Transaction Alerts
      - alert: LowTransactionSuccessRate
        expr: |
          sum(rate(payment_transactions_total{status="success"}[5m]))
          /
          sum(rate(payment_transactions_total[5m]))
          < 0.99
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Low transaction success rate"
          description: "Transaction success rate is below 99% (current: {{ $value | humanizePercentage }})."

      - alert: HighTransactionFailureRate
        expr: |
          sum(rate(payment_transactions_total{status="failed"}[5m]))
          > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High transaction failure rate"
          description: "Transaction failures are above 10 per second (current: {{ $value }})."

      - alert: UnusualTransactionVolume
        expr: |
          abs(
            sum(rate(payment_transactions_total[5m]))
            -
            avg_over_time(sum(rate(payment_transactions_total[5m]))[1h:5m])
          )
          /
          avg_over_time(sum(rate(payment_transactions_total[5m]))[1h:5m])
          > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Unusual transaction volume detected"
          description: "Transaction volume has changed by more than 50% from the hourly average."

      # Fraud Detection Alerts
      - alert: HighFraudDetectionRate
        expr: |
          sum(rate(fraud_detections_total{result="fraud"}[5m]))
          /
          sum(rate(fraud_detections_total[5m]))
          > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High fraud detection rate"
          description: "Fraud detection rate is above 10% (current: {{ $value | humanizePercentage }})."

      - alert: FraudDetectionModelDegraded
        expr: fraud_model_accuracy < 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fraud detection model performance degraded"
          description: "Model accuracy is below 90% (current: {{ $value | humanizePercentage }})."

      # Resource Alerts
      - alert: HighCPUUsage
        expr: |
          rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is above 80% (current: {{ $value }}%)."

      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / 1024 / 1024 / 1024 > 4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is above 4GB (current: {{ $value }}GB)."

      # Database Alerts
      - alert: DatabaseConnectionPoolExhaustion
        expr: |
          database_connections_active
          /
          database_connections_max
          > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "{{ $labels.database }} connection pool is above 90% capacity."

      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            rate(database_query_duration_seconds_bucket[5m])
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries detected"
          description: "P95 query time is above 1 second (current: {{ $value }}s)."

      - alert: DatabaseConnectionErrors
        expr: |
          rate(database_connection_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection errors"
          description: "Database connection errors are occurring (rate: {{ $value }}/s)."

      # Cache Alerts
      - alert: LowRedisCacheHitRate
        expr: |
          rate(redis_keyspace_hits_total[5m])
          /
          (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))
          < 0.80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low Redis cache hit rate"
          description: "Cache hit rate is below 80% (current: {{ $value | humanizePercentage }})."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is above 90% (current: {{ $value | humanizePercentage }})."

      # Kafka Alerts
      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag"
          description: "Consumer lag is above 10,000 messages (current: {{ $value }})."

      - alert: KafkaPartitionOffline
        expr: kafka_partition_offline_count > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka partition offline"
          description: "{{ $value }} Kafka partitions are offline."

      # Settlement Alerts
      - alert: HighPendingSettlements
        expr: sum(payment_settlements_pending) > 1000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "High number of pending settlements"
          description: "Pending settlements are above 1,000 (current: {{ $value }})."

      - alert: SettlementFailures
        expr: |
          rate(payment_settlements_failed[5m]) > 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Settlement failures detected"
          description: "Settlement failures are occurring (rate: {{ $value }}/s)."

      # Webhook Alerts
      - alert: HighWebhookFailureRate
        expr: |
          sum(rate(webhook_deliveries_total{status="failed"}[5m]))
          /
          sum(rate(webhook_deliveries_total[5m]))
          > 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High webhook failure rate"
          description: "Webhook failure rate is above 10% (current: {{ $value | humanizePercentage }})."

      # Security Alerts
      - alert: RateLimitExceeded
        expr: |
          rate(rate_limit_exceeded_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of rate limit violations"
          description: "Rate limit violations are occurring at {{ $value }}/s."

      - alert: SuspiciousAuthenticationAttempts
        expr: |
          rate(authentication_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of authentication failures"
          description: "Authentication failures are occurring at {{ $value }}/s."

      - alert: MultipleFailedLogins
        expr: |
          sum by (user_id) (increase(authentication_failures_total[5m])) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Multiple failed login attempts for user"
          description: "User {{ $labels.user_id }} has {{ $value }} failed login attempts in 5 minutes."
