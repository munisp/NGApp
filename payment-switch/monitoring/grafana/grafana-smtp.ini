# Grafana SMTP Configuration for Email Alerts
# Copy these settings to your grafana.ini or set as environment variables

#################################### SMTP / Emailing ##########################
[smtp]
enabled = true
host = smtp.sendgrid.net:587
# For Gmail: smtp.gmail.com:587
# For AWS SES: email-smtp.us-east-1.amazonaws.com:587
# For Mailgun: smtp.mailgun.org:587

user = apikey
# For Gmail: your-email@gmail.com
# For AWS SES: your-smtp-username
# For Mailgun: postmaster@your-domain.com

# The password is your SendGrid API key or app-specific password
password = ${SENDGRID_API_KEY}
# For Gmail: use app-specific password (not your regular password)
# For AWS SES: your-smtp-password
# For Mailgun: your-smtp-password

cert_file =
key_file =
skip_verify = false

from_address = alerts@payment-switch.com
from_name = Payment Switch Monitoring

# EHLO identity in SMTP dialog (defaults to instance_name)
ehlo_identity = payment-switch.com

# SMTP startTLS policy (defaults to 'OpportunisticStartTLS')
startTLS_policy = MandatoryStartTLS

#################################### Environment Variables ####################
# Alternative: Set these environment variables instead of editing grafana.ini
#
# GF_SMTP_ENABLED=true
# GF_SMTP_HOST=smtp.sendgrid.net:587
# GF_SMTP_USER=apikey
# GF_SMTP_PASSWORD=your-sendgrid-api-key
# GF_SMTP_FROM_ADDRESS=alerts@payment-switch.com
# GF_SMTP_FROM_NAME="Payment Switch Monitoring"
# GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS

#################################### Testing ##################################
# Test email configuration:
# 1. Start Grafana with SMTP configured
# 2. Go to Alerting > Notification channels
# 3. Click "Test" on the Email Alerts channel
# 4. Check your inbox for test email

#################################### SendGrid Setup ###########################
# 1. Sign up at https://sendgrid.com (free tier: 100 emails/day)
# 2. Go to Settings > API Keys
# 3. Create new API key with "Mail Send" permission
# 4. Copy the API key and set as SENDGRID_API_KEY
# 5. Verify sender email at Settings > Sender Authentication

#################################### Gmail Setup ##############################
# 1. Enable 2-factor authentication on your Google account
# 2. Go to https://myaccount.google.com/apppasswords
# 3. Generate app-specific password for "Mail"
# 4. Use your Gmail address as user
# 5. Use the app password (not your regular password)

#################################### AWS SES Setup ############################
# 1. Sign up for AWS SES
# 2. Verify your sender email/domain
# 3. Request production access (starts in sandbox mode)
# 4. Create SMTP credentials in SES console
# 5. Use SMTP username and password from SES
