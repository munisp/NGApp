# ISO 27001 Risk Register
# PayGate Payment Switch Platform
# Last Updated: 2025-12-30

metadata:
  organization: PayGate
  scope: Payment Processing Platform
  version: "1.0"
  risk_appetite: 0.3  # Maximum acceptable residual risk (0-1 scale)
  last_review: "2025-12-30"
  next_review: "2026-03-30"
  owner: Security Team

risk_scoring:
  likelihood_scale:
    - value: 0.1
      label: Rare
      description: May occur only in exceptional circumstances
    - value: 0.3
      label: Unlikely
      description: Could occur at some time
    - value: 0.5
      label: Possible
      description: Might occur at some time
    - value: 0.7
      label: Likely
      description: Will probably occur in most circumstances
    - value: 0.9
      label: Almost Certain
      description: Expected to occur in most circumstances

  impact_scale:
    - value: 0.1
      label: Negligible
      description: Minor impact, easily recoverable
    - value: 0.3
      label: Minor
      description: Some impact, recoverable with effort
    - value: 0.5
      label: Moderate
      description: Significant impact, requires substantial effort to recover
    - value: 0.7
      label: Major
      description: Severe impact, difficult to recover
    - value: 0.9
      label: Catastrophic
      description: Critical impact, may not be recoverable

risks:
  # Operational Risks
  - id: RISK-001
    name: Unauthorized Access to Financial Data
    description: Unauthorized users gaining access to transaction data or financial records
    category: operational
    asset: AST-DATA-001
    threat: External attacker or malicious insider
    vulnerability: Weak access controls or compromised credentials
    likelihood: 0.3
    impact: 0.9
    inherent_risk: 0.27
    controls:
      - Zero Trust Architecture
      - Multi-factor authentication
      - Role-based access control (Permify)
      - Audit logging
      - Session management
    control_effectiveness: 0.85
    residual_risk: 0.04
    status: treated
    owner: Security Team
    treatment:
      type: mitigate
      description: Implement comprehensive access controls and monitoring
    review_date: "2026-03-30"

  - id: RISK-002
    name: Data Breach - Customer PII
    description: Exposure of customer personal identifiable information
    category: compliance
    asset: AST-DATA-002
    threat: Data exfiltration by attacker or accidental exposure
    vulnerability: Insufficient data protection or access controls
    likelihood: 0.3
    impact: 0.9
    inherent_risk: 0.27
    controls:
      - Field-level encryption
      - Data masking
      - Access logging
      - DLP controls
      - Network segmentation
    control_effectiveness: 0.85
    residual_risk: 0.04
    status: treated
    owner: Compliance Team
    treatment:
      type: mitigate
      description: Implement comprehensive data protection controls
    review_date: "2026-03-30"

  - id: RISK-003
    name: Service Availability Disruption
    description: Payment processing services become unavailable
    category: operational
    asset: AST-APP-001
    threat: DDoS attack, infrastructure failure, or software bug
    vulnerability: Single points of failure or insufficient redundancy
    likelihood: 0.5
    impact: 0.7
    inherent_risk: 0.35
    controls:
      - Multi-region deployment
      - Auto-scaling
      - Load balancing
      - Circuit breakers
      - Health monitoring
      - DR procedures
    control_effectiveness: 0.80
    residual_risk: 0.07
    status: treated
    owner: SRE Team
    treatment:
      type: mitigate
      description: Implement high availability architecture
    review_date: "2026-03-30"

  - id: RISK-004
    name: Fraudulent Transactions
    description: Processing of fraudulent or unauthorized transactions
    category: operational
    asset: AST-INFRA-001
    threat: Fraud by external actors or compromised accounts
    vulnerability: Insufficient fraud detection or transaction validation
    likelihood: 0.5
    impact: 0.7
    inherent_risk: 0.35
    controls:
      - Real-time fraud detection (ML)
      - Transaction limits
      - Velocity checks
      - Manual review queues
      - Kill switch capability
    control_effectiveness: 0.75
    residual_risk: 0.09
    status: treated
    owner: Risk Team
    treatment:
      type: mitigate
      description: Implement comprehensive fraud prevention
    review_date: "2026-03-30"

  # Technical Risks
  - id: RISK-005
    name: Cryptographic Key Compromise
    description: Encryption keys are compromised or exposed
    category: technical
    asset: AST-DATA-004
    threat: Key theft, weak key generation, or improper storage
    vulnerability: Inadequate key management practices
    likelihood: 0.1
    impact: 0.9
    inherent_risk: 0.09
    controls:
      - HSM storage
      - Key rotation (automated)
      - Dual control for key operations
      - Audit logging
      - Vault integration
    control_effectiveness: 0.90
    residual_risk: 0.01
    status: treated
    owner: Security Team
    treatment:
      type: mitigate
      description: Implement enterprise key management
    review_date: "2026-03-30"

  - id: RISK-006
    name: API Security Vulnerabilities
    description: Exploitation of API vulnerabilities (injection, broken auth, etc.)
    category: technical
    asset: AST-SEC-003
    threat: Attackers exploiting API weaknesses
    vulnerability: Insufficient input validation or authentication
    likelihood: 0.5
    impact: 0.7
    inherent_risk: 0.35
    controls:
      - Input validation
      - JWT authentication
      - Rate limiting
      - WAF protection
      - Security headers (CSP, HSTS)
      - Regular security testing
    control_effectiveness: 0.80
    residual_risk: 0.07
    status: treated
    owner: Security Team
    treatment:
      type: mitigate
      description: Implement comprehensive API security
    review_date: "2026-03-30"

  - id: RISK-007
    name: Supply Chain Attack
    description: Compromise through third-party dependencies or vendors
    category: technical
    asset: AST-APP-001
    threat: Malicious code in dependencies or vendor compromise
    vulnerability: Insufficient vendor security assessment
    likelihood: 0.3
    impact: 0.7
    inherent_risk: 0.21
    controls:
      - Dependency scanning
      - SBOM generation
      - Vendor security assessments
      - Container image scanning
      - Signed artifacts
    control_effectiveness: 0.70
    residual_risk: 0.06
    status: treated
    owner: Security Team
    treatment:
      type: mitigate
      description: Implement supply chain security controls
    review_date: "2026-03-30"

  # Compliance Risks
  - id: RISK-008
    name: Regulatory Non-Compliance
    description: Failure to meet regulatory requirements (PCI-DSS, GDPR, etc.)
    category: compliance
    asset: AST-DATA-001
    threat: Regulatory fines, license revocation
    vulnerability: Insufficient compliance controls or monitoring
    likelihood: 0.3
    impact: 0.9
    inherent_risk: 0.27
    controls:
      - Compliance monitoring
      - Regular audits
      - Policy enforcement
      - Training programs
      - Automated compliance checks
    control_effectiveness: 0.80
    residual_risk: 0.05
    status: treated
    owner: Compliance Team
    treatment:
      type: mitigate
      description: Implement compliance management program
    review_date: "2026-03-30"

  - id: RISK-009
    name: Audit Trail Tampering
    description: Modification or deletion of audit logs
    category: compliance
    asset: AST-DATA-003
    threat: Insider threat or attacker covering tracks
    vulnerability: Mutable audit storage
    likelihood: 0.3
    impact: 0.7
    inherent_risk: 0.21
    controls:
      - Hash-chain integrity
      - Immutable storage
      - Separate audit infrastructure
      - Access controls
      - Integrity verification
    control_effectiveness: 0.90
    residual_risk: 0.02
    status: treated
    owner: Security Team
    treatment:
      type: mitigate
      description: Implement tamper-evident audit logging
    review_date: "2026-03-30"

  # Strategic Risks
  - id: RISK-010
    name: Insider Threat
    description: Malicious actions by employees or contractors
    category: strategic
    asset: AST-DATA-001
    threat: Data theft, sabotage, or fraud by insiders
    vulnerability: Excessive privileges or insufficient monitoring
    likelihood: 0.3
    impact: 0.7
    inherent_risk: 0.21
    controls:
      - Least privilege access
      - Background checks
      - Activity monitoring
      - Separation of duties
      - Access reviews
    control_effectiveness: 0.75
    residual_risk: 0.05
    status: treated
    owner: Security Team
    treatment:
      type: mitigate
      description: Implement insider threat program
    review_date: "2026-03-30"

# Risk Treatment Options
treatment_types:
  mitigate:
    description: Implement controls to reduce likelihood or impact
  transfer:
    description: Transfer risk to third party (insurance, outsourcing)
  accept:
    description: Accept the risk within risk appetite
  avoid:
    description: Eliminate the risk by removing the activity

# Summary Statistics
summary:
  total_risks: 10
  risks_above_appetite: 0
  risks_by_category:
    operational: 4
    technical: 3
    compliance: 2
    strategic: 1
  average_inherent_risk: 0.26
  average_residual_risk: 0.05
