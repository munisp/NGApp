# ISO 27001:2022 Statement of Applicability
# PayGate Payment Switch Platform
# Last Updated: 2025-12-30

metadata:
  organization: PayGate
  scope: Payment Processing Platform
  standard: ISO/IEC 27001:2022
  version: "1.0"
  last_review: "2025-12-30"
  next_review: "2026-03-30"
  owner: Security Team
  classification: Confidential

# Note: This document implements ISO 27001-aligned controls.
# Full ISO 27001 certification requires organizational ISMS and external audit.

controls:
  # A.5 - Organizational Controls
  - control_id: "A.5.1"
    control_name: "Policies for information security"
    applicable: true
    implemented: true
    justification: "Security policies defined in compliance/policies/"
    evidence:
      - "compliance/policies/information-security-policy.md"
      - "compliance/policies/acceptable-use-policy.md"
    implementation_notes: "Policies reviewed quarterly"

  - control_id: "A.5.2"
    control_name: "Information security roles and responsibilities"
    applicable: true
    implemented: true
    justification: "Roles defined in RBAC system (Permify)"
    evidence:
      - "security/access-control/policy-map.yml"
      - "Keycloak role configurations"
    implementation_notes: "Roles mapped to ISO 27001 responsibilities"

  - control_id: "A.5.3"
    control_name: "Segregation of duties"
    applicable: true
    implemented: true
    justification: "Enforced through RBAC and workflow approvals"
    evidence:
      - "Permify policy definitions"
      - "Temporal workflow configurations"
    implementation_notes: "Critical operations require dual approval"

  - control_id: "A.5.4"
    control_name: "Management responsibilities"
    applicable: true
    implemented: true
    justification: "Management oversight through dashboards and reports"
    evidence:
      - "Admin dashboard security metrics"
      - "Compliance reporting"

  - control_id: "A.5.5"
    control_name: "Contact with authorities"
    applicable: true
    implemented: true
    justification: "Incident response procedures include authority notification"
    evidence:
      - "runbooks/incident-response.md"
      - "Incident management system"

  - control_id: "A.5.6"
    control_name: "Contact with special interest groups"
    applicable: true
    implemented: true
    justification: "Participation in financial services security groups"
    evidence:
      - "Security team memberships"

  - control_id: "A.5.7"
    control_name: "Threat intelligence"
    applicable: true
    implemented: true
    justification: "OpenAppSec WAF with threat intelligence feeds"
    evidence:
      - "WAF configuration"
      - "Threat intelligence integrations"

  # A.6 - People Controls
  - control_id: "A.6.1"
    control_name: "Screening"
    applicable: true
    implemented: true
    justification: "Background checks for all employees"
    evidence:
      - "HR screening procedures"
      - "KYC/KYB for stakeholders"

  - control_id: "A.6.2"
    control_name: "Terms and conditions of employment"
    applicable: true
    implemented: true
    justification: "Security obligations in employment contracts"
    evidence:
      - "Employment contract templates"

  - control_id: "A.6.3"
    control_name: "Information security awareness, education and training"
    applicable: true
    implemented: true
    justification: "Security awareness training program"
    evidence:
      - "Training records"
      - "Phishing simulation results"

  - control_id: "A.6.4"
    control_name: "Disciplinary process"
    applicable: true
    implemented: true
    justification: "Security violations included in disciplinary policy"
    evidence:
      - "HR disciplinary procedures"

  - control_id: "A.6.5"
    control_name: "Responsibilities after termination or change of employment"
    applicable: true
    implemented: true
    justification: "Offboarding procedures include access revocation"
    evidence:
      - "Offboarding checklist"
      - "Access revocation logs"

