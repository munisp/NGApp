# Storage Encryption Configuration for PayGate
# Configures encrypted StorageClasses for all persistent volumes

---
# Encrypted StorageClass for PostgreSQL
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: paygate-postgres-encrypted
  labels:
    app.kubernetes.io/part-of: paygate
    encryption: enabled
provisioner: kubernetes.io/aws-ebs  # Change based on cloud provider
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: ${KMS_KEY_ARN}  # AWS KMS key ARN
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

---
# Encrypted StorageClass for TigerBeetle
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: paygate-tigerbeetle-encrypted
  labels:
    app.kubernetes.io/part-of: paygate
    encryption: enabled
provisioner: kubernetes.io/aws-ebs
parameters:
  type: io2
  iopsPerGB: "50"
  encrypted: "true"
  kmsKeyId: ${KMS_KEY_ARN}
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

