---
# PersistentVolumeClaim for PostgreSQL with encryption
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-encrypted
  namespace: data
  labels:
    app: postgres
    app.kubernetes.io/part-of: paygate
    encryption: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: paygate-postgres-encrypted
  resources:
    requests:
      storage: 100Gi

