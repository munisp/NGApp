# Kubernetes Secrets Encryption Configuration
# This configuration enables encryption at rest for Kubernetes secrets and configmaps
# using a KMS provider (Vault) with fallback to local AES-GCM encryption.

apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  # Encrypt secrets and configmaps
  - resources:
      - secrets
      - configmaps
    providers:
      # Primary: KMS provider using Vault Transit
      - kms:
          apiVersion: v2
          name: paygate-vault-kms
          endpoint: unix:///var/run/kmsplugin/socket.sock
          cachesize: 1000
          timeout: 3s
      
      # Fallback: Local AES-GCM encryption
      - aesgcm:
          keys:
            - name: paygate-secrets-key-1
              secret: ${ENCRYPTION_KEY_BASE64}
      
      # Identity provider for reading unencrypted secrets during migration
      - identity: {}

---
# KMS Plugin Deployment for Vault Integration
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vault-kms-plugin
  namespace: kube-system
  labels:
    app: vault-kms-plugin
    app.kubernetes.io/part-of: paygate
spec:
  selector:
    matchLabels:
      app: vault-kms-plugin
  template:
    metadata:
      labels:
        app: vault-kms-plugin
    spec:
      priorityClassName: system-node-critical
      hostNetwork: true
      containers:
        - name: vault-kms-plugin
          image: hashicorp/vault-k8s:1.3.0
          args:
            - "kms"
            - "-config=/etc/vault-kms/config.yaml"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/run/kmsplugin
            - name: config
              mountPath: /etc/vault-kms
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/run/kmsplugin
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: vault-kms-plugin-config

---
# KMS Plugin Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-kms-plugin-config
  namespace: kube-system
  labels:
    app: vault-kms-plugin
    app.kubernetes.io/part-of: paygate
data:
  config.yaml: |
    socketPath: /var/run/kmsplugin/socket.sock
    vaultAddr: https://vault.security.svc.cluster.local:8200
    vaultCACert: /etc/vault-tls/ca.crt
    vaultToken: ${VAULT_TOKEN}
    transitPath: transit
    keyName: paygate-k8s-secrets-key
    cacheSize: 1000
    cacheTTL: 1h
    healthCheckInterval: 30s

---
# Vault Transit Key Configuration (apply via Vault CLI or Terraform)
# vault write transit/keys/paygate-k8s-secrets-key type=aes256-gcm96
# vault write transit/keys/paygate-k8s-secrets-key/config deletion_allowed=false

---
# Secret for storing the local encryption key (fallback)
apiVersion: v1
kind: Secret
metadata:
  name: paygate-encryption-key
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: paygate
type: Opaque
data:
  # Base64-encoded 32-byte AES key
  # Generate with: head -c 32 /dev/urandom | base64
  encryption-key: ${ENCRYPTION_KEY_BASE64}

---
# RBAC for KMS Plugin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-kms-plugin
  labels:
    app.kubernetes.io/part-of: paygate
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
    resourceNames: ["vault-kms-plugin-token"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-kms-plugin
  labels:
    app.kubernetes.io/part-of: paygate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-kms-plugin
subjects:
  - kind: ServiceAccount
    name: vault-kms-plugin
    namespace: kube-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-kms-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: paygate
