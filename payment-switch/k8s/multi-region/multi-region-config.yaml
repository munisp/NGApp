apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-region-config
  namespace: payment-switch
data:
  regions.yaml: |
    regions:
      - id: lagos-primary
        name: Lagos Primary
        location: Lagos, Nigeria
        priority: 1
        endpoint: https://api.lagos.payswitch.ng
        status: active
        data_residency: nigeria
        services:
          nip-service: { replicas: 6, min: 3, max: 24 }
          neft-service: { replicas: 3, min: 2, max: 12 }
          fraud-detection: { replicas: 4, min: 2, max: 12 }
          tigerbeetle: { replicas: 3 }
          kafka: { replicas: 3 }
          postgres: { replicas: 1, read_replicas: 2 }

      - id: london-secondary
        name: London Secondary
        location: London, UK
        priority: 2
        endpoint: https://api.london.payswitch.ng
        status: standby
        data_residency: uk
        replication:
          source: lagos-primary
          mode: async
          lag_threshold_ms: 500
        services:
          nip-service: { replicas: 4, min: 2, max: 18 }
          neft-service: { replicas: 2, min: 1, max: 8 }
          fraud-detection: { replicas: 3, min: 2, max: 8 }
          tigerbeetle: { replicas: 3 }
          kafka: { replicas: 3 }
          postgres: { replicas: 1, read_replicas: 1 }

      - id: accra-dr
        name: Accra DR
        location: Accra, Ghana
        priority: 3
        endpoint: https://api.accra.payswitch.ng
        status: standby
        data_residency: ghana
        replication:
          source: lagos-primary
          mode: async
          lag_threshold_ms: 2000

    failover:
      auto_failover: true
      health_check_interval_seconds: 10
      failover_threshold: 3
      drain_timeout_seconds: 30
      require_manual_promote: false
      notify_on_failover: true
      notification_channels:
        - pagerduty
        - slack
        - email

    data_residency:
      nigeria:
        description: Nigerian transaction data stays in Lagos region
        regulations: [CBN Data Localization, NDPA]
        allowed_regions: [lagos-primary]
      uk:
        description: UK/EU customer data per GDPR
        regulations: [GDPR, UK DPA 2018]
        allowed_regions: [london-secondary]
      ghana:
        description: West African corridor data
        regulations: [Ghana Data Protection Act]
        allowed_regions: [accra-dr, lagos-primary]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encryption-at-rest-config
  namespace: payment-switch
data:
  encryption.yaml: |
    encryption_at_rest:
      tigerbeetle:
        algorithm: AES-256-GCM
        key_source: hsm
        key_id: tigerbeetle-encryption
        rotation_days: 90
      postgresql:
        algorithm: AES-256-CBC
        mode: tde
        key_source: hsm
        key_id: postgres-tde
        rotation_days: 365
      redis:
        algorithm: AES-256-GCM
        key_source: hsm
        key_id: redis-encryption
        rotation_days: 90
      kafka:
        algorithm: AES-256-GCM
        topic_encryption: true
        key_source: hsm
        key_id: kafka-encryption
        rotation_days: 180
      opensearch:
        algorithm: AES-256-GCM
        index_encryption: true
        key_source: hsm
        key_id: opensearch-encryption
        rotation_days: 180
      lakehouse:
        algorithm: AES-256-GCM
        parquet_encryption: true
        key_source: hsm
        key_id: kek-master
        rotation_days: 365
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pci-dss-config
  namespace: payment-switch
data:
  pci.yaml: |
    pci_dss_compliance:
      version: "4.0"
      scope: card-processing-module
      card_data_environment:
        network_segment: cde-zone
        allowed_services:
          - card-tokenization-service
          - payment-gateway
          - pos-service
        network_policies:
          ingress_from: [apisix-gateway]
          egress_to: [card-scheme-networks]
      tokenization:
        service: card-tokenization
        vault: hsm-backed
        format_preserving: true
        token_format: "tok_{random_32}"
        detokenization_requires: [mTLS, RBAC]
      key_management:
        dek_rotation: 24h
        kek_rotation: 90d
        key_ceremony: dual_control
        hsm_fips_level: "140-2 Level 3"
      logging:
        mask_pan: true
        mask_cvv: true
        mask_expiry: true
        retention_days: 365
      scanning:
        asv_quarterly: true
        penetration_test_annual: true
        internal_scan_weekly: true
