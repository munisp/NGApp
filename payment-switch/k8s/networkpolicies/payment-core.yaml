# Payment Core Namespace Network Policies
# Implements Zero Trust micro-segmentation for payment processing services

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-ingress
  namespace: payment-core
  labels:
    app.kubernetes.io/part-of: paygate
    security.paygate.io/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from APISIX API Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress
          podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services
  namespace: payment-core
  labels:
    app.kubernetes.io/part-of: paygate
    security.paygate.io/policy: zero-trust
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from within payment-core namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: payment-core
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090  # gRPC
  egress:
    # Allow traffic to other payment-core services
    - to:
        - namespaceSelector:
            matchLabels:
              name: payment-core
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090

