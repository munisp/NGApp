apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Keycloak Configuration
  keycloak-url: "http://keycloak:8080"
  keycloak-realm: "payment-switch"
  keycloak-client-id: "payment-switch-portal"
  # APISIX Configuration
  apisix-admin-url: "http://apisix:9180"
  # Permify Configuration
  permify-url: "http://permify:3476"
  # OpenAppSec Configuration
  openappsec-url: "http://openappsec:8080"
  # Application Configuration
  app-id: "payment-switch"
  app-title: "Payment Switch"
  analytics-endpoint: "https://analytics.payment-switch.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
type: Opaque
stringData:
  url: "postgresql://payment_user:payment_pass_2024@postgres:5432/payment_switch_portal"
  # In production, use external secret management:
  # - AWS Secrets Manager
  # - HashiCorp Vault
  # - Google Secret Manager
  # - Azure Key Vault
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
type: Opaque
stringData:
  url: "redis://redis-cache:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  # Generate with: openssl rand -base64 32
---
apiVersion: v1
kind: Secret
metadata:
  name: external-api-keys
type: Opaque
stringData:
  sendgrid-api-key: ""
  twilio-account-sid: ""
  twilio-auth-token: ""
  smile-identity-api-key: ""
  nibss-api-key: ""
  coinbase-commerce-api-key: ""
  circle-api-key: ""
  slack-webhook-url: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: BASE64_ENCODED_DOCKER_CONFIG
  # Generate with:
  # kubectl create secret docker-registry ghcr-credentials \
  #   --docker-server=ghcr.io \
  #   --docker-username=YOUR_GITHUB_USERNAME \
  #   --docker-password=YOUR_GITHUB_TOKEN \
  #   --docker-email=YOUR_EMAIL
